name: gates

# Every gate in this repo used to run only when a human typed it. The single automated check was
# Vercel's preview deploy, which runs `build:site` (esbuild) — esbuild does NOT typecheck, so that
# check could not fail on a TypeScript error, let alone a broken contrast contract or a drifted
# artifact. `CLAUDE.md` working principle 4 mandates this sequence pre-push; this makes it machinery
# instead of discipline.
#
# Most pointed case: #281's drift gate exists because committed `out/*` rotted 6,400 lines across
# many merged PRs undetected. Until this workflow, that gate protected nothing automatically — the
# exact failure mode it was filed to prevent was still live for any PR whose author didn't run it.

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the previous run; don't burn minutes finishing a stale one.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — FULL history, and the depth is load-bearing rather than cautious (#1039).
      #
      # The default is a DEPTH-1 shallow clone: one commit, no merge base, no remote branches. Every
      # git-reading gate in this repo until now used `git ls-files`, which reads the INDEX and needs no
      # history at all, so the default has never cost anything. `lint-materialization-renames.ts` is the
      # first that reads git HISTORY — it compares the committed emission at the merge base against the
      # working tree, and under depth-1 it cannot find a base ref.
      #
      # It FAILS in that state rather than skipping, deliberately (`docs/34` shape 9), so the symptom
      # would be loud. But the failure mode this setting prevents is the quiet one either way: a gate
      # that passes locally, where history exists, and cannot run where it matters.
      #
      # `0` rather than `2`: depth-2 gives HEAD~1, which is the base only when the branch is exactly one
      # commit long. A merge base against `origin/main` needs the branch point, and that is an unbounded
      # number of commits back — `docs/44` §6.6 proposed `2` before that was measured.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The engine core is buildless (run via tsx) and dependency-free, but the `web` + `plugin`
      # workspaces need esbuild + typescript, and `tsx` itself is not pinned anywhere in the repo
      # (the root package.json has no devDependencies). `npm ci` covers the workspaces; tsx is
      # pinned at the call site below so a new major can't silently change how the engine parses.
      - name: Install workspace deps
        run: npm ci

      # ---- the gates, cheapest-first so a fast failure reports fast -------------------------

      - name: Engine unit tests
        run: npx --yes tsx@4 packages/engine/test.ts

      # The MCP surface, driven over the REAL stdio transport as a subprocess. test.ts covers
      # handleRpc/callTool in-process; this covers what a CLIENT meets — newline framing, a message
      # split across chunks, a parse error that must not kill the process — plus 2026-07-28
      # conformance and the agent journey (discover → generate from a brief → verify → self-score).
      - name: MCP conformance + journey
        run: npx --yes tsx@4 packages/engine/mcp-test.ts

      # Reproduces New Balance perceptually from the schema alone; every step within its ΔE00
      # ceiling, plus the contrast contracts. Exits non-zero on any regression.
      - name: NB regression
        run: npx --yes tsx@4 packages/engine/nb-regression.ts

      # The ONLY gate that reads the COMMITTED artifacts. Every other one runs the engine live and
      # compares it against itself, so a stale committed artifact passes them all (#281). Snapshots,
      # regenerates, byte-compares, restores — so it never leaves the tree dirty.
      - name: Committed artifacts have not drifted
        run: npx --yes tsx@4 packages/engine/regen.ts --check

      # The FORCING FUNCTION for a materialization rename — one the contract cannot see, because the
      # Figma collection a variable sits in and the namespace folder its name sits under are not
      # guaranteed paths and never touch `DEPRECATIONS` (#1039, `docs/44` §5). A rule proposes the
      # PAIRING a diff cannot supply; the diff supplies the COMPULSION a rule cannot.
      #
      # Runs after `regen --check` because it reads the emission regen writes, and because the two
      # guarantees compose: regen proves the committed emission matches the emitter that produced it,
      # so the merge-base tree is a faithful witness rather than a stale copy.
      #
      # THE ONLY GATE IN THIS FILE THAT NEEDS GIT HISTORY — see `fetch-depth: 0` on the checkout above.
      # It FAILS rather than skips when it cannot find a base ref: a check that downgrades "cannot run"
      # into "nothing to compare, clean" reports green over the whole corpus it could not see.
      - name: A materialization rename is recorded as a rule, and the accounting over it is total
        run: npx --yes tsx@4 packages/engine/lint-materialization-renames.ts

      # The second gate that reads git HISTORY, and for the same reason the first one does: the two
      # facts it needs — did the emitted bytes move, did ENGINE_VERSION move — are indistinguishable
      # inside a single commit, because every in-tree copy of the version is STAMPED FROM the constant
      # and therefore agrees with it at every commit including the broken ones. Also covered by the
      # job-level `fetch-depth: 0` above.
      - name: The emission moved only with ENGINE_VERSION
        run: npx --yes tsx@4 packages/engine/lint-emission-version.ts

      # The token-NAME contract (#464). Deliberately NOT part of `regen`: regen rewrites every
      # generated artifact, so if the baseline were regenerated a deleted token would rewrite the
      # baseline to agree with the deletion and both gates would go green. The baseline is only
      # rewritten by an explicit `--accept`, which itself refuses unless CONTRACT_VERSION has
      # already been raised by the increment the diff requires.
      - name: Token name contract (breaking-change gate)
        run: npx --yes tsx@4 packages/engine/token-contract.ts --check

      # esbuild (and therefore the Vercel build) does not typecheck. These do.
      - name: Typecheck web
        run: npm run -w @prism3/studio typecheck

      # apps/studio's FIRST test step, and the reason it can exist is that #722 put the provenance
      # model in its own pure module: `src/main.ts` touches `document` at import time and cannot be
      # loaded under tsx, so anything inside it is assertable only by hand in a browser. Note what
      # `typecheck` above does NOT cover — `apps/studio/tsconfig.json` includes `src` only, so the
      # test file itself is never compiled and this step is the only thing that runs it.
      #
      # Two suites now: the provenance model (#722) and the export-settings model (#723). The second is
      # also what enforces #720's "a setting with no declaration fails the build" — half at typecheck
      # (`sources` is a required field), half here (`sources: []` type-checks and means "visible
      # nowhere"). Neither half subsumes the other, and its section 8 mutates each check to confirm it
      # goes red on the defect it exists for.
      - name: Studio unit tests
        run: npm run -w @prism3/studio test

      - name: Build web
        run: npm run -w @prism3/studio build

      # The Vercel Ignored Build Step (apps/studio/vercel-ignore.sh) skips a deploy when a commit touches
      # nothing the bundle depends on. Its exclusion list is the part that can rot: an engine file
      # that later gets imported into apps/studio/src would still be on the skip list, so its changes would
      # ship nothing and the site would go stale with every gate green. This checks the list against
      # esbuild's real metafile.
      - name: Vercel ignore list matches the real bundle
        run: npm run -w @prism3/studio check:ignore

      # The studio enforces contrast on every brand it GENERATES; this holds it to the same bar for
      # the chrome it renders those contracts in. #355 fixed a real failure there by hand and parked
      # the ink tiers ON the AA floor, which is a correct decision with no memory. STATIC — it reads
      # the token VALUES out of the stylesheet, which is where the budget lives. It used to say a
      # runtime check "could not run here at all" because the repo had no Playwright; #767 took that
      # dependency and the smoke suite below now measures what RENDERS. The two are complements, not
      # duplicates, and neither subsumes the other: this one catches a token lightened past AA
      # anywhere it is used, including in states no sweep happens to visit; the smoke suite catches
      # a legal token faded through `opacity` or inked onto a fixed ground (#555), which no value
      # check can see.
      - name: Studio chrome clears its own contrast floors
        run: npm run -w @prism3/studio lint:contrast

      # Two contexts, checked separately: the main thread (figma.*, no DOM) and the UI iframe (DOM,
      # no figma.*). CONTRIBUTING §3 documents both as a plugin gate; missing from this workflow's
      # initial cut (#298) — only Build plugin ran.
      - name: Typecheck plugin
        run: npm run -w @prism3/plugin typecheck

      # write / readback / persist / float / styles shims against an in-memory Figma API shim.
      - name: Plugin shim tests
        run: npm run -w @prism3/plugin test

      - name: Build plugin
        run: npm run -w @prism3/plugin build

      # dist/main.js runs in Figma's sandboxed main thread, which has no node: builtins. A regression
      # here breaks the plugin at load in Figma, not at typecheck or build time.
      - name: "Plugin main.js has 0 node: builtins"
        run: |
          set -euo pipefail
          if grep -q "node:" apps/plugin/dist/main.js; then
            echo "::error::apps/plugin/dist/main.js references a node: builtin — the main thread must stay sandbox-safe."
            grep -n "node:" apps/plugin/dist/main.js
            exit 1
          fi

      # The panel's own browser suite (#870) — the SECOND step in this workflow that runs a browser,
      # and it has to be separate from the studio one below. A component build's verdict line is the
      # only place its misses are reported, and a build that ends on a permanent "⋯ Building…" turns a
      # reporting build into a silent one: #866's four DISCARDED refs were visible solely because that
      # summary rendered. This asserts every terminating condition — clean, with misses, errored,
      # already-built, unknown-def — reaches a verdict a designer can read.
      #
      # WHY IT CANNOT LIVE IN THE STUDIO SMOKE SUITE, which is the only other browser step here. The
      # Components page is `figmaOnly`: `railNav()` omits it from the web rail, so the studio bundle
      # (`PRISM3_HOST='web'`) has no route to this control at any effort. The subject is the PANEL —
      # `apps/plugin/dist/ui.html`, loaded top-level so `parent === window` and the harness can stand
      # in for the main thread. Hence a plugin-workspace suite and this step's dependence on the
      # "Build plugin" step above rather than on "Build web".
      #
      # `npx playwright install` is inside the step for the reason the studio step records: the
      # download is SETUP FOR A GATE, so a failed download must fail the step rather than silently
      # skip the coverage. Same accepted cost — a transient CDN failure blocks merges — and the same
      # fix if it bites, which is caching the browser rather than making this advisory.
      # QUOTED, following the two steps here that already are: the parenthesis makes `(#870)` safe as a
      # plain scalar by YAML's own rule, but the studio suite below records the issue reference being
      # silently truncated on a first CI run, so the convention here is to quote any name carrying one
      # rather than to re-derive the rule per step.
      - name: "Component-build verdict suite (#870)"
        run: |
          npx playwright install --with-deps chromium
          npm run -w @prism3/plugin test:verdict

      # TokenPress's own 263 assertions, ported from vitest onto tsx (the suite it arrived with). It
      # runs the exporter end to end against Figma-shaped fixtures, so it is the only thing here that
      # can catch a regression in the OUT direction (Figma -> DTCG). Its runner asserts a per-file
      # census against the pre-port vitest baseline, so a test quietly vanishing fails too.
      - name: TokenPress tests
        run: npm run -w @prism3/tokenpress test

      # The exporter writes __PLUGIN_VERSION__ into every tree's $extensions.generator.version, and
      # it is a bare identifier with no runtime declaration — an absent bundler define ships a plugin
      # that throws on first export. build.mjs asserts that (plus the iife wrapper, the es2018 target
      # and jszip's setImmediate shim) against what it actually wrote. dist/ is gitignored, so a
      # regression here is invisible to typecheck, to lint and to every source grep.
      - name: Build TokenPress
        run: npm run -w @prism3/tokenpress build

      # The two DTCG exporters — prism3's emitter and TokenPress's, separate codebases sharing no code
      # — run over the same brand and compared. `tools/exporter-comparison/compare.ts` is a MEASUREMENT
      # and always exits 0, because most of what it reports is a difference that is right for its host
      # (#697); this is the assertable SUBSET, and it imports that measurement rather than restating it.
      # Four arms, on every brand with a Figma emission (discovered by scanning out/figma/, count
      # asserted at >= 3): a `$type` disagreement on a shared path, a path TokenPress emits that prism3
      # does not, TokenPress's float32 cleanup rewriting a value instead of restoring it (#703's
      # prediction), and #709's opacity 100× at the integration level. The prism3-only direction is a
      # memory of specific paths WITH CAUSES (aurora's 2 gradients, #731) and fails in both directions,
      # so a third unreachable path fails AND a gradient becoming reachable fails. Categories 3-5 stay
      # reporting-only until #697's byte-for-byte question is answered. Runs after the TokenPress build
      # because it executes TokenPress's real `TokenExporter` in memory. Known limit, stated in the
      # file and TRACKED as #747 (under #697, which must close it): the types arm only sees paths that
      # PAIR, which is 71-73 paths per brand — ~14% of the paired surface — that it cannot type-check.
      - name: The two DTCG exporters agree where a difference would be a defect
        run: npx --yes tsx@4 tools/exporter-comparison/gate.ts

      # Can a STRANGER consume what the engine emits? This runs Style Dictionary with a deliberately
      # naive config — no preprocessors, no custom transforms — because that is the only configuration
      # that answers the question. It is a CHARACTERIZATION gate: it pins the known #609 defect (three
      # of four modes invisible to a conforming consumer) so the gap cannot silently drift, and it
      # asserts the consumer config declares no custom code, since the cheapest way to make a future
      # failure vanish is the exact move that would destroy the gate's meaning.
      - name: Consumability gate (a stock Style Dictionary over the emitted DTCG)
        run: npm run -w @prism3/tokens check:consumability

      # Shipped SKILLS make factual claims about the engine, and were the last shipped surface with
      # no gate (#492) — out/**, the emitted contracts and apps/studio/dist are all scanned, skills/**
      # was not. Its first run found `prism3-consume` teaching the pre-rename `action.*` family,
      # which an agent would emit as references resolving to nothing.
      - name: Skills gate (shipped skills make true claims)
        run: npx --yes tsx@4 packages/engine/lint-skills.ts

      # US English in shipped text. Runs AFTER BOTH BUILDS on purpose: `engine/levers.ts` prose is
      # inlined into `apps/studio/dist/main.js`, and a source-only grep calls that bundle clean — the trap
      # that got #302 and #310. As of #937 it also scans `apps/plugin/dist` (main.js + ui.html), which
      # carries the component defs' `description`/`note`/`aria` prose and reaches no other gated
      # surface; "Build plugin" above is therefore load-bearing for this step, not just for the
      # node:-builtin check. Gates out/, the emitted schema + reports, and both built bundles — there is
      # no reported-but-not-fatal surface left, the two CLAUDE.md once held open having been converted.
      - name: US-English gate (shipped text)
        run: npx --yes tsx@4 packages/engine/lint-us-english.ts

      # Voice-standard §2 banned-phrase list ("simply", "just" outside its exactly/barely sense,
      # "easy", "obviously", "please note"/"note that", "Oops"/"Sorry", exclamation marks in prose)
      # in shipped text (#617). Sibling to the US-English gate above, not merged into it — different
      # exemption sets (an allow-set for "just", a context rule for "!"), different failure messages
      # — but wired in the SAME position for the SAME reason: its scope includes the built
      # `apps/studio/dist/*.js` bundle, so it has to run after the web build too.
      - name: Voice lint gate (shipped text)
        run: npx --yes tsx@4 packages/engine/lint-voice.ts

      # A gate that silently stops running is worse than no gate, because green starts meaning
      # "nothing ran". If any emitter, report or schema artifact ever leaves the compared set, this
      # fails loudly rather than quietly shrinking. Update the number deliberately when the set
      # legitimately grows.
      - name: Drift gate still covers the full artifact set
        run: |
          set -euo pipefail
          count=$(npx --yes tsx@4 packages/engine/regen.ts --check | grep -oE '[0-9]+ committed artifacts')
          echo "reported: $count"
          case "$count" in
            "108 committed artifacts") echo "✓ full set covered" ;;
            *) echo "✗ artifact coverage changed — expected 108. If the set legitimately grew or shrank, update this check in the same PR."; exit 1 ;;
          esac

      # The RUNNER's own checks, not a second run of the gates (#789). `verify.ts` is what a contributor
      # types instead of hand-assembling ~30 commands, and its list is the FIFTH authored statement of
      # what the gates are — compared against this file in BOTH directions by the step below, which is
      # what makes THIS FILE checkable at all. Until #789, `lint-doc-gates.ts` compared three documents
      # against ci.yml in one direction only, so a gate missing from ci.yml left four artifacts in
      # perfect agreement and fired nothing; measured, not assumed — deleting the lint-paint step left
      # the pre-#789 gate exiting 0.
      #
      # `--list` deliberately, NOT a full `npm run verify`: running the runner here would execute every
      # gate a SECOND time inside a job that already runs them all, doubling the job for no new
      # information. What this step covers is everything `verify.ts` asserts about ITSELF before running
      # anything — its self-checks (each derived gate can actually fail, the ordering check catches a
      # real inversion, the orphan scan catches an unnamed file) and `orderViolations` over the real
      # authored array. A `verify.ts` whose own checks are broken must not reach main just because CI
      # never imported it.
      - name: The gate runner's list and order are sound
        run: npx --yes tsx@4 verify.ts --list

      # #610 fixed CLAUDE.md/CONTRIBUTING.md/the PR template being out of sync with the gates above —
      # the PR template listed 4 checks against this workflow's 17, and #601/#602 each shipped a gate
      # (`lint:classes`, retired in #770) silently broken by following that shorter, stale checklist
      # faithfully. This is what stops it drifting again: every `npm run`/`npx tsx` gate above must
      # stay represented in all three documents, checked against the real file rather than a restated
      # list — which is also what made #770's own deletion a four-document edit rather than a one-line one.
      - name: Docs stay in sync with this workflow's gates
        run: npx --yes tsx@4 packages/engine/lint-doc-gates.ts

      # The component defs under packages/engine/components/ were typechecked by NOTHING: no root or
      # engine tsconfig existed, and test.ts runs under tsx, which transpiles without typechecking.
      # `button.ts` carried a `notes.evolution` field its schema never declared for five PRs (#657).
      # Measured on f02d30f: typo a `notes` key in button.ts and the plugin typecheck fails; do it in
      # text-field.ts and everything passes. Coverage was an accident of the plugin importing ONE def,
      # so it would have gone 1 → 0 the day that import moved, silently. This runs `tsc --noEmit`
      # (a check — the engine stays buildless, asserted by the gate) over a DECLARED scope, and — the
      # part that matters — asserts every tracked def is REPRESENTED in what tsc actually read. A
      # passing typecheck proves nothing about which files it opened.
      - name: Component defs typecheck against their schema
        run: npx --yes tsx@4 packages/engine/typecheck-components.ts

      # The sibling problem, one level out: the gate above keeps the CHECKLISTS honest, this one keeps
      # the LAYOUT DESCRIPTIONS honest. #651, #663 and #669 each shipped a doc describing a repo that
      # did not exist, and two of the three were ABSENCES — a missing `skills/` row, which no sweep for
      # wrong strings can find. So it runs both directions: every path a doc claims must resolve
      # (against `git ls-files`, from the doc's own directory), and every tracked layer must be named
      # in the tables that promise to describe the repo.
      - name: Docs describe the repo that exists
        run: npx --yes tsx@4 packages/engine/lint-layout-claims.ts

      # Nothing anywhere caught a decision superseded by a later one, or a decision that exists only
      # in an issue thread with no doc pointing at it (#886). `docs/42-current-decisions.md` is the
      # router; this keeps it honest both directions — every indexed decision resolves to a real
      # `Decided (date, #issue): title` heading, and every such heading anywhere in `docs/` is indexed.
      - name: Every recorded decision is indexed, and every index row is real
        run: npx --yes tsx@4 packages/engine/lint-decisions-index.ts

      # A leaf that later needs siblings is a MAJOR contract break — we paid one for `border.inverse`
      # in #891 (a major, two DEPRECATIONS entries, and a new NB_KNOWN_RENAMES mechanism). A group with
      # one child is verbosity. Asymmetric costs, so the default is the cheap error and the expensive
      # one is argued for in `LEAF_OK` with a reason (#892).
      - name: A context node is a group unless a stated reason says otherwise
        run: npx --yes tsx@4 packages/engine/lint-context-nodes.ts

      # `test.ts` has long asserted "all mode contrast contracts hold" by reading each role's own
      # recorded `ratio` — so it asks the reporting path whether the reporting path is right, and in
      # the one failure that matters it agreed with itself. A ground moved through the override
      # post-pass left 43 of 53 roles recording contrast against a surface the tree no longer had, and
      # every contract check passed (#956). This one recomputes from the FINAL emitted colors and
      # never reads `ratio` to decide the truth, then requires a shortfall to be warned rather than
      # silent. It sweeps declared surfaces deliberately: at defaults every brand is clean, so a
      # corpus-only run would report a confident zero over the only inputs that cannot show the bug.
      - name: Every reported contrast ratio matches the color it was measured against
        run: npx --yes tsx@4 packages/engine/lint-ratio-truth.ts

      # `VARIANT_AXES` closed the axis NAME vocabulary after #756 found four spellings of one axis,
      # each individually defensible, caught by a census that ran after all three had shipped. The
      # identical argument applies one level down to axis VALUES, and one level down there was no
      # census at all (#934). Not a uniformity rule — `switch`'s `[off, on]` diverges from checkbox's
      # `[unchecked, checked, indeterminate]` and is correct (#930) — but a register: every set
      # declared with a reason, both directions, plus the RELATION each set stands in to its axis's
      # canonical one, computed by set algebra and compared against what the author declared. The
      # census found the issue's own premise wrong twice: `selection` carries three sets rather than
      # two, and two OTHER axes diverge as well. The expensive case is not `switch`'s disjoint set but
      # `tone`'s overlap, where `error` and `danger` are one concept spelled two ways.
      - name: Every axis value set is declared, and stands in the relation it declares
        run: npx --yes tsx@4 packages/engine/lint-axis-values.ts

      # docs/00-progress.md is newest-entry-first, and a rebase routinely lands the incoming entry
      # SECOND with no textual conflict and nothing to report it (#931 — three hand-fixes in 24
      # hours across two lanes). The file is exempt from every other gate that touches it
      # (lint-advisory-expiry.ts, lint-decisions-index.ts above, lint-layout-claims.ts,
      # lint-shape-index.ts, lint-voice.ts), correctly — it is an append-only dated log, so a July
      # entry describing the repo as it was in July is accurate prose forever. That argument is
      # about CONTENT; it was applied file-wide, so ORDERING — a structural property none of those
      # five was ever asking about — fell through the gap they open together.
      #
      # EXPECTED is sorted(dates, descending), a genuine transformation of the parsed headings, never
      # a restatement of the file (docs/34 shape 1). Fails on 0 matched headings rather than passing
      # over nothing (shape 9). States plainly what it does NOT check: that an entry is correct,
      # present, dated accurately, or matches what shipped — one structural property only.
      - name: docs/00-progress.md stays newest-entry-first
        run: npx --yes tsx@4 packages/engine/lint-progress-order.ts

      # `out/` mixed the brand's token trees (which travel to a client on eject) with a regression
      # report and a preview page (which do not), and NOTHING said which was which — the only thing
      # distinguishing them was that a human knew. Every payload-assembling tool in the field declares
      # membership explicitly (npm `files[]`, shadcn's typed `files[]`, SD per-platform `files[]`); none
      # uses "everything in the output directory". The manifest is AUTHORED and deliberately NOT a regen
      # artifact: regenerated from a scan it would classify each new artifact itself and report that as a
      # pass, which is the defect it exists to remove. Adding an emitted artifact fails this until a
      # human classifies it — that friction is the feature.
      - name: Every emitted artifact is classified payload or ours
        run: npx --yes tsx@4 packages/engine/lint-payload-manifest.ts

      # #708: every mode-varying leaf reaches its mode's overlay, and nothing else does. The defect was
      # silent in every direction — `$extensions.prism3.modes` was written in two shapes (color wrapped
      # its value, shadow was a bare array), the projector's guard read one of them, and 28 mode-varying
      # shadows were dropped from every overlay in all four brands. A conforming consumer reading
      # base + dark.overlay rendered LIGHT shadows in dark mode. Nothing caught it because the
      # base+overlay cascade means every token is always present in every mode — base supplies it — so
      # coverage, presence and alias gates were all legitimately green. Nothing held an independent
      # answer to WHICH tokens ought to differ per mode. This does: it derives that set from the
      # projector's INPUT (the canonical modes extension) and compares it against the projector's
      # OUTPUT (the emitted overlays) — never by re-running the projector, which would be the gate
      # agreeing with itself. Covers every composite type by rule, not by a list naming `shadow`.
      - name: Overlays carry exactly the leaves that vary per mode
        run: npx --yes tsx@4 packages/engine/lint-overlay-completeness.ts

      # #1138: every pointer-tier leaf carries `$extensions.prism3.figma.{collection,mode(s),variable}`
      # — its own claim about where it materializes in Figma, and the ONLY place a DTCG consumer can
      # learn that. `tree.ts` writes those as literals; `emit-figma-*.ts` writes `$collection`/`$mode`/
      # variable names as ITS OWN literals. #1089 renamed the Figma collection `surface` ->
      # `color.surface` and left tree.ts's literal alone, so 128 leaves per brand in three brands named
      # a collection that did not exist, for weeks. Every gate was legitimately green: overlay
      # completeness reads a DIFFERENT extension, the exporter harness reads the Figma side and never
      # the DTCG side, and `regen --check` diffs bytes of what the engine writes — the engine wrote the
      # wrong value CONSISTENTLY, so it was stable and reproducible. This compares the two literals.
      # Four arms (collection / mode-set equality / mode membership / variable name) and a floor that
      # asserts each was exercised, since each passes vacuously if its claim stops being written.
      # Independence is a NARROW claim and only the narrow form is true: emit-figma*.ts never reads the
      # DESTINATION sub-keys (collection/mode/modes/variable) off a leaf's own $extensions.prism3.figma.
      # It DOES read that block (emit-figma-styles.ts:191) and reads a responsive `figma.modes` that is
      # spelled like a destination read and is not. The header carries the re-check, which returns zero.
      # Harbor emits no out/figma/, so its emission is BUILT IN MEMORY rather than skipped — a quarter
      # of the subject, and its layout `mode` claims are brand-derived (docs/34 shape 15).
      - name: A leaf's declared Figma destination is the one it materializes into
        run: npx --yes tsx@4 packages/engine/lint-figma-destination.ts
      # #1152: the orphan report (#479) is produced BY an executor ABOUT the collection it just walked,
      # so it can only describe drift INSIDE somewhere a plan reaches. A collection nothing plans is
      # never upserted, never indexed, never counted — the absence of a finding about it is
      # indistinguishable from the absence of a look. #1148 produced one: Variable.variableCollectionId
      # is readonly, so collapsing the colour tiers renames the value tier onto `color` and leaves a
      # designer's `color.surface` standing, unreported, forever.
      #
      # A gate for this cannot ask an executor anything — an executor has no opinion about a collection
      # it never walks, and four with no opinion still sum to silence. Every arm enumerates from OUTSIDE
      # them (the emitted artifacts, the authored COLLECTION_RENAMES, the executor sources' own text)
      # and uses the plan set only as the subtrahend. Note what is deliberately NOT an arm: the plan's
      # collection NAMES are read off the emission by construction (#1097), so comparing them to it is
      # x === x — docs/34 shape 17, stated in the header so nobody adds it back as "coverage".
      - name: No collection ships that nothing writes
        run: npx --yes tsx@4 packages/engine/lint-stranded-collections.ts

      # #1179: a studio ramp's hardcoded step list must be a subset of the ladder it resolves against.
      # `paintRadiusPreview` iterated an authored RADIUS_STEPS and read each step's px out of `rp.dims`,
      # which `resolve-preview.ts` builds from only the refs the PREVIEW SPEC binds — nothing bound
      # `radius.capsule`, so it fell through `?? 0` and the ramp rendered `capsule · 0px` with a sharp
      # swatch (#1177). Nothing caught it: test:smoke asserts the panel RENDERS and a 0px corner renders
      # fine; typecheck is satisfied because `?? 0` makes the expression total; regen never sees the
      # studio. A step that resolves to nothing produced a plausible number and a plausible picture.
      # SUBJECT = the authored arrays, parsed from studio source (main.ts touches `document` at import
      # time, so it cannot be loaded under tsx). ORACLE = the ladder, computed by running the engine
      # over five themes incl. two radiusScale extremes. Never derive one from the other (shape 17).
      # Two arms — an authored step the ladder lacks, and a ladder rung the list omits without
      # declaring it — plus floors that fail when the scan finds nothing rather than reporting a clean
      # zero, and that require every `*STEPS*` literal in the studio to be classified here.
      - name: A studio ramp step resolves to a real rung
        run: npx --yes tsx@4 packages/engine/lint-ramp-steps.ts

      # #1186: the VALUE half of the same class, and the actual #1177 mechanism. lint-ramp-steps proves
      # a step NAME is a real rung; it explicitly does not prove the step resolves to a VALUE in the map
      # the preview reads. `capsule` WAS in theme.dims.radius — the name gate passes it — but `rp.dims`,
      # which resolve-preview builds from only the refs the preview SPEC binds, carried nothing for it,
      # so `?? 0` rendered `capsule · 0px`. Measured here: the ladder has 6 rungs, rp.dims carries 4.
      # A rung may legitimately be outside that map (`none` always was), so the invariant is "in the map
      # OR visibly special-cased by the preview". THE CRUX: the special-cased set is DISCOVERED from how
      # the preview branches (`step === '<rung>'`), never listed here — a list is a second copy that
      # rots the moment a fourth rung is special-cased (shape 4). Arm B (special-cased AND present)
      # exists to make that discovery trustworthy: it turns an over-collecting scan from a silent false
      # negative into a failure. SUBJECT = the studio source; ORACLE = resolvePreview() run for real.
      - name: A ramp rung resolves to a value, or is special-cased
        run: npx --yes tsx@4 packages/engine/lint-ramp-values.ts

      # #758: the component tier's colour bindings, in two arms — because #758's own stated acceptance
      # ("Button's 648-member paint is byte-identical: regen --check reports 104") cannot fail.
      # `figmaAnatomySet` is called by no emitter and no component payload is committed under `out/`,
      # so component paint is outside regen's universe: repointing `destructive.outline.icon` at
      # `color.interactive.neutral.text.rest` — a token that RESOLVES — left `regen --check` at 104 and
      # `test.ts` at 2192/0, with a destructive button's icon painting neutral ink.
      #
      # ARM 1 is a RULE at zero: a paint key led by an axis value points at a token ref carrying that
      # value (90/90 across the corpus). EXPECTED comes from the key, ACTUAL from the ref — two authored
      # halves, neither derived from the other, and deliberately not from `paintOf`'s own lookup, which
      # would agree with itself in the mutated case too. Its four exceptions are named per key with a
      # reason and checked in BOTH directions, so a stale exemption fails.
      #
      # ARM 2 is a CHARACTERIZATION pinned to an authored baseline, because a uniform loss crosses no
      # intent boundary and arm 1 stays green through it. It is taken over the FULL DECLARED GRID, not
      # over `figmaAnatomySet`: `icon.figmaProperties.variantAxes` is ['size'] while its paint axis is
      # `tone`, so a set-based census pins `icon: 0` — a number no mutation can move, in a file that
      # reads as coverage. `schema/paint-census.json` is AUTHORED and NOT a regen artifact, for the same
      # reason as `token-contract.json`: regenerated, it would rewrite itself to agree with a regression.
      - name: Component paint is where the defs say it is
        run: npx --yes tsx@4 packages/engine/lint-paint.ts

      # #933, and the seam with the step above is the point: `lint-paint.ts` asks whether a binding is
      # painted AT ALL — its arm 3 collects every variable of every coordinate into one flat set and
      # DISCARDS the node — so nothing held an answer to "did the paint land on the part the def
      # nominated". The projector's box branch read `role === 'target'`, which means "what does the user
      # click", to decide "what carries colour". Every anatomy in the corpus is one box and one target and
      # they are the same part, so nothing exercised it; a switch is where they come apart, and the
      # configuration a hit-area author reaches for painted the track's `on` fill across the whole label
      # row. Both configurations validated with ZERO errors — #802's class, structurally valid output that
      # does not do its job. Measured with the defect restored: test.ts 2331/0 and lint-paint.ts green.
      # Which is why this gate CARRIES ITS OWN TWO-BOX FIXTURE: the corpus cannot express the shape, so a
      # corpus-only run would be a gate nothing can exercise.
      - name: Component paint lands on the part the def nominated
        run: npx --yes tsx@4 packages/engine/lint-paint-placement.ts

      # #756: the KB briefs and the emitted tier use THE SAME RUNG NAMES FOR DIFFERENT VALUES, offset
      # by one rung and agreeing on every value over the overlap. A def adopting the brief's names makes
      # `icon.size.md` mean 24 in the token layer and 20 in the component API — both halves valid, every
      # other gate green, visible only by reading two files side by side. #708's shape: a wrong value
      # that resolves. Three arms. ARM 1 (every enum value resolves to an emitted rung, per brand) is
      # NECESSARY AND NOT SUFFICIENT and says so in its own output: `['sm','md','lg','xl']` against a
      # five-rung tier passes it trivially. ARM 2 is the one that sees the divergence, in `lint-paint.ts`
      # arm 1's shape — a def states its ladder TWICE, in `props`/`variants` (`small`) and in `tokens`
      # (`sm`), so EXPECTED and ACTUAL are two independently-authored halves; it asserts both directions
      # of enum↔binding plus order-preservation per tier family. Monotonic, not strict, and measured:
      # `type.label` emits two rungs so `button`'s `large` legitimately clamps to `md` — a repeat is a
      # clamp, a reversal never is, and strictness would have forced an exception list. ARM 3 is the
      # default rule (a default resolves to `md`), which holds 5/5 across the corpus and was settled by
      # composition: `button`/`icon-button` at their own default bind `icon.size.md` = 24.
      - name: A def's size enum names the engine's rungs, not a brief's
        run: npx --yes tsx@4 packages/engine/lint-rung-names.ts

      # #786: `docs/34`'s sub-shape numbers are cited as stable ids from across the repo, and
      # nothing enforced that a published number keeps its meaning. Note what this is: a hazard with
      # ZERO incidents — measured over every commit that has touched the doc, shapes 1-9 are
      # byte-identical since 2026-08-08, 10-15 were each appended, and same-number-different-title
      # across the whole history is zero. The "12 -> 13 renumber" that motivated the issue happened at
      # FILING time, so no citation was ever invalidated. That is why this is the cheap version and
      # not the stable-slug migration, which would have rewritten every citation to fix damage that has
      # not occurred. ARM A is the binding: EXPECTED is the authored `schema/shape-index.json`, ACTUAL
      # is the doc's headings — the naive gate reads the CURRENT doc to decide what to expect, which is
      # shape 1 in the file that defines shape 1. Deriving the previous binding from git history is
      # independent but fails under a shallow checkout, so the memory is a committed file, AUTHORED and
      # not a regen artifact (`--accept` appends only and refuses a retitle). ARM B is existence: every
      # cited number resolves. It CANNOT check a citation names the right shape — stated in the gate's
      # header, because "citations clean" reads like a correctness claim and is only an existence one.
      - name: A published docs/34 shape number still means what it meant
        run: npx --yes tsx@4 packages/engine/lint-shape-index.ts

      # #807: CLAUDE.md principle 5 says a schema file kept out of regen must be hand-named in both
      # prose gates — a rule that lived in prose and was carried out by whoever remembered. Three files
      # (`nb-measured`, `payload-manifest`, `theme-schema.example`) were in neither gate with no record
      # of a decision, so nothing distinguished "deliberately exempt" from "nobody looked" — the same
      # membership-by-location defect `payload-manifest.json` itself exists to remove, one tier up.
      # This asserts every file in `schema/` is classified: in SCHEMA_ARTIFACTS, hand-named in BOTH
      # prose gates, or EXEMPT with a stated reason. EXPECTED comes from `git ls-files` — the DIRECTORY
      # — never from the lists being checked: measured, a union-of-the-lists version prints `✓ clean` at
      # exit 0 on the very file the directory-derived one fails on, because the unclassified file is by
      # definition absent from every list. Both directions checked, so a stale entry cannot rot quietly.
      # Its limit is stated in the header: it proves a human wrote an answer down, not that the answer
      # is right — moving a prose-carrying file to EXEMPT passes, which is what the `why` is for.
      - name: Every packages/engine/schema file has a decided place in the prose gates
        run: npx --yes tsx@4 packages/engine/lint-schema-classification.ts

      # #801, the first instance of #802: Button's focus ring shipped FLUSH against the component. The
      # issue named two candidate causes and both were WRONG — measured against the real executor over
      # the real 648-member set, the `focus/ring/offset` lookup resolves (0 misses) and its miss path is
      # both reachable and counted (108 misses when the variable is removed). What was missing is that
      # NOTHING ANYWHERE READ THE NUMBER. An offset of 0 is not an error at any layer it passes: a valid
      # FLOAT, binding nothing (Figma's x/y take no variable, so this value travels as a NAME and is
      # frozen to a literal at paste), writing without throwing, producing a structurally perfect
      # component — correct positioning, constraints and paints, 0 misses, and a ring on the border it
      # must be distinguishable from. #802's profile exactly: a value a human can see that no gate
      # compares against what it should be.
      #
      # And one gate REPORTED A PASS on it. `test-write-components.ts` asserted the ring's geometry
      # under the label "2px larger on EVERY side" while skipping itself on a flush ring (`if (ring.x >=
      # 0) continue`) and reading EXPECTED off the node under test (`off = -ring.x`) — shape 1, twice, in
      # four lines. Fixed at its site in this PR (classified from the PLAN's `absoluteInset`, expectation
      # from the shim's declared input) with an in-suite negative control that requires the checker to
      # fail on a flush ring by name.
      #
      # This gate is the plan-level version #802 asked for. EXPECTED walks the DEF (part → inset key →
      # def.tokens → token ref → variable name, restating the convention rather than calling `varOf`);
      # ACTUAL is the plan's `absoluteInset` and the FLOAT it resolves to in each brand's COMMITTED
      # export. It deliberately does NOT re-derive the executors' arithmetic — `test.ts` already
      # compares that against its own stub's inset and fails by name at 0 (the negative control that
      # located this gap), and its parity gate holds the plugin executor to the payload. Both directions,
      # so it cannot pass over an empty set: every declared inset part must be REPRESENTED in a plan,
      # and one gated by `when:` must carry its inset at that state and no other. A legitimately-zero
      # offset (`focus.ring.offset-field` is 0 by design) must be admitted in ZERO_OK with a reason —
      # authored, for the same argument as `payload-manifest.json`: a gate that decided for itself which
      # zeroes were intended would have waved #801's through. Mutation-verified: `focus.ring.offset`
      # 2 → 0 fails this gate 18× by name while test.ts, token-contract, nb-regression,
      # lint-overlay-completeness, the plugin suite and `regen --check` all stay green.
      - name: An absolutely-positioned part lands outside its parent
        run: npx --yes tsx@4 packages/engine/lint-absolute-inset.ts

      # A def offered as a build target must project members that acquire an EXTENT, and a def that
      # cannot must declare `figmaProperties.notStandalone`. #869: building `focus-ring` produced a
      # 100x100 white box with the correct focus color at 1px — not a crash and not a miss report, an
      # artifact that reads as a successful build. Measured, and it contradicts the issue on both of
      # its load-bearing points: the def does NOT error, and the artifact is not a half-build. It
      # projects 2 members with 0 binding errors, 0 set properties, planSetLayout succeeds, nothing
      # throws — a COMPLETE build of a plan carrying no geometry. The 100x100 is Figma's default frame;
      # the 1px is write-components.ts's deliberate `if (!node.strokeWeight) = 1` fallback. Nested it
      # is fine, because Button sites it absolutely and the executor resizes it to `parent + inset*2`.
      #
      # Nothing could see it, and the reason is #802's whole class: every other gate here asks whether
      # a thing exists, a ref resolves, a count matches, or nothing threw, and this plan is VALID. It
      # is valid and describes nothing a designer can use. The def's own `codeOnly` already said so —
      # "the members are strokeless", "what it projects is not yet a ring" — which makes the actual
      # defect a decision recorded where only humans look, not a missing check.
      #
      # Independence: EXPECTED is the def's declaration, ACTUAL is measured from the projected plan by
      # this file's own walk. It does not call the picker's filter or the plugin's refusal branch —
      # all three read the same field, so either would make the check agree with itself. Both
      # directions: an undeclared geometry-free root fails, and a DECLARED def whose root does size
      # fails as a stale refusal (a def withheld from the picker with a reason no longer true).
      #
      # Mutation-verified by name, four ways: removing the declaration fails arm A (the #869 defect,
      # 1 named failure, exit 1); a stale declaration on `button` fails arm B; a def losing its
      # projection fails the MUST_PROJECT scope floor; and collapsing the `layoutMode+children`
      # predicate to bare `layoutMode` — which on the first attempt changed NOTHING, since no def has
      # a childless auto-layout root — now fails the PREDICATE_CASES arm that was added because of it.
      - name: A def offered as a build target projects something with an extent
        run: npx --yes tsx@4 packages/engine/lint-standalone-floor.ts

      # #864 is #802's class again, and the largest instance of it: `icon` built four EMPTY ARTBOARDS.
      # The def carried a size axis and no geometry anywhere, so every gate in this workflow was green
      # over a component that renders nothing — an empty artboard exists, its refs resolve, its count
      # matches and nothing throws, which is all any of them ask.
      #
      # This states the quantity a human would check: a FILLED outline with non-zero box area, one per
      # glyph, across every member of the set, on a SQUARE artboard the document declares rather than
      # leaves to the importer (a Figma VectorNode's box IS its ink, and only 19 of these 39 glyphs are
      # square, so a 14×2 `minus` stretched into a host's square slot is a bar 7× too thick — builds
      # fine, renders wrong). EXPECTED is the vocabulary (`ICON_PATHS`, and `ICON_VIEWBOX` re-parsed
      # here rather than via the projector's own `viewBoxDims`, which would make both halves one
      # derivation); ACTUAL is the document the plan will hand to `figma.createNodeFromSvg`, read back
      # by parsing it. The ink is measured by the gate's own path walker, which flattens curves rather
      # than hull-bounding them and throws on an unmodelled command — both to keep the error away from
      # "measures nothing and calls it clean".
      #
      # Mutation-verified, ten ways, and two of them are the point: templating the glyph so all 39
      # members draw `check` leaves `test.ts` at 2274 passed / 0 failed (its sample member IS `check`),
      # and `fill="none"` on every path leaves every area and count check green. Both fail here by name.
      # It CANNOT see the subtree Figma returns — there is no SVG importer in Node; that is the
      # executors' runtime `NO VECTOR` miss, and the gate's header says so rather than implying cover.
      - name: A glyph draws its own filled outline on a square artboard
        run: npx --yes tsx@4 packages/engine/lint-glyph-geometry.ts

      # THE SECOND DIRECTION (#865). Every write the component executor makes is verified by a read-back
      # — set the value, read it, report a miss if the host did not keep it. Nothing verified what it did
      # NOT write, and a Figma node is never silent: a property no def mentioned kept Figma's own default
      # wearing our name. `createFrame()` returns an opaque white box, `combineAsVariants()` returns a set
      # with a 5px radius and a purple dashed border, and a text node starts top-left. Measured on the
      # corpus before the fix: 523 of 973 member root frames carried the unclaimed white fill, and it was
      # found BY EYE on four separate components before anyone looked for the class.
      #
      # A read-back cannot see this, structurally: an unset property has no write to verify. So this asks
      # the converse question — does every visually-significant property a built node carries trace to a
      # decision? ACTUAL is recorded, not read: the real `applyComponentPlan` runs against a Proxy host
      # whose `set` trap records property names, so a mechanism that merely LOOKS like it supplies a
      # property cannot be credited with it (three drafts of the expected table were wrong in exactly that
      # way — `setTextStyleIdAsync()` carries no alignment field on either axis). EXPECTED is authored in
      # the gate from `@figma/plugin-typings`, and `claimDefaults` carries a comment forbidding an import
      # of its table: a gate reading the subject's own list asserts `table === table` (docs/34 shape 2).
      #
      # Every arm reports its own name, and the three exemptions are ASSERTED rather than assumed — an
      # INSTANCE is exempt only if some plan node nominated the component it came from (A6), auto-layout
      # properties only where a `layoutMode` exists (A4), imported glyph ink only below Figma's importer
      # (A5) — plus corpus reach (A0), node-type representation (A2) and row exercise (A3), because a
      # sweep that builds no VECTOR reports its VECTOR rows as passing.
      - name: Every visually-significant property on a built node traces to a decision
        run: npx --yes tsx@4 apps/plugin/lint-unclaimed-defaults.ts

      # #1190 — Figma lists collections in creation order, so the panel order is the sequence of
      # createVariableCollection calls. This runs both emission paths (plugin executor + CLI paste
      # payloads) against a recording stub and asserts the observed order equals COLLECTION_ORDER —
      # the plugin path and the CLI path independently, and against each other.
      - name: Both emission paths create Figma collections in COLLECTION_ORDER
        run: npx --yes tsx@4 apps/plugin/lint-collection-order.ts

      # A stated advisory window, once it closes, fails the build. The step below this one is
      # advisory with a date on it, and that date is written in six places — this workflow twice,
      # verify.ts, test-smoke.mjs twice, and the three contributor documents. On the stated morning
      # every one of them becomes a false statement about what CI does, and NOTHING anywhere would
      # say so; whoever pushes that day did not write the claim and has none of this context.
      #
      # GATING, not advisory — a gate that watches for expired advisories and is itself advisory
      # would be its own joke. The broader "forward claim" problem ships separately as a tools/
      # harness because its recall is unknown; this sub-class is the one where that objection
      # dissolves. The oracle is the CLOCK — no API, no issue state, no network, and the repo cannot
      # edit the calendar — and the pattern is literal, so recall is MEASURED, not estimated: 904
      # dates across 548 tracked text files, 13 of them claims, and the complement read by hand.
      #
      # Verified in BOTH directions with an injected clock (PRISM3_TODAY), never by editing the
      # dates in the files, which would test a different program: passes today; fails on the stated
      # date naming all 8 live sites; fails on a planted past date and passes once it is removed.
      # docs/00-progress.md is out of scope BY GENRE — its dated entries describe the repo as it was,
      # so a closed window recorded there is correct prose forever.
      - name: A stated advisory window has not expired
        run: npx --yes tsx@4 packages/engine/lint-advisory-expiry.ts

      # The studio's DOM/interaction coverage (#767, deciding #333) — and the ONLY step in this
      # workflow that runs a browser. It loads every page in every mode across both corpus brands
      # (72 states), drives the mode switch, an override picker and an export, and asserts zero
      # console errors plus DOM and rendered-contrast invariants.
      #
      # WHY IT HAS TO BE A BROWSER: `apps/studio/src/main.ts` touches `document` at import time and
      # cannot be loaded into a Node harness at all — which is why the "Studio unit tests" step above
      # covers modules EXTRACTED from it (#722/#723) and nothing covers the ~9,000 lines inside it.
      # There is no unit granularity available for that file until the seam moves (#768). Every
      # behavioral verification the studio has ever had, including all ten fixes merged 2026-08-07,
      # was a throwaway Playwright script deleted afterward. This is that driving, committed.
      #
      # GATING since 2026-08-20 — #775's advisory window ran 2026-08-13 → 2026-08-20, and the flip
      # was EARNED on runner evidence rather than granted by the calendar. The stated condition was
      # a week of runs on the RUNNER (a noisier environment than any author's machine), with
      # flakiness to be FIXED rather than waited out, since an extension is how advisory becomes
      # forever.
      #
      # WHAT THE WEEK SHOWED. 30 runs in the window. Three read end-to-end from their step logs —
      # the oldest in the window, PR #873's and PR #878's — plus two local runs, every one of them
      # `✅ ALL PASS — 844 assertions executed`. The figures are IDENTICAL across five days: 844
      # assertions, 72 page × mode states, 15,638 text nodes, lowest rendered contrast 3.04:1, ~48s.
      # That DETERMINISM is the evidence, not the run count — a flaky browser suite varies its
      # numbers. STATED LIMIT: 3 of 30 runs were read, not all 30 (each needs its own API fetch and
      # no bulk log access was available). A silent red run among the other 27 is not excluded by
      # this evidence, only made unlikely by the determinism.
      #
      # ADVISORY MUST NOT MEAN SILENT, and it did by default — the finding that made that week
      # readable at all, kept because it is why the evidence above could exist. Measured while the
      # flag was on: with `continue-on-error`, GitHub reported the STEP'S OWN conclusion as `success`
      # when the command exited non-zero, not only the job's, so a red suite appeared in no status
      # check and in nothing reading the API — the only trace being `##[error]` inside the step log.
      # A week that produces no signal is not a week of evidence. So the suite writes to
      # `$GITHUB_STEP_SUMMARY`: on failure the count and the failing assertions (each already naming
      # its page × mode × brand); and on SUCCESS a single line, deliberately, so a MISSING summary
      # means "this did not run" rather than being indistinguishable from a pass. That success line
      # is exactly what the three sampled runs were read for. It OUTLIVES the flag — absence being
      # ambiguous is a property of summaries, not of `continue-on-error`.
      #
      # `npx playwright install` stays INSIDE this step, and the reason inverted. Under the flag it
      # was so `continue-on-error` covered the download too; that reason is spent. It is kept for the
      # opposite one: the download is SETUP FOR A GATE, so a failed download must fail the step
      # rather than silently skip the coverage. KNOWN COST, stated rather than discovered — a
      # transient CDN failure now blocks merges. That is precisely the ambient-infrastructure risk
      # the advisory arrangement kept out of the way, and accepting it is part of the flip. If it
      # bites, the fix is caching the browser, never restoring the flag.
      # QUOTED, and it has to be: a bare YAML scalar ends at ` #`, so an unquoted name would be
      # truncated and the issue reference silently dropped — measured on the first CI run of the
      # branch that added this step. Same reason the "Plugin main.js has 0 node: builtins" step above
      # is quoted, one character class along.
      - name: "Studio headless smoke suite (#775)"
        run: |
          npx playwright install --with-deps chromium
          npm run -w @prism3/studio test:smoke
