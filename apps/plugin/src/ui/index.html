<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism3</title>
    <style>
      /* The shared apps/studio/src UI injects its own full stylesheet into <head> at boot; this only
         resets the iframe body + adopts Figma's theme so the app sits flush in the panel. */
      /* NO `color-scheme` here (UI redesign S1.2, plan §3.3). This line used to pin the document light
         (#1031): `color-scheme` declares which schemes a document is prepared for, and the UA then supplies
         field text, the caret, autofill, scrollbars and option lists from that scheme. While every surface
         was painted from light tokens, `light dark` handed the UA dark-scheme ink over light fields (the
         Name and Namespace inputs measured 1.11:1). The chrome now has a real dark scheme: the bundle's
         generated blocks set `color-scheme` per theme, `ui/entry.ts` maps Figma's theme onto `data-theme`,
         and every legacy surface still painted from light tokens carries `data-theme="light"`, which pins
         its own `color-scheme` light. `test:start` measures a legacy field under Figma's dark theme to
         hold #1031 closed. The `--figma-color-*` variables below are Figma's own, so the pre-boot canvas
         still follows the host theme. */
      html, body { margin: 0; padding: 0; }
      body { background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #1e1e1e); }
    </style>
  </head>
  <body>
    <!-- The shared studio UI (apps/studio/src/entry.ts) mounts on #app (docs/22 #110 — one UI, no fork). The build
         inlines the bundled JS in place of this dev-only module tag. -->
    <div id="app"></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
