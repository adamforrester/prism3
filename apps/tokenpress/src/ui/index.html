<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Token Press - DTCG Exporter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            background: var(--figma-color-bg);
            color: var(--figma-color-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 16px;
            border-bottom: 1px solid var(--figma-color-border);
            background: var(--figma-color-bg-secondary);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .summary {
            font-size: 12px;
            color: var(--figma-color-text-secondary);
            line-height: 1.3;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--figma-color-border);
        }
        
        .tab {
            flex: 1;
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--figma-color-text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: var(--figma-color-text);
            border-bottom-color: var(--figma-color-border-brand);
        }
        
        .tab:hover {
            background: var(--figma-color-bg-hover);
        }
        
        .panel {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        
        .panel.hidden {
            display: none;
        }
        
        .button {
            background: var(--figma-color-bg-brand);
            color: var(--figma-color-text-onbrand);
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
            margin-top: 16px;
        }
        
        .button:hover {
            background: var(--figma-color-bg-brand-hover);
        }
        
        .button:disabled {
            background: var(--figma-color-bg-disabled);
            color: var(--figma-color-text-disabled);
            cursor: not-allowed;
        }
        
        .button.secondary {
            background: var(--figma-color-bg-secondary);
            color: var(--figma-color-text);
            border: 1px solid var(--figma-color-border);
        }
        
        .button.secondary:hover {
            background: var(--figma-color-bg-hover);
        }
        
        .issues {
            margin-top: 16px;
        }
        
        .issue {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .issue.error {
            background: var(--figma-color-bg-danger);
            border: 1px solid var(--figma-color-border-danger);
        }
        
        .issue.warning {
            background: var(--figma-color-bg-warning);
            border: 1px solid var(--figma-color-border-warning);
        }
        
        .options {
            display: grid;
            gap: 16px;
        }
        
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .option-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--figma-color-text);
        }
        
        .option-group select,
        .option-group input {
            padding: 8px 12px;
            border: 1px solid var(--figma-color-border);
            border-radius: 4px;
            background: var(--figma-color-bg);
            color: var(--figma-color-text);
            font-size: 14px;
        }
        
        .option-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
        }
        
        .progress {
            width: 100%;
            height: 4px;
            background: var(--figma-color-bg-secondary);
            border-radius: 2px;
            overflow: hidden;
            margin: 16px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: var(--figma-color-bg-brand);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            font-size: 12px;
            color: var(--figma-color-text-secondary);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Token Press</h1>
        <div class="summary" id="summary">
            Click "Scan & Validate" to analyze your design tokens
        </div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="scan">Scan & Validate</button>
        <button class="tab" data-tab="export">Export</button>
    </div>
    
    <div class="panel" id="scan-panel">
        <button class="button" id="scan-button">Scan & Validate</button>
        
        <div class="progress hidden" id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="issues" id="issues"></div>
    </div>
    
    <div class="panel hidden" id="export-panel">
        <div class="options">
            <div class="option-group">
                <label for="units">Units</label>
                <select id="units">
                    <option value="px">Pixels (px)</option>
                    <option value="rem">Root em (rem)</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="line-height-output">Line Height Output</label>
                <select id="line-height-output">
                    <option value="ratio">Ratio (DTCG default)</option>
                    <option value="dimension">Dimension</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="letter-spacing-units">Letter Spacing Units</label>
                <select id="letter-spacing-units">
                    <option value="px">Pixels (px)</option>
                    <option value="percent">Percent (%)</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="namespace">Namespace/Prefix (optional)</label>
                <input type="text" id="namespace" placeholder="e.g., pds">
            </div>
            
            <div class="option-group">
                <div class="checkbox-option">
                    <input type="checkbox" id="include-figma-extensions" checked>
                    <label for="include-figma-extensions">Include $extensions.figma metadata</label>
                </div>
            </div>
            
            <div class="option-group">
                <div class="checkbox-option">
                    <input type="checkbox" id="emit-dtcg-keys" checked>
                    <label for="emit-dtcg-keys">Emit DTCG keys ($type, $value)</label>
                </div>
            </div>
            
        </div>
        
        <button class="button" id="export-button" disabled>Export Tokens</button>
        <div class="status" id="export-status"></div>
    </div>

    <script src="ui-script.js"></script>
</body>
</html>
