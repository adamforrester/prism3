.p3-tweight, .p3-tspace, .p3-tpin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-150); align-items: center; }
.p3-tspace-ctl { display: grid; gap: var(--p3-space-050); min-width: 0; }
.p3-titalic { display: grid; gap: var(--p3-space-100); }
.p3-tnudge { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-150); align-items: start; }
.p3-tnudge-set { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); }
.p3-wmatrix { display: grid; gap: var(--p3-space-050); overflow-x: auto; }
.p3-wmatrix-row { display: grid; grid-auto-flow: column; grid-template-columns: minmax(var(--p3-step-w), 2fr); grid-auto-columns: minmax(var(--p3-hit-min), 1fr); gap: var(--p3-space-050); align-items: center; justify-items: center; }
.p3-wmatrix-row > :first-child { justify-self: stretch; }
.p3-wmatrix-head > .p3-field-label { overflow-wrap: anywhere; text-align: center; }
.p3-wmatrix-head > .p3-field-label:first-child { text-align: left; }
.p3-btn.p3-mcheck { min-height: var(--p3-hit-min); min-width: var(--p3-hit-min); padding: 0; justify-content: center; }
.p3-btn.p3-mcheck > .p3-ico { visibility: hidden; }
.p3-btn.p3-mcheck[aria-checked="true"] { border-color: var(--p3-ctl-edge); }
.p3-btn.p3-mcheck[aria-checked="true"] > .p3-ico { visibility: visible; color: var(--p3-text); }
.p3-btn.p3-pick[data-set="true"] { border-color: var(--p3-ctl-edge); }
/* A picker button whose value is long ("Auto: follows Light (160px)") wraps inside its cell rather than run past it. */
:is(.p3-tsizes-cells, .p3-tweight, .p3-tspace-ctl) > .p3-btn.p3-pick { min-width: 0; white-space: normal; }
/* #3337 (Q3337.2 A): a "Set it in …" link is a text link flush with the column: no inline padding and no edge, so its words
   start on the row's edge; still a whole target tall, underlined, the chevron after it. Its hover is the underline it
   already draws: with no edge, the ghost button's hover edge has nothing to color. */
.p3-btn.p3-deplink { justify-self: start; padding-inline: 0; border-width: 0; white-space: normal; text-align: left; text-decoration: underline; text-underline-offset: var(--p3-space-025); }

.p3-vpick-list { display: grid; gap: var(--p3-space-050); max-height: calc(var(--p3-ctl-h) * 9); overflow-y: auto; }
.p3-vpick {
  display: grid; grid-template-columns: minmax(var(--p3-step-w), auto) minmax(0, 1fr); gap: var(--p3-space-050) var(--p3-space-150);
  align-items: center; padding: var(--p3-space-075) var(--p3-space-100); border: var(--p3-bw-hairline) solid var(--p3-field-edge);
  border-radius: var(--p3-radius-lg); background: var(--p3-bg-page); color: var(--p3-text); cursor: pointer; text-align: left;
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-12);
}
.p3-vpick:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-vpick:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-vpick[aria-pressed="true"] { border: var(--p3-bw-thick) solid var(--p3-ctl-edge); padding: calc(var(--p3-space-075) - var(--p3-bw-hairline)) calc(var(--p3-space-100) - var(--p3-bw-hairline)); font-weight: var(--p3-fw-emphasis); }
.p3-vpick-key { display: flex; align-items: center; gap: var(--p3-space-050); font-family: var(--p3-font-mono); }
.p3-vpick-sample { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--p3-text); line-height: var(--p3-lh-compact); }
.p3-vpick-sample[data-wrap="true"] { white-space: normal; }
.p3-vpick-why { grid-column: 1 / -1; color: var(--p3-text-2); }
/* A named run of values (#3092: Layout's spacing steps, then the dimension steps). */
.p3-vpick-grp { display: grid; gap: var(--p3-space-050); }
.p3-vpick-cap { margin: 0; padding-top: var(--p3-space-050); color: var(--p3-text-2); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-cozy); }
/* Shape (S7): the way to Components under Density, and the base radius picker's sample, a square at the value's
   radius (its radius is the value, set inline inside the picker's [data-content] sample). */
.p3-shape-pad { display: grid; gap: var(--p3-space-050); justify-items: start; margin-top: var(--p3-space-100); }
.p3-btn.p3-shape-reset { justify-self: start; }
.p3-radius-sample { display: inline-block; width: var(--p3-space-300); height: var(--p3-space-300); border: var(--p3-bw-thick) solid var(--p3-text); vertical-align: middle; }
/* ── Layout (S10): the breakpoint list, each breakpoint's columns, gutter and margin, and the pickers' samples ────── */
.p3-bplist { display: grid; gap: var(--p3-space-100); }
.p3-bprow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--p3-space-100); align-items: center; justify-items: start; }
.p3-bprow > .p3-text-input { justify-self: stretch; }
.p3-bp-unit, .p3-bp-note { color: var(--p3-text-2); font-size: var(--p3-fs-12); white-space: nowrap; }
.p3-lgrid { display: grid; gap: var(--p3-space-200); }
.p3-lgrid-bp { display: grid; gap: var(--p3-space-100); min-width: 0; margin: 0; padding: var(--p3-space-150) 0 0; border: 0; border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-lgrid-name { display: flex; align-items: baseline; gap: var(--p3-space-100); padding: 0; float: left; width: 100%; }
/* L2: each breakpoint's name is a group heading at fw-strong (it was the UA's <b> bold, off-token); the fieldset's
   gap (space-100) plus space-050 makes its space-150. */
.p3-lgrid-name > b { font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
.p3-lgrid-name { padding-block-end: var(--p3-space-050); }
.p3-lgrid-name + * { clear: both; }
.p3-lrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-150); align-items: center; }
.p3-lrow > .p3-btn.p3-pick { min-width: 0; white-space: normal; }
.p3-lsamp-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--p3-space-025); height: var(--p3-space-200); }
.p3-lsamp-bar { display: block; min-width: 0; }
.p3-lsamp-gap { display: block; height: var(--p3-space-200); }
/* The type-ahead (#113): page DOM under the field, so it scrolls and takes the chrome's theme in Figma's iframe. */
.p3-combo { position: relative; min-width: 0; }
.p3-combo-list {
  position: absolute; z-index: 40; top: calc(100% + var(--p3-space-050)); left: 0; right: 0; display: grid;
  max-height: calc(var(--p3-ctl-h) * 8); overflow-y: auto; padding: var(--p3-space-050);
  border-radius: var(--p3-radius-xl); border: var(--p3-bw-hairline) solid var(--p3-line-2); background: var(--p3-bg-page);
}
.p3-combo-list[hidden] { display: none; }
.p3-combo-opt {
  display: flex; align-items: center; min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150); border-radius: var(--p3-radius-lg);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); cursor: pointer;
}
.p3-combo-opt:where(:not(:disabled, [aria-disabled="true"])):hover, .p3-combo-opt[aria-selected="true"] { background: var(--p3-fill-1); }

/* ── the start window and its guard (UI redesign S12) ──────────────────────────────────────────────── */
/* A window over the studio (G10 A): the scrim covers the frame, the window sits centered on it, and at 380 the start
   takes the whole pane. Its head stays put while its body scrolls. The scrim is Stance's modal scrim, `scrim.default`
   (#2560, the owner's Q486 A and Q613 8 A): the one the export and prune dialogs sit on, so every chrome dialog shares
   it. Until then it was the pressed hover wash, white 20% in dark, which lightened the studio behind the window. */
.p3-layer:empty { display: none; }
.p3-scrim {
  position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
  padding: var(--p3-space-300); background: var(--p3-scrim);
}
.p3-dialog {
  display: flex; flex-direction: column; width: min(100%, calc(var(--p3-dlg-unit) * 5)); max-height: 100%; min-height: 0;
  color: var(--p3-text); background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-line-2);
  border-radius: var(--p3-radius-xl); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
.p3-dialog-guard { width: min(100%, calc(var(--p3-dlg-unit) * 3.75)); }
.p3-dialog-head {
  display: flex; align-items: center; gap: var(--p3-space-100); flex: none; min-height: var(--p3-bar-h);
  padding: var(--p3-space-100) var(--p3-space-300); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-dialog-title {
  flex: 1 1 auto; min-width: 0; margin: 0; color: var(--p3-text); font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong);
  letter-spacing: var(--p3-ls-tighter); line-height: var(--p3-lh-compact);
}
.p3-dialog-body { display: grid; gap: var(--p3-space-200); min-height: 0; overflow: auto; padding: var(--p3-space-300); }
.p3-dialog-foot {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--p3-space-100); flex: none;
  padding: var(--p3-space-200) var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-dialog-body p { margin: 0; }
.p3-guard-text { color: var(--p3-text); }
.p3-frame[data-w="narrow"] .p3-scrim-start { padding: 0; }
.p3-frame[data-w="narrow"] .p3-start { width: 100%; height: 100%; max-height: none; border: 0; border-radius: 0; }
.p3-frame[data-w="narrow"] :is(.p3-dialog-head, .p3-dialog-body, .p3-dialog-foot) { padding-left: var(--p3-space-200); padding-right: var(--p3-space-200); }
/* Today's four cards, restyled (G11 B): containers take radius-xl and a hairline; the every card takes the same edge (the owner's review of #2142). */
.p3-start-lede { color: var(--p3-text-2); }
.p3-start-card {
  display: grid; gap: var(--p3-space-050); min-width: 0; padding: var(--p3-space-250);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page);
}
.p3-start-text { display: grid; gap: var(--p3-space-050); min-width: 0; }
.p3-start-title { margin: 0; color: var(--p3-text); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
.p3-start-desc { color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-start-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); margin-top: var(--p3-space-150); }
.p3-start-row > .p3-start-go { margin-left: auto; }
.p3-start-row > .p3-colorfield { flex: 0 1 auto; }
.p3-colorfield[data-refused="true"] { border-color: var(--p3-bad-icon); }
.p3-frame[data-w="narrow"] .p3-start-row > .p3-start-go { margin-left: 0; }
.p3-start-chips { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); margin-top: var(--p3-space-150); }
.p3-btn.p3-start-chip { border-radius: var(--p3-radius-pill); padding: 0 var(--p3-space-150) 0 var(--p3-space-100); font-weight: var(--p3-fw-default); }
.p3-start-dot { flex: none; width: var(--p3-space-150); height: var(--p3-space-150); border-radius: var(--p3-radius-pill); }
.p3-start-paste {
  display: block; width: 100%; min-width: 0; min-height: calc(var(--p3-ctl-h) * 2); margin-top: var(--p3-space-150);
  padding: var(--p3-space-100) var(--p3-space-150); resize: vertical; color: var(--p3-text); background: var(--p3-bg-page);
  border: var(--p3-bw-hairline) solid var(--p3-edge); border-radius: var(--p3-radius-lg);
  font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal);
}
.p3-start-paste::placeholder { color: var(--p3-text-2); opacity: 1; }
.p3-start-paste:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-start-paste:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-start-file { display: none; }
.p3-start-err { margin: 0; color: var(--p3-bad-text); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-start-err:empty { display: none; }
/* Discard (owner decision S5): Prism3's destructive button, filled, at rest exactly; its edge carries hover. */
.p3-btn.p3-btn-danger { background-color: var(--p3-danger-fill); color: var(--p3-danger-on); border-color: var(--p3-danger-fill); }
.p3-btn.p3-btn-danger:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-danger-edge-hover); }
/* The import card (the owner's review of #2142): its heading row holds the title and Upload, and the paste box sits a
   step further below it (space-200, one up from the cards' space-150), so pasting reads as the alternative. */
.p3-start-headrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--p3-space-200); }
.p3-start-import > .p3-start-paste { margin-top: var(--p3-space-200); }
.p3-start-pasterow { justify-content: flex-end; margin-top: var(--p3-space-100); }
/* ── the Build style guides page (S11.2, plugin only): a page no tab shows, full width ─────── */
/* Its own layout (`data-layout="page"`): the head, the page scrolling under it, the drawer at the foot. */
.p3-sgpage { display: none; }
.p3-frame[data-layout="page"] { position: fixed; inset: 0; display: flex; flex-direction: column; }
.p3-frame[data-layout="page"] .p3-panes { display: none; }
.p3-frame[data-layout="page"] .p3-sgpage { display: block; flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--p3-levers-bg); }
.p3-frame[data-layout="page"]:not([data-inspect=""]) .p3-sgpage { display: none; }
.p3-frame[data-layout="page"]:not([data-inspect=""]) .p3-inspect { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.p3-frame[data-layout="page"] .p3-drawer { position: static; flex: none; }
/* At 380 the head's rows are the frame's own flex items (the head is `display: contents` there): none of them shrinks. */
.p3-frame[data-layout="page"] :is(.p3-head, .p3-bar, .p3-nav, .p3-subnav, .p3-notices) { flex: none; }

/* ── the homes (#2879, plugin only): the library home, the minimal home, "Reading this file" ──────── */
/* Their own layout (`data-layout="home"`), shaped as the Build style guides page's: the bar, the home scrolling under
   it, the drawer at the foot. No tab row and no panes: there is no brand in the file to edit. */
.p3-home { display: none; }
.p3-home [hidden] { display: none; }
.p3-frame[data-layout="home"] { position: fixed; inset: 0; display: flex; flex-direction: column; }
.p3-frame[data-layout="home"] :is(.p3-panes, .p3-nav, .p3-subnav, .p3-sgpage, .p3-inspect) { display: none; }
.p3-frame[data-layout="home"] .p3-home { display: block; flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--p3-bg-page); }
.p3-frame[data-layout="home"] .p3-drawer { position: static; flex: none; }
.p3-frame[data-layout="home"] :is(.p3-head, .p3-bar, .p3-notices) { flex: none; }
.p3-home:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: calc(-1 * var(--p3-focus-width)); }
.p3-home-col { display: grid; gap: var(--p3-space-200); align-content: start; max-width: calc(var(--p3-dlg-unit) * 5); padding: var(--p3-space-300); }
.p3-frame[data-w="narrow"] .p3-home-col { padding: var(--p3-space-200); }
.p3-home-head { display: grid; gap: var(--p3-space-050); }
.p3-home-title {
  margin: 0; color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-20); font-weight: var(--p3-fw-bold);
  letter-spacing: var(--p3-ls-tightest); line-height: var(--p3-lh-compact);
}
.p3-home-meta { margin: 0; color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal); }
.p3-home-reading { display: flex; align-items: center; gap: var(--p3-space-100); margin: 0; color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); }
/* The agent link's card: a hairline container (the start cards' edge), its row drawn by the plugin's entry. */
.p3-home-card {
  display: grid; gap: var(--p3-space-100); min-width: 0; padding: var(--p3-space-250);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page);
}
.p3-home-row { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); }
/* The agent link's row (the plugin's `agent-link-ui.ts` fills the card): its title and status, then the switch. */
.p3-home-agentrow { display: flex; align-items: center; justify-content: space-between; gap: var(--p3-space-200); min-width: 0; }
.p3-home-agenttext { display: grid; gap: var(--p3-space-025); min-width: 0; }
.p3-home-agenttitle { color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); }
.p3-home-agentstatus { color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); overflow-wrap: anywhere; }
/* The bar's name for a home, in place of the brand switcher: text, then the "Library file" badge. The badge inks in the
   primary text color: the secondary one measured 4.16:1 on the dark bar, under the 4.5:1 floor (`test:chrome` §28b). */
.p3-homename { display: flex; align-items: center; gap: var(--p3-space-100); min-width: 0; flex: 0 1 auto; }
.p3-homename-text {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--p3-text);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong);
}
.p3-homename-badge {
  flex: none; padding: 0 var(--p3-space-100); border: var(--p3-bw-hairline) solid var(--p3-line-2); border-radius: var(--p3-radius-pill);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); white-space: nowrap;
}
.p3-homename-badge[hidden] { display: none; }
.p3-frame[data-w="narrow"]:has(> .p3-drawer[data-open="true"]) .p3-sgpage { display: none; }
.p3-sg {
  display: grid; gap: var(--p3-space-300); align-content: start; max-width: calc(29 * var(--p3-ctl-h)); margin: 0 auto;
  padding: var(--p3-space-400) var(--p3-space-500); color: var(--p3-text); font-family: var(--p3-font-ui);
  font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
.p3-sg-head { display: grid; gap: var(--p3-space-100); }
.p3-sg-hrow { display: flex; align-items: center; gap: var(--p3-space-200); }
.p3-sg-title { margin: 0; flex: 1 1 auto; font-size: var(--p3-fs-20); font-weight: var(--p3-fw-bold); letter-spacing: var(--p3-ls-tightest); line-height: var(--p3-lh-compact); }
.p3-sg-intro { margin: 0; color: var(--p3-text-2); line-height: var(--p3-lh-cozy); }
.p3-sg-note { display: flex; align-items: center; gap: var(--p3-space-100); margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-sg-note > .p3-ico { color: var(--p3-icon-2); }
.p3-sg-warn {
  padding: var(--p3-space-150) var(--p3-space-200); border: var(--p3-bw-hairline) solid var(--p3-line-2); border-radius: var(--p3-radius-xl);
  background: var(--p3-bg-page); color: var(--p3-text); font-size: var(--p3-fs-14);
}
.p3-sg-warn > .p3-ico { color: var(--p3-warn-icon); }
.p3-sg-warn-text { flex: 1 1 auto; min-width: 0; }
.p3-sg-error { color: var(--p3-bad-text); }
.p3-sg-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-300); align-items: start; }
.p3-sg-right { display: grid; gap: var(--p3-space-300); min-width: 0; }
.p3-sg-sec {
  display: grid; gap: var(--p3-space-200); min-width: 0; padding: var(--p3-space-300); border-radius: var(--p3-radius-xl);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); background: var(--p3-bg-page);
}
.p3-sg-sec-title { margin: 0; font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-tighter); line-height: var(--p3-lh-compact); }
/* The heading rule (TY2 A, #2215): a card's title is L1, so its content starts space-300 after it; the card's gap is
   space-200, which the untitled Draw card keeps. (Its page title, .p3-sg-title, is a page title, not a level.) */
.p3-sg-sec-title { margin-block-end: calc(var(--p3-space-300) - var(--p3-space-200)); }
.p3-sg-plain { display: grid; gap: var(--p3-space-200); min-width: 0; margin: 0; padding: 0; border: 0; }
.p3-sg-selrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-150); }
/* L3 (TY2 A, #2215): a field's name (Collection, Mode, the Kinds legend) is a field label, fs-14 / fw-emphasis /
   lh-compact in primary ink, its control space-050 after it. The legend is not reached by its fieldset's gap, so it
   carries the space itself. */
.p3-sg-field { display: grid; gap: var(--p3-space-050); min-width: 0; }
.p3-sg-field-name { padding: 0; font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-compact); color: var(--p3-text); }
legend.p3-sg-field-name { padding-block-end: var(--p3-space-050); }
/* A disabled select takes the disabled field (F1 A), as the text field does: no dashed edge (#2155). */
:is(.p3-sg, .p3-modes-select) .p3-select:disabled { background: var(--p3-disabled-fill); border-color: var(--p3-disabled-edge); color: var(--p3-disabled-ink); cursor: not-allowed; }
.p3-sg-kinds { display: grid; gap: var(--p3-space-100); min-width: 0; margin: 0; padding: 0; border: 0; }
.p3-sg-chips { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); }
.p3-sg-chips > .p3-sg-check { width: auto; border-color: var(--p3-edge); }
.p3-sg-n { color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.p3-check[aria-checked="mixed"] .p3-check-box { background: var(--p3-text); border-color: var(--p3-text); }
.p3-check[aria-checked="mixed"] .p3-check-box > .p3-ico { display: block; color: var(--p3-bg-page); }
.p3-sg-treebar { display: flex; align-items: center; gap: var(--p3-space-150); }
.p3-sg-grow { flex: 1 1 auto; min-width: 0; }
.p3-sg-tree, .p3-sg-sub { margin: 0; padding: 0; list-style: none; }
.p3-sg-tree {
  max-height: calc(10 * var(--p3-ctl-h)); overflow: auto; padding: var(--p3-space-050);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-xl);
}
/* #3553 M11: with no collection open the tree has no rows, and its padded border drew an empty pill. */
.p3-sg-tree:empty { display: none; }
.p3-sg-row { display: flex; align-items: center; gap: var(--p3-space-025); min-height: var(--p3-ctl-h-xs); }
.p3-sg-row[data-depth="1"] { padding-left: var(--p3-space-200); }
.p3-sg-row[data-depth="2"] { padding-left: var(--p3-space-400); }
.p3-sg-row[data-depth="3"] { padding-left: calc(3 * var(--p3-space-200)); }
.p3-sg-row[data-depth="4"] { padding-left: calc(4 * var(--p3-space-200)); }
.p3-sg-row[data-depth="5"] { padding-left: calc(5 * var(--p3-space-200)); }
.p3-sg-row[data-depth="6"], .p3-sg-row[data-depth="7"], .p3-sg-row[data-depth="8"] { padding-left: calc(6 * var(--p3-space-200)); }
.p3-sg-fold { min-height: var(--p3-ctl-h-xs); min-width: var(--p3-ctl-h-xs); }
.p3-sg-fold[aria-expanded="true"] > .p3-ico { transform: rotate(90deg); }
.p3-sg-fold-space { flex: none; width: var(--p3-ctl-h-xs); }
.p3-sg-row > :is(.p3-sg-check, .p3-sg-label) { flex: 1 1 auto; min-width: 0; }
.p3-sg-label { display: flex; align-items: center; gap: var(--p3-space-150); min-height: var(--p3-ctl-h-xs); padding: var(--p3-space-050) var(--p3-space-100); }
.p3-sg-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p3-sg-row[data-p3="sg-group"] .p3-sg-name { font-weight: var(--p3-fw-emphasis); }
.p3-sg-row[data-later="true"] .p3-sg-name { color: var(--p3-text-2); }
.p3-sg-tag {
  flex: none; padding: 0 var(--p3-space-075); border-radius: var(--p3-radius-md); background: var(--p3-fill-1);
  color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal);
}
.p3-sg-meta { display: inline-flex; align-items: center; gap: var(--p3-space-075); margin-left: auto; flex: none; color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.p3-sg-mono { font-family: var(--p3-font-mono); }
.p3-sg-swatch { display: inline-block; flex: none; width: var(--p3-icon-xs); height: var(--p3-icon-xs); border: var(--p3-bw-hairline) solid var(--p3-line-2); border-radius: var(--p3-radius-md); overflow: hidden; }
.p3-sg-swatch > span { display: block; width: 100%; height: 100%; }
.p3-sg-titles { display: grid; gap: var(--p3-space-100); }
.p3-sg-titles-sum { display: flex; align-items: center; gap: var(--p3-space-075); cursor: pointer; font-weight: var(--p3-fw-emphasis); list-style: none; }
.p3-sg-titles-sum::-webkit-details-marker { display: none; }
.p3-sg-titles-sum > .p3-ico { color: var(--p3-icon-2); }
.p3-sg-titles[open] > .p3-sg-titles-sum > .p3-ico { transform: rotate(90deg); }
.p3-sg-titles-sum:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-sg-titles-body { display: grid; gap: var(--p3-space-075); }
.p3-sg-textarea { width: 100%; min-height: var(--p3-ctl-h); resize: vertical; font-family: var(--p3-font-mono); }
.p3-sg-err { margin: 0; color: var(--p3-bad-text); font-size: var(--p3-fs-12); }
.p3-sg-err:empty { display: none; }
/* The run: the summary and Draw, then (variant 1) the table list. */
.p3-sg-runbar { display: flex; align-items: center; gap: var(--p3-space-200); }
.p3-sg-sum { flex: 1 1 auto; min-width: 0; color: var(--p3-text-2); }
.p3-sg-sum > b { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); }
.p3-sg-draw { min-height: var(--p3-ctl-h); }
.p3-sg-prog { display: grid; gap: var(--p3-space-150); min-width: 0; }
/* The cleanup offer (Q412 A, #2816): the run's list of tables the generator no longer draws, then Remove. */
.p3-sg-cleanup { display: grid; gap: var(--p3-space-150); min-width: 0; }
.p3-sg-cleanup-list { margin: 0; padding-left: var(--p3-space-300); color: var(--p3-text); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); overflow-wrap: anywhere; }
.p3-sg-cleanup-foot { display: flex; justify-content: flex-end; gap: var(--p3-space-150); }
.p3-sg-runhead { display: flex; align-items: center; gap: var(--p3-space-150); }
.p3-sg-runline { flex: 1 1 auto; min-width: 0; font-weight: var(--p3-fw-emphasis); }
.p3-sg-summary { margin: 0; overflow-wrap: anywhere; }
.p3-sg-tlist {
  margin: 0; padding: 0; list-style: none; max-height: calc(8 * var(--p3-ctl-h)); overflow: auto;
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-xl);
}
.p3-sg-trow {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-ctl-h-xs);
  padding: var(--p3-space-050) var(--p3-space-150); border-top: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-sg-trow:first-child { border-top: 0; }
.p3-sg-trow > .p3-ico { color: var(--p3-ok-icon); }
.p3-sg-trow[data-status="failed"] > .p3-ico { color: var(--p3-bad-icon); }
.p3-sg-wait { box-sizing: border-box; flex: none; width: var(--p3-icon-xs); height: var(--p3-icon-xs); border: var(--p3-bw-hairline) dashed var(--p3-icon-2); border-radius: var(--p3-radius-pill); }
.p3-sg-tname { flex: 1 1 auto; min-width: 0; color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.p3-sg-tname > b { color: var(--p3-text); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); }
.p3-sg-tstatus { flex: none; color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.p3-sg-trow[data-status="failed"] .p3-sg-tstatus, .p3-sg-reason { color: var(--p3-bad-text); }
.p3-sg-why { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); width: 100%; padding-left: var(--p3-space-300); font-size: var(--p3-fs-12); }
.p3-sg-reason { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
/* The options: a group per kind in the selection, each lever a name, its control and its hint. */
.p3-sg-ogroup { display: grid; gap: var(--p3-space-150); padding-top: var(--p3-space-150); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-sg-ogroup:first-child { padding-top: 0; border-top: 0; }
/* L2 (TY2 A, #2215): an option group's title is a group heading, fs-14 / fw-strong / lh-compact in primary ink; its first
   lever starts space-150 after it (the group's gap). */
.p3-sg-ogroup-title { margin: 0; color: var(--p3-text); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
.p3-sg-lever { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--p3-space-050) var(--p3-space-200); }
.p3-sg-lever-wide { grid-template-columns: minmax(0, 1fr); }
/* L3 (TY2 A, SH1 A, #2215): a lever inside an option group reads as a field (held decision 7, as Interactive's Neutral
   emphasis): fs-14 / fw-emphasis / lh-compact in primary ink. What follows its row (the control under a wide lever's
   name, or the lever's own hint under a name and its control) starts space-050 after it: the lever's row gap. */
.p3-sg-lever-name { color: var(--p3-text); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-compact); }
.p3-sg-hint { grid-column: 1 / -1; }
/* THE CHROME'S ONE SWITCH (concept v6's, SG5 A; every switch since #2183, `switchEl` in shell/dom.ts): a button with
   `role="switch"` holding a track and a knob, its state in `aria-checked` alone. Its ring is its own outline, on the
   focus color (FR1 A). In a lever's control column it sits at the start of its row. */
.p3-switch {
  display: inline-flex; align-items: center; justify-self: start; min-height: var(--p3-ctl-h-xs); padding: 0; border: 0; border-radius: var(--p3-radius-pill);
  background: transparent; cursor: pointer;
}
.p3-switch:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-switch-track {
  position: relative; flex: none; width: var(--p3-track-w); height: var(--p3-track-h); border-radius: var(--p3-radius-pill);
  border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page); pointer-events: none;
}
.p3-switch-knob {
  position: absolute; top: calc(var(--p3-thumb-inset) - var(--p3-bw-hairline)); left: calc(var(--p3-thumb-inset) - var(--p3-bw-hairline));
  width: var(--p3-thumb); height: var(--p3-thumb); border-radius: var(--p3-radius-pill); background: var(--p3-icon-2);
  transition: transform var(--p3-transition-dur) var(--p3-transition-ease);
}
.p3-switch[aria-checked="true"] .p3-switch-track { background: var(--p3-inv-bg); border-color: var(--p3-inv-bg); }
.p3-switch[aria-checked="true"] .p3-switch-knob { background: var(--p3-inv-text); transform: translateX(calc(var(--p3-track-w) - var(--p3-thumb) - 2 * var(--p3-thumb-inset))); }
/* Hover (Q28 a: every enabled control kind answers hover), on the chrome's own control cues: off, the track's edge steps
   to the field hover edge, as a field's and a page button's do; on, the track steps to the filled button's hover fill. */
.p3-switch:where(:not(:disabled, [aria-disabled="true"])):hover .p3-switch-track { border-color: var(--p3-field-edge-hover); }
.p3-switch[aria-checked="true"]:where(:not(:disabled, [aria-disabled="true"])):hover .p3-switch-track { background: var(--p3-inv-bg-2); border-color: var(--p3-inv-bg-2); }
@media (prefers-reduced-motion: reduce) { .p3-switch-knob { transition: none; } }
/* At 380: one column, the run's table list first, and Draw pinned to the bottom of the page. */
.p3-frame[data-w="narrow"] .p3-sg { padding: var(--p3-space-200) var(--p3-space-150) var(--p3-space-300); gap: var(--p3-space-200); }
.p3-frame[data-w="narrow"] .p3-sg-cols, .p3-frame[data-w="narrow"] .p3-sg-selrow { grid-template-columns: minmax(0, 1fr); }
.p3-frame[data-w="narrow"] .p3-sg-sec { padding: var(--p3-space-200); }
/* Q47 A (owner, 2026-10-06; as Components' build bar, #2180): it stands `space-300` above the page's bottom edge, so it
   never sits flush on the Activity drawer's strip. */
.p3-sg-actbar {
  position: sticky; bottom: var(--p3-space-300); z-index: 5; padding: var(--p3-space-150) var(--p3-space-200);
  border: var(--p3-bw-hairline) solid var(--p3-edge); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page);
}
/* The closed strip at 380 carries the running style guide's progress (S11.2). */
.p3-strip-prog { flex: none; width: calc(2 * var(--p3-ctl-h)); }

/* ── a disabled button: Prism3's own disabled button (owner decision X4 A, 2026-10-05) ─────── */
/* A disabled button takes the disabled skin Prism3's button and icon button definitions bind for its appearance, and
   nothing else: no dashed edge. Outline, the page-colored button: no fill, a solid edge on `disabled-icon`, the label
   on `disabled-text` and the glyph on `disabled-icon`. Text, the ghost button and the mode check: the same with no
   edge. Filled (Apply Theme, Continue, Discard): the disabled fill and the on-fill ink, no edge. A running write's
   control is `aria-disabled` and `aria-busy`: it is pending, not disabled, so it keeps its look (S11). These rules sit
   last so they win over a state rule of the same weight (a chosen chip, a set picker). Contrast-exempt as an inactive
   component (WCAG 2.2 SC 1.4.3 and 1.4.11), and the audits hold each one to these roles while it is really disabled.
   The preview's mode control, held on Palettes (PM1 B, #2321), takes the same rules by what each segment draws at
   rest: the selected one has an edge, so it is the outline skin; the others have none, so they are the text skin. */
:is(.p3-btn, .p3-vpick, .p3-mode):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  cursor: not-allowed; background-color: transparent; border-style: solid; border-color: var(--p3-disabled-icon); color: var(--p3-disabled-text);
}
:is(.p3-btn, .p3-vpick, .p3-mode):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) * { color: inherit; }
:is(.p3-btn, .p3-vpick, .p3-mode):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) .p3-ico { color: var(--p3-disabled-icon); }
:is(.p3-btn:is(.p3-btn-ghost, .p3-check), .p3-mode:not([aria-checked="true"])):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) { border-color: transparent; }
.p3-btn:is(.p3-btn-primary, .p3-next, .p3-btn-danger):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  background-color: var(--p3-disabled-fill); border-color: transparent; color: var(--p3-disabled-ink);
}
.p3-btn:is(.p3-btn-primary, .p3-next, .p3-btn-danger):is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) .p3-ico { color: var(--p3-disabled-ink); }
/* What a disabled button holds: the mode check's box takes Prism3's disabled check box (its fill, edge and on-fill
   mark). The always-on Light row's box takes the same check box (DB1 A, #2208), so "can't change" has one look. */
:is(.p3-check:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]), .p3-check-fixed) .p3-check-box { background: var(--p3-disabled-fill); border-color: var(--p3-disabled-edge); }
:is(.p3-check:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]), .p3-check-fixed) .p3-check-box > .p3-ico { color: var(--p3-disabled-ink); }
/* A disabled switch: Prism3's own disabled switch (owner Q52 B / DS2 A, SW1 D; #2237), the roles the engine's switch
   definition binds (`packages/engine/components/switch-control.ts`), on and off alike: the track's fill on
   `disabled-fill` (`color.disabled.fill`), its edge on `disabled-edge` (`color.disabled.border`) and the knob on
   `disabled-ink` (`color.disabled.on-fill`), never the outline button's `disabled-icon`. The engine's thumb glyph and
   row label have no element here: the chrome's knob is plain, and the lever's name keeps its ink, as every lever name
   does in the read-only panel (the owner, 2026-10-08). The knob keeps its side, so on and off still read apart. */
.p3-switch:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) { cursor: not-allowed; }
.p3-switch:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) .p3-switch-track { background: var(--p3-disabled-fill); border-color: var(--p3-disabled-edge); }
.p3-switch:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) .p3-switch-knob { background: var(--p3-disabled-ink); }

/* ── forced colors (#1855): Windows High Contrast keeps every state ─────────────────────────────── */
/* Under forced colors the browser repaints every fill, edge and ink in the person's system colors, so a state the
   chrome draws by a fill or an ink alone disappears: a selected chip turned white on black like the rest, a switch
   lost its knob and the status dots drew nothing. These rules put each state back in system colors, never in the
   chrome's own: a selected, pressed or checked control fills with `Highlight` and inks with `HighlightText`; a
   disabled one inks and edges with `GrayText`; an edge that carries the state is drawn, and one that does not is
   hidden in `Canvas`. A focus ring takes `CanvasText`, so it shows next to a `Highlight` fill too. The brand's color
   specimens keep their real colors (`forced-color-adjust: none`).
   ONE CONTROL OPTS OUT, AND ONLY WHILE SELECTED (owner decision HC1 B, 2026-10-09): under forced colors Chromium draws a
   `Canvas` backplate behind every run of text, whatever the fill under it, so a `HighlightText` label on a `Highlight`
   fill vanishes into a white box. A selected chip, segment, step, value or type-ahead option therefore takes
   `forced-color-adjust: none`, and every color it and what it holds draw is a system color, set here. No other control
   opts out. `test:chrome` section 39 measures each state under Chromium's forced-colors emulation, the selected labels
   as drawn. */
/* ── the plugin's left rail (#2909 IA v2 phase 1, round-4 wireframe; plugin only) ───────────── */
/* A 60px column on the page ground, fixed to the window's left edge, and every layout of the frame starts after it. Its
   tiles are bar tiles (`dom.ts` `tile`), labels kept at every width (Q2909.16 A), their tooltips to the right. The
   current area's tile and the Agent tile while the link is on take the second inset fill behind the glyph: the dark
   rail's first inset (`fill-1`) is too faint to read as a selected tile, so the round-4 wireframe drew a value outside
   the map there; `fill-2` is the mapped step, the same in both themes (the owner's Q2909.24 A). Hover takes
   `fill-1`. */
.p3-rail { display: none; }
.p3-frame[data-shell="rail"] > .p3-rail {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 35; box-sizing: border-box; width: var(--p3-rail-w);
  display: flex; flex-direction: column; align-items: center; gap: var(--p3-space-025); padding: var(--p3-space-100) 0;
  background: var(--p3-bg-page); border-right: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-frame[data-shell="rail"]:is([data-layout="panes"], [data-layout="page"], [data-layout="home"], [data-w="narrow"]:has(> .p3-drawer[data-open="true"])) { left: var(--p3-rail-w); }
.p3-rail-mark { display: flex; align-items: center; justify-content: center; min-height: var(--p3-ctl-h-sm); margin-bottom: var(--p3-space-075); }
.p3-rail-areas, .p3-rail-foot { display: flex; flex-direction: column; align-items: center; gap: var(--p3-space-025); }
.p3-rail-foot { margin-top: auto; }
.p3-rail-div { width: var(--p3-space-400); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); margin: var(--p3-space-050) 0; }
.p3-frame[data-shell="rail"] .p3-rail .p3-btn.p3-tile { min-height: var(--p3-ctl-h); padding: var(--p3-space-025) 0; }
/* #3083 (the owner, 2026-10-28): the foot's Minimize, Help and Appearance draw their icon alone (`tile`'s null label),
   so each tile is its square mark and no taller, the icon centered in it: a 32 × 32 target, over the 24px floor. */
.p3-frame[data-shell="rail"] .p3-rail .p3-btn.p3-tile.p3-tile-bare { min-height: var(--p3-rail-tile); padding: 0; }
/* The rail polish (owner, 2026-10-26, #2909): each icon 24px in a square mark, fixed on both axes, so neither the label
   nor a line height sizes it. It was `min-width: ctl-h` by `min-height: ctl-h-xs`, a 40 × 28 landscape. */
.p3-frame[data-shell="rail"] .p3-rail .p3-tile-mark {
  justify-content: center; box-sizing: border-box; flex: none; width: var(--p3-rail-tile); height: var(--p3-rail-tile); border-radius: var(--p3-radius-xl);
}
.p3-frame[data-shell="rail"] .p3-rail .p3-tile-mark > .p3-ico { width: var(--p3-icon-md); height: var(--p3-icon-md); }
/* The labels at 9px and −1% tracking (the owner's, 2026-10-26). The engine's type scale stops at 10px, so 9px is three
   quarters of its 12px step, on the scale rather than a raw length. */
.p3-frame[data-shell="rail"] .p3-rail .p3-tile-label {
  display: block; max-width: var(--p3-rail-w); color: var(--p3-text); text-align: center; white-space: normal; hyphens: manual;
  font-size: calc(var(--p3-fs-12) * 0.75); letter-spacing: var(--p3-ls-snug);
}
/* A full-width page on the rail (Documentation, Export) draws its own header: the tab row and Color's sub-row are Theme's. */
.p3-frame[data-shell="rail"][data-layout="page"] :is(.p3-nav, .p3-subnav) { display: none; }
.p3-frame[data-shell="rail"] .p3-rail .p3-btn.p3-tile:where(:not(:disabled, [aria-disabled="true"])):hover > .p3-tile-mark { background: var(--p3-fill-1); }
/* The current area's fill. The Agent tile's on fill and its edge on the top bar (Q738 A, Q788 C) went with the tile, for
   the Agent switch (#3083). */
.p3-frame[data-shell="rail"] .p3-rail .p3-tile[aria-current="page"] > .p3-tile-mark { background: var(--p3-fill-2); }
.p3-frame[data-shell="rail"] .p3-rail .p3-tile[aria-current="page"] .p3-tile-label { font-weight: var(--p3-fw-strong); }
.p3-frame[data-shell="rail"] .p3-rail .p3-tile-tip { top: 0; right: auto; left: calc(100% + var(--p3-space-050)); }
/* A menu a rail tile opens (Appearance, at the rail's foot) opens beside the rail, to the right of its tile and level with
   its bottom, so it stays in the window: under the tile it ran past the window's bottom edge, and right-aligned past its left. */
.p3-frame[data-shell="rail"] .p3-rail .p3-menu { top: auto; bottom: 0; right: auto; left: calc(100% + var(--p3-space-050)); }
.p3-frame[data-shell="rail"] .p3-rail .p3-agent-slot { display: flex; }
/* A home has no brand in the file to edit, so the rail's areas go and its foot stays (#2879). */
.p3-frame[data-shell="rail"][data-layout="home"] .p3-rail-areas { display: none; }
/* Contrast sits in the Theme area's preview header (round 4), never on Components. */
.p3-frame[data-shell="rail"][data-place="components"] .p3-preview-head > .p3-tile-start { display: none; }
.p3-min-slot:empty { display: none; }
/* On the rail the tab row holds Theme's pages alone: Components' page has no tab, so its row holds the page's title and
   the search. #3129 R3 and Q835 A (the owner, 2026-10-28): the title at the left, where the tabs start on Theme, and the
   search flush right, where Theme's row keeps it. R4: Components shows no mode control; its preview is always Light
   (Q3129.14 B, the pin in `shell/frame.ts`). */
.p3-frame[data-shell="rail"][data-place="components"] .p3-nav .p3-tabs { display: none; }
.p3-frame[data-place="components"] .p3-nav > .p3-search { margin-left: auto; }
.p3-frame[data-place="components"] .p3-preview-head > .p3-modes-wrap { display: none; }
/* #3149 (Q3149.1–.4, all A, the owner, 2026-11-01): Components shows no Inspect either, on both hosts, so its preview
   header holds nothing. At wide widths the empty row stays, so the preview's divider still meets the levers header's at
   one y (Q2). At the narrow tier the Preview pane has no levers pane beside it to line up with, so the row collapses.
   Inspect stays on every Theme page, and with it the build stamp and the privacy note at its foot (Q3149.3 A). */
.p3-frame[data-place="components"] .p3-preview-head > .p3-popwrap { display: none; }
.p3-frame[data-w="narrow"][data-place="components"] .p3-preview-head { display: none; }

/* ── Documentation (#2909, Q667 A, Q2909.21 A): a page no tab shows, full width, its own tab row ─────────── */
.p3-docs {
  display: grid; gap: var(--p3-space-200); align-content: start; max-width: calc(29 * var(--p3-ctl-h)); margin: 0 auto;
  padding: var(--p3-space-300) var(--p3-space-500); color: var(--p3-text); font-family: var(--p3-font-ui);
  font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
.p3-docs-head { display: grid; gap: var(--p3-space-100); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-docs-select { display: none; }
.p3-frame[data-w="narrow"] .p3-docs { padding: var(--p3-space-200) var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-docs-tabs { display: none; }
.p3-frame[data-w="narrow"] .p3-docs-select { display: flex; margin-bottom: var(--p3-space-100); }
.p3-docs-body > .p3-sg { max-width: none; margin: 0; padding: 0; }
/* #3553 M12: the narrow tier's own padding for the guide (`.p3-frame[data-w="narrow"] .p3-sg`, above) outranked the line
   before, so at the plugin's 380 the guide's body sat a space-150 inside the title and the section select over it. */
.p3-frame[data-w="narrow"] .p3-docs-body > .p3-sg { padding: 0; }
.p3-docs-card {
  display: grid; gap: var(--p3-space-075); padding: var(--p3-space-200); border: var(--p3-bw-hairline) solid var(--p3-line-1);
  border-radius: var(--p3-radius-xl); background: var(--p3-bg-page);
}
.p3-docs-cardrow { display: flex; align-items: center; justify-content: space-between; gap: var(--p3-space-200); }
.p3-docs-cardtitle { margin: 0; font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); line-height: var(--p3-lh-compact); }
.p3-docs-card > p { margin: 0; }
.p3-docs-card > [hidden] { display: none; }
.p3-docs-card > .p3-btn { justify-self: start; }
/* #3137 Q3137.6 A: with panels on, the count of sets with no usage panel, and the button to Update file under it. */
.p3-docs-missing { display: grid; gap: var(--p3-space-075); }
.p3-docs-missing > .p3-btn { justify-self: start; }

/* ── Export as an area (#2909): the export dialog's parts as a page, never modal ─────────────────────── */
.p3-export-host { display: contents; }
.p3-bardlg.p3-export-page { max-width: none; width: auto; margin: 0; border: 0; border-radius: 0; max-height: none; box-sizing: border-box; flex: 1 1 auto; min-height: 0; }

/* ── Update file (#2909): the overlay's tabs, items and sets ─────────────────────────────────────── */
.p3-upd-tabs { flex: none; padding: 0 var(--p3-space-300); margin: 0; border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-upd-body { flex: 1 1 auto; min-height: 0; padding: var(--p3-space-150) var(--p3-space-300); gap: var(--p3-space-100); overflow: auto; }
.p3-upd-body p { margin: 0; }
.p3-upd-item { display: grid; gap: var(--p3-space-050); padding: var(--p3-space-100) 0; border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-upd-item:last-child { border-bottom: 0; }
.p3-upd-sub { padding-left: var(--p3-space-400); }
.p3-upd-title { padding-left: var(--p3-space-100); }
.p3-upd-sets { display: grid; gap: var(--p3-space-025); padding-left: var(--p3-space-300); }
.p3-upd-setname { flex: 1 1 auto; min-width: 0; }
/* #3133: a due row's name and tag, on one line where they fit (the tag at the line's end, the gap the row had) and on two
   where they do not; a tag wider than the line shrinks and wraps its words inside its fill. */
.p3-upd-checktext { flex: 1 1 auto; column-gap: var(--p3-space-150); }
.p3-upd-checktext > .p3-upd-setname { flex: 1 0 auto; max-width: 100%; }
.p3-upd-checktext > .p3-sg-tag { flex: 0 1 auto; min-width: 0; }
/* #3129: To add, its head (the title, and Remove all from two rows up) and its rows (a name, where it lands, Remove).
   R6: To add and Due are subtitles inside the Components section, a step in from its title, in the title's ink. */
.p3-upd-group { display: grid; gap: var(--p3-space-050); padding-top: var(--p3-space-100); }
.p3-upd-subtitle { padding-left: var(--p3-space-400); color: var(--p3-text); font-weight: var(--p3-fw-emphasis); }

<body>
<header class="mk-tools">
  <h1>Direction B · Decisions first</h1>
  <div class="mk-grp mk-cases"><span class="mk-cap">State</span></div>
  <div class="mk-grp"><span class="mk-cap">Mode</span><button type="button" class="mk-tool" data-mode="light">Light</button><button type="button" class="mk-tool" data-mode="dark">Dark</button></div>
  <div class="mk-grp"><span class="mk-cap">Width</span><button type="button" class="mk-tool" data-width="wide">640</button><button type="button" class="mk-tool" data-width="narrow">380</button></div>
  <div class="mk-grp"><button type="button" class="mk-tool" data-drafts>DRAFT marks</button><span class="mk-legend"><i></i>a DRAFT string (#3711 or new)</span></div>
</header>
<main class="mk-stage">
  <div class="p3-frame mk-window" data-w="wide"><div class="mk-scrim"></div></div>
</main>
<script>
const ICONS = {"check":["M5 12l5 5l10 -10"],"x":["M18 6l-12 12","M6 6l12 12"],"chev":["M6 9l6 6l6 -6"],"chevr":["M9 6l6 6l-6 6"],"warn":["M12 9v4","M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0","M12 16h.01"],"info":["M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0","M12 9h.01","M11 12h1v4h1"],"lock":["M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6","M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0","M8 11v-4a4 4 0 1 1 8 0v4"],"error":["M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0","M12 8v4","M12 16h.01"]};
// Update file dialog: redesign mocks (#3712). Shared by every direction: the states, the strings, the model the
// directions draw from, and small DOM helpers. A design exploration, not product code: nothing here ships.
//
// STRINGS. `C` is copied word for word from `UPDATE_COPY` (apps/studio/src/state/update-file.ts) and `STRIP_COPY`
// (apps/studio/src/state/status-strip.ts) as they stand on main. `U` holds the #3711 strings (Q-UF1–3), DRAFT until the
// owner approves them there. `D` holds the strings these mocks add, each DRAFT. Every node that shows a `U` or `D` string
// carries `data-draft`, and the DRAFT marks toggle in the toolbar outlines it.

/* global ICONS */
const plural = (n) => `${n} set${n === 1 ? '' : 's'}`;

const C = {
  title: 'Update file', tabUpdate: 'Update', tabClean: 'Clean up',
  checking: 'Checking the file…',
  leadFresh: 'This file isn’t set up for Prism3 yet. This first update sets it up.',
  lead: 'Tick what to write. Untick what should wait.',
  setup: 'Set up file',
  setupSub: 'The pages, the templates and the style-guide cells. The cover too, while Documentation has it on.',
  theme: 'Theme', themeSub: 'The brand’s variables and styles. Layers bound to them restyle at once.',
  themeCurrent: 'Up to date',
  components: 'Components', toAdd: 'To add',
  toAddSub: (n) => `${plural(n)} chosen on Components. Each is added with its usage panel while Documentation has panels on.`,
  removeSet: (name) => `Remove ${name} from To add`,
  alsoAdds: (names) => `Also adds: ${names.join(', ')}.`,
  removeAll: 'Remove all',
  queueFresh: (n) => `Nothing chosen yet. This file holds none of the ${n} component sets.`,
  addAll: (n) => `Add all ${n}`,
  due: 'Due', dueSub: (n) => `${plural(n)} to update in place. Ticked by default.`,
  whySettings: 'Due · its settings changed',
  whyExecutor: 'Engine update: Prism3 draws components differently',
  checkReading: 'Reading this file…',
  checkedOf: (done, total) => `Checked ${done} of ${plural(total)}`,
  checkingSet: 'Checking…',
  checked: (c) => c.upToDate ? 'No member changes' : [`${c.update} of ${c.members} members change`, c.add ? `${c.add} added` : '', c.drop ? `${c.drop} kept and marked deprecated` : '', c.handEdited ? `${c.handEdited} edited by hand` : ''].filter(Boolean).join(' · '),
  handHint: {
    keep: 'Keep: each edit stays. A set whose edits hold back changes is listed under Kept edits until resolved.',
    overwrite: 'Overwrite: the plan’s values replace each edit.',
    accept: 'Accept as baseline: each edit stays and becomes the record, so it is no longer listed.',
  },
  kept: 'Kept edits',
  keptSub: (n) => `${plural(n)} hold hand edits over changes the plan makes. Each stays here until Overwrite or Accept as baseline is chosen for it.`,
  keptLine: (h) => `${h.members} member${h.members === 1 ? ' keeps' : 's keep'} out ${h.changes.length} of the plan’s values${h.changes.length ? `: ${h.changes.slice(0, 3).join(', ')}${h.changes.length > 3 ? `, ${h.changes.length - 3} more` : ''}` : ''}`,
  keptChoice: (name) => `Hand edits on ${name}`,
  handChoice: { keep: 'Keep', overwrite: 'Overwrite', accept: 'Accept as baseline' },
  saves: 'Saves a version first. If Figma refuses the save, nothing is written.',
  guides: 'Style guides', guidesSub: 'Drawn with the settings in Documentation. A rerun updates each table in place.',
  go: 'Update file', goFresh: 'Set up and update', cancel: 'Cancel', close: 'Close',
  cleanLead: 'Things Prism3 wrote earlier and no longer writes. Nothing here rides Update file.',
  cleanNone: 'Nothing stale in this file.',
  page: (p) => `↳ ${p}`,
  details: 'Details in Activity.',
};

// #3711 (Q-UF1 A, Q-UF2 A, Q-UF3 A): the issue's own example strings. DRAFT there until the owner approves them.
const U = {
  ranWarn: (n, check) => `Updated ${n} sets · ${check} to check`,
  affects: (n, what) => `${n} change${n === 1 ? ' affects' : 's affect'} files that use this library: ${what}. Their instances keep working and show as deprecated.`,
  goWith: (n) => `Update, including ${n} library change${n === 1 ? '' : 's'}`,
};

// New strings these mocks need. Each DRAFT, for the owner's sign-off with the direction.
const D = {
  lastRun: 'Last update',
  toCheckSub: 'Each was written but differs from the plan. Fix it by hand, or run it again.',
  checkLines: {
    tabs: 'Its Indicator part is 24 wide; the plan draws it 32. Set it by hand.',
    slider: '2 members aren’t finished: Disabled and Focus. Run it again, or finish them by hand.',
  },
  blocked: 'Can’t be updated in place',
  blockedWhy: 'The plan replaces its Calendar layer, and an in-place update would drop the overrides instances hold on it. Rebuild it from Components.',
  offNothing: 'Nothing to write: Theme is up to date, Date picker can’t be updated in place, and each kept set is on Keep.',
  offClean: 'Nothing to write. Tick Theme or Style guides to write them again.',
  offWaiting: 'Waits for the check to finish.',
  allCurrent: 'Every set in this file is up to date.',
  libTitle: 'Library changes',
  needs: 'Needs a decision',
  writes: 'This update writes',
  off: 'Off',
  sets: (n) => plural(n),
  compSummary: (parts) => parts.filter(Boolean).join(' · '),
  blockedN: (n) => `${n} can’t update`,
  keptN: (n) => `${n} kept edits`,
  dueN: (n) => `${n} due`,
  addN: (n) => `${n} to add`,
  willRun: (n) => `${n} will run`,
  noneDue: 'Nothing due',
};

// ── the demo file ────────────────────────────────────────────────────────────────────────────────
// A neutral demo brand and the engine's own generic component names. No client, file or key.
const KEPT = [
  { id: 'button', name: 'Button', held: { members: 4, changes: ['padding', 'corner radius', 'label weight', 'focus ring', 'gap'] }, check: { members: 9, update: 4, add: 0, drop: 0, handEdited: 4 } },
  { id: 'icon-button', name: 'Icon button', held: { members: 2, changes: ['size', 'icon color'] }, check: { members: 12, update: 6, add: 0, drop: 2, handEdited: 2 }, lib: { n: 2, what: '2 Icon button members retired' } },
  { id: 'text-field', name: 'Text field', held: { members: 3, changes: ['border width', 'hint color', 'height'] }, check: { members: 8, update: 3, add: 0, drop: 0, handEdited: 3 } },
  { id: 'select', name: 'Select', held: { members: 1, changes: ['chevron size'] }, check: { members: 6, update: 1, add: 0, drop: 0, handEdited: 1 } },
  { id: 'checkbox', name: 'Checkbox', held: { members: 2, changes: ['box radius', 'label gap'] }, check: { members: 10, update: 2, add: 0, drop: 0, handEdited: 2 } },
];
const BLOCKED = { id: 'date-picker', name: 'Date picker', why: C.whyExecutor };
const TO_CHECK = [{ name: 'Tabs', line: D.checkLines.tabs }, { name: 'Slider', line: D.checkLines.slider }];
const QUEUE = [
  { id: 'button', name: 'Button', page: null }, { id: 'icon-button', name: 'Icon button', page: 'Button' },
  { id: 'checkbox', name: 'Checkbox', page: null }, { id: 'text-field', name: 'Text field', page: null },
  { id: 'select', name: 'Select', page: null }, { id: 'tabs', name: 'Tabs', page: null },
];
const CHECKING = [
  { id: 'button', name: 'Button', why: C.whySettings, line: { members: 9, update: 4, add: 0, drop: 0, handEdited: 0 } },
  { id: 'checkbox', name: 'Checkbox', why: C.whyExecutor, line: 'checking' },
  { id: 'tabs', name: 'Tabs', why: C.whySettings, line: null },
];

// ── the states ───────────────────────────────────────────────────────────────────────────────────
const CASES = {
  owner: { label: '2026-11-12 run', kept: {} },
  chosen: { label: '…Overwrite on 2', kept: { button: 'overwrite', 'icon-button': 'overwrite' } },
  clean: { label: 'All up to date' },
  fresh: { label: 'Fresh file' },
  checking: { label: 'Checking' },
};

const S = { case: 'owner', tab: 'update', theme: false, guides: false, setup: false, kept: {}, queue: [], open: {}, w: 'wide', mode: 'light', draft: true };
const load = (k) => {
  Object.assign(S, { case: k, tab: 'update', kept: { ...(CASES[k].kept ?? {}) }, open: {} });
  S.theme = k === 'fresh';
  S.setup = k === 'fresh';
  S.guides = k === 'fresh';
  S.queue = k === 'fresh' ? QUEUE.map((q) => q.id) : [];
};

// What the dialog shows, derived from the state, so every direction draws the same facts.
const model = () => {
  const k = S.case;
  const fresh = k === 'fresh';
  const owner = k === 'owner' || k === 'chosen';
  const kept = owner ? KEPT.map((s) => ({ ...s, choice: S.kept[s.id] ?? 'keep' })) : [];
  const keptRun = kept.filter((s) => s.choice !== 'keep');
  const lib = keptRun.filter((s) => s.choice === 'overwrite' && s.lib).map((s) => s.lib);
  const libN = lib.reduce((n, l) => n + l.n, 0);
  const queue = QUEUE.filter((q) => S.queue.includes(q.id));
  const due = k === 'checking' ? CHECKING : [];
  const blocked = owner ? [BLOCKED] : [];
  const waiting = k === 'checking';
  const runs = [
    fresh && S.setup && 'setup', S.theme && 'theme',
    (keptRun.length || (due.length && !waiting)) && 'update', queue.length && 'sets', S.guides && 'guides',
  ].filter(Boolean);
  const off = waiting ? D.offWaiting : runs.length ? null : owner ? D.offNothing : D.offClean;
  return {
    fresh, owner, kept, keptRun, lib, libN, queue, due, blocked, waiting, runs, off,
    lastRun: owner ? { what: U.ranWarn(47, 2), sets: TO_CHECK } : null,
    themeCurrent: !fresh,
    allCurrent: k === 'clean',
    progress: waiting ? { done: 1, total: 3 } : null,
    saves: keptRun.length > 0 || (due.length > 0 && !waiting),
    go: libN ? U.goWith(libN) : fresh ? C.goFresh : C.go,
    goDraft: libN > 0,
    also: fresh && queue.length ? ['Icon', 'Focus ring'] : [],
  };
};

// ── DOM helpers: the chrome's own classes wherever the dialog already uses one ───────────────────
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const draft = (n) => { n.dataset.draft = ''; return n; };
const ico = (name) => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'p3-ico');
  svg.setAttribute('viewBox', '0 0 24 24');
  for (const [a, v] of [['fill', 'none'], ['stroke', 'currentColor'], ['stroke-width', '1.5'], ['stroke-linecap', 'round'], ['stroke-linejoin', 'round'], ['aria-hidden', 'true']]) svg.setAttribute(a, v);
  for (const d of ICONS[name]) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); svg.append(p); }
  return svg;
};
const btn = (cls, text, onClick) => { const b = el('button', `p3-btn ${cls}`, text); b.type = 'button'; if (onClick) b.onclick = () => { onClick(); paint(); }; return b; };
/** The dialog's tick: `.p3-check` with its box, a label, and the click that toggles it. */
const tick = (on, label, toggle, cls = '') => {
  const b = el('button', `p3-btn p3-btn-page p3-check p3-upd-check ${cls}`);
  b.type = 'button';
  b.setAttribute('role', 'checkbox');
  b.setAttribute('aria-checked', String(on));
  const bx = el('span', 'p3-check-box');
  bx.append(ico('check'));
  b.append(bx, ...[label].flat());
  b.onclick = () => { toggle(); paint(); };
  return b;
};
const tag = (text, kind) => { const t = el('span', 'p3-sg-tag', text); if (kind) t.dataset.kind = kind; return t; };
const sub = (text, cls = '') => el('p', `p3-sub ${cls}`, text);
/** A kept set's choice, as the dialog draws it today: the chrome's select. */
const choiceSelect = (s) => {
  const sw = el('div', 'p3-selwrap');
  const sel = el('select', 'p3-select');
  sel.setAttribute('aria-label', C.keptChoice(s.name));
  for (const k of ['keep', 'overwrite', 'accept']) { const o = el('option', null, C.handChoice[k]); o.value = k; sel.append(o); }
  sel.value = s.choice;
  sel.onchange = () => { S.kept[s.id] = sel.value; paint(); };
  sw.append(sel, ico('chev'));
  return sw;
};
/** A kept set's choice as three visible segments (Direction B). */
const choiceSeg = (s) => {
  const seg = el('div', 'p3-seg mk-seg');
  seg.setAttribute('role', 'radiogroup');
  seg.setAttribute('aria-label', C.keptChoice(s.name));
  for (const k of ['keep', 'overwrite', 'accept']) {
    const b = el('button', 'p3-seg-tab', C.handChoice[k]);
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(s.choice === k));
    b.onclick = () => { S.kept[s.id] = k; paint(); };
    seg.append(b);
  }
  return seg;
};
const progress = (p) => {
  const wrap = el('div', 'p3-upd-progress');
  const bar = el('progress', 'p3-op-prog p3-upd-prog');
  bar.max = p.total; bar.value = p.done;
  wrap.append(bar, sub(C.checkedOf(p.done, p.total), 'p3-upd-progtext'));
  return wrap;
};
/** The #3711 Q-UF2 callout: each library change, above the Update button. */
const libCallout = (m, cls = '') => {
  const box = el('div', `mk-lib ${cls}`);
  box.append(ico('warn'));
  const text = el('div', 'mk-lib-text');
  text.append(draft(el('b', null, D.libTitle)), ...m.lib.map((l) => draft(el('p', null, U.affects(l.n, l.what)))));
  box.append(text);
  return box;
};
/** The foot shared by every direction: the reason the action is off, or the check's progress; then Cancel and the action. */
const footRow = (m) => {
  const row = el('div', 'mk-footrow');
  if (m.progress) row.append(progress(m.progress));
  if (m.off) row.append(draft(el('p', 'p3-sub mk-off', m.off)));
  else row.append(el('span', 'mk-spacer'));
  const go = btn('p3-btn-primary', m.go);
  if (m.goDraft) draft(go);
  go.disabled = !!m.off;
  row.append(btn('p3-btn-page', C.cancel), go);
  return row;
};

// ── the frame every direction shares: head, tabs, body, foot ─────────────────────────────────────
let DIRECTION = null;
const paint = () => {
  document.documentElement.dataset.theme = S.mode;
  document.documentElement.dataset.drafts = String(S.draft);
  const win = document.querySelector('.mk-window');
  win.dataset.w = S.w;
  for (const b of document.querySelectorAll('[data-case]')) b.setAttribute('aria-pressed', String(b.dataset.case === S.case));
  for (const b of document.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode));
  for (const b of document.querySelectorAll('[data-width]')) b.setAttribute('aria-pressed', String(b.dataset.width === S.w));
  const m = model();
  const dlg = el('div', `p3-bardlg p3-upd mk-dlg mk-${DIRECTION.key}`);
  dlg.setAttribute('role', 'dialog');
  dlg.setAttribute('aria-label', C.title);
  const head = el('div', 'p3-bardlg-head');
  const x = btn('p3-btn-ghost p3-btn-icon');
  x.setAttribute('aria-label', C.close);
  x.append(ico('x'));
  head.append(el('h2', 'p3-bardlg-title', C.title), x);
  const tabs = el('div', 'p3-tabs p3-upd-tabs');
  tabs.setAttribute('role', 'tablist');
  for (const k of ['update', 'clean']) {
    const t = el('button', 'p3-tab', k === 'update' ? C.tabUpdate : C.tabClean);
    t.type = 'button';
    t.setAttribute('role', 'tab');
    t.setAttribute('aria-selected', String(S.tab === k));
    t.onclick = () => { S.tab = k; paint(); };
    tabs.append(t);
  }
  const { body, foot } = S.tab === 'update' ? DIRECTION.update(m) : DIRECTION.clean(m);
  const bodyEl = el('div', `p3-bardlg-col p3-upd-body mk-body`);
  bodyEl.append(...body);
  const footEl = el('div', 'p3-bardlg-foot mk-foot');
  footEl.append(...foot);
  dlg.append(head, tabs, bodyEl, footEl);
  document.querySelector('.mk-scrim').replaceChildren(dlg);
};
const cleanDefault = () => ({
  body: [sub(C.cleanLead, 'mk-lead'), el('p', 'p3-upd-summary', C.cleanNone)],
  foot: [(() => { const r = el('div', 'mk-footrow'); r.append(el('span', 'mk-spacer'), btn('p3-btn-page', C.close)); return r; })()],
});

const mount = (direction) => {
  DIRECTION = direction;
  const tools = document.querySelector('.mk-cases');
  for (const [k, c] of Object.entries(CASES)) {
    const b = el('button', 'mk-tool', c.label);
    b.type = 'button';
    b.dataset.case = k;
    b.onclick = () => { load(k); paint(); };
    tools.append(b);
  }
  for (const b of document.querySelectorAll('[data-mode]')) b.onclick = () => { S.mode = b.dataset.mode; paint(); };
  for (const b of document.querySelectorAll('[data-width]')) b.onclick = () => { S.w = b.dataset.width; paint(); };
  document.querySelector('[data-drafts]').onclick = () => { S.draft = !S.draft; paint(); };
  // The screenshot script drives the same entry points through the URL: ?case=owner&mode=dark&w=narrow&drafts=0.
  const q = new URLSearchParams(location.search);
  load(q.get('case') && CASES[q.get('case')] ? q.get('case') : 'owner');
  if (q.get('mode')) S.mode = q.get('mode');
  if (q.get('w')) S.w = q.get('w');
  if (q.get('drafts') === '0') S.draft = false;
  // Full length: the window grows to the dialog, for a screenshot that shows every row. The real window scrolls the body.
  if (q.get('full') === '1') document.documentElement.dataset.full = 'true';
  if (q.get('open')) for (const k of q.get('open').split(',')) S.open[k] = true;
  paint();
};

// Direction B · Decisions first. What needs a person comes first, in a gray well of white cards (the levers panel's
// gray holding `.p3-lsec`-style cards): the last run's sets to check, a set that can't be updated, and each kept set with
// its three choices shown at once as a segmented control. Under it, one white list card says what this update writes,
// one row per step in run order, each with its tick and a status at the row's end. The library changes callout sits in
// the foot, over the button it qualifies.
const bCard = (iconName, title, cls = '') => {
  const card = el('section', `mk-b-card ${cls}`);
  const head = el('div', 'mk-b-chead');
  if (iconName) head.append(ico(iconName));
  head.append(title);
  card.append(head);
  return card;
};
const stepRow = (on, title, line, end, toggle, more) => {
  const row = el('div', 'mk-b-step');
  row.dataset.on = String(on);
  const top = el('div', 'mk-b-stop');
  top.append(toggle ? tick(on, el('span', 'mk-b-stitle', title), toggle, 'mk-b-tick') : el('span', 'mk-b-stitle mk-b-notick', title));
  if (end) top.append(end);
  row.append(top);
  if (line) row.append(sub(line, 'mk-b-sline'));
  if (more) row.append(more);
  return row;
};
const DIRECTION_B = {
  key: 'b',
  update: (m) => {
    const body = [];
    if (m.fresh) body.push(sub(C.leadFresh, 'mk-b-lead'));
    // 1 · Needs a decision.
    const needs = [];
    if (m.lastRun) {
      const card = bCard('warn', draft(el('b', null, m.lastRun.what)), 'mk-b-warn');
      card.append(draft(sub(D.toCheckSub)));
      const list = el('ul', 'mk-b-list');
      for (const s of m.lastRun.sets) { const li = el('li'); li.append(el('b', null, s.name), draft(sub(s.line))); list.append(li); }
      card.append(list);
      needs.push(card);
    }
    for (const b of m.blocked) {
      const t = el('span', 'mk-b-ctitle');
      t.append(el('b', null, b.name), draft(el('span', 'mk-b-cstate', ` · ${D.blocked}`)));
      const card = bCard('lock', t);
      card.append(sub(b.why), draft(el('p', 'mk-b-why', D.blockedWhy)));
      needs.push(card);
    }
    if (m.kept.length) {
      const card = bCard(null, el('b', null, C.kept));
      card.append(sub(C.keptSub(m.kept.length)));
      const list = el('div', 'mk-b-kept');
      for (const s of m.kept) {
        const r = el('div', 'mk-b-krow');
        const name = el('div', 'mk-b-kname');
        name.append(el('span', null, s.name), sub(C.keptLine(s.held)));
        if (s.choice !== 'keep') name.append(sub(C.checked(s.check), 'mk-b-will'));
        if (s.choice === 'overwrite' && s.lib) name.append(draft(sub(s.lib.what, 'mk-b-will')));
        r.append(name, choiceSeg(s));
        list.append(r);
      }
      card.append(list);
      needs.push(card);
    }
    if (needs.length) {
      const well = el('section', 'mk-b-well');
      well.append(draft(el('h3', 'mk-b-wtitle', D.needs)), ...needs);
      body.push(well);
    }
    // 2 · This update writes.
    const writes = el('section', 'mk-b-writes');
    const head = el('div', 'mk-b-whead');
    head.append(draft(el('h3', 'mk-b-wtitle', D.writes)));
    if (!m.fresh) head.append(sub(C.lead));
    writes.append(head);
    const list = el('div', 'mk-b-steps');
    if (m.fresh) list.append(stepRow(S.setup, C.setup, C.setupSub, null, () => { S.setup = !S.setup; }));
    list.append(stepRow(S.theme, C.theme, C.themeSub, m.themeCurrent ? tag(C.themeCurrent) : null, () => { S.theme = !S.theme; }));
    // Components: no tick of its own; its status says how many sets run, and its inset lists the sets.
    let detail = null;
    if (m.queue.length) {
      detail = el('div', 'mk-b-inset');
      const h = el('div', 'mk-b-ihead');
      h.append(el('b', null, C.toAdd), m.queue.length >= 2 ? btn('p3-btn-ghost mk-b-mini', C.removeAll, () => { S.queue = []; }) : '');
      detail.append(h, sub(C.toAddSub(m.queue.length)));
      for (const q of m.queue) {
        const r = el('div', 'mk-b-irow');
        r.append(el('span', 'mk-b-iname', q.name));
        if (q.page) r.append(el('span', 'p3-sub', C.page(q.page)));
        const x = btn('p3-btn-ghost p3-btn-icon mk-b-x', null, () => { S.queue = S.queue.filter((id) => id !== q.id); });
        x.setAttribute('aria-label', C.removeSet(q.name));
        x.append(ico('x'));
        r.append(x);
        detail.append(r);
      }
      if (m.also.length) detail.append(sub(C.alsoAdds(m.also)));
    } else if (m.fresh) {
      detail = el('div', 'mk-b-inset');
      detail.append(el('b', null, C.toAdd), sub(C.queueFresh(38)), btn('p3-btn-page mk-b-addall', C.addAll(38), () => { S.queue = QUEUE.map((q) => q.id); }));
    } else if (m.due.length) {
      detail = el('div', 'mk-b-inset');
      detail.append(el('b', null, C.due), sub(C.dueSub(m.due.length)));
      for (const d of m.due) {
        const r = el('div', 'mk-b-drow');
        const text = el('span', 'p3-check-text mk-b-dtext');
        text.append(el('span', 'mk-b-iname', d.name), tag(d.why));
        r.append(tick(true, text, () => {}));
        const line = d.line === 'checking' ? C.checkingSet : d.line ? C.checked(d.line) : '';
        if (line) r.append(sub(line, 'mk-b-dline'));
        detail.append(r);
      }
    }
    const runN = m.queue.length + m.keptRun.length + (m.waiting ? 0 : m.due.length);
    // While the check is out the due sets are not counted as running yet: the chip says how many are due.
    const compEnd = draft(tag(m.waiting ? D.dueN(m.due.length) : runN ? D.willRun(runN) : m.allCurrent ? C.themeCurrent : D.noneDue));
    const compLine = m.allCurrent ? D.allCurrent : null;
    const comp = stepRow(runN > 0, C.components, compLine, compEnd, null, detail);
    if (m.allCurrent) comp.querySelector('.mk-b-sline').dataset.draft = '';
    list.append(comp);
    list.append(stepRow(S.guides, C.guides, C.guidesSub, null, () => { S.guides = !S.guides; }));
    writes.append(list);
    if (m.saves) writes.append(sub(C.saves, 'mk-b-saves'));
    body.push(writes);
    const foot = [];
    if (m.libN) foot.push(libCallout(m));
    foot.push(footRow(m));
    return { body, foot };
  },
  clean: () => {
    const w = el('section', 'mk-b-writes');
    w.append(el('p', 'p3-upd-summary mk-b-cleanline', C.cleanNone));
    return { body: [sub(C.cleanLead, 'mk-b-lead'), w], foot: cleanDefault().foot };
  },
};
mount(DIRECTION_B);

</script>
</body>
</html>
