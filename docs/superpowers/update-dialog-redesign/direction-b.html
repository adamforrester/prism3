/*
 * The new shell's stylesheet (UI redesign, docs/superpowers/ui-redesign/implementation-plan.md §3).
 *
 * Hand-written rules only. It reaches the bundle through the virtual import `p3:chrome-css`, after the
 * generated `--p3-*` variables, and `installStyles` receives it with `styles.css`, so the class-scope
 * law covers both. The build fails, naming what failed, when this file carries a raw or named color,
 * `currentColor`, a length, duration or shadow, a `var()` fallback or a URL that is not a `data:` URI,
 * reads anything but `var(--p3-*)`, reads a variable the map does not define, or leaves a mapped
 * variable unread. See `apps/studio/chrome/esbuild-plugin.mjs`.
 *
 * Classes here take the `p3-` scope, which `styles.css` does not use. State is read from ARIA attributes
 * and from the frame's `data-w` (width tier), `data-bar-fit` (the bar's fit step, #2214; at the narrow tier only `trim`, #2262) and `data-layout`
 * (panes or page; the legacy layout went in H12, #2289), never from a shared state class.
 *
 * WHAT THIS STYLES: the frame (`src/shell/frame.ts`), meaning the top bar, the tab row with Color's
 * sub-row, the notices row and the two panes (S1.2); the
 * preview header, the mode control, the verdict and Inspect (`src/shell/preview.ts`, S1.3); and the
 * Activity button and drawer, the Figma menu and the plugin's Agent switch (S1.4, T7; #3083); the levers panel, the
 * Palettes preview and the step picker (S2: `src/domains/`, `src/preview/`, `src/ui/`); the brand menu, the
 * export and prune dialogs and the error strip (S13.1: `src/shell/bar.ts`, `src/shell/notices.ts`). The
 * legacy views lent into Inspect and the previews keep `styles.css` and are pinned light with `data-theme="light"`
 * (the legacy page and the plugin's Pages menu, the others, went in H12). So no rule here sets a font or a color
 * on a container that holds legacy content: each chrome control sets its own, and legacy text keeps
 * inheriting the legacy body's.
 *
 * Layering (IA-2): the top bar on `bar-bg`, the tab row on `levers-bg`, the preview pane on `bg-page`.
 * Edges (B1): a control on the top bar takes `edge-bar`, a control on the levers ground takes `edge`.
 * Radius (owner, 2026-10-01): containers take `radius-xl`, controls take `radius-lg`. Shadows (T5, worded by the owner
 * on #3113, 2026-10-28) are used sparingly, and only where they carry meaning. A sanctioned use: a subtle shadow along
 * the top edge of the Activity drawer while it overlays the preview (the open drawer; the strip and the sheet at 380), so
 * it reads as an overlay that slides up and over. Its color is the chrome's own scrim, no new token. Each sanctioned use
 * is recorded with its reason (`SANCTIONED_SHADOWS`, `chrome/spec.mjs`), and the build lets its rule through word for word.
 *
 * The comments here ship in both bundles, so they are held to US English and the voice standard.
 */

/* The app view's root gives up the legacy column box: the frame lays out the full width. */
#app.p3-app { max-width: none; margin: 0; padding: 0; }

/* ── the frame ───────────────────────────────────────────────────────────────────────────── */
.p3-head { position: sticky; top: 0; z-index: 30; }
.p3-panes { display: none; }
.p3-ico { width: var(--p3-icon-xs); height: var(--p3-icon-xs); flex: none; display: block; }

/* ── the top bar ─────────────────────────────────────────────────────────────────────────── */
.p3-bar {
  display: flex; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-bar-h);
  padding: var(--p3-space-050) var(--p3-space-400) var(--p3-space-050) var(--p3-space-300); background: var(--p3-bar-bg);
  border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
/* The bar's last control ends where the page content does (owner, S13.1 review): the right padding is the preview
   header's (`.p3-preview-head`), and at the narrow tier both rows take the same 12px. The dialog layer draws no box,
   so it adds no gap after the last control; its scrims are fixed to the window. */
.p3-bardlg-layer { display: contents; }
.p3-bar-slot { display: contents; }
.p3-bar-main { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); position: relative; }
.p3-spacer { flex: 1 1 auto; }

/* Buttons: a page-colored fill and an edge that clears 3:1 on the bar (B1). */
/* No hover on a disabled control (owner decision Q28 a, 2026-10-05): a control that is `:disabled` or
   `aria-disabled="true"` changes nothing under the pointer, whatever its kind. So every hover rule here is limited
   with `:where(:not(:disabled, [aria-disabled="true"]))`, which adds no weight, so the cascade order is unchanged.
   The build's [hover] check (`chrome/esbuild-plugin.mjs`, #2247) fails any `:hover` without it on the element it
   hovers, but the selectors HOVER_EXEMPT names word for word, each with its reason: the tile tooltip, a reveal, and
   the color field, which carries the limit in a `:has()` form. */
.p3-btn, .p3-brand {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--p3-space-100); flex: none;
  min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-200); border-radius: var(--p3-radius-lg);
  border: var(--p3-bw-hairline) solid var(--p3-edge-bar); background-color: var(--p3-bg-page); color: var(--p3-text);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis);
  line-height: var(--p3-lh-compact); white-space: nowrap; cursor: pointer;
}
.p3-btn:where(:not(:disabled, [aria-disabled="true"])):hover, .p3-brand:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-btn .p3-ico, .p3-brand .p3-ico { color: var(--p3-icon-2); }
.p3-btn-primary { background-color: var(--p3-inv-bg); color: var(--p3-inv-text); border-color: var(--p3-inv-bg); }
.p3-btn-primary:where(:not(:disabled, [aria-disabled="true"])):hover { background-color: var(--p3-inv-bg-2); border-color: var(--p3-inv-bg-2); }
.p3-btn-ghost { border-color: transparent; background-color: transparent; }
/* A ghost control shows an edge on hover, the bar's own (B1), instead of a wash. */
.p3-btn-ghost:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-edge-bar); }
.p3-btn-icon { padding: 0; min-width: var(--p3-ctl-h-sm); }
:is(.p3-btn, .p3-brand, .p3-pill, .p3-seg-tab, .p3-select, .p3-menu-item, .p3-verdict):focus-visible {
  outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset);
}

/* The brand switcher: the brand's swatch, its name, a chevron. */
.p3-brand { justify-content: flex-start; padding: 0 var(--p3-space-150); min-width: 0; flex: 0 1 auto; }
.p3-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.p3-swatch {
  display: block; flex: none; width: var(--p3-space-200); height: var(--p3-space-200); border-radius: var(--p3-radius-md);
  overflow: hidden; outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline));
}
.p3-swatch > span { display: block; width: 100%; height: 100%; }
/* The brand menu (S13.1) hangs under the switcher, from its left edge. Fixed, at its static position, so its height
   can be held to the window (100% of a fixed box's containing block is the viewport) and it scrolls rather than run
   off the bottom (#432), with the import box open, at 380 × 420 too. Four layout columns wide (concept's 288). */
.p3-brandwrap { flex: 0 1 auto; min-width: 0; }
.p3-menu.p3-brandmenu {
  position: fixed; top: auto; right: auto; margin-top: calc(var(--p3-ctl-h-sm) + var(--p3-space-050));
  min-width: 0; width: calc(var(--p3-l-col) * 4); max-width: calc(100% - 2 * var(--p3-space-300));
  max-height: calc(100% - 2 * var(--p3-bar-h)); overflow-y: auto; align-content: start;
}
.p3-swatch-sm { width: var(--p3-icon-xs); height: var(--p3-icon-xs); }
.p3-menu-item[aria-current="true"] { font-weight: var(--p3-fw-emphasis); }
.p3-menu-cap {
  padding: var(--p3-space-100) var(--p3-space-150) var(--p3-space-050); color: var(--p3-text-2);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis);
}
.p3-menu-div { border-top: var(--p3-bw-hairline) solid var(--p3-line-1); margin: var(--p3-space-050) 0; }
/* The design.md import box, in the brand menu and in the export dialog. */
.p3-import { display: grid; gap: var(--p3-space-100); padding: var(--p3-space-100) var(--p3-space-050) var(--p3-space-050); }
.p3-brandmenu .p3-confirm { margin: var(--p3-space-050); padding: var(--p3-space-150); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); color: var(--p3-text); }
.p3-textarea {
  width: 100%; min-width: 0; min-height: calc(3 * var(--p3-ctl-h)); resize: vertical; padding: var(--p3-space-100) var(--p3-space-150);
  border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal);
}
.p3-textarea::placeholder { color: var(--p3-text-2); opacity: 1; }
.p3-textarea:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-textarea:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-field-err { margin: 0; color: var(--p3-bad-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); }
.p3-import-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); }
.p3-upload { cursor: pointer; }
.p3-file { display: none; }

/* Bar tiles (the owner's top-bar decision, 2026-10-05, "A · Menu bar"): Contrast, Theme, Activity and Export. No edge
   and no fill, a mark (a glyph, or a glyph and a count) over a small label; the label drops at the narrow tier. The
   tooltip hangs under the tile on hover and on keyboard focus, the inverse pair, and repeats the name (`dom.ts`
   `tile`). There is no divider anywhere in the bar. */
.p3-btn.p3-tile {
  position: relative; flex-direction: column; gap: var(--p3-space-025); min-height: var(--p3-ctl-h); padding: 0 var(--p3-space-100);
  border-color: transparent; background-color: transparent;
  /* A tile can be a link (#2637 Q384, the web's Docs): no underline, so it reads as the other tiles do. */
  text-decoration: none;
}
.p3-btn.p3-tile:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: transparent; }
.p3-tile-mark { position: relative; display: inline-flex; align-items: center; gap: var(--p3-space-050); }
/* The label takes the text ink: the secondary ink is under 4.5:1 on the dark bar at this size. */
.p3-tile-label { color: var(--p3-text); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-default); line-height: var(--p3-lh-compact); }
.p3-btn.p3-tile .p3-ico.p3-tile-ok { color: var(--p3-ok-icon); }
.p3-btn.p3-tile .p3-ico.p3-tile-bad { color: var(--p3-bad-icon); }
.p3-tile-count { color: var(--p3-bad-text); font-size: var(--p3-fs-12); font-variant-numeric: tabular-nums; }
/* Every tile dot (Activity's status) sits at the glyph's top right, at one offset (the owner's QA, 2026-10-05). A
   failure is red (`.p3-status-dot[data-state="bad"]`); every other dot is the ok green (D-RED A): Activity running, a
   warning (`warn`) and a new result nobody opened. Agent's dot went with its tile (#3083): the switch's on state says it. Every tile dot is filled, the same shape
   (owner, 2026-10-05): Activity's running dot is no longer a ring on the tile. */
.p3-tile-mark > .p3-dot { position: absolute; top: calc(-1 * var(--p3-space-025)); right: calc(-1 * var(--p3-space-050)); }
.p3-tile-mark > .p3-status-dot:is([data-state="unread"], [data-state="warn"]) { background: var(--p3-ok-icon); }
.p3-tile-mark > .p3-status-dot[data-state="run"] { border: 0; background: var(--p3-ok-icon); }
.p3-tile-tip {
  display: none; position: absolute; z-index: 60; top: calc(100% + var(--p3-space-050)); right: 0; width: max-content;
  max-width: calc(var(--p3-l-col) * 3); padding: var(--p3-space-050) var(--p3-space-100); border-radius: var(--p3-radius-md);
  background: var(--p3-inv-bg); color: var(--p3-inv-text); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-default);
  line-height: var(--p3-lh-cozy); white-space: normal; text-align: left; pointer-events: none;
}
.p3-tile-start > .p3-tile-tip { left: 0; right: auto; }
.p3-tile:is(:hover, :focus-visible):not([aria-expanded="true"]) > .p3-tile-tip { display: block; }
.p3-verdict:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
/* A status dot. Never the only cue: the verdict's line, a mode's name and count, Health's sentence say it. */
.p3-dot { display: inline-block; flex: none; width: var(--p3-dot); height: var(--p3-dot); border-radius: var(--p3-radius-pill); }
.p3-dot-ok { background: var(--p3-ok-icon); }
.p3-dot-bad { background: var(--p3-bad-icon); }

/* Status pills: an operation's verdict, in its Activity row (S11), so on the page ground with the page's
   edge (B1). */
.p3-pill {
  display: inline-flex; align-items: center; gap: var(--p3-space-050); flex: 0 1 auto; min-width: 0;
  min-height: var(--p3-hit-min); padding: 0 var(--p3-space-150); border-radius: var(--p3-radius-pill);
  border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page); color: var(--p3-text);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis);
  line-height: var(--p3-lh-compact); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.p3-pill-bad { color: var(--p3-bad-text); }

/* The theme menu: three radio items (F3). */
.p3-popwrap { position: relative; display: inline-flex; }
.p3-menu {
  position: absolute; z-index: 40; top: calc(100% + var(--p3-space-050)); right: 0; display: grid; min-width: max-content;
  padding: var(--p3-space-050); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page);
  border: var(--p3-bw-hairline) solid var(--p3-line-2);
}
.p3-menu-item {
  display: flex; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150);
  border: 0; border-radius: var(--p3-radius-lg); background: none; color: var(--p3-text); cursor: pointer; text-align: left;
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-default); white-space: nowrap;
}
.p3-menu-item:where(:not(:disabled, [aria-disabled="true"])):hover { background: var(--p3-fill-1); }
.p3-menu-item[disabled] { color: var(--p3-text-2); cursor: not-allowed; }
.p3-menu-item .p3-ico { color: var(--p3-icon-2); }
.p3-menu-note { margin-left: auto; padding-left: var(--p3-space-200); color: var(--p3-text-2); font-size: var(--p3-fs-12); }
/* The build stamp at the foot of the Inspect menu (#474, owner decision C3 A): small, secondary, selectable. */
.p3-menu-stamp { display: flex; flex-wrap: wrap; gap: var(--p3-space-050) var(--p3-space-150); margin: var(--p3-space-050) 0 0; padding: var(--p3-space-100) var(--p3-space-150) var(--p3-space-050);
  border-top: var(--p3-bw-hairline) solid var(--p3-line-1); color: var(--p3-text-2); font-size: var(--p3-fs-12); user-select: text; }
.p3-menu-stamp-b { font-family: var(--p3-font-mono); overflow-wrap: anywhere; }
/* #3138: the privacy note, just above the build stamp, in the stamp's small secondary text. #3147: it wraps within the
   width the menu's items give it and never sets that width (`width: 0; min-width: 100%`), since the menu sizes to
   `max-content` and the approved note on one line would make it wider than the window. The wide tier only
   (Q3298/3294 compose A, owner, 2026-11-02): at the narrow tier #3298's cap decides, so the note sets the menu's width
   up to that cap rather than shrinking it to the items'. */
.p3-menu-privacy { margin: var(--p3-space-050) 0 0; padding: var(--p3-space-100) var(--p3-space-150) 0; border-top: var(--p3-bw-hairline) solid var(--p3-line-1);
  color: var(--p3-text-2); font-size: var(--p3-fs-12); box-sizing: border-box; }
.p3-frame:not([data-w="narrow"]) .p3-menu-privacy { width: 0; min-width: 100%; }
.p3-menu-privacy + .p3-menu-stamp { margin-top: 0; border-top: 0; }
/* #3147 (O2 B, owner, 2026-11-02): the open Inspect menu is at least 320px wide (two and a half start-window units), so
   the privacy note wraps to about five lines on both hosts rather than to the stamp's width. A `width`, not a
   `min-width`: `.p3-menu`'s `min-width: max-content` still wins when the items are wider. The wide tier only: the
   narrow tier is never forced wider than its window (#3298 caps it there). */
.p3-frame:not([data-w="narrow"]) .p3-menu[data-p3="inspect-menu"] { width: calc(var(--p3-dlg-unit) * 2.5); }
.p3-menu-item > .p3-ico:last-child { visibility: hidden; color: var(--p3-icon); }
.p3-menu-item[aria-checked="true"] { font-weight: var(--p3-fw-emphasis); }
.p3-menu-item[aria-checked="true"] > .p3-ico:last-child { visibility: visible; }

/* A write's control while that write runs, panel or agent (owner decision #4 on #1956): the engine
   Button's isPending. Busy is aria-busy, never native disabled, so focus stays and nothing here dims it.
   Both labels sit in one cell, so the control keeps the wider one's width; the one not showing is held
   invisible, which also keeps it out of the accessible name. */
.p3-pend { display: inline-grid; }
.p3-pend > * { grid-area: 1 / 1; }
.p3-pend-busy { display: inline-flex; align-items: center; gap: var(--p3-space-050); }
:is(.p3-btn, .p3-menu-item)[aria-busy="true"] { cursor: progress; }
:is(.p3-btn, .p3-menu-item)[aria-busy="true"] .p3-pend-idle,
:is(.p3-btn, .p3-menu-item):not([aria-busy="true"]) .p3-pend-busy { visibility: hidden; }
/* The busy label's "…" is the spinner's cell. After a short delay, three of the fast duration (about
   300 ms, inside the engine spinner's 200 to 500 ms anti-flash wait), the "…" gives way to the arc, so
   a quick write never flashes a spinner. The arc takes the label's ink. Under reduced motion it turns at
   the slower reduced period: the spinner is functional, and aria-busy carries the state either way. */
.p3-spin { position: relative; display: inline-grid; place-items: center; flex: none; width: var(--p3-icon-xs); height: var(--p3-icon-xs);
  animation: p3-spin-hide var(--p3-dur-fast) linear calc(var(--p3-dur-fast) * 3) both; }
.p3-spin::before {
  content: ""; position: absolute; inset: 0; opacity: 0; border-radius: var(--p3-radius-pill);
  border: var(--p3-bw-thick) solid transparent; border-top-color: var(--p3-text);
  animation: p3-spin-show var(--p3-dur-fast) linear calc(var(--p3-dur-fast) * 3) both, p3-spin var(--p3-dur-spin) linear infinite;
}
.p3-btn-primary .p3-spin::before { border-top-color: var(--p3-inv-text); }
/* #3553 Q-UI8 A: an icon on a primary button (Export's Download) takes the button's own ink, as its words do (the
   inverse text; a disabled one takes the disabled icon ink, below), never the page's secondary icon gray. */
.p3-btn-primary .p3-ico { color: var(--p3-inv-text); }
/* A control's spinner is made with its label, at mount, and held invisible until the control turns busy, and
   an invisible element still runs its animations: the wait and the fade would be spent unseen, long before
   any write (#2332). So it holds no animation until then, and they start when the control turns busy. A
   spinner made when it is shown (a style-guide table being drawn) is not in a control and starts at once. */
:is(.p3-btn, .p3-menu-item):not([aria-busy="true"]) .p3-spin,
:is(.p3-btn, .p3-menu-item):not([aria-busy="true"]) .p3-spin::before { animation: none; }
@media (prefers-reduced-motion: reduce) { .p3-spin::before { animation-duration: var(--p3-dur-fast), var(--p3-dur-spin-reduced); } }
@keyframes p3-spin-hide { to { color: transparent; } }
@keyframes p3-spin-show { to { opacity: 1; } }
@keyframes p3-spin { to { transform: rotate(1turn); } }

/* ── the tab row (IA-1): the levers header ───────────────────────────────────────────────── */
/* ONE HEADER HEIGHT (the owner's QA note Q2): the tab row and the preview's title row are both
   `bar-h` tall and share one grid row in the two-pane layout, so their dividers meet at one y. */
.p3-nav {
  display: flex; align-items: center; gap: var(--p3-space-200); min-height: var(--p3-bar-h);
  padding: 0 var(--p3-space-300); background: var(--p3-levers-bg); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
/* The tabs scroll sideways when they do not fit; the inline padding keeps the first tab's focus ring inside. */
.p3-tabs {
  display: flex; align-self: stretch; flex: 1 1 auto; min-width: 0; gap: var(--p3-space-200); overflow-x: auto; scrollbar-width: none;
  padding: 0 var(--p3-space-075); margin: 0 calc(-1 * var(--p3-space-075));
}
.p3-tab {
  position: relative; display: inline-flex; align-items: center; flex: none; min-height: var(--p3-bar-h); padding: 0;
  border: 0; border-bottom: var(--p3-bw-thick) solid transparent; background: none; cursor: pointer; white-space: nowrap;
  color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-default);
}
.p3-tab:where(:not(:disabled, [aria-disabled="true"])):hover { color: var(--p3-text); }
.p3-tab[aria-selected="true"] { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); border-bottom-color: var(--p3-text); }
.p3-tab:focus-visible { outline: none; }
.p3-tab:focus-visible::before {
  content: ""; position: absolute; inset: var(--p3-space-150) calc(-1 * var(--p3-space-075)); pointer-events: none;
  border: var(--p3-focus-width) solid var(--p3-focus-ring); border-radius: var(--p3-radius-lg);
}
.p3-domrow { display: none; }
.p3-selwrap { position: relative; display: block; flex: 1 1 auto; min-width: 0; }
.p3-selwrap > .p3-ico { position: absolute; right: var(--p3-space-150); top: 50%; transform: translateY(-50%); color: var(--p3-icon-2); pointer-events: none; }
.p3-select {
  appearance: none; width: 100%; min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-500) 0 var(--p3-space-200);
  border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); cursor: pointer;
}
.p3-select:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }

/* Settings search (Q3): a magnifier at the end of the levers header opens a field in place. */
.p3-search { display: flex; align-items: center; flex: none; min-width: 0; }
.p3-search-box { display: none; }
/* #3553 M1 A: an open field takes the row and the tabs hide, at every width (the narrow tier's rule, below, made general).
   At 50% beside tabs that keep their width, the wide tier left the field about 52px of text, cut the last tab, and ran
   the status and Close out of the levers column. Moving to another Theme page means closing Search first. */
.p3-search[data-open="true"] { flex: 1 1 auto; }
/* On Components the row also carries the page's title, which left the field 0px at 1024 and ran Close past the column at
   every width: it gives way too, as the tabs do (the rail's tile still names the place). */
.p3-nav:has(.p3-search[data-open="true"]) :is(.p3-tabs, .p3-preview-title) { display: none; }
.p3-search[data-open="true"] .p3-search-open { display: none; }
.p3-search[data-open="true"] .p3-search-box { display: flex; position: relative; align-items: center; gap: var(--p3-space-100); flex: 1 1 auto; min-width: 0; }
.p3-search-box > .p3-ico { position: absolute; left: var(--p3-space-150); color: var(--p3-icon-2); pointer-events: none; }
.p3-search-input {
  flex: 1 1 auto; min-width: 0; min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150) 0 var(--p3-space-500);
  border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14);
}
.p3-search-input::placeholder { color: var(--p3-text-2); opacity: 1; }
.p3-search-input::-webkit-search-cancel-button { appearance: none; }
.p3-frame[data-w="narrow"] .p3-search-close { min-width: var(--p3-ctl-h-xs); min-height: var(--p3-ctl-h-xs); }
.p3-search-input:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-search-input:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-search-status { flex: none; color: var(--p3-text-2); font-size: var(--p3-fs-12); white-space: nowrap; }
.p3-search-status:empty { display: none; }

/* Color's sub-pages, and the Depth & motion switch: a segmented tablist. Its track is the top bar's step,
   so it reads on the gray tab row in both themes, and the selected segment's edge is measured against
   that track (B1). The labels stay primary text: secondary text is under 4.5:1 on the dark track, so the
   selected one is told apart by its fill, its edge and its weight. Concentric corners: the track's
   radius-xl is the segment's radius-lg plus the track's inset. */
/* Q1: the sub-pages sit under the tab row's divider, at the top of the levers panel. */
.p3-subnav { display: flex; padding: var(--p3-space-150) var(--p3-space-300); background: var(--p3-levers-bg); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-subnav:empty { display: none; }
.p3-seg {
  display: inline-flex; gap: var(--p3-space-025); padding: var(--p3-space-025); min-width: 0;
  border-radius: var(--p3-radius-xl); background: var(--p3-bar-bg);
}
.p3-seg-tab {
  flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer;
  min-height: calc(var(--p3-ctl-h) - 2 * var(--p3-space-025)); padding: 0 var(--p3-space-300);
  border: var(--p3-bw-hairline) solid transparent; border-radius: var(--p3-radius-lg); background: none;
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-default);
}
.p3-seg-tab:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-edge-bar); }
.p3-seg-tab[aria-selected="true"], .p3-seg-tab[aria-pressed="true"], .p3-seg-tab[aria-checked="true"] {
  background: var(--p3-bg-page); border-color: var(--p3-edge-bar); font-weight: var(--p3-fw-emphasis);
}
.p3-pane-toggle { display: none; }

/* ── notices: the error strip, full width under the top bar (S13.1) ──────────────────────── */
/* Concept v6's banner: the inset ground, the danger glyph and text. In the chrome's theme, so dark in dark. */
.p3-notices:not(:has(> :not([hidden]))) { display: none; }
.p3-errstrip {
  display: flex; align-items: flex-start; gap: var(--p3-space-150); padding: var(--p3-space-150) var(--p3-space-300);
  background: var(--p3-fill-1); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); color: var(--p3-bad-text);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-cozy);
}
.p3-errstrip[hidden] { display: none; }
.p3-errstrip > .p3-ico { color: var(--p3-bad-icon); margin-top: var(--p3-space-025); }
.p3-errstrip-text { min-width: 0; overflow-wrap: anywhere; }

/* ── the dialogs (S13.1): Export and the prune review, on a scrim ─────────────────────────── */
/* Their own `p3-bardlg-*` names, not `p3-dialog-*` or `p3-scrim` (the start window and its guard's, S12): no rule here
   reaches another dialog, and no rule of theirs reaches these (`test:chrome` §29c). The scrim sits at z-index 50, under
   the start window's, so a window opened over an open export dialog sits above it. */
.p3-bardlg-scrim {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: var(--p3-space-300); background: var(--p3-scrim);
}
.p3-bardlg {
  display: flex; flex-direction: column; width: 100%; max-width: calc(var(--p3-l-col) * 12); max-height: 100%; min-height: 0;
  border-radius: var(--p3-radius-xl); border: var(--p3-bw-hairline) solid var(--p3-line-2); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-cozy);
}
.p3-bardlg-head {
  display: flex; align-items: center; gap: var(--p3-space-150); padding: var(--p3-space-150) var(--p3-space-300);
  border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-bardlg-title { flex: 1 1 auto; margin: 0; font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-tighter); }
.p3-bardlg-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; overflow: hidden; }
.p3-bardlg-col { display: flex; flex-direction: column; gap: var(--p3-space-150); min-width: 0; padding: var(--p3-space-200) var(--p3-space-300); overflow-y: auto; }
.p3-export-out { background: var(--p3-fill-1); border-left: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-bardlg-desc { margin: 0; }
.p3-bardlg-note { margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); }
.p3-export-oseg { align-self: flex-start; max-width: 100%; }
/* #3553 M8: the option rows wrap. #3553 Q-UI11 A: the artifact switcher is Documentation's underline tabs (`.p3-tabs`,
   above), on a hairline as Documentation's head is; the three fit the plugin's 380 (M8's overflow), and the row scrolls
   rather than wrap if they ever do not. */
.p3-export-oseg { flex-wrap: wrap; }
.p3-export-tabhead { display: flex; border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
/* #3553 Q-UI7 A: the options are set in the chrome's Inter, as every other segmented control is; only Token names', whose
   options are token spellings, stay in mono. */
.p3-export-oseg .p3-seg-tab { flex: 0 1 auto; padding: 0 var(--p3-space-150); font-size: var(--p3-fs-12); }
.p3-export-oseg[data-key="tokenNameCase"] .p3-seg-tab { font-family: var(--p3-font-mono); }
.p3-export-sets { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-rhythm-row); }
/* #3337 (Q3337.4 A): Export's settings join the rhythm: rows a row apart, an L3 label space-050 above its control, the
   control's note the hint rhythm under it. */
.p3-export-set { display: grid; gap: var(--p3-rhythm-hint); }
.p3-export-lab { font-weight: var(--p3-fw-emphasis); margin-block-end: calc(var(--p3-space-050) - var(--p3-rhythm-hint)); }
.p3-export-files { margin: 0; font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); white-space: pre-line; overflow-wrap: anywhere; }
.p3-export-prevs { display: grid; gap: var(--p3-space-075); min-width: 0; min-height: 0; flex: 1 1 auto; overflow: auto; align-content: start; }
.p3-export-pname { color: var(--p3-text-2); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); overflow-wrap: anywhere; }
.p3-export-pre {
  margin: 0; overflow: auto; padding: var(--p3-space-150); border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-line-1);
  background: var(--p3-bg-page); color: var(--p3-text); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); white-space: pre;
}
.p3-bardlg-foot {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--p3-space-100); padding: var(--p3-space-150) var(--p3-space-300);
  border-top: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-bardlg-import { display: grid; gap: var(--p3-space-075); padding: var(--p3-space-150) var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-bardlg-import > .p3-menu-item { justify-self: start; }
/* #3553 M9: Export draws its captions and its Import action with the menu's classes, so they kept the menu's inner
   padding and sat a space-150 right of the files, the code and the notes they label. Here a caption starts at the
   column's edge, and the action's label does too: the button keeps its own padding and hover fill, moved out by it. */
:is(.p3-export-out, .p3-bardlg-import) > .p3-menu-cap { padding-inline: 0; }
.p3-bardlg-import > .p3-menu-item { margin-inline-start: calc(-1 * var(--p3-space-150)); }

/* ── the two panes (shown from the first moved page, S2) ─────────────────────────────────── */
/* The tab row and the preview's title row share ONE grid row (Q2), so the two dividers sit at one y
   whatever either row holds. The sub-pages open the levers column under the line (Q1). The bar's row is `max-content`
   (#2105): an `auto` row gives way to the bar's own `min-height` when the window is short, and a bar on two or three
   rows then drew over the notices under it. */
.p3-frame[data-layout="panes"] {
  position: fixed; inset: 0; display: grid; grid-template-columns: 42% minmax(0, 1fr);
  grid-template-rows: max-content auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "bar bar" "notices notices" "nav phead" "subnav pbody" "levers pbody" "levers drawer";
}
.p3-frame[data-layout="panes"] :is(.p3-head, .p3-panes, .p3-preview) { display: contents; }
.p3-frame[data-layout="panes"] .p3-bar { grid-area: bar; }
.p3-frame[data-layout="panes"] .p3-notices { grid-area: notices; }
.p3-frame[data-layout="panes"] :is(.p3-nav, .p3-subnav) { border-right: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-frame[data-layout="panes"] .p3-nav { grid-area: nav; }
/* Seven tabs and the magnifier in the 42% levers column (S2): the tabs closed up to 12px and the row's inline
   padding to 16px, so all seven fit at 1280; narrower, the row scrolls sideways as before. Theme's six tabs since #2909
   take one step more, 16px (the owner, 2026-10-26). */
.p3-frame[data-layout="panes"][data-w="wide"] .p3-nav { padding: 0 var(--p3-space-200); gap: var(--p3-space-150); }
.p3-frame[data-layout="panes"] .p3-nav .p3-tabs { gap: var(--p3-space-200); }
.p3-frame[data-layout="panes"] .p3-subnav { grid-area: subnav; min-width: 0; border-bottom: 0; }
/* #1975: in the 42% column at 640 and 800 the three sub-pages do not fit one row. The row keeps to its column (it ran
   under the preview, where a pointer could not reach Interactive) and a segment that does not fit wraps to a second line. */
.p3-frame[data-layout="panes"] .p3-subnav .p3-seg { display: flex; flex-wrap: wrap; width: 100%; }
.p3-levers {
  grid-area: levers; min-width: 0; min-height: 0; overflow: auto; background: var(--p3-levers-bg);
  border-right: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-preview-head {
  grid-area: phead; display: flex; align-items: center; gap: var(--p3-space-200); min-height: var(--p3-bar-h);
  padding: 0 var(--p3-space-400); background: var(--p3-bg-page); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-preview-body { grid-area: pbody; min-width: 0; min-height: 0; overflow: auto; background: var(--p3-bg-page); }
/* QA-B9, QA-B17: the two panes' eased scroll (an edit's reveal, a jump link) glides on the default transition's
   duration and curve. A scroll takes no CSS curve, so `preview/follow-edit.ts` reads these and steps it. */
:is(.p3-levers, .p3-preview-body) { --p3-scroll-dur: var(--p3-transition-dur); --p3-scroll-ease: var(--p3-transition-ease); }
/* The two panes scroll, so a keyboard can focus them; their ring sits inside their edge (S2). So does the export
   dialog's preview, a Tab stop that scrolls inside a scrolling column (#2523, owner decision Q229 A): drawn outside, its
   ring would be clipped at the column's edges. */
:is(.p3-levers, .p3-preview-body, .p3-export-pre):focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: calc(-1 * var(--p3-focus-width)); }

/* ── the preview header (S1.3): title, the mode control and Inspect, on one row (Q2) ─────── */
.p3-preview-title {
  margin: 0; flex: none; color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-20);
  font-weight: var(--p3-fw-bold); letter-spacing: var(--p3-ls-tightest); line-height: var(--p3-lh-compact); white-space: nowrap;
}
.p3-preview-head > .p3-popwrap { margin-left: auto; }
/* #3553 Q-UI1 A: at 1280 the mode control fell back to its select on the pages with longer titles (Style guide, Surfaces &
   fills, Shape, Depth & motion), so the control changed form between tabs. The fit logic stays; the header gives it
   room at the wide tier instead: the Contrast tile sets its icon beside its word rather than above it, and Inspect is
   its icon alone. */
.p3-frame[data-w="wide"] .p3-preview-head > .p3-tile-start { flex-direction: row; gap: var(--p3-space-075); }
.p3-frame[data-w="wide"] .p3-preview-head [data-p3="inspect-open"] > :is(.p3-btn-label, .p3-ico:last-child) { display: none; }
/* Square, as the chrome's other icon buttons (`.p3-btn-icon`), at the control height. */
.p3-frame[data-w="wide"] .p3-preview-head [data-p3="inspect-open"] { padding: 0; min-width: var(--p3-ctl-h-sm); justify-content: center; }
/* A button on the page ground takes the page's edge (B1), not the bar's. */
.p3-btn-page { border-color: var(--p3-edge); }
/* The mode control (Q1, model B): a radio group on the bar's step, the selected mode filled like a selected
   segment. A derived mode is hatched while it is not the one selected. It scrolls sideways when a brand
   ships more modes than fit, so the header never wraps. */
.p3-modes-wrap { display: flex; flex: 0 1 auto; min-width: 0; }
.p3-modes { flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
/* More modes than fit (S3 review): the select of the same modes instead, never a clipped radio (concept v6's
   slim preview). */
.p3-modes-wrap[data-fit="select"] > .p3-modes, .p3-modes-wrap:not([data-fit="select"]) > .p3-modes-select { display: none; }
/* #2383: the select is never narrower than its longest option, so the chosen mode's name is never cut (at 640 it read
   "Lig", or nothing). A select at `width: 100%` gives no width of its own to its flex parent, so it shrank to its caret.
   Where the title, the select and Inspect do not fit one row, the select takes its own row under the title and Inspect
   stays on the title's row. `fit` in `shell/preview.ts` decides that and sets `data-row`. The title never truncates. */
.p3-modes-wrap[data-fit="select"], .p3-modes-wrap[data-fit="select"] > .p3-modes-select { flex: none; }
.p3-modes-select > .p3-select { width: auto; }
.p3-preview-head:has(> .p3-modes-wrap[data-row="own"]) { flex-wrap: wrap; row-gap: var(--p3-space-100); padding-block: var(--p3-space-100); }
.p3-modes-wrap[data-row="own"] { order: 1; flex-basis: 100%; }
.p3-mode { flex: none; gap: var(--p3-space-075); padding: 0 var(--p3-space-150); }
.p3-mode[data-derived="true"]:not([aria-checked="true"]) {
  background-image: repeating-linear-gradient(135deg, transparent 0 var(--p3-space-050), var(--p3-fill-1) var(--p3-space-050) var(--p3-space-100));
}
.p3-mode-count { font-size: var(--p3-fs-12); }

/* ── Inspect (S1.3): over the preview ──────────────────────────────────────────────────────── */
/* No chrome rule sets a font or a color on Inspect's body: it holds legacy views, pinned light, whose text
   inherits the legacy body's. The shell's own parts (cards, notes) set theirs. */
.p3-inspect { display: none; }
.p3-inspect-head {
  display: flex; align-items: center; gap: var(--p3-space-200); flex: none; min-height: var(--p3-bar-h);
  padding: 0 var(--p3-space-300); background: var(--p3-bg-page); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-inspect-tabs { flex: 0 1 auto; }
.p3-inspect-body { flex: 1 1 auto; min-height: 0; min-width: 0; overflow: auto; padding: var(--p3-space-400); background: var(--p3-bg-page); }
.p3-frame[data-layout="panes"]:not([data-inspect=""]) :is(.p3-preview-head, .p3-preview-body) { display: none; }
.p3-frame[data-layout="panes"]:not([data-inspect=""]) .p3-inspect { display: contents; }
.p3-frame[data-layout="panes"] .p3-inspect-head { grid-area: phead; padding: 0 var(--p3-space-400); }
.p3-frame[data-layout="panes"] .p3-inspect-body { grid-area: pbody; }

.p3-stack { display: grid; gap: var(--p3-space-300); align-content: start; }
/* A container (the 2026-10-01 radius split): radius-xl, a hairline, the page ground. */
.p3-card {
  display: grid; gap: var(--p3-space-200); padding: var(--p3-space-300); border-radius: var(--p3-radius-xl);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
.p3-card-body { display: grid; gap: var(--p3-space-200); }
.p3-card-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--p3-space-150); }
.p3-card-title {
  margin: 0; font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); letter-spacing: var(--p3-ls-open);
  text-transform: uppercase; line-height: var(--p3-lh-compact);
}
.p3-card-sub, .p3-note { color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); }
.p3-stack > .p3-note { margin: 0; }
.p3-health-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--p3-space-150); margin: 0; }
/* #3366: Health's pointer to the contrast floor, its line then the way to the setting. */
.p3-health-floor { display: grid; gap: var(--p3-space-050); justify-items: start; }
.p3-health-floor > .p3-note { margin: 0; }
.p3-vpill {
  display: inline-flex; align-items: center; gap: var(--p3-space-075); padding: var(--p3-space-050) var(--p3-space-150);
  border-radius: var(--p3-radius-pill); background: var(--p3-fill-1); color: var(--p3-text);
  font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis);
}
.p3-vpill .p3-ico { color: var(--p3-ok-icon); }
.p3-vpill-bad { color: var(--p3-bad-text); }
.p3-vpill-bad .p3-ico { color: var(--p3-bad-icon); }
.p3-health-modes { display: grid; gap: var(--p3-space-100); margin: 0; padding: 0; list-style: none; }
.p3-health-mode { display: flex; align-items: center; gap: var(--p3-space-100); }
/* A legacy view inside Inspect: pinned light (D2), on its own page-colored container, inset like the
   chrome's own cards (Health, the Decisions log) so its toolbar does not sit on the container's edge. */
.p3-legacy-card { min-width: 0; padding: var(--p3-space-300); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page); }
/* #1993: the Type preview's availability marks (● ○), in the table and its key, are drawn in the chrome's embedded
   face, which carries them. The legacy card's text stack (`styles.css`'s --sans) would hand them to a device font. */
.p3-legacy-card .tpw-mark.yes, .p3-legacy-card .tpw-mark.no, .p3-legacy-card .tpw-key { font-family: var(--p3-font-ui); }
/* Q24: a Color preview's section container on the levers panel's gray. The section keeps `styles.css`'s
   edge, radius and padding; only its ground moves, and its specimens stay on the brand's page. The card is
   pinned light, so this reads the light value in either chrome theme. */
.p3-legacy-card .p3-sgsec { background: var(--p3-levers-bg); }
/* #3553 M5 A: in the Style guide's galleries an inverse token pill shares its inline-flex wrap with its `inverse` badge. In a
   narrow card the pill shrank below its longest segment and broke inside it, per character. The wrap wraps, so the
   badge goes above the pill where the two do not fit side by side. */
.p3-legacy-card .sg-pills .tpill-wrap { flex-wrap: wrap; }
/* QA-I2, on Surfaces & fills (S4f): a ratio badge's mark in the chrome's status icon colors, a pass in the success
   icon and a miss in the danger icon, from the chrome theme `preview/badge-marks.ts` stamps on the mark (the one that
   contrasts most with the ground under it). An unstamped mark (no theme reaches 3:1 there) keeps the badge's ink. */
.p3-marks .sg-ratio-mk[data-theme] { color: var(--p3-ok-icon); }
.p3-marks .sg-ratio-no .sg-ratio-mk[data-theme] { color: var(--p3-bad-icon); }

/* ── narrow (Q7): one column, one sticky top row, the tabs as a select ───────────────────── */
.p3-frame[data-w="narrow"] .p3-head { display: contents; }
.p3-frame[data-w="narrow"] .p3-bar {
  position: sticky; top: 0; z-index: 30; flex-wrap: wrap; min-height: var(--p3-ctl-h-sm);
  gap: var(--p3-space-075); padding: var(--p3-space-025) var(--p3-space-150);
}
.p3-frame[data-w="narrow"] .p3-bar-main { flex-wrap: wrap; gap: var(--p3-space-075); }
/* Narrow keeps the logo and drops the name; the mark's accessible name still says it. */
/* The narrow tier's rules for the tile labels, the product name and the two rows also serve the wide bar's fit steps
   (#2214, BL1 A+B): `frame.ts` (`fitBar`) sets `data-bar-fit` when the full bar would not fit on one row. `glyphs`
   drops the labels, `logo` the name too, `rows` takes the two rows as well, and `trim` (Q83 A) also cuts the brand
   switcher's name short, below. The narrow tier takes `trim` too (#2262), when its own first row would not fit. */
.p3-frame[data-w="narrow"] :is(.p3-btn, .p3-brand) { min-height: var(--p3-ctl-h-xs); font-size: var(--p3-fs-12); }
.p3-frame[data-w="narrow"] .p3-brand { padding: 0 var(--p3-space-100); }
.p3-frame[data-w="narrow"] .p3-btn-icon { min-width: var(--p3-ctl-h-xs); }
.p3-frame[data-w="narrow"] .p3-nav { gap: var(--p3-space-100); padding: var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-nav .p3-tabs { display: none; }
.p3-frame[data-w="narrow"] .p3-domrow { display: flex; flex: 1 1 auto; min-width: 0; }
.p3-frame[data-w="narrow"] .p3-nav:has(.p3-search[data-open="true"]) .p3-domrow { display: none; }
.p3-frame[data-w="narrow"] .p3-subnav { padding: var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-subnav .p3-seg { display: flex; width: 100%; }
.p3-frame[data-w="narrow"] .p3-seg-tab { padding: 0 var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-errstrip { padding: var(--p3-space-100) var(--p3-space-150); }
/* #2105: the plugin's narrow window is 420 tall, and a refused restore's line ran 270px, leaving the levers pane 0px. At
   the narrow tier the line stops at two bar heights and scrolls inside itself, so the page under it keeps its room. */
.p3-frame[data-w="narrow"] .p3-errstrip { max-height: calc(2 * var(--p3-bar-h)); overflow-y: auto; }
/* #1999 (owner decision Q1999.1 A): the one exception, the refused-saved-brand notice inside the start window. There the
   strip is the window's own content, in a body that scrolls, so the cap would only scroll its two buttons out of sight. */
.p3-frame[data-w="narrow"] .p3-start .p3-errstrip { max-height: none; overflow-y: visible; }
.p3-frame[data-w="narrow"] .p3-bardlg-scrim { padding: var(--p3-space-150); }
.p3-frame[data-w="narrow"] :is(.p3-bardlg-head, .p3-bardlg-col, .p3-bardlg-foot, .p3-bardlg-import) { padding-left: var(--p3-space-150); padding-right: var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-bardlg-body { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
.p3-frame[data-w="narrow"] .p3-bardlg-col { overflow: visible; }
.p3-frame[data-w="narrow"] .p3-export-out { border-left: 0; border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
/* #2175: the neutral source's three segments ("Follow primary", "Custom tint", "Pinned") clip at 380 at the 12px
   above; at 8px they fit. Scoped to the choice that opts in, so no other segmented control moves. */
.p3-frame[data-w="narrow"] .p3-seg-snug .p3-seg-tab { padding: 0 var(--p3-space-100); }
.p3-frame[data-layout="panes"][data-w="narrow"] {
  grid-template-columns: minmax(0, 1fr); grid-template-rows: max-content auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "bar" "notices" "nav" "subnav" "levers" "drawer";
}
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-preview-head { grid-area: nav; }
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-preview-body { grid-area: levers; }
.p3-frame[data-layout="panes"][data-w="narrow"][data-pane="settings"] :is(.p3-preview-head, .p3-preview-body, .p3-inspect-head, .p3-inspect-body) { display: none; }
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-inspect-head { grid-area: nav; }
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-inspect-body { grid-area: levers; }
.p3-frame[data-w="narrow"] .p3-preview-head { flex-wrap: wrap; padding: var(--p3-space-100) var(--p3-space-150); }
/* #3298 (owner decision Q3298.1 A): at the narrow tier the preview header holds the Inspect menu. Sized to its longest
   line and hung from Inspect alone, the menu ran off the window's left edge at 380 (the privacy note on one line, 529px
   wide). Here the header is its containing block: the menu keeps Inspect's right edge (the header's 12px padding),
   drops just under Inspect from its static position (the narrow button's height plus the usual gap), and is capped at
   the header's width less 12px a side, so the privacy note and the build stamp wrap inside it. 1280 is unchanged. */
.p3-frame[data-w="narrow"] .p3-preview-head { position: relative; }
.p3-frame[data-w="narrow"] .p3-preview-head > .p3-popwrap { position: static; }
.p3-frame[data-w="narrow"] .p3-preview-head > .p3-popwrap > .p3-menu {
  top: auto; right: var(--p3-space-150); margin-top: calc(var(--p3-ctl-h-xs) + var(--p3-space-050));
  min-width: 0; max-width: calc(100% - 2 * var(--p3-space-150));
}
.p3-frame[data-w="narrow"] .p3-inspect-head { padding: 0 var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-inspect-body { padding: var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-btn.p3-tile { min-height: var(--p3-ctl-h-xs); min-width: var(--p3-ctl-h-xs); padding: 0 var(--p3-space-050); }
.p3-frame:is([data-w="narrow"], [data-bar-fit]) .p3-tile-label { display: none; }
/* At 380 the Contrast tooltip hangs from the bar's left edge, so a long line stays inside the window. */
.p3-frame[data-w="narrow"] .p3-tile-start { position: static; }
.p3-frame[data-w="narrow"] .p3-tile-start > .p3-tile-tip { left: 0; top: 100%; }
/* `trim` (#2214, the owner's Q83 A): the first row still does not fit, so the brand switcher takes what is left of it and
   cuts its name short with the ellipsis `.p3-brand-name` already draws; the spacer before Theme gives up its share. */
.p3-frame[data-bar-fit="trim"] .p3-brandwrap { flex: 1 1 0; min-width: 0; }
.p3-frame[data-bar-fit="trim"] .p3-bar-main > .p3-spacer { flex-grow: 0; }
.p3-frame[data-w="narrow"] .p3-inspect-close .p3-btn-label { display: none; }
.p3-frame[data-layout="panes"][data-w="narrow"][data-pane="preview"] :is(.p3-levers, .p3-nav, .p3-subnav) { display: none; }
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-pane-toggle { display: inline-flex; }
.p3-frame[data-layout="panes"][data-w="narrow"] .p3-bar { position: static; }

/* ── Activity (S1.4, F2): the button's status dot, the drawer, the strip and the sheet ─────── */
/* The status dot: running (a ring), a result that needs attention, a result nobody has opened. Never the
   only cue: the button's name carries the same words. */
.p3-status-dot { box-sizing: border-box; }
.p3-status-dot[data-state="none"] { display: none; }
.p3-status-dot[data-state="unread"] { background: var(--p3-icon); }
.p3-status-dot[data-state="bad"] { background: var(--p3-bad-icon); }
.p3-status-dot[data-state="run"] { border: var(--p3-bw-thick) solid var(--p3-icon); }
/* The bar's lead dot: the newest operation's state. */
.p3-status-dot[data-state="ok"] { background: var(--p3-ok-icon); }
/* The drawer: at the bottom of the frame, pinned to the bottom edge, on the page ground. Its bar row is one
   button: the newest operation, its time, the counts. Its body, one row per operation that has run (S11,
   concept v6). Hidden until something has run, unless it is opened. */
.p3-drawer {
  position: sticky; bottom: 0; z-index: 20; display: flex; flex-direction: column; min-height: 0;
  background: var(--p3-bg-page); border-top: var(--p3-bw-hairline) solid var(--p3-line-1);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal);
}
.p3-drawer[data-open="false"][data-ever="false"]:not(:has(> .p3-status:not([hidden]))) { display: none; }
/* #3170: a drawer with nothing to show yet still carries the status strip (the read after open, at 380), without its empty
   bar row. */
.p3-drawer[data-open="false"][data-ever="false"] > .p3-drawer-bar { display: none; }
/* A sanctioned shadow (T5, the owner, #3113): the drawer's top edge casts a subtle shadow up over what it covers, while it
   overlays the preview: open, and at 380 as the strip and the sheet. Not the closed bar row wider. */
.p3-drawer[data-open="true"], .p3-frame[data-w="narrow"] .p3-drawer { box-shadow: 0 calc(-1 * var(--p3-space-025)) var(--p3-space-150) calc(-1 * var(--p3-space-050)) var(--p3-scrim); }
.p3-drawer-bar {
  display: flex; align-items: center; gap: var(--p3-space-100); flex: none; width: 100%;
  min-height: var(--p3-bar-h); padding: var(--p3-space-050) var(--p3-space-300);
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.p3-drawer-bar > .p3-ico { color: var(--p3-icon-2); }
/* The bar row spans the drawer's width at the window's bottom edge, so its ring sits inside it, as the scrolling panes'
   does (#2144); drawn from launch since #3113, the keyboard reaches it before anything has run. A row header and an
   earlier result's line ring outside, as every other control does. */
.p3-drawer-bar:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: calc(-1 * var(--p3-focus-width)); }
:is(.p3-op-head, .p3-op-history summary):focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); border-radius: var(--p3-radius-md); }
.p3-drawer[data-open="true"] .p3-drawer-bar > .p3-ico:last-of-type { transform: rotate(180deg); }
.p3-drawer-last { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Q3113.3 A: the split counts. "1 failed" in the error ink after the error glyph, "1 warning" in the text ink after the
   warning glyph, "n running" quiet. Inline, so each keeps the row's text baseline. */
.p3-drawer-count { color: var(--p3-text-2); white-space: nowrap; }
.p3-drawer-count[data-kind="bad"] { color: var(--p3-bad-text); }
.p3-drawer-count[data-kind="warn"] { color: var(--p3-text); }
.p3-drawer-count > .p3-ico, .p3-drawer-link > .p3-ico, .p3-drawer-linkline > .p3-ico { display: inline-block; vertical-align: text-bottom; margin-inline-end: var(--p3-space-050); }
.p3-drawer-count[data-kind="bad"] > .p3-ico { color: var(--p3-bad-icon); }
.p3-drawer-count[data-kind="warn"] > .p3-ico { color: var(--p3-warn-icon); }
.p3-drawer-counts { display: flex; align-items: baseline; gap: var(--p3-space-100); min-width: 0; }
/* Q3113.2 A: a state's mark, a glyph in its status ink (or the running ring), and the verdict's words: a failure's in
   the error ink, any other in the text ink. */
.p3-op-mark { display: inline-flex; flex: none; }
.p3-op-mark[data-state="ok"] { color: var(--p3-ok-icon); }
.p3-op-mark[data-state="warn"] { color: var(--p3-warn-icon); }
.p3-op-mark[data-state="bad"] { color: var(--p3-bad-icon); }
.p3-op-markslot { display: inline-flex; flex: none; }
.p3-op-markslot:empty { display: none; }
:is(.p3-op-verdict, .p3-drawer-verdict)[data-state="bad"] { color: var(--p3-bad-text); }
.p3-op-verdict { min-width: 0; overflow-wrap: anywhere; }
.p3-op-verdict[hidden] { display: none; }
/* The bar row's text runs: the summary, its time, the counts and the agent status, on one baseline (#2213, the
   owner's review). Centered in the row like the dot and the caret, but aligned on their baseline among themselves. */
.p3-drawer-text { display: flex; align-items: baseline; gap: inherit; flex: 1 1 auto; min-width: 0; }
.p3-drawer-text > .p3-op-prog { align-self: center; }
/* The agent link's short status (#2213, the owner's N1 A and AS1 A; plugin only): quiet text at the bar row's far
   right, beside the caret, and the error ink when the link is in trouble. One line. It takes only the room the row has
   left (from no width, up to its words' own), so the summary never gives way to it; its tooltip and its accessible
   name carry the link's full status line. */
.p3-drawer-link { flex: 1000 1 0%; min-width: 0; max-width: max-content; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--p3-text-2);
  padding-inline-start: var(--p3-space-100); border-inline-start: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-drawer-link[data-error="true"] { color: var(--p3-bad-text); }
/* Q3113.7 A: the link as a glyph, a dot and one word; the full line, heading the open drawer, the same way. */
.p3-drawer-link > .p3-ico, .p3-drawer-linkline > .p3-ico { color: var(--p3-icon-2); }
.p3-drawer-link-dot { background: var(--p3-ok-icon); vertical-align: middle; margin-inline-end: var(--p3-space-050); }
:is(.p3-drawer-link, .p3-drawer-linkline)[data-error="true"] .p3-drawer-link-dot { background: var(--p3-bad-icon); }
.p3-drawer-linkline[data-error="true"] { color: var(--p3-bad-text); }
.p3-drawer-body {
  display: grid; gap: var(--p3-space-100); align-content: start; min-height: 0;
  max-height: calc(6 * var(--p3-bar-h)); overflow: auto; padding: 0 var(--p3-space-300) var(--p3-space-200);
}
.p3-drawer-body[hidden] { display: none; }
.p3-drawer-note { margin: 0; }
.p3-drawer-note[hidden] { display: none; }
/* Q3113.8 A: the sheet's header row at 380 (a 24 × 24 close icon, "Activity", the counts, the agent dot), which takes the
   bar row's place there. Wider, the bar row closes the drawer and no header is drawn. */
.p3-drawer-head { display: none; }
.p3-frame .p3-drawer-head > .p3-btn.p3-drawer-close { width: var(--p3-hit-min); min-width: var(--p3-hit-min); height: var(--p3-hit-min); min-height: var(--p3-hit-min); padding: 0; }
.p3-drawer-title { font-weight: var(--p3-fw-strong); }
/* One operation: a header that expands its body. */
.p3-ops { display: grid; gap: var(--p3-space-050); }
.p3-op { border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-xl); }
.p3-op-head {
  display: flex; align-items: center; gap: var(--p3-space-100); width: 100%; min-height: var(--p3-hit-min);
  padding: var(--p3-space-050) var(--p3-space-150); border: 0; background: transparent; color: inherit;
  font: inherit; text-align: left; cursor: pointer;
}
.p3-op-head > .p3-ico:first-child { color: var(--p3-icon-2); }
.p3-op-head[aria-expanded="true"] > .p3-ico:first-child { transform: rotate(90deg); }
.p3-op-agent { display: inline-flex; align-items: center; gap: var(--p3-space-050); color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.p3-op-agent[hidden] { display: none; }
.p3-op-when { margin-left: auto; color: var(--p3-text-2); white-space: nowrap; }
.p3-op-body { display: grid; gap: var(--p3-space-100); padding: 0 var(--p3-space-150) var(--p3-space-150); }
.p3-op-body[hidden] { display: none; }
/* A run's details, one line per item, console-style (#2177): the chrome's mono font, each line its own block, a long
   one wrapping inside the drawer rather than widening it. #3305 (the owner): the drawer's mono text (these lines, the
   publish description, the status counter) is set at 10px; its UI-face text stays at the drawer's 12. */
.p3-op-summary { margin: 0; padding: 0; list-style: none; font-family: var(--p3-font-mono); font-size: var(--p3-fs-10); overflow-wrap: anywhere; }
.p3-op-line { margin: 0; }
/* #3326 (Q3326.1 A, Q3326.5 A; #3308 Q3308.1 A): a bad result's causes, first, in the UI face. One disclosure per cause:
   closed, its mark, the set in emphasis, what happened and `· <first reason>` clipped to one line, the step at the end;
   open, every reason one per line, wrapping, then its why, what stays and what to do. At 380 the step moves inside. */
.p3-op-causes { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-050); min-width: 0; }
.p3-op-cause { min-width: 0; }
.p3-op-cause > summary { list-style: none; display: flex; align-items: baseline; gap: var(--p3-space-075); cursor: pointer; min-width: 0; }
.p3-op-cause > summary::-webkit-details-marker { display: none; }
.p3-op-cause > summary > .p3-ico:first-child { flex: none; align-self: center; color: var(--p3-icon-2); width: var(--p3-icon-xs); height: var(--p3-icon-xs); }
.p3-op-cause[open] > summary > .p3-ico:first-child { transform: rotate(90deg); }
.p3-op-cause > summary > .p3-op-mark { align-self: center; }
.p3-op-cause-subj { font-weight: var(--p3-fw-emphasis); white-space: nowrap; }
.p3-op-cause-subj[hidden] { display: none; }
.p3-op-cause-what { white-space: nowrap; flex: none; }
.p3-op-cause-first { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p3-op-cause[open] .p3-op-cause-first { display: none; }
.p3-op-cause-step { flex: none; margin-left: auto; color: var(--p3-text-2); white-space: nowrap; }
.p3-op-cause-body { display: grid; gap: var(--p3-space-050); padding: var(--p3-space-050) 0 var(--p3-space-075) var(--p3-space-500); }
.p3-op-cause-reasons { margin: 0; padding: 0 0 0 var(--p3-space-200); display: grid; gap: var(--p3-space-025); overflow-wrap: anywhere; }
.p3-op-cause-say { margin: 0; overflow-wrap: anywhere; }
.p3-op-cause-say > b { font-weight: var(--p3-fw-emphasis); }
.p3-op-cause-why, .p3-op-cause-steptext { color: var(--p3-text-2); }
.p3-op-cause-steptext { display: none; }
.p3-frame[data-w="narrow"] .p3-op-cause-step { display: none; }
.p3-frame[data-w="narrow"] .p3-op-cause-steptext { display: block; }
/* #3326 PR 2 (Q3326.4 A, Q3326.6–.8 A, Q3390.3 A): after the causes, the notes, then Update file's steps, each under a
   small label ("Note", "Steps"). A note is one line: the info mark, its step in emphasis, what it says. A step is its
   mark, its name in emphasis and its verdict's words, its mono lines behind its own disclosure; a step with no lines (one
   that never ran) keeps the chevron's room, so every mark sits in one column. Ported from the approved renders' prototype. */
.p3-op-sec { margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-10); text-transform: uppercase; letter-spacing: var(--p3-ls-wide); }
.p3-op-notes, .p3-op-steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-050); min-width: 0; }
.p3-op-note { display: flex; align-items: baseline; gap: var(--p3-space-075); min-width: 0; }
.p3-op-note > .p3-op-mark { align-self: center; }
.p3-op-mark[data-state="note"], .p3-op-mark[data-state="skip"] { color: var(--p3-icon-2); }
.p3-op-note-say { min-width: 0; overflow-wrap: anywhere; }
.p3-op-note-step { font-weight: var(--p3-fw-emphasis); }
.p3-op-step { min-width: 0; }
.p3-op-step > summary, .p3-op-step-flat { list-style: none; display: flex; align-items: baseline; gap: var(--p3-space-075); min-width: 0; }
.p3-op-step > summary { cursor: pointer; }
.p3-op-step > summary::-webkit-details-marker { display: none; }
.p3-op-step > summary > .p3-ico:first-child { flex: none; align-self: center; color: var(--p3-icon-2); width: var(--p3-icon-xs); height: var(--p3-icon-xs); }
.p3-op-step[open] > summary > .p3-ico:first-child { transform: rotate(90deg); }
.p3-op-step-gap { flex: none; width: var(--p3-icon-xs); }
.p3-op-step :is(summary, .p3-op-step-flat) > .p3-op-mark, .p3-op-step-flat > .p3-op-mark { align-self: center; }
.p3-op-step-name { flex: none; font-weight: var(--p3-fw-emphasis); white-space: nowrap; }
.p3-op-step-words { min-width: 0; color: var(--p3-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p3-op-step > .p3-op-summary { margin-top: var(--p3-space-050); padding-left: var(--p3-space-500); }
/* Q3113.4 A: a bad result's next steps. */
.p3-op-next { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); }
.p3-op-copied:empty { display: none; }
/* An Update's library publish description and its Copy button (#2858). */
.p3-op-publish { display: grid; gap: var(--p3-space-050); }
.p3-op-publish-head { display: flex; align-items: center; justify-content: space-between; gap: var(--p3-space-100); }
.p3-op-publish-text { margin: 0; padding: var(--p3-space-100); border: var(--p3-bw-hairline) solid var(--p3-edge); border-radius: var(--p3-radius-md); font-family: var(--p3-font-mono); font-size: var(--p3-fs-10); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.p3-op-phase { display: grid; gap: var(--p3-space-050); }
.p3-op-prog { display: block; appearance: none; width: 100%; height: var(--p3-space-050); border: none; border-radius: var(--p3-radius-pill); background: var(--p3-line-1); overflow: hidden; }
.p3-op-prog::-webkit-progress-bar { background: var(--p3-line-1); }
.p3-op-prog::-webkit-progress-value { background: var(--p3-icon); }
.p3-op-prog::-moz-progress-bar { background: var(--p3-icon); }
/* #3170 part 2 (Q3170.1–6 A): the status strip, first in the drawer, above its bar row (`shell/status-strip.ts`). On the
   drawer's ground; a verdict is marked as Activity marks one, its glyph in its status ink, never a filled band. The bar is
   the drawer's own progress; with no value it is indeterminate, and it draws no motion: what moves is what the run said. */
.p3-status { display: grid; gap: var(--p3-space-075); padding: var(--p3-space-100) var(--p3-space-300); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-status[hidden] { display: none; }
.p3-status-top { display: flex; align-items: baseline; gap: var(--p3-space-100); min-width: 0; }
.p3-status-top > .p3-op-mark { align-self: center; }
.p3-status-top > [hidden], .p3-status-sub > [hidden], .p3-status-prog[hidden] { display: none; }
.p3-status-what { flex: 1 1 auto; min-width: 0; font-weight: var(--p3-fw-strong); overflow-wrap: anywhere; }
.p3-status[data-tone="bad"] .p3-status-what { color: var(--p3-bad-text); }
.p3-status-n { flex: none; color: var(--p3-text-2); font-family: var(--p3-font-mono); font-size: var(--p3-fs-10); font-variant-numeric: tabular-nums; white-space: nowrap; }
.p3-status-sub { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); color: var(--p3-text-2); }
.p3-status-sub:not(:has(> :not([hidden]))) { display: none; }
.p3-status-line { flex: 1 1 auto; min-width: 0; }
.p3-status-stop { flex: none; margin-inline-start: auto; }
.p3-frame[data-w="narrow"] .p3-status { padding: var(--p3-space-075) var(--p3-space-150); }
.p3-op-history > summary { cursor: pointer; color: var(--p3-text-2); }
/* Q3113.6 A: one line per earlier result (its mark, time, words and Agent), each opening its own lines (#2281). */
.p3-op-history > ul { display: grid; gap: var(--p3-space-025); margin: var(--p3-space-050) 0 0; padding: 0; list-style: none; }
.p3-op-entry > summary { cursor: pointer; list-style: none; }
.p3-op-entry > summary::-webkit-details-marker { display: none; }
.p3-op-entry-head > .p3-ico:first-child { color: var(--p3-icon-2); }
.p3-op-entry[open] > summary .p3-op-entry-head > .p3-ico:first-child { transform: rotate(90deg); }
/* An entry with no lines of its own sets its mark under the others' chevrons. */
.p3-op-entry-row > .p3-op-entry-head { padding-inline-start: var(--p3-icon-xs); margin-inline-start: var(--p3-space-075); }
.p3-op-entry-head { display: inline-flex; align-items: center; gap: var(--p3-space-075); }
.p3-op-entry-head > .p3-op-when { margin-left: 0; }
.p3-op-entry > :is(.p3-op-summary, .p3-op-causes, .p3-op-sec, .p3-op-notes, .p3-op-steps) { margin-top: var(--p3-space-050); padding-left: var(--p3-space-300); }
/* Under the two panes, the drawer is the preview pane's bottom row (plan §3.9). */
.p3-frame[data-layout="panes"] .p3-drawer { grid-area: drawer; position: static; border-left: 0; }
/* At 380: the closed drawer is the strip, pinned to the bottom edge; the open drawer is a full-pane sheet
   under the top row (F2). */
.p3-frame[data-w="narrow"] .p3-drawer-bar { min-height: var(--p3-ctl-h-sm); gap: var(--p3-space-075); padding: var(--p3-space-050) var(--p3-space-150); }
.p3-frame[data-w="narrow"] .p3-drawer-body { padding: 0 var(--p3-space-150) var(--p3-space-200); }
.p3-frame[data-w="narrow"]:has(> .p3-drawer[data-open="true"]) { position: fixed; inset: 0; display: flex; flex-direction: column; }
.p3-frame[data-w="narrow"]:has(> .p3-drawer[data-open="true"]) :is(.p3-nav, .p3-subnav, .p3-notices, .p3-panes, .p3-inspect) { display: none; }
.p3-frame[data-w="narrow"] .p3-drawer[data-open="true"] { flex: 1 1 auto; border-top: 0; }
.p3-frame[data-w="narrow"] .p3-drawer[data-open="true"] .p3-drawer-body { flex: 1 1 auto; max-height: none; }
.p3-frame[data-w="narrow"] .p3-drawer[data-open="true"] > .p3-drawer-bar { display: none; }
.p3-frame[data-w="narrow"] .p3-drawer[data-open="true"] .p3-drawer-head {
  display: flex; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-ctl-h-sm); padding-top: var(--p3-space-050);
}
/* Q3113.8 A: row headers wrap in the sheet, so a verdict and its time are never cut; the Settings/Preview toggle hides
   while the sheet is open, as the panes do. */
.p3-frame[data-w="narrow"] .p3-op-head { flex-wrap: wrap; }
.p3-frame[data-w="narrow"]:has(> .p3-drawer[data-open="true"]) .p3-pane-toggle { display: none; }
/* At 380 the bar row's agent status is its glyph and dot (Q3113.7 A); the word stays in its name, drawn as `.p3-sr` draws. */
.p3-frame[data-w="narrow"] .p3-drawer-link-word { position: absolute; width: var(--p3-bw-hairline); height: var(--p3-bw-hairline); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* #2176 (the owner's AD1–AD3): the open drawer's handle, at the wide tier. A window splitter: its box is the hit target
   (hit-min tall, the pill's width plus space-200 a side), centered on the drawer's top edge over the bar row. Its one
   mark is the pill, which sits space-075 inside the drawer's top border, the way a sheet's grabber does, and is
   space-500 wide (the owner's change from the mock's 32px). The pill takes the secondary glyph ink, a declared 3:1 pair
   on the page. The drawer is the handle's containing block; it makes no stacking context, so nothing that hangs over
   it from the preview header moves under it. */
.p3-frame:is([data-layout="panes"], [data-layout="page"], [data-layout="home"]) .p3-drawer { position: relative; z-index: auto; }
.p3-drawer-grip {
  position: absolute; top: 0; left: 0; right: 0; margin: 0 auto; box-sizing: border-box; display: flex; justify-content: center;
  align-items: flex-start; width: calc(var(--p3-space-500) + 2 * var(--p3-space-200)); height: var(--p3-hit-min);
  padding-top: var(--p3-space-075); cursor: ns-resize; touch-action: none; user-select: none;
}
.p3-drawer-grip[hidden] { display: none; }
.p3-drawer-grip:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-drawer-pill { display: block; flex: none; width: var(--p3-space-500); height: var(--p3-space-050); border-radius: var(--p3-radius-pill); background: var(--p3-icon-2); }
/* AD2: no handle at the narrow tier, where the open drawer is the full-pane sheet. */
.p3-frame[data-w="narrow"] .p3-drawer-grip { display: none; }
/* A kept height (`--p3-activity-h`, which the shell sets on the frame while the drawer is open and wide; a runtime
   variable, RUNTIME_VARS in `chrome/esbuild-plugin.mjs`): the drawer draws at it, its body taking the rest. Under the
   two panes the preview body and the drawer share the preview column from the sub-row's line down, so the drawer can
   reach the preview header whatever the levers column holds: the body keeps the drawer's height free under it. */
.p3-frame[data-w="wide"] .p3-drawer[data-sized="true"] { box-sizing: border-box; height: var(--p3-activity-h); }
.p3-frame[data-w="wide"] .p3-drawer[data-sized="true"] .p3-drawer-body { flex: 1 1 auto; max-height: none; }
.p3-frame[data-layout="panes"][data-w="wide"]:has(> .p3-drawer[data-sized="true"]) :is(.p3-preview-body, .p3-inspect-body) {
  grid-row: 4 / -1; margin-bottom: var(--p3-activity-h);
}
.p3-frame[data-layout="panes"][data-w="wide"] .p3-drawer[data-sized="true"] { grid-row: 4 / -1; align-self: end; }

/* The Figma menu (S1.4, plugin only). At 380 it spans the top row, under it, like the Agent popover. */

/* ── the Agent switch (S1.4, IA-3; #3083, the owner's Q3083.5 B, Q3083.6 A and Q3083.7 B, 2026-10-28; plugin only) ── */
.p3-agent-slot { display: inline-flex; }
.p3-agent-slot:empty { display: none; }
/* A bare "Agent" and the chrome's switch, on the bar ground with no control around them (Q3083.5 B): it replaced the
   Agent tile, its green dot and the on mark's fill and edge (Q738 A, Q788 C). The word is a `<label>` for the switch, so a
   click on either turns it, and the switch stays the chrome's one track-and-knob kind (#2183). The switch's own target is
   its track's width by the bar's control height, 32px at 1280 (`ctl-h-sm`) and 28 at 380 (`ctl-h-xs`, below), where the
   label drops and the switch stands alone (Q3083.6 A), its name still "Agent". The switch is the bar-only size
   (Q3083.7 B): a 36 × 20 track and a 16px knob, from `bar-track-w`, `bar-track-h`, `bar-thumb` and `bar-thumb-inset`. On
   the bar ground, off, the track's edge is `edge-bar` (`edge` is 2.92:1 on the dark bar), and on, `inv-bg` and its hover
   `inv-bg-2`, each a declared pair on `bar-bg` (`spec.mjs`). The knob keeps the page switch's roles on the track's fill. */
.p3-agent-slot > .p3-popwrap { align-items: center; gap: var(--p3-space-100); }
.p3-agent-switch-label {
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); white-space: nowrap; cursor: pointer;
}
.p3-switch.p3-agent-switch { min-height: var(--p3-ctl-h-sm); border-radius: var(--p3-radius-lg); }
.p3-agent-switch .p3-switch-track { width: var(--p3-bar-track-w); height: var(--p3-bar-track-h); border-color: var(--p3-edge-bar); }
.p3-agent-switch .p3-switch-knob {
  top: calc(var(--p3-bar-thumb-inset) - var(--p3-bw-hairline)); left: calc(var(--p3-bar-thumb-inset) - var(--p3-bw-hairline));
  width: var(--p3-bar-thumb); height: var(--p3-bar-thumb);
}
/* One class over the page switch's on rule, which comes later in this file at the same weight. */
.p3-switch.p3-agent-switch[aria-checked="true"] .p3-switch-knob { transform: translateX(calc(var(--p3-bar-track-w) - var(--p3-bar-thumb) - 2 * var(--p3-bar-thumb-inset))); }
/* #3553 Q-UI10 A: the label stays at the narrow tier, where Q3083.6 A had dropped it and left a bare toggle: there it is the
   agent glyph rather than the word, so the brand switcher keeps its room. Only the wide bar's fit steps drop it, with the
   other bar labels. */
.p3-agent-switch-label { display: inline-flex; align-items: center; }
.p3-agent-switch-label > .p3-ico { display: none; color: var(--p3-icon); }
.p3-frame[data-w="wide"][data-bar-fit] .p3-agent-switch-label { display: none; }
.p3-frame[data-w="narrow"] .p3-agent-switch-label > .p3-ico { display: block; }
.p3-frame[data-w="narrow"] .p3-agent-switch-word { display: none; }
.p3-frame[data-w="narrow"] .p3-switch.p3-agent-switch { min-height: var(--p3-ctl-h-xs); }
/* Minimize (#2949, the owner's Q600 A): a tile at the rail's foot (Q731; on the top bar under #2909), drawn whether the
   agent link is on or off. */
.p3-btn.p3-tile.p3-agent-min[hidden] { display: none; }
/* #3204 (Q3204.1 A): the desktop bridge's pairing prompt, under the Agent switch while the bridge asks for a code. The
   theme menu's surface (`.p3-menu`), its parts in one column: the title, one line, the code field with Pair and Not now,
   and the field's error line. It hangs from the bar's right edge, not the switch's: the switch sits near the right of
   the bar, and at 380 a box anchored to it would leave the window. */
.p3-agent-slot > .p3-popwrap { position: static; }
.p3-menu.p3-agent-pair {
  gap: var(--p3-space-100); padding: var(--p3-space-200); min-width: 0;
  width: calc(var(--p3-l-col) * 4);
}
.p3-menu.p3-agent-pair[hidden] { display: none; }
.p3-agent-pair-title { color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); }
.p3-agent-pair-line { color: var(--p3-text-2); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); }
.p3-agent-pair-row { display: flex; gap: var(--p3-space-100); align-items: center; }
.p3-agent-pair-row > .p3-text-input { flex: 1 1 auto; }
.p3-agent-pair .p3-field-err:empty { display: none; }
/* The strip (#2949, the owner's Q1 A): while minimized the window is one row, the strip, on the top bar's ground.
   Everything else in the document stays mounted, only not drawn, so Restore returns to the same page and state. The
   live region (`p3-sr`) stays in the tree, so an error still announces. The line takes the room the buttons leave, and an
   ellipsis if it must; the strip's tooltip carries the link's full status line. With the link off, the strip draws no dot
   and no Turn off (#2909). */
html[data-strip="true"] body > :not(.p3-strip, .p3-sr) { display: none; }
.p3-strip {
  position: fixed; inset: 0; box-sizing: border-box; display: flex; align-items: center; gap: var(--p3-space-100);
  padding: 0 var(--p3-space-100) 0 var(--p3-space-150); background: var(--p3-bar-bg); color: var(--p3-text);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-12);
}
.p3-strip[hidden] { display: none; }
.p3-strip-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p3-strip > .p3-btn { flex: none; }
.p3-strip > [hidden] { display: none; }

/* ── the levers panel (S2 on): sections as white cards on the gray panel (IA-2, V7) ────────── */
/* THE SETTINGS RHYTHM (#3337, the owner's Q3337.1 A): five named chrome tokens over the space scale, the values the Theme
   pages already used. Every list of settings is a grid at --p3-rhythm-row, so a row never takes its spacing from a margin
   on itself, and a new container of settings reads the name rather than skipping it.
     --p3-rhythm-label    a setting's name to its control at L2 (space-150; an L3 field label keeps space-050, TY2 A)
     --p3-rhythm-hint     a control to its hint or readout, and a note to its link (space-100)
     --p3-rhythm-row      one setting row to the next (space-300)
     --p3-rhythm-group    one group to the next (space-500), then its hairline and space-200 under it
     --p3-rhythm-section  one card to the next (space-200)
   test:chrome section 3337 measures row → row as drawn, against the emission's space.300, on every place. */
/* N-3 A, RX2 A (#1984): the region that holds a page's levers draws no box of its own. The read-only line above it is
   Build style guides' boxed note (`.p3-sg-note.p3-sg-warn`, unchanged); this places it on the panel's own inset. */
.p3-levers-region { display: contents; }
.p3-levers > .p3-levers-note { margin: var(--p3-space-300) var(--p3-space-300) 0; font-family: var(--p3-font-ui); }
.p3-levers-note:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-levers-body {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-rhythm-section); align-content: start;
  padding: var(--p3-space-300) var(--p3-space-300) var(--p3-space-500); color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);
}
.p3-intro { margin: 0 0 var(--p3-space-100); color: var(--p3-text-2); line-height: var(--p3-lh-cozy); }
.p3-lsec {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-rhythm-row); padding: var(--p3-space-300); border-radius: var(--p3-radius-xl);
