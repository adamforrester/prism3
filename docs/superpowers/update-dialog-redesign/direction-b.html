  background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-lsec[hidden], .p3-lever[hidden], .p3-levers-body [hidden] { display: none; }
/* #1975: the levers fit their pane at every width (the 42% column is 268px at 640). A grid with no columns of its own
   sizes its one column to its widest child's content, so each one in the panel takes the pane's width instead; a
   picker may shrink and cut its words (its label already ellipsizes). */
.p3-levers-body :is(.p3-fillrows, .p3-icols, .p3-icol, .p3-irow-group, .p3-irow-states, .p3-icon-pair, .p3-lsec-head, .p3-field, .p3-list) {
  grid-template-columns: minmax(0, 1fr);
}
/* Narrower than the 380 the panel is laid out for (the two panes at 640 and 800), a row's picker moves under its name
   rather than squeeze it, and a breakpoint's Remove under its field. `data-fit` is the pane's own width class
   (`LEVERS_SNUG_MAX` in `shell/frame.ts`), so this follows the column, not the window. */
/* In a snug pane the panel and its cards take space-200 at the sides, not space-300, so a pair of fields side by side
   (Brand's name and namespace, v5 answer 4) keeps a usable width. */
.p3-levers[data-fit="snug"] .p3-levers-body { padding-inline: var(--p3-space-200); }
.p3-levers[data-fit="snug"] .p3-lsec { padding: var(--p3-space-200); }
.p3-levers[data-fit="snug"] .p3-fillrow { grid-template-columns: auto minmax(0, 1fr); }
.p3-levers[data-fit="snug"] .p3-fillrow > :nth-child(n + 3) { grid-column: 1 / -1; justify-self: stretch; }
.p3-levers[data-fit="snug"] .p3-bprow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
.p3-levers[data-fit="snug"] .p3-bprow > :nth-child(n + 4) { grid-column: 2 / -1; }
/* The way on to the next page keeps to the pane as well: in a snug pane its words wrap rather than run past the edge
   (#2909: the plugin's 640 window is 580px beside the rail, so its levers column is 243px). */
.p3-levers[data-fit="snug"] .p3-btn.p3-next { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: left; padding-block: var(--p3-space-075); }
.p3-lsec-head { display: grid; gap: var(--p3-space-050); }
.p3-lsec-title { margin: 0; font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-tighter); line-height: var(--p3-lh-compact); }
.p3-lsec-desc { margin: 0; color: var(--p3-text-2); line-height: var(--p3-lh-cozy); }
/* One lever: 8px from its label to its control. */
.p3-lever { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-100); min-width: 0; margin: 0; padding: 0; border: 0; }
.p3-lever-head { display: flex; align-items: center; gap: var(--p3-space-050); width: 100%; padding: 0; float: none; }
/* ── the heading rule (TY2 A): three levels, every value an existing chrome variable ─────────────────
   L1 section title (.p3-lsec-title, above): fs-16 / fw-strong / lh-compact / ls-tighter (#2322); its description space-050
   under it (.p3-lsec-head's gap); its content space-300 after the head (.p3-lsec's gap).
   L2 group heading (a lever's name, .p3-rows-sub, .p3-icol-title, .p3-lgrid-name > b): fs-14 / fw-strong /
   lh-compact / ls-snugger (#2322); its content starts space-150 after it, whatever that content is.
   L3 field label (.p3-field-label, .p3-fill-label): fs-14 / fw-emphasis / lh-compact, primary ink; its control
   space-050 after it. Table headers are not a level (below). test:chrome section 29 measures all three. */
.p3-lever-name { font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
/* The head row is as tall as its line: the lever's gap (space-100) plus space-050 makes the L2's space-150. A group
   lever's head is a <legend>, which the fieldset's grid gap does not reach, so it carries the whole space-150. */
.p3-lever-head { padding-block-end: var(--p3-space-050); }
fieldset.p3-lever > legend.p3-lever-head { padding-block-end: var(--p3-rhythm-label); }
/* A lever inside a group (Color › Interactive's Neutral emphasis, inside Neutral) reads as a field: L3's weight, and its
   control space-050 after it (its head is a <legend>, so the legend's padding is the whole space). */
.p3-icol .p3-lever-name { font-weight: var(--p3-fw-emphasis); }
.p3-icol fieldset.p3-lever > legend.p3-lever-head { padding-block-end: var(--p3-space-050); }
/* A lever in a group that is no fieldset (a slider, in Components' Button options): its control space-050 after the head
   too, under the lever's own space-100 gap. */
.p3-icol div.p3-lever > .p3-lever-head { padding-block-end: 0; margin-block-end: calc(var(--p3-space-050) - var(--p3-space-100)); }
/* A lever's own one-line description belongs to its head: space-050 under the name, not space-150. */
.p3-lever-ctl > .p3-sub:first-child { margin-block-start: calc(-1 * var(--p3-space-100)); }
/* #3337 (Q3337.3 A): in a group, a div lever's control already starts space-050 under its head (the rule above it), so its
   description takes no second pull: three pulls stacked put a read-only row's note on its name. */
.p3-icol div.p3-lever > .p3-lever-ctl > .p3-sub:first-child { margin-block-start: 0; }
.p3-readout { margin-left: auto; color: var(--p3-text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* #1975: in a snug pane a long readout (Layout's container max, "1440px · 90rem") wraps under itself, set right. */
.p3-levers[data-fit="snug"] .p3-readout { white-space: normal; text-align: right; }
/* #3338: Button options is drawn in the preview's card, where no `data-fit` reaches, so a long readout (the Weights line,
   "subtle 300 · … · max 900") wraps under itself there too, set right, rather than running past the card's edge. */
.p3-cp-optsec .p3-readout { white-space: normal; text-align: right; }
.p3-lever-head .p3-readout, .p3-slider-head > .p3-readout { line-height: var(--p3-lh-compact); }
/* The ⓘ keeps its target (hit-min wide, at least; the narrow tier's buttons are ctl-h-xs tall) but overhangs the heading's
   line equally above and below, so it never sets the row's height at any tier: equal negative margins of a whole hit-min
   leave its margin box shorter than the line, and the head's center alignment keeps it centered on the line. (Not
   `1lh`: inside the button that is the button's own line height, not the heading's.) It sits space-050 after the
   heading text (the head's gap). */
.p3-btn-icon.p3-info { min-width: var(--p3-hit-min); min-height: var(--p3-hit-min); }
.p3-lever-head .p3-info { margin-block: calc(-1 * var(--p3-hit-min)); }
/* BG1 A, HP5 (heading pass 2): a lever named as its section says its name once, in the section's title row (`promoteLever`,
   `ui/lever-kit.ts`). Its ⓘ sits space-050 after the title (the row's gap); anything else its head held (Gradients' switch)
   sits at the row's far end. Both overhang the title's line as the lever head's ⓘ does, so the row is as tall as the title. */
.p3-lsec-titlerow { display: flex; align-items: center; gap: var(--p3-space-050); min-width: 0; }
.p3-lsec-end { display: inline-flex; align-items: center; gap: var(--p3-space-100); margin-inline-start: auto; }
:is(.p3-lsec-titlerow > .p3-info, .p3-lsec-end > *) { margin-block: calc(-1 * var(--p3-hit-min)); }
.p3-lever .p3-btn-ghost:where(:not(:disabled, [aria-disabled="true"])):hover, .p3-picker .p3-btn-ghost:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-edge); }
.p3-tip { margin: 0; padding: var(--p3-space-150) var(--p3-space-200); border-radius: var(--p3-radius-lg); background: var(--p3-fill-1); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-lever-ctl { display: grid; gap: var(--p3-rhythm-hint); min-width: 0; }
.p3-lever-state:empty { display: none; }
.p3-sub { margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-state { display: flex; gap: var(--p3-space-100); align-items: flex-start; margin: 0; font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-state-hint { color: var(--p3-text-2); }
.p3-state-warn .p3-ico { color: var(--p3-warn-icon); }
/* An engine refusal: the lever is ringed in the danger icon color and says why, in words. */
.p3-lever[data-refused="true"] { outline: var(--p3-bw-thick) solid var(--p3-bad-icon); outline-offset: var(--p3-space-150); border-radius: var(--p3-radius-lg); }
.p3-refmark { display: flex; gap: var(--p3-space-100); align-items: center; margin: 0; color: var(--p3-bad-text); font-size: var(--p3-fs-12); }
.p3-refmark .p3-ico { color: var(--p3-bad-icon); }
.p3-refmark[hidden] { display: none; }
/* A color field: the native picker, the hex as text, the OKLCH readout, inside one edge (B1). */
.p3-colorfield {
  display: flex; align-items: center; min-width: 0; min-height: var(--p3-ctl-h); padding-left: var(--p3-space-100);
  border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page);
}
.p3-colorfield:where(:not(:has(:disabled, [aria-disabled="true"]))):hover { border-color: var(--p3-field-edge-hover); }
.p3-color-input {
  flex: none; width: var(--p3-hit-min); height: var(--p3-hit-min); padding: 0; border: 0; border-radius: var(--p3-radius-md);
  background: none; cursor: pointer; appearance: none;
}
.p3-color-input::-webkit-color-swatch-wrapper { padding: 0; }
.p3-color-input::-webkit-color-swatch { border: 0; border-radius: var(--p3-radius-md); }
.p3-hex-input {
  flex: 1 1 0; width: 0; min-width: var(--p3-step-w); align-self: stretch; margin: var(--p3-space-050) 0; padding: 0 var(--p3-space-100);
  border: 0; border-radius: var(--p3-radius-md); background: transparent; color: var(--p3-text);
  font-family: var(--p3-font-mono); font-size: var(--p3-fs-14);
}
.p3-hex-input:not(.p3-name-input) { text-transform: uppercase; }
.p3-name-input { font-family: var(--p3-font-ui); }
.p3-colorfield-meta { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 var(--p3-space-150); color: var(--p3-text-2); font-size: var(--p3-fs-12); white-space: nowrap; }
:is(.p3-color-input, .p3-hex-input, .p3-range, .p3-step, .p3-addrow):focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
/* A slider: the native range, filled in the icon color, a full target's height. */
.p3-range { width: 100%; height: var(--p3-hit-min); margin: 0; accent-color: var(--p3-icon); cursor: pointer; }
/* A disabled range takes Prism3's disabled skin (F1 A's family, #2152): the shadow hue slider while the shadow has no hue
   to follow (#2184, owner Q58 B). The accent token is the owner's (Q72 A). */
.p3-range:disabled { accent-color: var(--p3-disabled-ink); cursor: not-allowed; }
.p3-choice { display: flex; flex-wrap: wrap; width: 100%; }
/* #1975: a choice whose options do not fit the levers column (Shape's Density at 640, Type's Scale) wraps onto a second
   row rather than run past the panel, as Interactive's and Components' did first at 380. Each option is never narrower
   than its label on one line while the row has room for it (`fit-content`), so the rows wrap where they did; one label
   longer than the whole row ("Strong (bold near-black/white)" at 640) wraps inside its option. */
.p3-choice > .p3-seg-tab { min-width: fit-content; white-space: normal; }
/* #3115: the selected option is bold, and an option is never narrower than its label, so a bold label wider than its
   regular one moved the wrap ("No hover fill" dropped a row when "Neutral overlay wash" was picked). Every option
   reserves its label's bold width: a copy of the label in the selected weight, hidden and no height, under the label
   in a column. The selection then never changes the layout. The copy has empty alternative text, so it is not read. */
.p3-choice > .p3-seg-tab[data-label] { flex-direction: column; }
.p3-choice > .p3-seg-tab[data-label]::after {
  content: attr(data-label); content: attr(data-label) / "";
  display: block; height: 0; overflow: hidden; visibility: hidden; font-weight: var(--p3-fw-emphasis);
}
.p3-list { display: grid; gap: var(--p3-space-100); }
/* L3: a field label over a list (Gradients' Stops) has its first row space-050 after it, as a control would. */
.p3-list > .p3-field-label { margin-block-end: calc(var(--p3-space-050) - var(--p3-space-100)); }
.p3-list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-100); align-items: center; }
.p3-list-row > .p3-btn-icon { min-height: var(--p3-ctl-h); min-width: var(--p3-ctl-h); }
/* The dashed add row (V7): a dashed edge that still clears 3:1 (B1). */
.p3-btn.p3-addrow { width: 100%; min-height: var(--p3-ctl-h); border: var(--p3-bw-hairline) dashed var(--p3-edge); background-color: transparent; }
.p3-btn.p3-addrow:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-advrow { display: grid; gap: var(--p3-space-200); justify-items: start; }
.p3-advbody { display: grid; gap: var(--p3-space-200); justify-self: stretch; }
.p3-nextrow { display: flex; }
.p3-btn.p3-btn-page:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
/* QA-I12: Continue, at the foot of every levers page, is a primary (filled) button, in Apply Theme's inverse fill. */
.p3-btn.p3-next { background-color: var(--p3-inv-bg); color: var(--p3-inv-text); border-color: var(--p3-inv-bg); }
.p3-btn.p3-next:where(:not(:disabled, [aria-disabled="true"])):hover { background-color: var(--p3-inv-bg-2); border-color: var(--p3-inv-bg-2); }
.p3-btn.p3-next .p3-ico { color: var(--p3-inv-text); }

/* ── Brand (S3): Identity, Personality, Modes ──────────────────────────────────────────────── */
/* v5 answer 4: Brand name and Token namespace side by side at every width, 380 included; the notes span both. */
.p3-idrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--p3-space-200); align-items: end; }
.p3-idnotes { display: grid; gap: var(--p3-space-100); }
.p3-idnotes-row { display: flex; }
/* A text field with its own edge (B1), a control's height and radius. */
.p3-text-input {
  width: 100%; min-width: 0; min-height: var(--p3-ctl-h); padding: 0 var(--p3-space-150);
  border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-edge); background: var(--p3-bg-page);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14);
}
.p3-text-input.p3-value { font-family: var(--p3-font-mono); }
/* No hover on a disabled field: it cannot be edited, so nothing answers the pointer (owner, 2026-10-05; Q28 a). */
.p3-text-input:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-text-input:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
/* A text field that cannot change (Layout's first breakpoint, D13; any field a derived mode locks) takes Prism3's own
   disabled text field skin, exactly: the fill, the edge and the on-fill ink its text field definition binds (owner
   decision F1 A, 2026-10-05). Contrast-exempt as an inactive component (WCAG 2.2 SC 1.4.3, 1.4.11); test:chrome
   exempts it only while it is really disabled, and holds it to these three roles. */
.p3-text-input:disabled {
  background: var(--p3-disabled-fill); border-color: var(--p3-disabled-edge); color: var(--p3-disabled-ink); cursor: not-allowed;
}
/* Personality: the engine's words as chips; a chosen one takes the selected edge and shows its check. A single-select
   `chipChoice` chip draws no check (#3117, Q3117.1 B): its edge alone shows it is pressed, so a pick keeps its width. */
.p3-chips { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); }
.p3-btn.p3-chip { min-height: var(--p3-ctl-h-xs); padding: 0 var(--p3-space-150); gap: var(--p3-space-050); font-weight: var(--p3-fw-default); }
.p3-btn.p3-chip > .p3-ico { display: none; }
.p3-btn.p3-chip[aria-pressed="true"] { border-color: var(--p3-ctl-edge); }
.p3-btn.p3-chip[aria-pressed="true"] > .p3-ico { display: inline-block; color: var(--p3-text); }
/* Modes: a check per mode, its name and its note on one line (concept v6). The row is the control and its
   target; the box is the drawn edge (field-edge on the page, B1), so the row itself shows an edge only on hover.
   Light is a fixed row, not a control: its box is dashed, as v6 draws a check that cannot change. */
.p3-checks { display: grid; gap: var(--p3-space-025); }
.p3-check { display: flex; align-items: center; gap: var(--p3-space-150); min-height: var(--p3-ctl-h-xs); padding: var(--p3-space-050) var(--p3-space-100); border: var(--p3-bw-hairline) solid transparent; border-radius: var(--p3-radius-lg); }
.p3-btn.p3-check { justify-content: flex-start; width: 100%; border-color: transparent; background-color: transparent; white-space: normal; text-align: left; font-weight: var(--p3-fw-default); }
.p3-btn.p3-check:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-check-box {
  display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--p3-space-200); height: var(--p3-space-200);
  border: var(--p3-bw-hairline) solid var(--p3-field-edge); border-radius: var(--p3-radius-md); background: var(--p3-bg-page);
}
.p3-check-box > .p3-ico { display: none; }
.p3-check[aria-checked="true"] .p3-check-box { background: var(--p3-text); border-color: var(--p3-text); }
.p3-check[aria-checked="true"] .p3-check-box > .p3-ico { display: block; color: var(--p3-bg-page); }
/* The always-on Light row (Brand › Modes, `.p3-check-fixed`) is a fixed fact, not a control: its mark always shows,
   and its box takes the locked mode check's disabled check box below (owner decision DB1 A, #2208). */
.p3-check-fixed .p3-check-box > .p3-ico { display: block; }
.p3-check-text { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--p3-space-075); min-width: 0; }
.p3-check-name { color: var(--p3-text); }
.p3-check-note { color: var(--p3-text-2); font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
/* Custom modes: name, base, remove, wrapping at the narrow widths. */
.p3-cmrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); }
.p3-cmrow > .p3-text-input { flex: 1 1 var(--p3-step-w); width: auto; }
.p3-cmrow > .p3-selwrap { flex: 1 1 var(--p3-step-w); }
.p3-cm-based { color: var(--p3-text-2); font-size: var(--p3-fs-12); }
/* QA-R1: Add custom mode is the full-width dashed add row; its note sits under it, as Interactive's add form does. */
.p3-cmadd { display: grid; gap: var(--p3-space-100); }
/* A confirm drawn in place (concept v6's confirm dialog): the dialog's edge on the page ground. */
.p3-confirm {
  display: grid; gap: var(--p3-space-150); padding: var(--p3-space-200); border-radius: var(--p3-radius-xl);
  border: var(--p3-bw-hairline) solid var(--p3-line-2); background: var(--p3-bg-page); line-height: var(--p3-lh-cozy);
}
.p3-confirm-title { margin: 0; font-weight: var(--p3-fw-strong); }
.p3-confirm-line { margin: 0; }
.p3-confirm-list { display: grid; gap: var(--p3-space-050); margin: 0; padding-left: var(--p3-space-300); font-size: var(--p3-fs-12); }
.p3-confirm-row { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); }

/* ── the Palettes preview (S2, V7): a container per group, large squares, labels under them ───── */
.p3-preview-stack { padding: var(--p3-space-400); gap: var(--p3-space-300); }
.p3-frame[data-w="narrow"] .p3-preview-stack { padding: var(--p3-space-150); }
/* The Components page (#2700, the owner's approved wireframe): the list of sets in the levers pane, a row per family or
   set, a box that selects and a name that focuses, families folding as Build style guides' groups do; the action bar at
   the foot of the pane, sticky as Draw's is (idea 9 A), in the chrome's own ground and edge (no shadow, T5). The shown
   family's settings open under its row at every width (#2815 step 1). */
.p3-cp { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-200); align-content: start; }
.p3-cp-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-300); min-width: 0; }
/* TY2 A: an L1 section title has space-300 after it, so the title's last line is the head's bottom. */
.p3-cp-sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-300); min-width: 0; }
/* #2909 Q2909.17 A: a tier holds its sections, after its caption: a small secondary line with a hairline under it, not a
   heading (the list's three levels are its sections, their settings and those settings' levers, TY2 A). */
.p3-cp-tier { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-300); min-width: 0; }
/* #3129 R1: the caption's line, the hairline under it, holds the caption and, right-aligned, its Select all and
   Deselect all; R2 draws the shared settings' tier the same way. */
.p3-cp-tier-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 var(--p3-space-100);
  padding-bottom: var(--p3-space-050); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.p3-cp-tier-cap {
  margin: 0; min-width: 0; color: var(--p3-text-2);
  font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-normal);
}
.p3-cp-tier-acts { display: inline-flex; flex-wrap: wrap; gap: var(--p3-space-050); margin-left: auto; }
.p3-btn.p3-cp-tier-act { min-height: var(--p3-ctl-h-xs); padding-inline: var(--p3-space-075); font-size: var(--p3-fs-12); }
/* A grid, so the title takes what the box and Build all leave and wraps inside itself at any pane width (#1975: the

.p3-cp-title { min-width: 0; overflow-wrap: anywhere; }
.p3-cp-count { color: var(--p3-text-2); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-default); letter-spacing: normal; }

.p3-cp-rows, .p3-cp-sub { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-space-025); margin: 0; padding: 0; list-style: none; }

.p3-btn.p3-check.p3-cp-check { flex: none; width: var(--p3-ctl-h-xs); min-width: var(--p3-ctl-h-xs); min-height: var(--p3-ctl-h-xs); padding: 0; justify-content: center; }
.p3-cp-nobox, .p3-cp-fold-space { flex: none; width: var(--p3-ctl-h-xs); }

.p3-bopts { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--p3-rhythm-row); min-width: 0; }
.p3-btn.p3-cp-name { flex: 0 1 auto; min-width: 0; justify-content: flex-start; padding-inline: var(--p3-space-075); font-weight: var(--p3-fw-default); }

.p3-cp-bar {

  border: var(--p3-bw-hairline) solid var(--p3-edge); border-radius: var(--p3-radius-xl); background: var(--p3-bg-page); font-family: var(--p3-font-ui);

/* The counts keep one line (owner, on #2812): at 380 the line moves under the button whole rather than wrapping. */
.p3-cp-sum { min-width: 0; color: var(--p3-text-2); white-space: nowrap; }

.p3-cp-dhead { display: grid; gap: var(--p3-space-025); padding: 0 var(--p3-space-050) var(--p3-space-200); }

.p3-cp-dhead .p3-sub { margin: 0; }
/* A family's settings, under its row in the list (#2815 step 1): Button options, in the chrome's inks. A `.p3-icol` group
   (its L2 title, its L3 lever names, its gaps), drawn as a card on the levers gray rather than with the group's rule. */
.p3-icol.p3-cp-optsec { padding: var(--p3-space-300); margin-block: var(--p3-space-100) var(--p3-space-200); border: var(--p3-bw-hairline) solid var(--p3-edge); border-radius: var(--p3-radius-xl); background: var(--p3-levers-bg); font-family: var(--p3-font-ui); }

/* L2: the description starts space-150 under the title, and the levers space-150 under it (the head's pull-up). */
.p3-cp-optsec > .p3-icol-head { row-gap: var(--p3-space-150); }
.p3-cp-opt-desc { flex-basis: 100%; }
.p3-board-desc { flex-basis: 100%; margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-14); line-height: var(--p3-lh-cozy); }
.p3-board-body { display: grid; gap: var(--p3-space-300); }
.p3-pal { display: grid; gap: var(--p3-space-200); min-width: 0; contain: layout paint; }
.p3-pal + .p3-pal { padding-top: var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-palh { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--p3-space-200); align-items: center; }
.p3-hero {
  display: block; width: var(--p3-hero-sw); height: var(--p3-hero-sw); border-radius: var(--p3-radius-lg);
  outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline));
}

.p3-palh-name { display: grid; gap: var(--p3-space-075); min-width: 0; }
.p3-pal-title { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-tighter); line-height: var(--p3-lh-compact); }
.p3-palh-meta { display: flex; flex-wrap: wrap; gap: var(--p3-space-075) var(--p3-space-100); align-items: center; }

.p3-tokchip {
  display: inline-flex; align-items: center; min-height: var(--p3-space-300); padding: 0 var(--p3-space-100);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-md);

.p3-rolechip {
  display: inline-flex; align-items: center; gap: var(--p3-space-075); min-height: var(--p3-space-300); padding: 0 var(--p3-space-100);

.p3-eyebrow { font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); color: var(--p3-text-2); text-transform: uppercase; letter-spacing: var(--p3-ls-wide); }

  display: inline-flex; align-items: center; min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150); border-radius: var(--p3-radius-lg);

.p3-ancmark { display: inline-block; flex: none; width: var(--p3-dot); height: var(--p3-dot); margin-right: var(--p3-space-075); background: var(--p3-text); transform: rotate(45deg); }
.p3-sqk-step .p3-ancmark { margin-right: var(--p3-space-050); }
.p3-sqrow { display: grid; gap: var(--p3-space-100); }

  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border-radius: var(--p3-radius-lg); overflow: hidden;

.p3-sqk { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-compact); }
.p3-sqk-item { display: grid; gap: var(--p3-space-025); padding: 0 var(--p3-space-050); min-width: 0; overflow: hidden; }
.p3-sqk-step { font-weight: var(--p3-fw-emphasis); }
.p3-sqk-item[data-anchor="true"] .p3-sqk-step { font-weight: var(--p3-fw-strong); }
.p3-sqk-hex { color: var(--p3-text-2); overflow: hidden; text-overflow: ellipsis; }
[data-per="5"] :is(.p3-sqs, .p3-sqk) { grid-template-columns: repeat(5, minmax(0, 1fr)); }
[data-per="5"] .p3-palh { grid-template-columns: auto minmax(0, 1fr); }
[data-per="5"] .p3-palh-anchor { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; align-items: center; justify-content: start; }
.p3-checker { background: repeating-conic-gradient(var(--p3-fill-2) 0% 25%, var(--p3-bg-page) 0% 50%) 0 0 / var(--p3-space-150) var(--p3-space-150); }
.p3-sr { position: absolute; width: var(--p3-bw-hairline); height: var(--p3-bw-hairline); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* #2212: the frame's hidden h1 takes no browser margin and is set in the chrome's own face at its default size and weight,
   not the page's system stack or the browser's bold heading (test:chrome's font audit reads every chrome text node). */

   drawer is drawn), and takes the chrome face itself rather than inheriting it (S11). */
.p3-live { margin: 0; color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-12); }

/* ── the step picker (V9, ui/step-picker.ts; first mounted in S4) ───────────────────────────── */
.p3-picker {
  display: grid; gap: var(--p3-space-150); padding: var(--p3-space-200); border-radius: var(--p3-radius-xl); background: var(--p3-fill-1);
  color: var(--p3-text); font-family: var(--p3-font-ui); font-size: var(--p3-fs-14); line-height: var(--p3-lh-normal);

.p3-picker-mode { color: var(--p3-text); }

.p3-picker-pal-name { font-weight: var(--p3-fw-emphasis); }
.p3-picker-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-step-w), 1fr)); gap: var(--p3-space-100); }
.p3-step {
  display: grid; gap: var(--p3-space-050); padding: var(--p3-space-075); border: var(--p3-bw-hairline) solid var(--p3-field-edge);
  border-radius: var(--p3-radius-lg); background: var(--p3-bg-page); color: var(--p3-text); cursor: pointer; text-align: left;
  font-family: var(--p3-font-mono); font-size: var(--p3-fs-12);

.p3-step:where(:not(:disabled, [aria-disabled="true"])):hover { border-color: var(--p3-field-edge-hover); }
.p3-step[aria-pressed="true"] { border: var(--p3-bw-thick) solid var(--p3-ctl-edge); padding: calc(var(--p3-space-075) - var(--p3-bw-hairline)); font-weight: var(--p3-fw-emphasis); }
.p3-step-chip { display: block; height: var(--p3-space-300); border-radius: var(--p3-radius-md); }
.p3-step-key, .p3-step-ratio { display: flex; align-items: center; gap: var(--p3-space-050); }
.p3-step-ratio { color: var(--p3-text-2); }
.p3-step[data-below="true"] .p3-step-ratio { color: var(--p3-bad-text); }
.p3-step[data-below="true"] .p3-step-ratio .p3-ico { color: var(--p3-bad-icon); }

.p3-step[aria-disabled="true"] .p3-step-chip { opacity: .4; }
/* A text-link row's contrast in every mode and the steps its states follow (#2990). */
.p3-linkmodes { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.p3-linkmodes-title { flex-basis: 100%; font-weight: var(--p3-fw-emphasis); }
.p3-linkmode { display: inline-flex; gap: var(--p3-space-050); align-items: center; }
.p3-linkmode-ratio { display: inline-flex; align-items: center; gap: var(--p3-space-050); font-family: var(--p3-font-mono); color: var(--p3-text); }
.p3-linkmode[data-below="true"] .p3-linkmode-ratio { color: var(--p3-bad-text); }
.p3-linkmode[data-below="true"] .p3-ico { color: var(--p3-bad-icon); }
.p3-linkfollow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100); margin: 0; font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.p3-linkfollow-step { display: inline-flex; align-items: center; gap: var(--p3-space-050); font-family: var(--p3-font-mono); }
.p3-linkfollow-sw { display: block; flex: none; width: var(--p3-space-200); height: var(--p3-space-200); border-radius: var(--p3-radius-md); outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline)); }

/* ── Color › Surfaces & fills (S4a): labeled fields, the fill rows, the gradient editor ──────────── */
/* One set of surface controls, for the previewed mode (S4c, owner decision Q22: no Light and Dark groups). */
.p3-modegroup { display: grid; gap: var(--p3-space-150); }

.p3-modegroup .p3-fieldgrid { align-items: end; }
/* QA-B8: rows stand spacing 300 apart, in every row list (fields, fill rows, Interactive's sets, Type's families). */

.p3-field { display: grid; gap: var(--p3-space-050); min-width: 0; align-content: start; }
.p3-field-wide { grid-column: 1 / -1; }
.p3-field-label { color: var(--p3-text); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-compact); }
/* Table headers name cells, not fields: they are not a heading level, and keep the secondary 12px label. */
:is(.p3-facehead, .p3-tsizes-head, .p3-wmatrix-head, .p3-tnudge-head) .p3-field-label { color: var(--p3-text-2); font-size: var(--p3-fs-12); }
/* Depth & motion (S9.2): a slider's name with its readout on one line; a per-mode control's Auto line or its Return to
   Auto, one shown; a curve drawn in a value picker row (D10), stroked in the row's ink. */
.p3-slider-head { display: flex; align-items: baseline; gap: var(--p3-space-100); }
.p3-autorow { display: flex; align-items: center; flex-wrap: wrap; gap: var(--p3-space-100); }
.p3-autorow > [hidden] { display: none; }
.p3-curve { display: block; width: var(--p3-ctl-h); height: var(--p3-ctl-h); }
.p3-fieldpair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--p3-space-100); }
.p3-fillrows { display: grid; gap: var(--p3-space-300); }
.p3-fillrows[hidden], .p3-fillrow-wrap[hidden] { display: none; }
.p3-fillrow-wrap { display: grid; gap: var(--p3-space-100); }
.p3-fillrow-wrap[data-refused="true"] { outline: var(--p3-bw-thick) solid var(--p3-bad-icon); outline-offset: var(--p3-space-075); border-radius: var(--p3-radius-lg); }
.p3-fillrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--p3-space-200); align-items: center; }
/* QA-B11: the swatch is as tall as the label and its token (40), and the row's spacing is one step up (150 → 200). */
.p3-fill-sw {
  display: block; flex: none; width: var(--p3-swatch-h); height: var(--p3-swatch-h); border-radius: var(--p3-radius-md);
  outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline));
}
.p3-fill-name { display: grid; gap: var(--p3-space-025); min-width: 0; }
.p3-fill-label { font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); line-height: var(--p3-lh-compact); }
.p3-fill-tok { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--p3-text-2); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); }
/* #3553 M3 A: a token that wraps at its dots (`tokenLabel`'s `wrap`, a `<wbr>` after each), so the part that tells
   rows apart is never the part cut: the easing roles all ellipsized to "motion.easing-ro…" at the plugin's 380. */
.p3-fill-tok.p3-fill-tok-wrap { overflow: visible; white-space: normal; }
/* #2217 (heading pass 2): a label stacked over its control, with nothing on its right, puts its token flush right on the
   label's own line, and the token wraps under the label when the two do not fit; at the narrow tier it always does. */
.p3-fill-name.p3-fill-name-online { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--p3-space-200); row-gap: var(--p3-space-025); }
.p3-fill-name-online > .p3-fill-tok { margin-inline-start: auto; }
.p3-frame[data-w="narrow"] .p3-fill-name.p3-fill-name-online { display: grid; }
.p3-frame[data-w="narrow"] .p3-fill-name-online > .p3-fill-tok { margin-inline-start: 0; }
.p3-btn.p3-pick { min-width: 0; min-height: var(--p3-ctl-h); gap: var(--p3-space-100); justify-content: flex-start; padding: 0 var(--p3-space-150) 0 var(--p3-space-200); }

.p3-btn.p3-pick > .p3-btn-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
/* QA-B5, QA-B18: every select and step-picker button in the levers pane is one control: the field's height (40),
   12px text set from the left, and the caret at the far right (the select's sits where the button's does). */
.p3-levers :is(.p3-select, .p3-btn.p3-pick) { min-height: var(--p3-ctl-h); font-size: var(--p3-fs-12); text-align: left; }
/* A read-only row's value in place of the picker: the scrim's primitive and opacity (S4c). */

.p3-pick-ratio { display: inline-flex; align-items: center; gap: var(--p3-space-025); color: var(--p3-text-2); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); }
.p3-pick-ratio[data-below="true"] { color: var(--p3-bad-text); }
.p3-pick-ratio[data-below="true"] .p3-ico { color: var(--p3-bad-icon); }
.p3-btn.p3-pick[aria-expanded="true"] { border-color: var(--p3-ctl-edge); }
/* S4f (QA-B15, QA-B16): the gradients list. Each gradient is set apart from the next by its divider with a step

.p3-glist { display: grid; }
.p3-gedit { display: grid; gap: var(--p3-space-150); padding-block: var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-gadd { padding-top: var(--p3-space-400); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-gbar { height: var(--p3-gbar-h); border-radius: var(--p3-radius-lg); outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline)); }
.p3-gstop { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, var(--p3-step-w)) auto; gap: var(--p3-space-100); align-items: center; }
.p3-gstop > .p3-btn-icon { min-height: var(--p3-ctl-h); min-width: var(--p3-ctl-h); }
.p3-num-input { min-width: 0; }
/* #3106: an added glass fill. Its head is the shipped glass's row (the swatch, the name over its token, as tall as the
   swatch) with the small remove button on the right, as a gradient's; its color and opacity sit on one line under the
   name, starting where the name starts. Its own grid, not .p3-fillrow, so a snug pane keeps the remove button beside
   the name instead of stretching it under the row. */
.p3-glassrow { display: grid; gap: var(--p3-space-100); }
.p3-glasshead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--p3-space-200); align-items: center; }
.p3-glasshead > .p3-btn-icon { min-height: var(--p3-ctl-h); min-width: var(--p3-ctl-h); }
.p3-glassctl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-100); align-items: center; padding-inline-start: calc(var(--p3-swatch-h) + var(--p3-space-200)); }
.p3-glassctl .p3-num-input { flex: none; width: var(--p3-step-w); }

   its % (its name still says percent). */
.p3-levers[data-fit="snug"] .p3-glassctl { padding-inline-start: 0; }
.p3-levers[data-fit="snug"] .p3-glassctl .p3-colorfield-meta { display: none; }
/* #3553 M4 A: every snug color field drops its OKLCH readout, as the glass control does: at the plugin's 380 it was cut to
   "OKLCH 0.471 0.300…". A percent field's unit (`.p3-numfield`) stays. */
.p3-levers[data-fit="snug"] .p3-colorfield:not(.p3-numfield) .p3-colorfield-meta { display: none; }
/* #3106 (Q827 A): the name of the glass fill being added, its Add and Cancel, the token it makes, and why it can't be used. */
.p3-glassdraft { display: grid; gap: var(--p3-space-050); }
.p3-glassdraft-btns { display: flex; gap: var(--p3-space-100); }
.p3-glassdraft-btns > .p3-btn { min-height: var(--p3-ctl-h); }
.p3-glassdraft-btns > .p3-btn-icon { min-width: var(--p3-ctl-h); }
/* S4d: a group's sub-heading inside a section's rows (the preview's "Inverse"), the Icon section's pairing note,
   and the jump links to each section (Q49). Color › Interactive's jump links (S5.2) take these same rules, once,
   so the two pages draw one control. */
.p3-rows-sub { margin: var(--p3-space-150) 0 0; padding-top: var(--p3-space-150); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
.p3-rows-sub[hidden], .p3-icon-pair[hidden] { display: none; }
.p3-icon-pair { display: grid; gap: var(--p3-space-100); justify-items: start; }
.p3-icon-pair-note { margin: 0; line-height: var(--p3-lh-cozy); }
/* S4f: the Background fills sub-headings (QA-B7) at the rows' sub-heading size; the first opens the block, so it
   takes no divider. The contrast floor row's name and its info button share a line (QA-B6). */
.p3-rows-sub.p3-rows-sub-first { margin-top: 0; padding-top: 0; border-top: none; }
/* #3366: under the contrast floor's row, what it checks: the line, a list of its groups each with a sample's swatch,
   and what it does not check. The list's rhythm is Health's mode list (`.p3-health-modes`). */
.p3-floor-what { display: grid; gap: var(--p3-space-150); }
.p3-floor-groups { display: grid; gap: var(--p3-space-100); margin: 0; padding: 0; list-style: none; font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); }
.p3-floor-group { display: flex; align-items: center; gap: var(--p3-space-100); }
.p3-floor-sw {
  flex: none; width: var(--p3-icon-xs); height: var(--p3-icon-xs); border-radius: var(--p3-radius-md);
  outline: var(--p3-bw-hairline) solid var(--p3-line-1); outline-offset: calc(-1 * var(--p3-bw-hairline));
}
/* L2: a group heading inside a row list (whose gap is space-300) pulls its first row up to space-150. */
.p3-fillrows > .p3-rows-sub { margin-block-end: calc(var(--p3-space-150) - var(--p3-space-300)); }
/* A6 (owner, 2026-10-03): the scrim's wash fills its swatch, over the swatch's checkerboard (`.p3-checker`). */
.p3-scrim-wash { display: block; width: 100%; height: 100%; border-radius: inherit; }
/* The preview's scrim card: the same checkerboard under the wash, the card's size and corners kept. */
.p3-legacy-card .sg-scrimcard.p3-checker { background-size: var(--p3-space-150) var(--p3-space-150); }
.p3-fill-nameline { display: flex; align-items: center; gap: var(--p3-space-050); min-width: 0; }
.p3-jump { display: flex; flex-wrap: wrap; gap: var(--p3-space-100) var(--p3-space-200); }
.p3-jump[hidden] { display: none; }
.p3-jump-label { display: inline-flex; align-items: center; min-height: var(--p3-hit-min); }   /* QA-B17: "Jump to:", on the links' line */
.p3-jump-link { display: inline-flex; align-items: center; min-height: var(--p3-hit-min); color: var(--p3-text); font-weight: var(--p3-fw-emphasis); text-decoration: underline; text-underline-offset: var(--p3-space-025); }
.p3-jump-link:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); border-radius: var(--p3-radius-md); }
.p3-lsec:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); border-radius: var(--p3-radius-md); }

/* Values and code in the chrome are set in the chrome's monospace face. */
.p3-value { font-family: var(--p3-font-mono); }

/* ── Color › Interactive (S5.2): the column groups, rows grouped under their rest row (its jump links are above) ── */
/* S5.3 (the owner's QA-I7): more room between button sets, one step up the spacing scale from S5.2's. */
.p3-icols { display: grid; gap: var(--p3-rhythm-group); }
.p3-icol { display: grid; gap: var(--p3-rhythm-row); padding-top: var(--p3-space-200); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-icol[hidden], .p3-irow-group[hidden], .p3-icol-add[hidden] { display: none; }
.p3-icol:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); border-radius: var(--p3-radius-md); }
.p3-icol-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--p3-space-100); }
.p3-icol-title { margin: 0; font-size: var(--p3-fs-14); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snugger); line-height: var(--p3-lh-compact); }
/* L2: the group's first row starts space-150 after its heading row (the group's gap is space-300). */
.p3-icol-head { margin-block-end: calc(var(--p3-space-150) - var(--p3-space-300)); }
.p3-irow-group { display: grid; gap: var(--p3-rhythm-row); }
.p3-irow-states { display: grid; gap: var(--p3-rhythm-row); padding-left: var(--p3-space-300); border-left: var(--p3-bw-hairline) dashed var(--p3-line-1); }
/* #3335 (the owner's Q3335.1 A and Q3335.7 A, with the amendment): each button set is a card of its own, its title on one
   line with its palette and, for an accent, Remove; its state groups below on the group rhythm, the first without the
   hairline the card's own edge already draws. A group with no rest row (a wash, or Solid fill's pickers) is `.p3-irow-flat`:
   its Hover and Pressed are its own rows, side by side at its level, with no states column to indent them. */
.p3-icard:focus-visible { outline: var(--p3-focus-width) solid var(--p3-focus-ring); outline-offset: var(--p3-focus-offset); }
.p3-icard-line { display: flex; align-items: center; gap: var(--p3-space-100); }
.p3-icard-pal { color: var(--p3-text-2); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-default); letter-spacing: normal; }
/* An accent's Remove overhangs the title's line, so the row stays as tall as the title (TY2 A). */
.p3-icard-line > .p3-btn { margin-block: calc(-1 * var(--p3-space-100)); }
.p3-icard > .p3-icols > .p3-icol:first-child { padding-top: 0; border-top: 0; }
.p3-irow-states:empty { display: none; }
.p3-pick-read { color: var(--p3-text-2); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); white-space: nowrap; }
/* The add row (S5.3, QA-I4): set apart from the last button set by more than the sets are from each other; the
   dashed Add button set, then the color select with the add and Cancel once it is clicked. */
.p3-icol-add { display: grid; gap: var(--p3-space-100); margin-top: var(--p3-space-200); }
.p3-icol-addform { display: grid; gap: var(--p3-space-050); }
.p3-icol-addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--p3-space-100); align-items: center; }
/* The link state selects (S5.3, QA-I9): one to a line, the panel's full width, so no option label is cut. */
.p3-fieldgrid.p3-irungs { grid-template-columns: minmax(0, 1fr); }
/* Q24: a Color preview's section container on the levers panel's gray. The section keeps `styles.css`'s
   edge, radius and padding; only its ground moves, and its specimens stay on the brand's page. */
.p3-legacy-card .p3-sgsec { background: var(--p3-levers-bg); }
/* The Interactive preview (S5.3). QA-I1: a treatment label's foot line (its token and ratio badge) wraps inside the
   label column instead of running under the buttons beside it. QA-I2: a ratio badge's mark takes the chrome's
   status icon colors, a pass in the success icon and a miss in the danger icon; the badge keeps its own ink and
   edge. The preview stamps each mark with the chrome theme whose icon color contrasts most with the ground it is
   drawn on. A mark it does not stamp (no theme reaches 3:1 there, as on a mid-gray page) keeps the badge's ink. */
.p3-ipv .sg-tlab { min-width: 0; }
.p3-ipv .sg-foothint { flex-wrap: wrap; max-width: 100%; }
/* The marks' colors are the shared `.p3-marks` rule (S4f), which the card also carries. */

/* ── Type (S6.2): the library, Add face with its type-ahead, the face for each text type ──────────── */
.p3-facehead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-150); }
.p3-facerow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--p3-space-150); align-items: center; }
.p3-face-stat { color: var(--p3-text-2); font-size: var(--p3-fs-12); white-space: nowrap; }
.p3-face-stat[data-bad="true"] { color: var(--p3-bad-text); }
.p3-facerow > .p3-btn-icon { min-height: var(--p3-ctl-h); min-width: var(--p3-ctl-h); }
.p3-faceadd { display: grid; gap: var(--p3-space-100); }
.p3-faceadd-row, .p3-famrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-100); align-items: center; }
.p3-famrow > .p3-selwrap:only-child { grid-column: 1 / -1; }
/* ── Type (S6.3): Individual sizes, the weights matrix, the italic chips, the pins, line height and letter spacing,
   and the value picker's list (ui/value-picker.ts) ─────────────────────────────────────────────────── */
/* TS1 A (#2216): Type scale's pinned count sits space-050 under the control (the control's gap less space-050); each
   warning is a group holding its own action, space-100 inside, space-150 after the line or group before it. */
.p3-tscale-pins { margin-block-start: calc(-1 * var(--p3-space-050)); }
.p3-tscale-group { display: grid; gap: var(--p3-space-100); justify-items: start; }
:is(.p3-tscale-pins, .p3-tscale-group) + .p3-tscale-group { margin-block-start: var(--p3-space-050); }
.p3-tsizes { display: grid; gap: var(--p3-space-100); padding-top: var(--p3-space-150); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.p3-tsizes-head, .p3-tsizes-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--p3-space-150); align-items: center; }
.p3-tsizes-row[data-off="true"] .p3-fill-label { color: var(--p3-text-2); }
