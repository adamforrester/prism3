rray, not wired here."},row2:{kind:"nest",nests:"checkbox-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"A second Checkbox.Row \u2014 one of the representative stack (the variable row count is not modeled yet). Same nest configuration as the first, including the group-width fill."},row3:{kind:"nest",nests:"checkbox-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"A third Checkbox.Row \u2014 completing the representative stack. In code the stack is `children`: any number of Checkbox.Row; the three fixed nests stand in for that count in the projection. Fills the group's width like its siblings."}},codeOnly:["value / onChange \u2014 the GROUP owns the checked-value ARRAY and the change callback (`value: string[]`), and each row's checked appearance is DERIVED from it (`checked = value.includes(row.value)`), never wired on a row inside the group. Figma has no data model, so the projected rows show a fixed default selection; the array and its wiring are the code projection's. This is the contract the brief (\xA72) puts on the group and a single `checkbox-row` structurally cannot express.",'error / validation \u2014 GROUP-LEVEL and [HELD]. The brief says the group owns validation and carries the error message ("Select at least one option", SC 3.3.3), with the individual rows staying neutral. Prism 2\'s spec settles no error visual for the group (no error state, no group field-message), so this def deliberately does NOT invent one: whether the group composes a nested `field-message` for the error, and what an errored group looks like, is held for owner decision. `required` IS carried (via the nested FieldLabel and aria-required); error is not.',"select-all \u2014 [HELD], and absent by design. A select-all is a parent checkbox in the `indeterminate` state broadcasting partial selection, and it is expressible from the existing parts (a `checkbox-row` at `indeterminate` above the set). Prism 2's group has none, so reproducing Prism 2 means not adding one; its absence is confirmed rather than an oversight.","variable row count \u2014 [HELD]. Prism 2 models a 2-to-6-row group with six fixed rows plus five node-visibility booleans (rows 2-6, defaulting on). In code the count is simply `children: CheckboxRow[]` of any length. This def represents the stack with three fixed row nests rather than porting the six-rows-with-booleans mechanism (which would be the corpus's first boolean-toggled `nest`); the count and the boolean model are held for owner confirmation.","orientation \u2014 [HELD]. The brief's \xA715 names a group `orientation` (vertical / horizontal); Prism 2 is vertical only. Vertical scans better and lets long labels wrap, so it is the built default and horizontal is not invented here \u2014 a horizontal axis is held rather than guessed at.","the disabled dim \u2014 a disabled GROUP dims every row and the label, driven by the group's context (the CSS cascade / a data-attribute), not by a prop on each row. It is [HELD] out of the Figma projection (Prism 2 shows no group disabled treatment), so a designer sees the rest configuration and a code consumer gets the dim from the group.",'the id / describedby WIRING and role="group" \u2014 the host generates ids, ties the FieldLabel to the group via aria-labelledby, and stitches any group message into aria-describedby. Figma has no accessibility tree and no node-to-node reference, so the nested label sits above the rows and is associated by proximity alone (the ceiling field-label already hits).',"RTL \u2014 the group mirrors through logical properties: the label aligns to the reading start and each row mirrors its control to that side (brief \xA79). Figma members are drawn left to right.","text expansion \u2014 the group label and the row labels expand like any string (150-200% in German or Russian, brief \xA79); the rows wrap and keep their controls on the first line, and the vertical stack absorbs the extra lines. The Figma members carry the English placeholder only."]},figmaProperties:{variantAxes:["size"],booleans:{}},accessibility:{role:'group (role="group" on the container, or a native <fieldset>) with aria-labelledby pointing at the FieldLabel; each row is a native <input type="checkbox">',wcag:['1.3.1 Info and Relationships (the group structure \u2014 role="group" + the shared label \u2014 is the meaning)',"3.3.2 Labels or Instructions (the group label, announced once for the set)","3.3.1 Error Identification / 3.3.3 Error Suggestion \u2014 the intent, at the GROUP level and announced once. The group error display is not designed yet, so this def does not meet either today.","4.1.2 Name Role Value (the group name via aria-labelledby; each row carries its own checked / mixed)","2.4.13 Focus Appearance / 1.4.11 Non-text Contrast (the control boundary and focus indicator, on each row)","2.5.8 Target Size (each row is its own target \u2014 the group does not change that)","3.3.7 Redundant Entry (repeated consents across a form)"],keyboard:"Each checkbox row is its OWN Tab stop and Space toggles it \u2014 the same model as a standalone Checkbox.Row, and the key difference from Radio.Group (one Tab stop, arrows within). The group adds no roving tabindex and no arrow navigation; it is a labeled container, not a single composite widget. NEVER override Enter (it submits the enclosing form).",focus:"Focus lands on each row's control in turn; the group container is not itself focusable. On a validation error, move focus to the first invalid group (its label / first row) and announce the group-level message.",aria:'Prefer role="group" on a div plus aria-labelledby over <fieldset>/<legend>: both are valid, but fieldset has flexbox/grid quirks that make it hard to style, and role="group" keeps the layout freedom while preserving the shared-label announcement. The GROUP owns required and error \u2014 aria-required and aria-invalid associate to the group and announce once; an individual row never owns its own required or error. Do not double-label: the rows carry their short labels, the group carries the decision.'},content:{labelPattern:`The group label NAMES THE DECISION or asks the question ("Notification preferences", "Which contact methods?"), abstracting the shared word up so its rows read the short remainder ("Email", "SMS", "Push"). Sentence case, no trailing colon \u2014 FieldLabel's rules.`,errorPattern:'GROUP-LEVEL and specific \u2014 "Select at least one option", stating what is wrong and how to fix it (SC 3.3.3), never "Invalid". The rows stay neutral; the group carries the message. The error visual is not designed yet.'},docs:{usage:"Use to select any number \u2014 zero to many \u2014 from a bounded set, where the change is committed on save rather than applied instantly. Give the group a label that names the decision; let it own the value array, required and validation, and derive each row's checked state from the value array rather than wiring it on the row. Compose the rows as `children`. Past roughly 7-10 options, a filtering multi-select combobox (not built yet) scans better; for exactly-one selection use Radio.Group, and for a single independent opt-in a lone Checkbox.Row.",do:["Give the group a label that names the decision, so its rows can read the short abstracted-up remainder","Let the GROUP own the value array, required and validation \u2014 a row inside a group never manages its own","Derive each row's checked state from the group's value array; never wire checked on a row in a group","Keep required and error at the group level, announced once (aria-required / aria-invalid on the group)",'Prefer role="group" + aria-labelledby over fieldset/legend for the layout freedom'],dont:["Pre-check a consent option \u2014 a dark pattern, and for marketing consent often unlawful","Wire checked, onChange or required on an individual row inside a group \u2014 all three belong to the group","Model an exclusive one-of-many choice as a checkbox group \u2014 that is Radio.Group","Reach for a checkbox group past roughly 7-10 options \u2014 a filtering multi-select combobox (not built yet) scans better","Override Enter to toggle \u2014 Enter submits the form, and that expectation is universal"],contentGuidelines:'The group label names the decision; the rows carry the short options. Group errors read "Select at least one option" rather than "Invalid".'},ai:{primaryPurpose:"Select any number \u2014 zero to many \u2014 from a bounded set via a labeled stack of Checkbox.Row options, with the group owning the value array, group-level required and all validation.",whenToUse:"A small bounded multi-select committed on save (notification preferences, feature opt-ins, a filter set), where seeing all the options aids the choice and the group needs one label, one required rule and one validation message.",avoidWhen:'Exactly one option may be chosen (Radio.Group \u2014 any-number versus exactly-one), a single independent opt-in with no siblings (a lone Checkbox.Row \u2014 a consent line, "remember me"), the change takes effect the instant it is toggled (a list of Switch.Row \u2014 staged versus immediate), or the set runs past roughly 7-10 options (a filtering multi-select combobox or listbox, not built yet).',commonPartners:["checkbox-row","checkbox-control","field-label","field-message"],triggerKeywords:["checkbox group","checkbox set","checkboxes","multiselect","choice list","select all","choose any","notification preferences","opt in list"],generationPriority:2},composition:{composesWith:["checkbox-row","field-label"],alternativeTo:["radio-group","switch-row"],replacesPatterns:['a bare set of <input type="checkbox"> with no shared label or group wiring',"per-row required / error scattered across the options instead of owned by the group"],supersededBy:[],planned:["form","combobox"]},motion:{enter:"None (present on mount). Each row's nested control draws its own check, about 100-150ms.",exit:"None. Rows do not animate in or out of the stack.",reduceMotion:"No layout motion at any setting. Under prefers-reduced-motion, each nested control flips instantly."},notes:{contested:["THE `size` AXIS IS A GENERALIZATION OF PRISM 2, NOT A REPRODUCTION \u2014 Prism 2's group is single-size (a Large label). The family-universal `size` axis is carried so the group is not the one form def frozen at one size, scaling the label and rows together by `follow`. `[HELD]`: the owner may prefer a single-size group; if so, drop the axis and pin the nested label/rows to one rung. Recorded as a fork rather than presented as settled.","THE GROUP PAINTS NOTHING and so declares no `paintKeys` \u2014 the first projecting def whose whole color surface is its nested children's. The alternative (inventing a group fill or border) is exactly the surface Prism 2's transparent container does not have; a stack is structure, and its ink lives one level down in `field-label` and `checkbox-row`.","`orientation` AND `density` ARE OMITTED. Brief \xA73 and \xA715 give the group `orientation` (vertical default, horizontal for a few short options) and `density` (comfortable, compact). Prism 2's group is vertical and single-density, so neither is an axis here; vertical is the built default and horizontal is held (see `codeOnly`). The alternative is declaring both as axes, which multiplies the set for configurations nobody has designed.","THE GROUP `description` PROP IS DEFERRED (#1698, decision 3). The brief puts a group-level `description` (helper text, describedby-wired) beside `required` and the error message. It would compose the same part the group error does, and that part is the held field-message decision, so it waits for it rather than inventing a helper slot the error design may reshape."],unverified:["GROUP-LEVEL ERROR / VALIDATION DISPLAY IS `[HELD]`. The brief puts validation and the error message on the group; Prism 2 settles no visual for it. This def carries `required` (settled) and no error skin (unsettled). Whether the group nests a `field-message` for the group error, and what an errored group looks like (a recolored label? a message below the stack? a per-row neutral hold?), needs the owner. Building one now would invent the very thing the brief left to design.","THE VARIABLE ROW COUNT AND SELECT-ALL ARE `[HELD]`. The three fixed row nests stand in for Prism 2's six-rows-with-booleans (a Figma convenience for `children: CheckboxRow[]`). If the projection should carry a designer-toggleable count, the mechanism is the node-visibility boolean on each row nest (the corpus's first boolean-toggled `nest` \u2014 schema-legal, unbuilt). A select-all parent is likewise expressible (a row at `indeterminate` above the set) and deliberately not added, since Prism 2 has none.","THE NESTING IS UNVERIFIED ON A REAL HOST, the same way `checkbox-row`'s and the other decompositions' are: the group nests `checkbox-row` (which nests `checkbox-control` `nest-exposed`), the deepest chain in the corpus, and whether a doubly-nested instance's inherited sizing and exposed properties cooperate with the group's auto-layout is a real-host question the offline shim cannot answer. `test:roundtrip` builds every projected def and reads it back \u2014 the host-truth check #1347 named, and #1503 extends it to assert each row reads back `layoutAlign: STRETCH` \u2014 but a three-deep nest is new ground; the symptom to look for is a row instance that does NOT fill the group (the STRETCH dropped on a real host), or an exposed selection that does not surface at the group."],evolution:["RESOLVED (#1699): `required` now DEFAULTS TO `false`, the brief's default (\xA715). It had defaulted `true` only because the nested FieldLabel built its required marker on by default; #1699 moved FieldLabel's own default to `false`, so the group follows the brief and the code default agrees with the Figma default (marker hidden) again.","THE INTER-ROW GAP IS RESOLVED (#1623 sign-off). Each `checkbox-row` carries 12px of block padding and so spaces itself, so the group binds a 0px gap (`space.0`) and adds no stack gap on top. The provisional size-keyed gap this entry used to hold is gone; the group's `size` axis still scales its label and rows through `follow`.","THE WIDTH/FILL MODEL IS RESOLVED (#1503, owner Option B: follow Prism 2). Prism 2's group is a fixed-320 root with rows set to FILL; this def now realizes that with the container floored at `minWidth: 320` and each row `crossAxisFill` (\u2192 `layoutAlign: STRETCH`), the projection capability #1503 added. A `minWidth` floor rather than a fixed width keeps the group responsive (reads at 320, flexes above), the `select` #1345 precedent. `radio-group` mirrors this exactly, so the two groups match by SHARING one resolution (#1475). The inter-row gap was settled separately (0px, #1623 sign-off, the entry above).",'Field POV (brief \xA713): the group became a first-class component owning the value array and group validation, replacing ad-hoc hand-wired fieldsets; and `role="group"` + `aria-labelledby` replaced `fieldset`/`legend`, driven by fieldset\'s CSS-layout quirks.']}};var ka={id:"radio-control",name:"Radio.Control",aliases:["radio-circle","radio-disc","radio-atom"],category:"form",status:"draft",summary:"Outlined radio ring; dot and brand ring on select. Nested by Radio.Row; no label.",description:"The atomic radio control \u2014 the painted circle with its inner selection dot and its focus ring, and nothing else. Nested by the labeled Radio.Row rather than placed on its own: it carries no label, no description and no hit-target padding, so a standalone use needs an external aria-label. A constant-weight outlined ring (no fill) at both selections that recolors on select \u2014 a neutral edge when unchecked, the interactive brand edge when checked \u2014 with an inner filled circle, half the ring's diameter, also appearing on select, never a filled disc. Carries the two-value selection axis (unchecked / checked) whose dot is a real part gated on the coordinate, and the 2px control border.",props:[{name:"checked",type:"boolean",required:!1,description:"The selected appearance \u2014 the inner dot present. Driven by the host row from the group's scalar value \u2014 a bare Radio.Control is styled by the coordinate, not wired to state here, and never holds a boolean of its own (selection is `group.value === option.value`)."},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the control circle (both axes from one key, round by construction) and the inner dot. Both read `control.size.*`, which moves a rung with brand density; `icon.size.*` would resolve and measure the wrong thing (the glyph artboard ladder). The host row passes its own size through by `follow`, so the nested control tracks the row."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"The disabled skin \u2014 a contrast-exempt border/dot treatment. Set on the host, followed here."},{name:"aria-label",type:"string",required:!1,description:"Required only for a genuinely standalone control with no host row to name it \u2014 the Row provides the accessible name, so a nested control must NOT double-label."}],states:["rest","hover","pressed","focus-visible","disabled"],variants:{size:["small","medium","large"],selection:["unchecked","checked"]},axisKinds:{size:"authoring",selection:"runtime"},paintKeys:["{selection}.{slot}.{state}","{selection}.{slot}","{slot}"],tokens:{"unchecked.border":"color.field.border.rest","unchecked.border.hover":"color.field.border.hover","checked.border":"color.interactive.primary.border.rest","checked.border.hover":"color.interactive.primary.border.hover","checked.border.pressed":"color.interactive.primary.border.pressed","checked.indicator":"color.interactive.primary.fill.selected","focus-ring":"color.border.focus","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset","disabled.border":"color.disabled.border","disabled.indicator":"color.disabled.fill",radius:"radius.round","border-width":"border-width.thick","size.small.control":"control.size.sm.height","size.medium.control":"control.size.md.height","size.large.control":"control.size.lg.height","size.small.dot":"control.size.sm.dot","size.medium.dot":"control.size.md.dot","size.large.dot":"control.size.lg.dot"},anatomy:{root:"control",parts:{control:{kind:"box",role:"target",paintSlots:["border"],size:"size.{size}.control",radius:"radius",strokeWidth:"border-width",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},children:["dot","focusRing"],note:"The outlined ring AND the nominal hit-target marker. The real hit target is the whole labeled ROW, which lives on `radio-row`; this circle is not independently clickable. `role: target` is here only because the schema requires exactly one per anatomy \u2014 the same nominal marker `checkbox-control`'s `control` carries. No fill: a constant-weight outlined ring at both selections that RECOLORS on select \u2014 neutral `field.border.*` when unchecked, the interactive brand edge `interactive.primary.border.*` when checked \u2014 with the inner dot as an additional selection cue (#1348, #1423)."},dot:{kind:"box",role:"presentation",paintSlots:["indicator"],size:"size.{size}.dot",radius:"radius",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},presentWhen:{selection:["checked"]},note:"The inner circle, present only at `checked` \u2014 an unchecked radio draws no mark, so this is a gated part rather than a recolored one. Its ink is `checked.indicator` (the brand fill, on the PAGE, since the ring is unfilled), and at `disabled` the page form `disabled.indicator`. Its select micro-motion \u2014 a scale-in, and a sibling's dot animating OUT \u2014 is stated in `motion`; the Figma members are static."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring` component, inset from the CONTROL so the ring surrounds the circle. F2 (#1388) derives its radius concentrically off the host, so a full-round host yields a circular ring \u2014 verified, not re-derived (#1348)."}},codeOnly:["read-only \u2014 deliberately not a state of this atom. A radio has no working native readonly, so there is no treatment to project; the field/row/group decides it. The Row admits it in its own `codeOnly`.","motion \u2014 the select micro-motion (a spring/scale-up of the dot at roughly 100-150ms, and \u2014 uniquely \u2014 a SIBLING's dot animating OUT, the only exit animation a radio has, since it can never be deselected on its own). The def states it in `motion`; a Figma variant carries no motion, so the dot is static at every coordinate.","The whole-row hit target. A bare control circle is a 12-24px disc that fails SC 2.5.8 in isolation; the accessible target is the labeled ROW, which is `radio-row` and not this atom. This def is nested, never placed alone, precisely so the target is supplied one level up.","error \u2014 deliberately not a state of this atom (#1698, decision 1). Radio error is GROUP-level only, never per-option (brief \xA74, \xA715), so no option draws a danger ring and the set has no error column. The group carries the error; its display is held with the group error design.","RTL \u2014 the row mirrors (the control moves to the reading-start side through logical properties), and the disc and dot are symmetrical, so this atom has nothing to mirror (brief \xA79). Figma members are drawn left to right."]},figmaProperties:{variantAxes:["selection","size"],stateAxis:{name:"state",values:["rest","hover","pressed","focus-visible","disabled"]},booleans:{}},accessibility:{role:"The visual control only \u2014 the accessible radio role, name and aria-checked belong to the host input the Row wires, and the exclusivity and roving-tabindex keyboard model to Radio.Group. A standalone use must supply role and name itself.",wcag:["1.4.11 Non-text Contrast (the ring border, and the inner dot against the page)","2.4.13 Focus Appearance (the nested focus ring, offset, at least 3:1 \u2014 circular for this round host)","4.1.2 Name Role Value (carried by the host; this atom is presentational when nested)"],keyboard:"None of its own \u2014 the atom is not a tab stop. Focus, Space-to-select and the group's roving tabindex / arrow navigation belong to the host input and Radio.Group; the ring here renders the host's `:focus-visible` state.",focus:"The nested focus ring surrounds the circle on `:focus-visible`, offset so an unbroken sliver of background separates the ring from the control's own border (WCAG 1.4.11). Circular, because the host is full-round. Keyboard traversal only.",aria:'When nested in a host row, the host provides the accessible name through `aria-labelledby` \u2014 never double-label. The role is `radio`; a lone radio announces "radio button, 1 of N" with no indication of what is being chosen, which is why the group label is mandatory and lives on Radio.Group, not here.'},content:{labelPattern:"None \u2014 the atom carries no label. The option label and its rules live on Radio.Row (`radio-row`); the decision it belongs to lives on Radio.Group (`radio-group`).",errorPattern:"None \u2014 radio error is GROUP-level only, never per-option, so this atom has no error state and no error ring. The group carries the message and the error display."},docs:{usage:"Do not place this on its own. It is the circle Radio.Row nests, so a fix to its border weight or its dot geometry reaches the row without being copied. Build it before the row that nests it (the nest resolves by name against the live file). A standalone use is only for a control with an external label and its own aria wiring.",do:["Nest this from Radio.Row rather than redrawing the circle per host","Let the host row expose `selection` and `state` and `follow` its size, so the nested control tracks the row","Let the inner circle and the ring recolor carry the selection; the ring border stays constant in WEIGHT across states, going brand-colored (not thicker) on select","Supply an external aria-label only when using the control genuinely alone"],dont:["Place a bare circle as the clickable element \u2014 it fails SC 2.5.8 in isolation; the labeled row is the hit target","Double-label a nested control \u2014 the host row already provides the accessible name","Fill the disc on select \u2014 the ring stays outlined and an inner circle shows the selection","Thicken the border to signal selection \u2014 the border WEIGHT is constant across states; selection recolors the ring to brand and adds the inner dot"],contentGuidelines:"The atom has no copy of its own; all label, description and error text belongs to the row and the group that compose it."},ai:{primaryPurpose:"Render the atomic radio control \u2014 the outlined circle, its inner selection dot and its focus ring \u2014 for a host row to nest.",whenToUse:"Nested by the labeled Radio.Row (the common case), or standalone only for a control with an external label and its own aria wiring.",avoidWhen:"You want the labeled case (that is Radio.Row), a staged binary opt-in (Checkbox.Row / Checkbox.Control), or an immediate-effect toggle (Switch.Row / Switch.Control). Never place a bare circle as the clickable element \u2014 the hit target is the labeled row.",commonPartners:["radio-row","focus-ring","radio-group"],triggerKeywords:["radio control","radio circle","radio disc","radio dot","option control"],generationPriority:3},composition:{composesWith:["focus-ring"],alternativeTo:["checkbox-control","switch-control"],replacesPatterns:["the painted circle and dot inlined in a radio row","a filled-disc radio that signals selection by the ring filling in"],supersededBy:[]},motion:{enter:"On select, the inner dot scales in with a border-color crossfade on the ring, about 100-150ms. The focus ring appears instantly \u2014 a fade lags rapid arrow navigation through the group.",exit:"When a sibling is selected, this dot animates out \u2014 the one exit a radio has, since it is never deselected on its own.",reduceMotion:"Under prefers-reduced-motion, the dot snaps in and out through opacity and color only, with no scale."},notes:{contested:["THE ATOM IS A SEPARATE COMPONENT rather than kept inline in the row, and the #1348 precondition made it earn that: the split was built ONLY after confirming the radio Row nests it (the composition check), which it does \u2014 the radio was already a row containing a control subtree, the shape checkbox had before #1226 and switch before #1354. The rejected alternative (keep the disc inline and let the family diverge) is exactly the per-def duplication #1011 found had shipped the identical fill/border pairing across three defs.","THE PRISM 2 VISUAL \u2014 a constant-weight outlined ring with an inner circle on select \u2014 REPLACES the pre-split filled disc (checkbox's treatment at a round radius), on the owner's decision (#1348, 2026-09-10). The pre-split radio's own `notes.contested` argued filled WON over the outlined model on two grounds (one visual family with checkbox, and `on-fill` being a gated pairing); the owner reversed that in favor of matching Prism 2, whose radio is an outlined ring plus `checkboxBlankCircleFill`. Filled is no longer the fork \u2014 it is superseded. What made the reversal clean rather than a new contrast problem: the dot now sits on the PAGE (the ring is unfilled), and `interactive.primary.fill.selected` clears 3:1 against the page as a dot exactly as it did as a disc, so no pairing that was gated stops being gated.","THE RING RECOLORS ON SELECT \u2014 `checked.border.*` binds the INTERACTIVE family (`color.interactive.primary.border.{rest,hover,pressed}`) while `unchecked.border.*` keeps the neutral `field.border.*`, so selection moves the ring's COLOR as well as adding the dot. Its WEIGHT is still constant (one 2px key across selection). This is the #1423 correction, and the direction reversed since #1348: the decomposed def originally bound `field.border.*` at BOTH selections (a fully-constant-color ring) on the reading that \"the ring stays constant\" meant color too, with the brand-ring recolor named as the ALTERNATIVE. The owner's QA of the 2026-09-15 Figma import found that left a selected radio's ring gray where Prism 2 ships it brand (spec: unchecked #82899D, checked #1E1EFF/#0812C3/#090A83), and triaged the recolor decision-free \u2014 Prism 2 is the oracle. THE NAMED ALTERNATIVE is now the reverse: a fully-constant-color ring (both selections on `field.border.*`), a rebind of the three `checked.border.*` keys back, for a brand that wants the ring to hold neutral through selection. Revisit if a brand wants that constant-color skin.","THE PAINT GRAMMAR IS AXIS-LED, inherited from `checkbox` rather than re-decided, and the exemption that makes it legal is declared once per AXIS in `lint-paint.ts` (`NON_FAMILY_AXES`). Recorded here only so this def is not read as a second independent vote: the family shares one grammar and one exemption. What is genuinely open is not the grammar but its cost \u2014 arm 1 does not check a non-family axis at all (#916)."],unverified:["THE DECOMPOSITION IS UNVERIFIED ON A REAL HOST, the same way `checkbox-control`'s and `switch-control`'s were: the nested control instance must pin its own SQUARE (the control edge) rather than stretch to the `control-box` line box, and whether the instance's inherited sizing mode cooperates with the row's auto-layout is a real-host question the offline shim cannot answer. The symptom to look for: a control instance stretched to the line-box height instead of centered within it. Radio's control is SQUARE, so the Row pins via `size` (both axes from one key), the same as checkbox \u2014 a wider pin than switch's height-only.","THE INNER DOT AT `small` MAY NOT READ \u2014 the dot is half the control edge by the tier's construction, so at `small` it is 8px in every shipped brand and 6px at compact density (the `minimal-compact` fixture since aurora moved to comfortable, #1215). Whether a 6px filled circle reads as a selection dot at all is unmeasured. The affordance is most useful at `medium`, and the row's own min-height is what has to reach SC 2.5.8.","THE CIRCULAR FOCUS RING IS DERIVED, NOT RE-DERIVED HERE (#1348 point 3). F2 (#1388) made the ring concentric, and a full-round host (this disc, `radius.round`) yields a circular ring by construction \u2014 `version.ts` names radio as the middle of its three derivation cases. This def CONFIRMS the full-round-host condition (`test.ts` #1348); the #1388 execution block gates the derivation itself. What is unverified is the same real-host question F2 left open, now one nest deeper: the ring is nested inside the control and the control inside the row, so an inherited dimension binding would have to be cleared twice, the same as `checkbox-control` (#1280/#1290).","THE PRESSED LADDER IS ASYMMETRIC ACROSS SELECTION, and that is faithful to Prism 2 (#1423). The CHECKED ring binds `pressed` (`interactive.primary.border.pressed`, #090A83 in the spec \u2014 a distinct Active color), because the interactive family emits a pressed rung and Prism 2 darkens the selected ring under press. The UNCHECKED ring has NO `pressed` binding: `color.field.border.*` emits `rest` and `hover` only, so pressed falls through to rest \u2014 matching Prism 2, whose `selected=false` ring is a static neutral edge with no Active override. The inner DOT paints one value with no per-state ladder (`checked.indicator`), so under press it is the CHECKED ring that tracks the interactive ladder while the dot and the unchecked ring hold still."],evolution:["THE GROUP IS BUILT. This entry used to say RadioGroup was a separate component with no def (#901). `radio-group` (#1469) now owns the shared `name`, the single scalar value, the roving-tabindex single tab stop and all validation \u2014 none of which is expressible from this atom or from the Row. This def is the OPTION's painted control only.","PER-OPTION ERROR DROPPED (#1698, decision 1). The atom carried an `error` state that drew a danger ring on each option (#1433a locked that ring and the unchanged inner dot). The brief says radio error is never per-option, and this def's own `errorPattern` agreed, so the state, its two `*.border.error` keys and the error column (36 \u2192 30 members) are gone. The error shows at the group.","Styled native inputs sharing a `name`, for free roving tabindex and exclusivity, won over hand-rolled `role=radio` div groups (brief \xA713). That is the input this atom paints."]}};var Ta={id:"radio-row",name:"Radio.Row",aliases:["radio","radio-button","option"],category:"form",status:"draft",inherits:"checkbox-row",summary:"One labeled option inside a Radio.Group. The whole row is the hit target.",description:"A control for choosing exactly one from a small set of mutually exclusive, all-visible options \u2014 2 to about 7, where seeing them all aids the decision. This def is the labeled OPTION: it nests a Radio.Control (the outlined circle and its inner selection dot) and carries the option label, with the whole row as the hit target. The group is a separate component and is MANDATORY, because a lone radio is meaningless: it owns the shared name that enforces exclusivity, the single selected value, the single tab stop, and all validation. Selection is derived from the group, never held here. Not any-number selection (Checkbox.Row), not an immediate on/off (Switch.Row), not the same choice collapsed (Select) or in a compact skin (a segmented control, not built yet).",props:[{name:"value",type:"string",required:!0,description:"Required, where Checkbox.Row's is optional. This is the option's identity within its group, not a string that happens to be submitted. Selection is derived from it: `checked = (group.value === props.value)`. The option never holds a boolean of its own."},{name:"label",type:"node",required:!1,description:"Rich content, inline-end of the control, and part of the hit target \u2014 the Checkbox.Row label model, inherited. Option labels are parallel, mutually exclusive and brief: the same grammatical shape across the set, with no overlap that would make two options both apply. Long labels WRAP rather than truncate, with the control centered within the first line-box so it stays on the first line. Per-option detail or price belongs in `description`, not in the label."},{name:"description",type:"node",required:!1,description:"Per-option helper beneath the label, describedby-wired. This is where the detail that makes an option distinguishable goes \u2014 the price, the delivery estimate, the caveat."},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the row \u2014 the control-to-label gap, the row's minimum height, the label's type \u2014 and is passed through to the nested Radio.Control by `follow`, scaling the circle's diameter and the inner dot's."}],states:["rest","hover","pressed","focus-visible","disabled","read-only"],variants:{size:["small","medium","large"]},axisKinds:{size:"authoring"},paintKeys:["{slot}"],densitySpacing:["size.{size}.gap"],tokens:{label:"color.text.primary","disabled.label":"color.disabled.text","pad-y":"space.150","pad-x":"space.0","size.small.gap":"space.100","size.medium.gap":"space.100","size.large.gap":"space.150","size.small.min-height":"size.sm.height","size.medium.min-height":"size.md.height","size.large.min-height":"size.lg.height","size.small.control-box":"control.size.sm.line-box","size.medium.control-box":"control.size.md.line-box","size.large.control-box":"control.size.lg.line-box","size.small.control":"control.size.sm.height","size.medium.control":"control.size.md.height","size.large.control":"control.size.lg.height","size.small.text":"type.body.sm.default","size.medium.text":"type.body.md.default","size.large.text":"type.body.lg.default"},anatomy:{root:"row",parts:{row:{kind:"box",role:"target",layout:{direction:"row",align:"start",justify:"start",sizing:{x:"hug",y:"hug"}},gap:"size.{size}.gap",padding:{block:"pad-y",inlineLabel:"pad-x"},minWidth:320,children:["controlBox","label"]},controlBox:{kind:"box",role:"presentation",height:"size.{size}.control-box",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"fixed"}},children:["control"]},control:{kind:"nest",nests:"radio-control",size:"size.{size}.control",nesting:{kind:"nest-exposed",variant:{selection:"unchecked",state:"rest"},expose:["selection","state"],follow:["size"]},note:"An in-flow instance of `radio-control` taking the control cell inside the line-box wrapper. It EXPOSES the control's selection and state (the consumer drives them from the Row), follows the Row's size, and binds its own square so it is centered within the taller wrapper rather than stretched to fill it."},label:{kind:"text",type:"size.{size}.text",wrap:!0,note:`The accessible name AND the second half of the hit target. Rich content in code; a plain text node in Figma. It WRAPS to a second line rather than overflowing (#1424) \u2014 it fills the row's main axis and reflows. The accessible name of the CHOICE is the group's label, which no part here can carry \u2014 an option label alone announces "radio button, 1 of 3" with no indication of what is being chosen.`}},codeOnly:["read-only \u2014 a `states` value the Figma set does not carry. Since #1348 the Row projects a SIZE-ONLY set (no stateAxis): the control's `state` is EXPOSED from the nested `radio-control` and the consumer drives it from the Row, so no state is enumerated into the Row's own matrix. read-only binds NOTHING even in code: a radio has no working native readonly, so there is no treatment to project, and six variants byte-identical to `rest` would read as coverage of a state nobody has designed.","states \u2014 the documented cost of collapsing 36 members to 3 (the #1348 decomposition). A disabled Row in Figma shows the disabled CONTROL (the exposed state) beside a full-ink label, because the Row no longer multiplies state. The Row's own per-state LABEL treatment (`disabled.label` dimming the text) is the CODE projection's, not Figma's \u2014 `lint-paint` arm 2 reads `def.states` for reachability, so `disabled.label` stays reachable and keyed for code while the Figma SET collapses to size-only.","min-height \u2014 `size.*.min-height` is the row's FLOOR and Figma has no floor. `PartDef` carries `height`, which is fixed, so binding it here would state the wrong quantity and clip a wrapping option label at the one coordinate that matters most. The row hugs its children instead and the keys stay bound for the code projection, where `min-height` is the property they name.","THE GROUP, which is the unit of use and is not this def \u2014 it is `radio-group` (#1469). The shared `name` that enforces exclusivity, the single scalar value selection is derived from, the single tab stop with roving tabindex and arrow navigation, `orientation`, `required` and all validation live there. A Figma set of options can show what an option looks like at every coordinate and cannot show a group at all \u2014 so the exclusivity that makes these radios rather than toggles is absent from the projection by construction, not by omission.","The whole-row hit target beyond the row's own extent. SC 2.5.8 wants 24x24 and Apple/Material want 44/48 on touch; the row reaches that at `medium` and not at `small`, and the padding that would expand it is a per-consumer decision about the surrounding layout. `row` is the node it lands on \u2014 that is what this block makes expressible \u2014 but the value is not the def's to pick.","The `description` prop \u2014 per-option helper text beneath the label, which is where the detail that distinguishes options goes (a price, a delivery estimate). It is a second text part under `label` rather than beside it, and adding it would double the row's vertical shape for content that is optional at every one of the three members. Left to the code projection, where it is describedby-wired.","motion \u2014 the select micro-motion and the SIBLING's dot animating out, the only exit animation a radio has. The dot is `radio-control`'s, so its `motion` states it; a Figma variant carries no motion, so the dot is static at every coordinate.","RTL \u2014 the row mirrors through logical properties: the control moves to the reading-start side and the label flows from it. The disc is symmetrical, so there is no glyph to hold unmirrored (brief \xA79). Figma members are drawn left to right.","text expansion \u2014 option labels wrap rather than truncate, and the control stays on the first line (#1201). Horizontal option rows are fragile under expansion (German up to about 300%), which is part of why the group is vertical (brief \xA79). The Figma members carry the English placeholder only."]},figmaProperties:{variantAxes:["size"],texts:{label:{part:"label",default:"Radio option"}},booleans:{}},accessibility:{role:'radio (native <input type="radio"> sharing a name), with aria-checked; the group carries role="radiogroup"',wcag:["1.3.1 Info and Relationships (the group structure is the meaning)","4.1.2 Name Role Value (role and checked)","3.3.2 Labels or Instructions (the option label)","3.3.1 Error Identification / 3.3.3 Error Suggestion \u2014 the group's, announced once and never per option. The group error display is not designed yet, so neither is met today.","1.4.11 Non-text Contrast / 2.4.13 Focus Appearance (control boundary and focus indicator)","2.5.8 Target Size \u2014 the intent: the whole row is the target, as in Checkbox.Row. The default (medium) row is held to a 44px minimum height on comfortable and spacious density; small and compact rows are not measured."],keyboard:`The keyboard model is the opposite of Checkbox.Row's. The group is a single tab stop: Tab moves into the group and the next Tab moves out, while arrow keys move between options, wrapping at the ends, with Home/End jumping to first/last. Space selects the focused option. Implement with ROVING TABINDEX \u2014 one radio at tabindex="0" (the checked one, or the first if none), siblings at -1, with arrow handling moving focus, the 0, and calling .focus() \u2014 rather than aria-activedescendant, which is more verbose and prone to synchronization bugs. Making each radio its own tab stop is the most common radio accessibility failure. Native inputs sharing a name give the grouping, the exclusivity and this keyboard model for free.`,focus:':focus-visible ring on the CONTROL, offset, at least 3:1, keyboard traversal only \u2014 and CIRCULAR, because the control is full-round and the ring is derived concentrically from it. The ring must appear INSTANTLY \u2014 fading it lags rapid arrow navigation. Selection FOLLOWS FOCUS by default: arrowing moves focus and selects, which is native <input type="radio"> behavior and the APG default, and the catalog keeps native semantics rather than reimplementing them. The known cost is that a screen-reader user exploring the options fires onChange at every step; the answer is to keep radio onChange CHEAP \u2014 a radio selection must never trigger navigation or expensive work \u2014 and to decouple selection from focus only as a deliberate, documented exception. On focus restore into the group (a validation error, a legend click), focus the CHECKED radio rather than blindly the first; if none is checked, the first non-disabled option.',aria:'Prefer the styled native input \u2014 appearance: none plus a pseudo-element or SVG keeps role, checked state, exclusivity and the roving-tabindex keyboard model for free. For the container, role="radiogroup" plus aria-labelledby is the default over fieldset/legend, for the same CSS-layout reason as Checkbox.Row. THE GROUP LABEL IS MANDATORY FOR MEANING: without it assistive tech announces an orphaned "radio button, 1 of 3" with no indication of what is being chosen. Group error and required associate to the group and announce once; an option never owns its own error. On mobile (Jetpack Compose) put the click target on the ROW rather than the dot \u2014 selectableGroup() on the parent, selectable(role = Role.RadioButton) on the row, and onClick = null on the RadioButton itself \u2014 or the control double-fires and assistive tech announces twice.'},content:{labelPattern:'Parallel, mutually exclusive, scannable \u2014 the same grammatical shape across the set, brief, sentence case, no terminal punctuation, and no overlap that would let two options both apply. Long labels wrap rather than ellipsis-truncate, with the control centered within the first line-box so it stays on the first line rather than floating mid-paragraph. The GROUP label names the decision or asks the question ("Shipping method", "How should we contact you?") and may be visually hidden when an enclosing labeled section already frames it, but must stay programmatically present.',errorPattern:'Group-level and specific \u2014 "Select a preferred contact method", never "Invalid input" (SC 3.3.3). Never per-option.',emptyPattern:'A group starts EMPTY by default, so no option carries a pre-selected state \u2014 the practice forces a deliberate choice and pre-selects only where a genuinely safe recommended default exists. A radio cannot be deselected, so once chosen the group cannot return to empty: an optional group must therefore carry an explicit "None" or "N/A" option, or a stray click permanently pollutes the data with no way back. If a "None" option would corrupt the data model, the choice belongs in a clearable Select instead.'},docs:{usage:"Use a group of these for exactly one of 2 to about 7 mutually exclusive, all-visible options where seeing them all aids the decision \u2014 a shipping method, a plan tier. Always inside a Radio.Group, never alone: the group owns the shared name, the value and the validation. Prefer vertical orientation, which scans better and lets long labels wrap safely; reserve horizontal for a few short options and space them so no label associates with the wrong control. Compose FieldMessage at the GROUP rather than per option.",do:["Ship options inside a group \u2014 the group owns the shared name, the single value, validation and the tab stop",'Give the group a label; without one, assistive tech announces "radio button, 1 of 3" with no idea what the choice is','Give an optional group an explicit "None" option \u2014 a radio cannot be deselected, so a stray click is otherwise permanent',"Keep onChange cheap, since selection follows focus and a screen-reader user arrowing through fires it at every step","On focus restore, focus the checked option rather than the first","Start empty to force a deliberate choice; pre-select only a genuinely safe default"],dont:["Set checked, onChange or name on an option \u2014 all three belong to the group, and an option setting its own name breaks exclusivity outright","Make each option its own tab stop \u2014 the group is one stop with arrow navigation, and getting this wrong is the most common radio accessibility failure","Add toggle-off behavior \u2014 no-deselect is native and deliberate","Model an exclusive choice as several checkboxes, or a true/false toggle as two radios","Reach for radio past about 7 options or in tight vertical space \u2014 that is Select","Use radio for a choice that takes effect instantly \u2014 that is Switch.Row, or a segmented control (not built yet)"],contentGuidelines:"Option labels are parallel and brief; the detail that distinguishes them goes in the description. The group label names the decision. Errors are group-level and say what to do."},ai:{primaryPurpose:"Present one option within a mutually exclusive set via a labeled row that nests the circle-and-dot control, deriving its selected state from the group that owns the value.",whenToUse:"Exactly one of 2 to about 7 all-visible options where seeing them together aids the decision, and the choice is committed on submit rather than applied instantly. Always as a child of a Radio.Group.",avoidWhen:"Any number of options may be selected (Checkbox.Row \u2014 never model an exclusive choice as several checkboxes), the change applies immediately (Switch.Row \u2014 and never two radios for a true/false toggle), the set runs past about 7 or vertical space is tight (Select, the collapsed alternative), the choice is a dense frequent view-switch (a segmented control, not built yet, which carries a different accessibility model), or it is really an action (Button). Also do not reach for this def when what is wanted is the group: use Radio.Group (`radio-group`), which owns the name, the value and the validation.",commonPartners:["radio-control","radio-group","field-label","field-message","focus-ring"],triggerKeywords:["radio","radio button","option","pick one","mutually exclusive"],generationPriority:2},composition:{composesWith:["radio-control"],alternativeTo:["checkbox-row","switch-row","select"],replacesPatterns:["a set of checkboxes misused for a mutually exclusive choice",'a bare <input type="radio"> set with no group label',"two radios standing in for a true/false toggle"],supersededBy:["select"],planned:["form","card","segmented-control","toggle-button"]},motion:{enter:"None of the row's own (present on mount). On select, the nested Radio.Control scales its dot in, about 100-150ms; the focus ring appears instantly.",exit:"None of the row's own. When a sibling option is selected, this option's dot animates out \u2014 exclusivity made visible.",reduceMotion:"No layout motion. Under prefers-reduced-motion, the nested dot snaps through opacity and color only."},notes:{contested:['THE VISUAL IS THE PRISM 2 OUTLINED MODEL \u2014 a constant-weight ring with an inner circle on select \u2014 on the owner\'s decision (#1348), REPLACING the pre-split filled disc. The treatment and the named brand-ring-recolor alternative live on `radio-control`, where the painted surface does; this entry records only that the fork the pre-split radio kept open ("filled wins over the outlined model") is CLOSED, superseded by the owner matching Prism 2. Do not re-argue it here; if the treatment moves, move it there.',"THE PAINT GRAMMAR IS AXIS-LED, inherited from `checkbox` rather than re-decided, and the exemption that makes it legal is declared once per AXIS in `lint-paint.ts` (`NON_FAMILY_AXES`). Since #1348 the grammar and the exemption live on `radio-control` (the Row paints only the label, so its `paintKeys` is the bare slot alone). Recorded here only so this def is not read as a second independent vote.","The group's `orientation` and `density` are in brief \xA715's variants block and are not axes here, because they are the group's. Unlike checkbox, where that was a tidy boundary, here it means the def is missing an axis its unit of use genuinely has \u2014 and `radio-group` holds both rather than declaring them.",`Carbon's "AI presence" variant, which sets an AI-explainability label beside a recommended option, is named in brief \xA74 as a frontier signal and explicitly "a watch item, not a default". Not declared. It is also a dual-action row needing careful focus management so assistive tech does not conflate the explainer control with the radio, which makes it an anatomy question rather than an axis one.`,"Selection-follows-focus is the practice default and the external research pass argued the opposite (explicit selection, Space to commit), citing the screen-reader-exploration trap and Windows gamepad behavior. Recorded because the contrary position is legitimate and reasoned rather than wrong: the resolution is that follows-focus is native and the APG default, and the exploration cost is better paid by keeping `onChange` cheap than by reimplementing the platform."],unverified:["THE DECOMPOSITION IS UNVERIFIED ON A REAL HOST, the same way `checkbox-control`'s and `switch-control`'s were: the nested control instance must pin its own SQUARE (the control edge) rather than stretch to the `control-box` line box, and whether the instance's inherited sizing mode cooperates with the row's auto-layout is a real-host question the offline shim cannot answer. The symptom to look for: a control instance stretched to the line-box height instead of centered within it. Radio's control is SQUARE, so the Row pins via `size` (both axes), the same as checkbox.","THE FOCUS RING must appear INSTANTLY (brief \xA76, \xA78) \u2014 a fade lags rapid arrow navigation through a group, which is a radio-specific constraint that checkbox does not have. It is stated in `motion` and `accessibility.focus`, and nothing checks it: `motion` is prose, and no gate reads a ring's transition. The ring's SHAPE, by contrast, is handled: F2 (#1388) derives it concentrically, so a full-round control yields a circular ring (`radio-control.ts`).","The whole-row hit target is expressed as `size.*.min-height`, the row's floor, and `anatomy.parts.row` is the node the expanding padding would land on. What is still unstated is the VALUE: the row clears SC 2.5.8's 24x24 at `medium` and not at `small`, and how much padding to add is a decision about the surrounding layout rather than a property of this component. Admitted in `anatomy.codeOnly` rather than guessed at \u2014 which is why `accessibility.wcag` states 2.5.8 as intent (#1698)."],evolution:["THE COMPANIONS ARE BUILT. This def used to record Radio.Control and RadioGroup as the two companions, with the group deferred (#901). `radio-control` (#1348) is the atom this Row nests, and `radio-group` (#1469) is the mandatory group that owns the shared `name`, the single scalar value, the roving-tabindex single tab stop, `orientation` and all validation.","THE SELECT MICRO-MOTION HAS A HOME. It was recorded here as having no expression in the def schema. The schema has a `motion` field; the dot's transition is stated on `radio-control`, where the dot is, and this Row's `motion` names the rest.",'Field POV (brief \xA713): the group became the mandatory first-class component and the bare radio an incomplete unit; composition (a group wrapping option children) replaced the options array; styled native inputs sharing a `name` replaced hand-rolled `role=radio` groups, with `role="radiogroup"` + `aria-labelledby` over `fieldset`; the segmented control split out as a compact presentation of the same semantics; and selection-follows-focus was affirmed as the default, with the cheap-`onChange` caveat.']}};var $a={id:"radio-group",name:"Radio.Group",aliases:["radio-set","radios","radio-list","single-select","radio-fieldset","radio-button-group","choice-list"],category:"form",status:"draft",summary:"Labeled stack of Radio rows. Owns the shared name, one value and validation.",description:"A labeled set for choosing EXACTLY ONE from a small set of mutually exclusive, all-visible options. A required section label (FieldLabel) above a vertical stack of Radio.Row options. Owns the contract a single radio cannot \u2014 and without which the radios are not radios at all: the shared name that enforces exclusivity, the single scalar value, the single tab stop with roving focus, and all validation, announced once for the group. Use for 2 to about 7 options where seeing them all aids the decision; past that, a Select or a filtering combobox (not built yet) scans better. Not any-number selection (Checkbox.Group), not a single independent opt-in (a lone Checkbox.Row), not an immediate-effect setting list (a list of Switch.Row), not the same choice collapsed (Select) or in a compact skin (a segmented control, not built yet).",props:[{name:"label",type:"string | node",required:!0,description:`The group heading, rendered as the nested FieldLabel and the group's accessible name (role="radiogroup" + aria-labelledby). Names the decision the set answers ("Shipping method", "How should we contact you?"), letting its rows read the abstracted-up short labels ("Standard", "Express", "Overnight"). MANDATORY for meaning: without it assistive tech announces an orphaned "radio button, 1 of 3" with no indication of what is being chosen.`},{name:"value",type:"string",required:!1,description:"The controlled SCALAR selected option value \u2014 exactly one, where Checkbox.Group owns an array. The GROUP owns it; each row's checked appearance is DERIVED (`checked = (value === row.value)`), never wired on the row. Pair with `onChange`; use `defaultValue` for the uncontrolled form."},{name:"defaultValue",type:"string",required:!1,description:"Uncontrolled initial selection \u2014 a single option value. Start EMPTY (unset) to force a deliberate choice; pre-select only where a genuinely safe recommended default exists, and never pre-select a consent-shaped option."},{name:"onChange",type:"(value: string, event) => void",required:!1,description:"Fires with the NEW scalar value when a different row is selected. The group dispatches it; a row never owns its own onChange inside a group. Keep it CHEAP \u2014 selection follows focus by default, so a screen-reader user arrowing through fires it at every step."},{name:"required",type:"boolean",default:!1,required:!1,description:`Whether an option must be chosen. Off by default. Drives the nested FieldLabel's required marker and aria-required on the group. Group-level: an individual row never owns its own required. An optional group must instead carry an explicit "None" option, because a radio cannot be deselected \u2014 a stray click is otherwise permanent.`},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the group \u2014 the label's type and every row (control circle, label ramp, gap) together, passed into the nested FieldLabel and rows by `follow`, so the group scales with the rest of the form."},{name:"name",type:"string",required:!0,description:"The shared control name \u2014 LOAD-BEARING here, not a submission convenience: it is what enforces browser-level exclusivity across the set, so every group sets one. An individual option NEVER sets its own, which would break exclusivity outright."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"Disables the whole set \u2014 every row and the label dim, driven by the group's context (the native disabled is the source of truth). Not projected as a Figma state; the group has no disabled treatment of its own."}],states:["rest"],variants:{size:["small","medium","large"]},axisKinds:{size:"authoring"},tokens:{gap:"space.0","pad-y":"space.100","pad-x":"space.0"},anatomy:{root:"container",parts:{container:{kind:"box",role:"target",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"gap",padding:{block:"pad-y",inlineLabel:"pad-x"},minWidth:320,children:["label","row1","row2","row3"]},label:{kind:"nest",nests:"field-label",nesting:{kind:"nest-fixed",variant:{size:"medium",emphasis:"secondary",weight:"bold",state:"rest"},follow:["size"]},crossAxisFill:!0,note:"The group heading and accessible name, composed rather than re-declared, configured secondary and bold, with its required marker following the group's `required`. Its size follows the group; a fix to FieldLabel reaches here without a copy. Fills the group's width, so a long heading wraps. It is MANDATORY: an unlabeled radio group announces \"radio button, 1 of 3\" with no idea what the choice is."},row1:{kind:"nest",nests:"radio-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"The first Radio.Row \u2014 always present. Nests the labeled row (which nests the control), following the group's size. Fills the group's width. Its checked state is derived from the group's scalar value (`checked = value === row.value`), not wired here."},row2:{kind:"nest",nests:"radio-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"A second Radio.Row \u2014 one of the representative stack (the variable row count is not modeled yet). Same nest configuration as the first, including the group-width fill."},row3:{kind:"nest",nests:"radio-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"A third Radio.Row \u2014 completing the representative stack. In code the stack is `children`: any number of Radio.Row; the three fixed nests stand in for that count in the projection. Fills the group's width like its siblings."}},codeOnly:["value / onChange \u2014 the GROUP owns the SCALAR selected value and the change callback (`value: string`, exactly one \u2014 where CheckboxGroup owns an array), and each row's checked appearance is DERIVED from it (`checked = value === row.value`), never wired on a row inside the group. Figma has no data model, so the projected rows show a fixed default selection; the scalar and its wiring are the code projection's. This is the contract the group owns and a single `radio-row` structurally cannot express \u2014 and for radio it is what makes the options mutually exclusive at all.","name \u2014 the SHARED control name that enforces browser-level EXCLUSIVITY, owned by the group and load-bearing rather than a submission convenience. An individual option setting its own name breaks exclusivity outright. Figma has no DOM naming, so the shared name is the code projection's; the projected rows cannot show the exclusivity that makes them radios rather than toggles.",'roving tabindex / single tab stop \u2014 THE OPPOSITE OF CHECKBOX-GROUP, and radio\'s headline keyboard difference. The whole group is ONE tab stop: Tab moves into it and the next Tab moves out, while arrow keys move between options (wrapping, Home/End to first/last) and Space/selection-follows-focus selects. Implement with roving tabindex (the checked option at tabindex="0", siblings at -1). Making each option its own tab stop is the most common radio a11y failure. Figma has no accessibility tree and no keyboard model, so none of this is projectable \u2014 it lives in `accessibility.keyboard` and here.','error / validation \u2014 GROUP-LEVEL and [HELD]. The brief says the group owns validation and carries the error message ("Select a shipping method", SC 3.3.3), with the individual rows staying neutral. Prism 2\'s spec settles no error visual for the group (no error state, no group field-message), so this def deliberately does NOT invent one: whether the group composes a nested `field-message` for the error, and what an errored group looks like, is held for owner decision. `required` IS carried (via the nested FieldLabel and aria-required); error is not. Same [HELD] as `checkbox-group`.',"variable row count \u2014 [HELD]. Prism 2 models the group with six fixed rows plus node-visibility booleans (rows 3\u20136 defaulting OFF, so 2 visible by default \u2014 one fewer than checkbox's three). In code the count is simply `children: RadioRow[]` of any length. This def represents the stack with three fixed row nests rather than porting the six-rows-with-booleans mechanism (which would be the corpus's first boolean-toggled `nest`); the count and the boolean model are held for owner confirmation, matching `checkbox-group`.","orientation \u2014 [HELD]. The group `orientation` (vertical / horizontal) is `RadioGroup`'s own axis (`radio-row` records it there); Prism 2 is vertical only. Vertical scans better and lets long option labels wrap, so it is the built default and horizontal is not invented here \u2014 a horizontal axis is held rather than guessed at, the same as `checkbox-group`.","the disabled dim \u2014 a disabled GROUP dims every row and the label, driven by the group's context (the CSS cascade / a data-attribute), not by a prop on each row. It is [HELD] out of the Figma projection (Prism 2 shows no group disabled treatment), so a designer sees the rest configuration and a code consumer gets the dim from the group.",'the id / describedby WIRING and role="radiogroup" \u2014 the host generates ids, ties the FieldLabel to the group via aria-labelledby, and stitches any group message into aria-describedby. Figma has no accessibility tree and no node-to-node reference, so the nested label sits above the rows and is associated by proximity alone (the ceiling field-label already hits).',"RTL \u2014 the group mirrors through logical properties: the label aligns to the reading start and each option mirrors its control to that side. The disc is symmetrical, so nothing inside it needs holding unmirrored (brief \xA79). Figma members are drawn left to right.","text expansion \u2014 vertical is the default partly for this: horizontal option rows are fragile under expansion (German up to about 300%), prone to clipping and to a label sitting nearer the wrong control, while a vertical stack wraps safely (brief \xA79). The Figma members carry the English placeholder only."]},figmaProperties:{variantAxes:["size"],booleans:{}},accessibility:{role:`radiogroup (role="radiogroup" on the container, or a native <fieldset>) with aria-labelledby pointing at the FieldLabel; each row is a native <input type="radio"> sharing the group's name`,wcag:['1.3.1 Info and Relationships (the group structure \u2014 role="radiogroup" + the shared label \u2014 is the meaning)',"3.3.2 Labels or Instructions (the group label, announced once for the set)","3.3.1 Error Identification / 3.3.3 Error Suggestion \u2014 the intent, at the GROUP level and announced once. The group error display is not designed yet, so this def does not meet either today.","4.1.2 Name Role Value (the group name via aria-labelledby; each option carries its own checked)","2.4.13 Focus Appearance / 1.4.11 Non-text Contrast (the control boundary and focus indicator, on each option)","2.5.8 Target Size (each row is its own target \u2014 the group does not change that)"],keyboard:`The keyboard model is the opposite of Checkbox.Group's. The group is a single tab stop: Tab moves into the group and the next Tab moves out, while arrow keys move between options, wrapping at the ends, with Home/End jumping to first/last. Space selects the focused option, and selection FOLLOWS FOCUS by default (arrowing moves focus and selects \u2014 native <input type="radio"> behavior and the APG default). Implement with ROVING TABINDEX \u2014 one radio at tabindex="0" (the checked one, or the first if none), siblings at -1, arrow handling moving focus and calling .focus() \u2014 not aria-activedescendant. Making each option its own tab stop is the most common radio accessibility failure. NEVER override Enter (it submits the enclosing form).`,focus:"Focus lands on ONE option at a time (roving), not on every option in turn. On focus restore into the group (a validation error, a legend click), focus the CHECKED radio rather than blindly the first; if none is checked, the first non-disabled option. The group container is not itself focusable. Keep the :focus-visible ring INSTANT (a fade lags rapid arrow navigation) and circular (the control is full-round).",aria:'Prefer role="radiogroup" on a div plus aria-labelledby over <fieldset>/<legend>: both are valid, but fieldset has flexbox/grid quirks that make it hard to style, and role="radiogroup" keeps the layout freedom while preserving the shared-label announcement. THE GROUP LABEL IS MANDATORY FOR MEANING: without it assistive tech announces an orphaned "radio button, 1 of 3". The GROUP owns required and error \u2014 aria-required and aria-invalid associate to the group and announce once; an individual option never owns its own required or error. Native inputs sharing a name give the grouping, the exclusivity and the roving-tabindex keyboard model for free. Do not double-label: the rows carry their short labels, the group carries the decision.'},content:{labelPattern:`The group label NAMES THE DECISION or asks the question ("Shipping method", "How should we contact you?"), abstracting the shared word up so its rows read the short remainder ("Standard", "Express", "Overnight"). Sentence case, no trailing colon \u2014 FieldLabel's rules. May be visually hidden when an enclosing labeled section already frames it, but must stay programmatically present.`,errorPattern:'GROUP-LEVEL and specific \u2014 "Select a shipping method", stating what is wrong and how to fix it (SC 3.3.3), never "Invalid". The options stay neutral; the group carries the message. The error visual is not designed yet.',emptyPattern:'The group starts EMPTY by default, so no option carries a pre-selected state \u2014 this forces a deliberate choice. Pre-select only where a genuinely safe recommended default exists. A radio cannot be deselected, so once chosen the group cannot return to empty: an optional group must carry an explicit "None" or "N/A" option, or a stray click permanently pollutes the data. If a "None" option would corrupt the data model, the choice belongs in a clearable Select instead.'},docs:{usage:"Use to choose exactly one of 2 to about 7 mutually exclusive, all-visible options where seeing them all aids the decision \u2014 a shipping method, a plan tier. Give the group a label that names the decision; let it own the shared name, the single scalar value, required and validation, and derive each row's checked state from the value rather than wiring it on the row. Compose the rows as `children`. Prefer vertical orientation, which scans better and lets long labels wrap safely. Past about 7 options a Select or a filtering combobox (not built yet) scans better; for any-number selection use Checkbox.Group, and for an immediate-effect setting Switch.Row.",do:["Give the group a label that names the decision, so its rows can read the short abstracted-up remainder","Let the GROUP own the shared name, the single scalar value, required and validation \u2014 an option never manages its own","Derive each row's checked state from the group's scalar value; never wire checked on a row in a group",'Give an optional group an explicit "None" option \u2014 a radio cannot be deselected, so a stray click is otherwise permanent',"Keep required and error at the group level, announced once (aria-required / aria-invalid on the group)",'Prefer role="radiogroup" + aria-labelledby over fieldset/legend for the layout freedom'],dont:["Set checked, onChange or name on an individual option \u2014 all three belong to the group, and an option setting its own name breaks exclusivity outright","Make each option its own tab stop \u2014 the group is one stop with arrow navigation, and getting this wrong is the most common radio accessibility failure","Model an any-number choice as a radio group \u2014 that is Checkbox.Group","Reach for a radio group past about 7 options or in tight vertical space \u2014 that is a Select","Override Enter to select \u2014 Enter submits the form, and that expectation is universal"],contentGuidelines:'The group label names the decision; the rows carry the short options. Group errors read "Select a shipping method" rather than "Invalid".'},ai:{primaryPurpose:"Choose exactly one from a bounded set via a labeled stack of Radio.Row options, with the group owning the shared name, the single scalar value, group-level required and all validation.",whenToUse:"A small bounded single-select committed on save (shipping method, plan tier, a contact preference), where seeing all 2 to about 7 options aids the choice and the group needs one label, one required rule and one validation message.",avoidWhen:"Any number of options may be chosen (Checkbox.Group \u2014 exactly-one versus any-number), a single independent opt-in with no siblings (a lone Checkbox.Row), the change takes effect the instant it is toggled (Switch.Row, or a segmented control, not built yet), or the set runs past about 7 options or vertical space is tight (a Select, or a filtering combobox, not built yet).",commonPartners:["radio-row","radio-control","field-label","field-message"],triggerKeywords:["radio group","radio set","radios","single select","exactly one","choice list","pick one","choose one","mutually exclusive","shipping method","plan tier"],generationPriority:2},composition:{composesWith:["radio-row","field-label"],alternativeTo:["checkbox-group","select","switch-row"],replacesPatterns:['a bare set of <input type="radio"> with no shared label or group wiring',"a set of checkboxes misused for a mutually exclusive choice","per-option required / error scattered across the options instead of owned by the group"],supersededBy:[],planned:["form","combobox","segmented-control"]},motion:{enter:"None (present on mount). On select, the chosen option's dot scales in, about 100-150ms.",exit:"Selecting an option animates the previously selected option's dot out \u2014 exclusivity made visible, and the only exit a radio has. Rows do not animate in or out of the stack.",reduceMotion:"No layout motion. Under prefers-reduced-motion, both dots snap through opacity and color only; the focus ring appears instantly at every setting."},notes:{contested:["THE `size` AXIS IS A GENERALIZATION OF PRISM 2, NOT A REPRODUCTION \u2014 Prism 2's group is single-size (a Large label). The family-universal `size` axis is carried so the group is not the one form def frozen at one size, scaling the label and rows together by `follow`. `[HELD]`: the owner may prefer a single-size group; if so, drop the axis and pin the nested label/rows to one rung. Inherited from `checkbox-group` verbatim \u2014 the two groups match by sharing this fork's resolution, not by each deciding it.","THE GROUP PAINTS NOTHING and so declares no `paintKeys` \u2014 like `checkbox-group`, its whole color surface is its nested children's. The alternative (inventing a group fill or border) is exactly the surface Prism 2's transparent container does not have; a stack is structure, and its ink lives one level down in `field-label` and `radio-row` (whose control ink is `radio-control`'s).","`orientation` AND `density` ARE OMITTED. Brief \xA73, \xA74 and \xA715 give the group `orientation` (vertical default) and `density` (comfortable, compact; touch targets hold to 44/48 on mobile). Prism 2's group is vertical and single-density, so neither is an axis here; vertical is the built default and horizontal is held (see `codeOnly`). Same as `checkbox-group`.","THE GROUP `description` PROP IS DEFERRED (#1698, decision 3). The brief puts a group-level `description` beside `isRequired` and the error message. It would compose the same part the group error does, and that part is the held field-message decision, so it waits for it rather than inventing a helper slot the error design may reshape.","OPTIONS ARRAY VERSUS COMPOSITION (brief \xA73, \xA713). The configuration pattern passes `options={[{label, value}]}` (Atlassian, Fluent v8 `ChoiceGroup`) \u2014 terse and layout-safe, but a bottleneck once an option needs a thumbnail, tooltip or rich description. The composition pattern renders option children inside the group (Primer, Spectrum, Base Web, and Fluent v9, which deprecated its array `ChoiceGroup` for this reason). The practice defaults to COMPOSITION, bound through context \u2014 the checkbox-group model, scalar instead of array \u2014 and this def follows it: the stack is `children: RadioRow[]`."],unverified:["GROUP-LEVEL ERROR / VALIDATION DISPLAY IS `[HELD]`. The brief puts validation and the error message on the group; Prism 2 settles no visual for it. This def carries `required` (settled) and no error skin (unsettled). Whether the group nests a `field-message` for the group error, and what an errored group looks like, needs the owner \u2014 the same open question `checkbox-group` holds.","THE VARIABLE ROW COUNT IS `[HELD]`. The three fixed row nests stand in for Prism 2's six-rows-with-booleans (rows 3\u20136 default off, so 2 visible by default). In code the count is simply `children: RadioRow[]` of any length. If the projection should carry a designer-toggleable count, the mechanism is the node-visibility boolean on each row nest (schema-legal, unbuilt) \u2014 the same held mechanism as `checkbox-group`. There is no radio select-all to hold (a select-all is a multi-select affordance and does not apply).","THE NESTING IS UNVERIFIED ON A REAL HOST, the same way `checkbox-group`'s is: the group nests `radio-row` (which nests `radio-control` `nest-exposed`), the deepest chain in the corpus, and whether a doubly-nested instance's inherited sizing and exposed properties cooperate with the group's auto-layout is a real-host question the offline shim cannot answer. `test:roundtrip` builds every projected def and reads it back; the symptom to look for is a row instance stretched or an exposed selection that does not surface at the group."],evolution:["RESOLVED (#1699): `required` now DEFAULTS TO `false`, the brief's default (\xA715). It had defaulted `true` only because the nested FieldLabel built its required marker on by default; #1699 moved FieldLabel's own default to `false`, so the group follows the brief and the code default agrees with the Figma default (marker hidden) again.","THE WIDTH/FILL MODEL IS `checkbox-group`'S RESOLVED ONE, COPIED DELIBERATELY (#1503, #1475, owner Option B). The audit found every column-stacking form group hugged its width with rows that did NOT fill it, where Prism 2 gives a fixed 320px root with rows set to FILL \u2014 because the projection could not emit cross-axis child FILL. #1503 added that capability (`crossAxisFill` \u2192 `layoutAlign: STRETCH`) plus a `minWidth` width floor, and landed it on `checkbox-group` FIRST; this def mirrors it verbatim (container `minWidth: 320`, rows `crossAxisFill`), so the two match by sharing ONE resolution rather than each guessing \u2014 building `radio-group` to a different width model is the one outcome that guarantees they never match. `test:roundtrip` asserts each row reads back `layoutAlign: STRETCH` on the offline host (a real-host confirmation is the standing nesting caveat in `unverified`).","THE INTER-ROW GAP IS RESOLVED (#1623 sign-off), shared with `checkbox-group`. Each `radio-row` carries 12px of block padding and so spaces itself, so the group binds a 0px gap (`space.0`) and adds no stack gap on top. The provisional size-keyed gap this entry used to hold is gone; the group's `size` axis still scales its label and rows through `follow`.",'Field POV (brief \xA713): the group became the mandatory first-class component, owning `name`, the single value and validation; composition replaced the options array (Fluent v9 deprecating `ChoiceGroup` is the marker); and `role="radiogroup"` + `aria-labelledby` replaced `fieldset`/`legend`.']}};var Sa={id:"switch-control",name:"Switch.Control",aliases:["switch-track","toggle-control","switch-atom"],category:"form",status:"draft",summary:"Switch track, thumb, state glyph and focus ring. Nested by Switch.Row; no label.",description:"The atomic switch control \u2014 the painted pill track, its traveling thumb, the X/checkmark state glyph in that thumb, and the focus ring, and nothing else. Nested by the labeled Switch.Row rather than placed on its own: it carries no label, no description and no hit-target padding, so a standalone use needs an external aria-label. Carries the two-value selection axis (off / on) whose thumb POSITION is the part that varies, the off-track border that is load-bearing for WCAG 1.4.11, and the 2px control border.",props:[{name:"checked",type:"boolean",required:!1,description:"The on/off appearance. Driven by the host row \u2014 a bare Switch.Control is styled by the coordinate, not wired to state here. The flip is immediate by the Row's contract; this atom only renders the two positions."},{name:"showStateLabel",type:"boolean",required:!1,default:!0,description:'The X/checkmark-in-the-
