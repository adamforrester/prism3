rungs were derived for a SOLID wash over the worst pixel; a fade meets that only on its first stop, so text placed toward the clear end sits on less wash than the rung name suggests. Nothing here can gate where a designer puts the text, so the usage prose says to verify contrast where the text sits.","THE NOMINAL SIZE IS A PLACEHOLDER, NOT A MEASUREMENT (#1280's idiom). `container.narrow` (720px) is what makes the standalone build a wash-shaped rectangle; a veil has no intrinsic size, so nobody has decided 720px is RIGHT \u2014 it is a legible placeholder a designer resizes. In real use the box is full-bleed, sized to its media container, which no standalone Figma component can express. If a nested or laid-out veil is ever found stuck at 720px, the fix is the consumer sizing it to its container, not a change here.","THE CONTRAST IS PER-IMAGE AND UNVERIFIABLE HERE \u2014 the whole reason #1317 renamed the rungs from WCAG floors to intensities. The engine derives each alpha as the least step clearing a floor against the WORST pixel of an UNKNOWN image, so the wash's effect on a REAL photo's combined contrast depends on that photo. This component cannot gate it; the accessibility and docs prose says to verify against the actual image, and there is no engine check that can stand in for that."]}};var Oa={id:"image-placeholder",name:"ImagePlaceholder",aliases:["media-frame","image-frame","photo-placeholder","empty-image","image-slot"],category:"foundations",status:"draft",summary:"Empty media frame locked to 1:1, 4:3 or 16:9. Drop an image fill onto it.",description:'An empty-state media frame that holds a photograph at a fixed aspect ratio. Pick a ratio (1:1, 4:3 or 16:9) and the frame keeps that proportion while its size flexes to its container; a designer drops an image fill onto it (a native Figma action, not a modeled slot). Before an image arrives it shows a neutral fill and a centered "no image" marker, and it clips its content so a mismatched photo cannot overflow the frame.',props:[{name:"ratio",type:"enum: '1:1' | '4:3' | '16:9'",values:["1:1","4:3","16:9"],default:"4:3",required:!1,description:"The width-to-height PROPORTION the frame holds while its actual size flexes \u2014 a square (1:1), the classic photo ratio (4:3), or widescreen (16:9). It is an aspect-ratio LOCK, not a pair of fixed dimensions: the frame derives its height from its width (or the reverse) so the shape survives being resized. Pick it from the media the frame will hold."}],states:[],variants:{ratio:["1:1","4:3","16:9"]},axisKinds:{ratio:"authoring"},paintKeys:["{slot}"],tokens:{fill:"color.background.secondary",icon:"color.icon.tertiary","nominal-side":"container.narrow"},anatomy:{root:"frame",parts:{frame:{kind:"box",role:"target",aspectRatio:"ratio",width:"nominal-side",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},clipsContent:!0,paintSlots:["fill"],children:["marker"],note:"The media frame: a neutral fill, an aspect-ratio lock, and clipping so a dropped image stays inside. Its width is nominal (720px) and a designer resizes it; the ratio holds while the size flexes."},marker:{kind:"vector",glyph:"image",glyphPx:180,note:'The centered "no image" marker \u2014 a muted glyph shown until a photograph is dropped in, sized to read as a proportion of the media frame.'}},codeOnly:["aspect-lock derive \u2014 the frame holds its RATIO while its real size flexes, and Figma expresses that as an aspect-ratio LOCK (`lockAspectRatio()`) that DERIVES the second dimension from the first. The engine binds ONE nominal dimension and locks the ratio; that a variable BINDING on the single axis makes Figma derive the other at PASTE time (as a resize does) is a live-file behavior no offline host can witness, filed for the real-host round-trip arm (`tools/component-roundtrip/`). What the offline gates hold is the lock capturing the right ratio, read back as `targetAspectRatio`.","raster swap \u2014 dropping an actual photograph onto the frame is a NATIVE Figma action (an image fill), not a modeled slot or variant. This def models the frame and its empty state; the image the designer supplies is theirs.","scrim/veil and play-circle overlays \u2014 DEFERRED to a follow-up (#1316 residue, owner-held). A wash for text over the image nests the `veil` component, and a video affordance nests the `play-circle` glyph; both are compositions this core empty-state frame does not carry. Named here so the absence reads as a deferral rather than a gap.","the ratio is a magnitude of SHAPE, not a state \u2014 1:1 / 4:3 / 16:9 is a proportion a designer selects, carried by Figma as a variant coordinate, never a runtime state. An image placeholder has no interaction states at all (`states: []`)."]},figmaProperties:{variantAxes:["ratio"],footprintVaries:["ratio"],booleans:{}},accessibility:{role:'img once it holds an image: with a descriptive accessible name when the image is informative, or an empty alt (`alt=""`) when it is decorative, which removes it from the accessibility tree. The empty frame is presentational. The "no image" marker inside it is decorative and aria-hidden; it is a visual affordance, not the accessible content.',wcag:['1.1.1 Non-text Content \u2014 an image placeholder that ships as a real image needs a text alternative describing it, or an empty `alt=""` when the image is decorative (image.md \xA76: an omitted alt and an empty one behave oppositely); the empty-state marker is decorative and is hidden from assistive tech',"1.4.11 Non-text Contrast \u2014 where the frame edge is a meaningful boundary, verify it against the surface behind it; the neutral fill is a background, not a UI boundary carrying meaning",'1.4.1 Use of Color \u2014 the marker signals "no image" by shape and position, not by color alone'],focus:"None of its own \u2014 the frame is not focusable as an empty placeholder. If it becomes an interactive media element (a button that opens a picker), that control carries its own focus; the placeholder frame does not invent one.",aria:'Once the frame holds a real image, decide whether the image is informative or decorative. Informative: an img role and an accessible name that describes its function, not the picture. Decorative: an empty alt (`alt=""`), never an omitted one \u2014 some screen readers announce the file name when alt is missing. Mark the "no image" marker aria-hidden \u2014 it is a decorative affordance, and announcing it would add nothing. Do not rely on the marker as the accessible description of the eventual image.'},content:{labelPattern:'An image placeholder carries no text of its own. Where its ratio variants surface in a UI, name the proportion plainly \u2014 "16:9", "Square" \u2014 rather than a pixel dimension, because the frame holds a ratio and not a fixed size.'},docs:{usage:"Use an image placeholder wherever a layout reserves space for a photograph before one is chosen \u2014 a card's media slot, a hero, a gallery cell. Pick the ratio from the media it will hold (1:1 for square thumbnails, 4:3 for standard photography, 16:9 for video stills and wide banners); the frame keeps that proportion while it flexes to its container, so a row of cards stays aligned even as their widths change. Drop a photograph onto the frame as an image fill \u2014 a native Figma action. The frame clips its content, so a mismatched image stays inside the ratio rather than overflowing.",do:["Pick the ratio from the media the frame will hold, and let the lock keep it while the size flexes","Drop the photograph on as an image fill \u2014 the frame is the container, not a swappable slot","Give an informative image an accessible name and a decorative one an empty alt; keep the empty-state marker decorative and aria-hidden","Let the frame clip \u2014 a photo cropped to the ratio reads better than one that overflows the layout"],dont:["Hard-code a width AND a height to fake a ratio \u2014 the frame holds the ratio and derives the second dimension, so two fixed sizes fight the lock and break on resize",`Treat the "no image" marker as the image's description \u2014 it is a placeholder affordance, replaced when a photograph arrives`,"Reach for an image placeholder as a decorative wash over a photo \u2014 that is the `veil` component (a follow-up may compose the two)","Expect a play or scrim overlay yet \u2014 those are not built yet; this is the core empty-state frame"],contentGuidelines:'The frame holds no copy. Where its ratio surfaces in a UI, name the proportion ("16:9", "Square"), not a pixel size \u2014 the frame holds a ratio, not a fixed dimension.'},ai:{primaryPurpose:"Reserve space for a photograph at a fixed aspect ratio, holding the proportion while the frame flexes to its container, and show a neutral empty state until an image is dropped in.",whenToUse:"A layout needs a media slot at a known proportion before the image is chosen \u2014 a card's photo area, a hero, a gallery cell. Pick 1:1, 4:3 or 16:9 from the media it will hold; the frame keeps that ratio as it resizes and clips whatever image is dropped onto it.",avoidWhen:"The surface is a decorative wash over an existing photo (that is the `veil` component), the image is already present and fixed (place it directly), or the space needs a play button or a legibility scrim over the media (not built yet \u2014 this is the core empty-state frame only).",commonPartners:["icon","veil"],triggerKeywords:["image placeholder","media frame","photo frame","aspect ratio","16:9","4:3","square image","empty image","image slot","no image","media slot"],generationPriority:3},composition:{composesWith:[],alternativeTo:[],replacesPatterns:["a hand-drawn rectangle with a fixed width and height standing in for an image, which breaks its ratio the moment it is resized"],supersededBy:[]},notes:{contested:["THE FILL SLOT IS `fill`, bound to `color.background.secondary`, and that role is a call rather than the only option. An empty media frame could read as the page (no fill), as a recessed well (`background.tertiary`), or as a distinct filled surface (`background.secondary`). The middle reads as a deliberate placeholder distinct from the page while staying quiet, which is what an empty state wants; a designer who wants a more recessed well rebinds to `background.tertiary`. Named here so the choice is weighable rather than assumed.","THE SINGLE NOMINAL DIMENSION IS `width`, not `height`, and that is the natural axis for a media frame that is usually as wide as its column and derives its height from the ratio. A portrait-first layout would bind `height` instead; the aspect-lock capability accepts either (the validator refuses only binding BOTH). `width` is the common case, so it is the default here."],unverified:["THE PASTE-TIME DERIVE IS FIGMA-DOCUMENTED FOR RESIZE, NOT PROVEN FOR A BOUND VARIABLE. `lockAspectRatio()` derives the second dimension when a locked node is resized on one axis, and `targetAspectRatio` is read-only. Binding a variable on the single axis SETS that dimension, which is a resize \u2014 so the derive should hold \u2014 but that a `setBoundVariable` triggers it at paste time is a live-file behavior no offline host can witness, the same class as accept-and-discard. The offline gates prove the lock is captured with the right ratio (read back as `targetAspectRatio`); the derive-on-paste is filed for the real-host round-trip arm. If a pasted placeholder is ever found NOT deriving its height, the fallback is Option C \u2014 a nominal square plus the ratio carried in code/AI metadata only \u2014 and this note is the record that A was chosen on Figma's documented lock contract rather than on a live paste.","THE OVERLAYS ARE DEFERRED (#1316). A legibility scrim/veil over the image and a play-circle video affordance both nest other components and are owner-held for a follow-up. Named here and in `codeOnly` so the absence reads as a deferral rather than a gap.","THE NOMINAL WIDTH IS A PLACEHOLDER, NOT A MEASUREMENT (the veil/focus-ring idiom). `container.narrow` (720px) makes the standalone build a media-shaped rectangle; the frame has no intrinsic size, so nobody has decided 720px is RIGHT \u2014 it is a legible placeholder a designer resizes over their layout, and the ratio, not the width, is the fixed fact.","THE MARKER SIZE IS A FIXED FLOOR (180px), NOT A SIZE THAT TRACKS THE FRAME ON RESIZE (#1340). The owner asked to make the marker larger and, ideally, to scale it with the frame. A larger FIXED size grounded in Prism 2 (180px, its centered-glyph proportion, `glyphPx` on `marker`) is what shipped. TRUE proportional scaling \u2014 the marker tracking the frame's actual flexing extent as a designer resizes it \u2014 would need a Figma scale-constraint / percentage-size projection the engine does not have: the fluid `100%` container is skipped for exactly this reason (Figma has no percentage FLOAT primitive), and a per-ratio glyph would still be three fixed sizes, not resize-tracking. Filed as a follow-up mechanism question; the fixed floor is the deliverable, and 180px already reads as a proportion of the frame at every ratio (25% / 33% / 44% of the shorter side at 1:1 / 4:3 / 16:9), so the marker is no longer the stray 32px icon #1340 named."]}};var Ca={id:"spinner",name:"Spinner",aliases:["loading-indicator","activity-indicator","loader","busy-indicator","loading","inline-loading","spin"],category:"foundations",status:"draft",summary:'Indeterminate loading indicator on the icon ladder. Announces "Loading" unless its host hides it.',description:"A rotating arc over a faint full ring, showing that work is in progress with no known end. Sized on the icon ladder (16 / 20 / 24 / 32) and inked from the surrounding text or icon color, so it drops into any icon slot \u2014 a button's leading visual, a field's trailing slot. On its own it is a polite status named \"Loading\", or a more specific `label`; inside a host that announces its own busy state, the host hides it with `aria-hidden`. It has no value, so it never stands in for a determinate progress bar.",props:[{name:"size",type:"enum: 'x-small' | 'small' | 'medium' | 'large'",values:["x-small","small","medium","large"],default:"medium",required:!1,description:"The icon ladder: 16 / 20 / 24 / 32. The band scales with it (2px at 24). Inside a host slot, take the slot's own icon size."},{name:"label",type:"string",default:"Loading",required:!1,description:'The accessible name of the spinner\'s `role="status"` wrapper, visually hidden and announced politely. "Loading" by default; name the work when it is known ("Loading results"). A host that already announces its own busy state (a Button or IconButton `isPending`, which set `aria-busy` and carry their own live region) puts `aria-hidden="true"` on the spinner instead, so the state is announced once.'}],states:[],variants:{size:["x-small","small","medium","large"]},axisKinds:{size:"authoring"},paintKeys:["{slot}"],tokens:{"size.x-small":"icon.size.xs","size.small":"icon.size.sm","size.medium":"icon.size.md","size.large":"icon.size.lg",icon:"color.icon.primary"},anatomy:{root:"frame",parts:{frame:{kind:"box",role:"target",size:"size.{size}",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},children:["ring"],note:"The square on the icon ladder. Paints nothing; it is the box a host resizes to its own slot. `target` only in the schema's sense \u2014 the spinner is never interactive."},ring:{kind:"vector",glyph:"spinner",size:"size.{size}",note:"The composed drawing: the track (a full ring at 20% layer opacity) under the head arc (33% of the circle, round caps), both filled outlines inked with the one icon color. Drawn at the rest position \u2014 the arc starting at twelve o'clock and running clockwise."}},codeOnly:["rotation \u2014 the whole behavior. In code the spinner turns continuously: `animation: spin var(--motion-duration-spin) linear infinite` (800ms per turn), a `@keyframes spin { to { transform: rotate(1turn) } }` on the SVG. Figma holds one rest position per size; a prototype rotation loop for presentations is optional and not built here.","reduced motion \u2014 under `@media (prefers-reduced-motion: reduce)` the turn SLOWS to `var(--motion-duration-reduced-spin)` (2600ms per turn), still linear and infinite. Not a pulse and not a static ring: the turn is what tells a sighted user work is continuing, so reduced motion keeps it and takes the speed out of it.",'the stroke in code \u2014 one `<svg viewBox="0 0 24 24">` with two circles at r=10: the track at `stroke-opacity: 0.2` and the arc with `stroke-dasharray` 33% of the circumference (20.73 of 62.83), both `stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"`, the arc rotated -90deg so it starts at twelve o\'clock. The viewBox scales the 2-unit stroke with the rendered size, the same proportion the Figma outlines hold.',"a fixed arc \u2014 MUI's `disableShrink`, held by construction. The only animation is the GPU `transform: rotate` above; the arc's `stroke-dasharray` is static, and nothing animates `stroke-dasharray` or `stroke-dashoffset`. A dash animation is computed by layout and paint, so it drops frames or freezes under heavy main-thread load (parsing a large JSON payload, rendering a large React tree) \u2014 exactly when a spinner most needs to look alive (brief \xA78).",'right-to-left \u2014 the turn stays clockwise and does not mirror (Spectrum\'s rule, brief \xA79). Clockwise reads as time moving forward; counter-clockwise reads as undo or going back. Layout mirrors through logical properties, and the rotation is the deliberate exception, so no `[dir="rtl"]` rule flips it.',"enter fade \u2014 the spinner fades in when it mounts: `opacity` 0 \u2192 1 over `var(--motion-duration-fast)` on `var(--motion-easing-role-enter)`, and under reduced motion over `var(--motion-duration-reduced-fast)`, because a change of opacity is not vestibular motion. Figma holds the visible member.","anti-flash delay \u2014 the HOST's, not the spinner's. A spinner that appears for a fast operation flashes, so the host waits about 200\u2013500ms before mounting it and renders nothing if the work resolves first; once shown, the host keeps it about 500ms so it does not flash for one frame, and clears both timers on unmount (brief \xA711, inherited from Progress; Ant and Fluent expose the wait as a first-class `delay` prop). A button's `isPending` \"delays the spinner\". The spinner renders the moment it is mounted.",'announcement \u2014 a wrapper with `role="status"` and `aria-live="polite"` around an `aria-hidden` `<svg>`, with the `label` ("Loading" by default) in a visually hidden span (brief \xA711). A host that already announces its busy state through its own live region \u2014 a Button or IconButton `isPending`, or a region carrying `aria-busy` with a live status (Primer\'s stance) \u2014 puts `aria-hidden="true"` on the spinner, so the state is announced once. Never `aria-valuenow` and never `role="progressbar"`: a spinner has no value.']},figmaProperties:{variantAxes:["size"],booleans:{},emitAsComponents:!0},accessibility:{role:'`status` with `aria-live="polite"`, named by `label` \u2014 "Loading" by default. Hidden (`aria-hidden="true"`) inside a host that announces its own busy state.',wcag:["1.1.1 Non-text Content (the drawing is `aria-hidden`; the status text is the name)","1.4.11 Non-text Contrast (the arc takes its host's icon ink, meant to clear 3:1; the track is decorative and exempt)",`4.1.3 Status Messages (the polite "Loading" status when it stands alone; the host's own announcement when the host hides it)`],focus:'None. The spinner takes no focus. A pending host control keeps its own: it takes `aria-disabled="true"`, not native `disabled`, which takes the control out of the focus order and sends focus to the page body (USWDS), and it suppresses the repeat click in script \u2014 see Button\'s `isPending`.',aria:'Standalone, the default: a `role="status"` wrapper with `aria-live="polite"`, named by `label` ("Loading" unless a more specific label is given), around an `aria-hidden` drawing. Inside a host that already announces its busy state \u2014 a Button or IconButton `isPending`, which set `aria-busy` and carry their own polite live region \u2014 the host sets `aria-hidden="true"` on the spinner, so the state is announced once rather than twice. Never `aria-valuenow` and never `role="progressbar"`: a spinner has no value, and an indeterminate progressbar can make some screen readers keep announcing the missing value.'},content:{labelPattern:'Name the work, in sentence case: "Loading results", "Saving changes" \u2014 not a generic "Loading\u2026". "Loading" is the fallback only when nothing more specific is known. One status for the whole wait, not a chain of steps ("Fetching\u2026", "Parsing\u2026") that floods the live region; for a region or a longer wait, the host announces completion ("Results loaded").'},docs:{usage:'Use a spinner for a short wait with no known end \u2014 about 200ms to 5s \u2014 inside the thing that is waiting: a button that is saving, a field checking its value, a region reloading. Size it to the icon slot it sits in, and let it take the ink around it. The host decides when it shows (after a short delay, so a fast operation does not flash). On its own the spinner announces a polite "Loading" status, or a more specific `label`; inside a host that announces its own busy state, such as a Button\'s `isPending`, the host sets `aria-hidden="true"` on it.',do:["Put the spinner in the host's own icon slot at that slot's icon size, so nothing around it moves","Let the host delay showing it, so a fast operation does not flash a spinner",'Give a standalone spinner a specific `label` ("Loading results") when the work is known','Set `aria-hidden="true"` on a spinner inside a host that announces its own busy state (`aria-busy`, a Button\'s `isPending`)',"Keep the turn under reduced motion, slowed to the reduced duration"],dont:["Use a spinner for work with a known length \u2014 show determinate progress","Draw a static loading glyph from the icon set instead \u2014 it drops the rotation, the reduced-motion turn and the announcement",'Leave a spinner exposed inside a host that already announces its busy state \u2014 the state is announced twice; set `aria-hidden="true"` on it','Keep the generic "Loading" when the work is known \u2014 name it ("Loading results")',"Show many spinners at once \u2014 a dashboard that starts one per widget on load reads as noise; use one placeholder for the layout and keep the spinner for a single user-triggered wait (Primer)",'Put `role="progressbar"` or `aria-valuenow` on a spinner \u2014 it has no value, and a value is determinate progress',"Stop the turn under reduced motion \u2014 slow it"],contentGuidelines:'Label: specific and in sentence case \u2014 "Loading results", "Updating profile" \u2014 not a generic "Loading\u2026"; "Loading" is the fallback when nothing more specific is known. One status for the whole wait, and for a region or a longer wait the host announces completion ("Results loaded"). Inside a button, the button keeps its accessible name while pending.'},ai:{primaryPurpose:"Show that work is in progress with no known end, inside the control or region that is waiting.",whenToUse:"A short indeterminate wait of about 200ms to 5s (Material 3's bands) inside a host: a pending Button, a field validating its value, a region reloading. Size it to the host's icon slot.",avoidWhen:"The wait is under 200ms (show nothing \u2014 a spinner shown that briefly only flashes), runs past about 5s or has a known length (determinate progress, not built yet \u2014 including a circular progress with a value), the page is loading its layout (a skeleton, not built yet), or you want a static icon \u2014 the spinner is behavior, not a glyph.",commonPartners:["button","icon-button","text-field","select"],triggerKeywords:["spinner","loading","loader","busy","pending","activity indicator","loading indicator","inline-loading","spin"],generationPriority:3},composition:{composesWith:[],alternativeTo:[],planned:["progress","skeleton","toast"],replacesPatterns:["an animated loading GIF","a static loading glyph in the icon set"]},motion:{enter:"A quick fade in on mount: opacity over `motion.duration.fast` (100ms at the standard tempo) on the `motion.easing-role.enter` curve. The host decides when to mount it.",exit:"none",reduceMotion:"The turn runs `motion.duration.spin` (800ms) per turn, linear and infinite. Under prefers-reduced-motion it runs `motion.duration-reduced.spin` (2600ms) per turn instead \u2014 slower, never stopped. The enter fade stays, on `motion.duration-reduced.fast` \u2014 a change of opacity is not vestibular motion."},notes:{contested:["THE TRACK IS A LAYER OPACITY, not a variable carrying the alpha (#1673's approach) and not a paint opacity. The spinner takes whatever ink its host pushes (on-fill, icon ink, disabled ink, their inverse twins); a 20% variable would need a twin of every one, and the host would still push its solid ink onto the track. A paint opacity is reset when the host rebinds the paint. A layer opacity survives both.","STANDALONE COMPONENTS, not one variant set (`emitAsComponents`). The button swaps a spinner into its icon slot by component name, and a set member's name is not unique in a file.","THE TURN IS NOT TEMPO-SCALED. `motion.duration.spin` holds 800ms at every tempo, where the transition ramp scales with the brand's tempo lever.",'A SEPARATE PRIMITIVE, not a `CircularProgress` variant (brief \xA71, \xA710). The practice default, and this def: a separate `Spinner` keeps the no-value contract off a component that carries `value` / `min` / `max`, so a button loader is never read as a `progressbar` that needs a value. The alternative is the fold MUI (`CircularProgress variant="indeterminate"`) and Spectrum (`ProgressCircle isIndeterminate`) ship. Material 3 split its "Loading indicator" out of indeterminate progress in May 2025 (unverified, see below).','THE ANNOUNCEMENT MODEL (brief \xA76) \u2014 three methods in the field: `role="status"` with a hidden "Loading" (the APG-recommended pattern, and this def\'s default); an indeterminate `role="progressbar"` with no `aria-valuenow` (permitted, but some screen readers keep announcing the missing value, so ruled out here); and `aria-busy` on the region with an `aria-hidden` drawing (Primer; the practice default for the overlay or region case, and what a host does when it hides the spinner).',"INLINE vs OVERLAY, and the API divide (brief \xA73, \xA74). This def is the inline primitive only: no mask, no `spinning` toggle, no `fullscreen`. The alternatives are Ant's `Spin`, which wraps content in a dimming mask and blocks it, and, on API shape, Base Web's exhaustive `overrides` (drilling into `Svg` / `TrackPath`) against Spectrum's locked-down API (only `staticColor`). This def sits at the locked-down end: `size` and `label`.","REDUCED MOTION SLOWS THE TURN rather than substituting a pulse (owner, 2026-09-26). Brief \xA76 and \xA78 name a slow opacity pulse, or a static indicator with a low-frequency text ellipsis, as the substitute. Both agree on the rule that matters: never a frozen ring, which reads as a crash (Primer: make it subtle, do not remove it).","THE ANTI-FLASH DELAY IS THE HOST'S, not a `delay` prop. Brief \xA73 lists `delay` (~200\u2013500ms), a first-class prop in Ant and Fluent. The host already decides when to mount the spinner and owns the busy announcement, so the timer sits with that decision; a `delay` prop would put a second timer beside the host's. The alternative is the brief's prop, defaulting to 0.","NO 2.2.2 OR 2.3.3 CLAIM (owner, 2026-09-26). Brief \xA76 lists 2.2.2 Pause, Stop, Hide and 2.3.3 Animation from Interactions for the reduced-motion rule; the owner declined both claims, so `accessibility.wcag` names 1.1.1, 1.4.11 and 4.1.3 only.","CIRCULAR-PROGRESS AND PROGRESS-CIRCLE ARE NOT ALIASES here, though brief \xA710 lists both to map. They are MUI's and Spectrum's names for the fold the practice keeps apart, and in this repo the circular progress on record (`reference/Prism2/component-specs/circular-progress-indicator.json`) is determinate and feeds the planned Progress component. Routing those names to the spinner would hand an agent asking for a circular progress with a value the one component that has none. The alternative is the brief's mapping, which fits a system with no determinate circle.","A VISIBLE LABEL AND `labelPosition` \u2014 deferred by owner (2026-09-27). The `label` is visually hidden. The brief's alternative (\xA72, \xA73, \xA79): an adjacent text slot (Ant's `description`, replacing `tip`), placed by `labelPosition` before / after / above / below (Fluent), which flips logically under RTL.","`staticColor` \u2014 deferred by owner (2026-09-27). The spinner takes its host's ink. The brief's alternative (\xA73, \xA74, \xA76): Spectrum's white / black `staticColor` for a spinner over imagery or video, where theme roles fail 3:1.","THE OVERLAY / MASK \u2014 deferred by owner (2026-09-27). The brief's alternative (\xA72, \xA74, \xA711): a `position: relative` wrapper with an absolute scrim dimming the wrapped content and a centered spinner (Ant `Spin`; `fullscreen` for a page-blocking loader), blocking interaction only for genuinely blocking work (`pointer-events` / `inert`, plus `aria-busy` on the masked content).","A `spinning` PROP \u2014 deferred by owner (2026-09-27). The brief's alternative (\xA73): Ant's toggle that shows the overlay over wrapped content. The host mounts and unmounts the spinner instead.","A SUCCESS / ERROR END STATE \u2014 declined by owner (2026-09-27). Brief \xA74 notes Carbon's `InlineLoading` resolving to a checkmark or an error mark, without arguing for or against it, and \xA712 closes the loop with a background spinner resolving into a success or failure toast. The outcome belongs to the host, or to a toast or inline message, not to the spinner."],unverified:['The external 2026 version numbers and the Material 3 "Loading indicator" split (May 2025 Expressive Update) \u2014 brief \xA714 holds them loosely and flags them unverified, and so does this def. They back the separate-primitive call and the 200ms / 5s bands, both of which stand on their own reasoning.','The `role="status"`-versus-`role="progressbar"` announcement specifics \u2014 which screen readers keep announcing an indeterminate progressbar\'s missing value. The brief asks for verification against current screen readers; not verified here.',"1.4.11 for the arc: it takes its host's icon ink and is stated to clear 3:1, but that is not measured per host. Standalone it binds `color.icon.primary`, which the engine gates against `background.primary`; inside a host it takes whatever ink the host pushes (on-fill, disabled ink, their inverse twins), and no gate composes the spinner onto each host's ground and measures the arc there."],evolution:["VERIFIED ON A REAL HOST (2026-09-26). The two items this def shipped as unverified were measured live through `figma.createNodeFromSvg` in the owner's test file. The importer makes one VECTOR per `<path>`, in path order, named by its `id`. `track` imports at layer opacity 0.2 (read back as 0.20000000298, single precision), even-odd winding, 22x22 at (1,1). `arc` imports at opacity 1, nonzero winding, 12x16.79 at (11,1). Both outlines arrive as cubic curves (24 and 16 segments, no straight lines), so the elliptical-arc commands convert without flattening.",'THE DEFAULT ANNOUNCEMENT (owner, 2026-09-27). The def shipped hidden by default, speaking only with a `label` \u2014 which put the brief\'s first trap, an unlabeled spinner silent to assistive tech, on the default path of every standalone use. Now `label` defaults to "Loading" and the spinner is a polite status; a host that announces its own busy state opts out with `aria-hidden="true"`. Button and IconButton say so in their `accessibility.aria`.','THE ENTER FADE (owner, 2026-09-27). `motion.enter` was "none (present on mount)"; it is now a quick opacity fade on `motion.duration.fast`, the brief\'s "appear is a quick fade" (\xA78). `instant` (50ms) was the shorter candidate and reads as a cut at the standard tempo. At the relaxed tempo `motion.duration-reduced.fast` falls to 50ms too, so under reduced motion a relaxed brand gets the shorter fade; accepted, since a shorter fade is the conservative direction there. No new token.',"CATEGORY `feedback` \u2192 `foundations` (2026-09-27), to brief \xA715. Nothing reads the field beyond the required check, so no surface moved.","FIELD (brief \xA713.1): loading rendering went from GIF to CSS `border-radius` to inline SVG \u2014 precise, and themeable through `currentColor` and dash control. This def is the SVG end, drawn as outlines in Figma.",'FIELD (brief \xA713.2): the spinner-versus-progress split. Material 2 folded the two into an indeterminate `CircularProgress`; Material 3 (May 2025) split its "Loading indicator" out for short waits. The practice keeps them distinct in name and contract even where the rendering is shared.','FIELD (brief \xA713.3): never unlabeled. A bare animated SVG is silent to assistive tech; `role="status"` with a "Loading" name, or `aria-busy` on the region, is now the baseline. The default "Loading" above is this def\'s answer.',"FIELD (brief \xA713.4): `aria-disabled` over `disabled` in loading buttons (USWDS), keeping focus and the workflow rather than sending focus to the page body. Button's `isPending` carries it.","FIELD (brief \xA713.5): the anti-flash discipline, the reduced-motion substitute and `currentColor` theming, carried over from the perceived-performance and motion-accessibility work."]}};var Ia={id:"badge",name:"Badge",aliases:["status-badge","counter-badge","notification-badge","notification-dot","presence-badge","label","counter","state-label"],category:"foundations",status:"draft",summary:"A static status label, count or dot. Nothing to click, and color is never the only signal.",description:"A small, static marker of one of three types. A status label is short text in the flow of content, such as a lifecycle state, a keyword or a file size, and it announces its own text. A count is a number over a host, such as unread messages on an icon button, capped at a maximum. A dot is a contentless mark over a host for presence or unread state. A count or dot is hidden from assistive technology, and its meaning goes in the host's accessible name. A badge has no hover, focus or pressed state. Anything a user can click, toggle or remove is a tag.",props:[{name:"type",type:"enum: 'status' | 'count' | 'dot'",values:["status","count","dot"],default:"status",required:!1,description:"Which kind of badge. status = a short label in flow that announces its own text. count = a number over a host, hidden from assistive technology. dot = a contentless mark over a host, also hidden. For a count or dot, the host carries the meaning in its accessible name."},{name:"emphasis",type:"enum: 'subtle' | 'bold'",values:["subtle","bold"],default:"subtle",required:!1,description:"How strongly a status label reads. subtle = the tone's tint with a 1px edge in the tone's border color, for a state that sits beside other content. bold = the solid tone fill, for a state that needs to stand out. A count and a dot are always bold."},{name:"tone",type:"enum: 'neutral' | 'info' | 'success' | 'warning' | 'danger'",values:["neutral","info","success","warning","danger"],default:"neutral",required:!1,description:"Which semantic role the badge paints from. The text carries the meaning, so a tone never stands in for it."},{name:"label",type:"string",required:!1,description:"The status text, for type status. One or two words, in consistent casing across the product."},{name:"value",type:"number",required:!1,description:"The count, for type count. Above max it shows as max followed by a plus sign, formatted for the locale."},{name:"max",type:"number",default:"99",required:!1,description:'The largest count shown in full, for type count. A larger value shows as "99+".'},{name:"showZero",type:"boolean",default:"false",required:!1,description:"Whether a count of zero still shows, for type count. Hidden by default, since zero is usually nothing to act on."},{name:"overlap",type:"enum: 'rectangular' | 'circular'",values:["rectangular","circular"],default:"rectangular",required:!1,description:"The host shape a count or dot sits over. circular pulls the badge in toward the curve so it stays on the host's edge, such as an avatar."}],states:[],variants:{type:["status","count","dot"],emphasis:["subtle","bold"],tone:["neutral","info","success","warning","danger"]},axisKinds:{type:"authoring",emphasis:"runtime",tone:"runtime"},paintKeys:["{tone}.{type}.{emphasis}.{slot}"],tokens:{type:"type.label.sm.emphasis","status.radius":"radius.sm","count.radius":"radius.round","dot.radius":"radius.round","status.pad-x":"space.150","status.pad-y":"space.100","count.pad-x":"space.075","count.pad-y":"space.025","dot.pad-x":"space.0","dot.pad-y":"space.0","dot-size":"control.size.sm.dot","border-width":"border-width.hairline","neutral.status.subtle.fill":"color.foreground.secondary","neutral.status.subtle.label":"color.text.primary","neutral.status.subtle.border":"color.border.secondary","info.status.subtle.fill":"color.foreground.info-subtle","info.status.subtle.label":"color.text.info","info.status.subtle.border":"color.border.info","success.status.subtle.fill":"color.foreground.success-subtle","success.status.subtle.label":"color.text.success","success.status.subtle.border":"color.border.success","warning.status.subtle.fill":"color.foreground.warning-subtle","warning.status.subtle.label":"color.text.warning","warning.status.subtle.border":"color.border.warning","danger.status.subtle.fill":"color.foreground.danger-subtle","danger.status.subtle.label":"color.text.danger","danger.status.subtle.border":"color.border.danger","neutral.status.bold.fill":"color.inverse.foreground.tertiary","neutral.status.bold.label":"color.inverse.text.primary","info.status.bold.fill":"color.foreground.info","info.status.bold.label":"color.text.on-info","success.status.bold.fill":"color.foreground.success","success.status.bold.label":"color.text.on-success","warning.status.bold.fill":"color.foreground.warning","warning.status.bold.label":"color.text.on-warning","danger.status.bold.fill":"color.foreground.danger","danger.status.bold.label":"color.text.on-danger","neutral.count.bold.fill":"color.inverse.foreground.tertiary","neutral.count.bold.label":"color.inverse.text.primary","info.count.bold.fill":"color.foreground.info","info.count.bold.label":"color.text.on-info","success.count.bold.fill":"color.foreground.success","success.count.bold.label":"color.text.on-success","warning.count.bold.fill":"color.foreground.warning","warning.count.bold.label":"color.text.on-warning","danger.count.bold.fill":"color.foreground.danger","danger.count.bold.label":"color.text.on-danger","neutral.dot.bold.fill":"color.inverse.foreground.tertiary","info.dot.bold.fill":"color.foreground.info","success.dot.bold.fill":"color.foreground.success","warning.dot.bold.fill":"color.foreground.warning","danger.dot.bold.fill":"color.foreground.danger"},anatomy:{root:"surface",parts:{surface:{kind:"box",role:"target",paintSlots:["fill","border"],layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"hug"}},padding:{block:"{type}.pad-y",inlineLabel:"{type}.pad-x"},radius:"{type}.radius",strokeWidth:"border-width",children:["text","count","dot"],note:"The badge body, sized by what it holds: a small-radius label around a status text, a circle around one digit that grows into a pill, or the round dot itself. A subtle status label is the tone's tint with a 1px edge in the tone's border color, drawn inside the edge so it adds no size. A bold badge is the solid tone fill with no edge. Neither paints an interactive color."},text:{kind:"text",type:"type",presentWhen:{type:["status"]},note:"The status text in the tone's text role. It carries the meaning, so the tone is never the only signal."},count:{kind:"text",type:"type",presentWhen:{type:["count"]},note:'The number, in the ink paired with the bold tone fill. Capped as the maximum followed by a plus sign, as in "99+".'},dot:{kind:"box",role:"presentation",size:"dot-size",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},presentWhen:{type:["dot"]},note:"The dot's fixed square, about 8px. It paints nothing itself: the badge around it has no padding for this type, so the pill's round fill is the dot."}},codeOnly:["the overlay rules for a count or dot \u2014 a count hides at zero unless showZero, caps as max followed by a plus sign, and sets min-inline-size equal to its block size so one digit is an exact circle (Figma has no width-equals-height floor, so the member approximates it with padding). Over a host, both carry a stroke in the canvas color that separates them from the host; the Figma count and dot members carry no stroke, since that one exists only against a host.","the overlay placement \u2014 a count or dot is positioned against its host from a wrapper that owns the stacking context, so a host with overflow hidden does not clip it. Inset uses inset-inline-end so it mirrors in right-to-left layouts. circular overlap pulls the badge in by about 14.6% of the host size, onto the curve.",'the accessible-name wiring \u2014 for a count or dot the badge is aria-hidden and the host composes the meaning into its own name ("Inbox, 3 unread messages"). A count that changes after render is announced through one shared polite live region, debounced, never one region per badge. None of this has a Figma expression.',"number formatting \u2014 the count and its cap render through Intl.NumberFormat, so a locale with different digits or grouping reads correctly.","The edge sits inside the box \u2014 subtle and bold badges are one size. In Figma it is an inside stroke; in code an inset outline (outline: 1px solid; outline-offset: -1px), never a border, which would make a subtle badge 2px larger than its bold twin. An outline also survives forced-colors mode, where the browser removes background fills, so a subtle status label keeps its shape there in the system border color. A bold badge (status, count or dot) carries the same inset outline in transparent: invisible everywhere else, and drawn in the system color in forced-colors mode, so every badge keeps its shape there."]},figmaProperties:{variantAxes:["type","emphasis","tone"],excludeCoordinates:[{type:["count","dot"],emphasis:["subtle"]}],texts:{label:{part:"text",default:"Status"},value:{part:"count",default:"3"}},swaps:{},booleans:{}},accessibility:{role:"none. A status label is plain text and announces itself; a count or dot is aria-hidden and its meaning is in the host's accessible name.",wcag:["1.4.1 Use of Color (the text carries the meaning; a tone, or a dot, is never the only signal)","1.4.3 Contrast (the label ink clears 4.5:1 on its own fill, measured in every mode of the example brands)","1.4.11 Non-text Contrast (applies to the dot, which has no text, so the colored circle is the information: its bold fill clears 3:1 against the page, measured in every mode of the example brands. For a status label or count the text carries the meaning, and the separation from the page is design intent rather than a 1.4.11 requirement: the subtle label's 1px edge and every bold fill clear 3:1 against the page in the same measurement)","4.1.2 Name, Role, Value (a count or dot joins its host's accessible name, so the host says what it means)","4.1.3 Status Messages (a count that changes after render reaches assistive technology through a polite live region)"],keyboard:"None. A badge takes no focus and has no action. A count on an icon button is reached through the button.",focus:"Never focusable, and no focus ring. The host carries focus.",aria:'Status label: not aria-hidden, and no role of its own. It reads as text in place, so it must not be given role="status". Count and dot: aria-hidden="true", and the host composes the meaning into its accessible name, as in "Inbox, 3 unread messages" or "Maya, online". A dot needs that text in the host name. Never describe it by color, as in "red dot". A count that changes while the page is open is announced through one shared polite live region.'},content:{labelPattern:'Status label: one or two words, in the same casing everywhere ("In review", "Failed", "PDF 262 KB"). Count: a number, capped ("99+"). Dot: no text on screen. The host names what it means ("3 unread messages", "Online").'},docs:{usage:"Use a status label to show a state or attribute inline, such as a lifecycle state beside a title or a keyword on a card. Use a count over a host for an accumulation the user can act on, such as unread messages. Use a dot when the exact number is unknown or does not matter, such as presence on an avatar. A status label is subtle by default; use bold when the state has to stand out from the content around it, such as a failure in a list of passing builds. Keep it static. If it needs to be clicked, toggled or removed, it is a tag.",do:["Put the meaning of a count or dot in the host's accessible name",'Cap a count, as in "99+", and hide it at zero unless zero matters',"Keep a status label to one or two words, in the same casing everywhere","Pair every tone with text that says the same thing"],dont:["Make a badge clickable, selectable or removable. That is a tag.","Use a badge for feedback about an action. That is a toast or a banner.","Rely on the tone or a dot alone to carry meaning","Put more than one count or dot on one host"],contentGuidelines:`Name the state, not the color: "Failed", not "Red". Use the same word for the same state everywhere, and keep it short enough to read at a glance. For a count, show the number up to the cap and the cap followed by a plus sign above it ("99+"). For a count or dot, write the host's accessible name so it says what the badge shows ("Notifications, 5 new"), since the badge itself is not read.`},ai:{primaryPurpose:"Mark a status, count or presence with a small static badge that nobody clicks.",whenToUse:"A short inline state or attribute (status), an actionable number over an icon button or tab (count), or presence or unread state over an avatar or nav item (dot).",avoidWhen:"The user can click, toggle or remove it (use a tag), the message is feedback about an action (use a toast or banner), or the color would be the only signal.",commonPartners:["icon-button","button"],triggerKeywords:["badge","status badge","status label","counter badge","count badge","notification badge","notification dot","unread count","presence dot","label","pill label"],generationPriority:3},composition:{composesWith:[],alternativeTo:["tag"],planned:["avatar","tabs","toast","banner"],replacesPatterns:["a hand-drawn colored pill","a red circle with a number drawn over an icon"]},motion:{enter:"A count or dot scales in from zero, from the corner it is anchored to. When a count changes, only the number animates, not the pill. A status label appears with no motion. A dot pulses only for a critical alert.",exit:"A count or dot scales out to its anchor corner.",reduceMotion:"Under prefers-reduced-motion every change is instant: no scale, no pulse."},notes:{contested:["One component or three. The brief's practice default is three siblings (count badge, dot, status label: Fluent, Primer); the owner chose one component switched by `type` (2026-09-27, the axis first named `genre`), which is the brief's contested alternative (MUI, Ant). The cost the brief names is real: the accessibility contract differs by type (hidden overlay vs announced label), so `accessibility.aria` states both, and a consumer must pick the type deliberately rather than inherit a default. `type` defaults to `status` because that is the only type that needs no host.","THE HOOK FOR THE TAG LANE: what Tag must differ on, so the two never read alike at rest. (1) Tag binds the `color.interactive.*` family; Badge never does, and `test.ts` holds that. (2) Tag has states (hover, pressed, focus-visible, disabled, and selected where it toggles); Badge has none. (3) Tag carries a 44px touch target; Badge is excluded from `lint-hit-target.ts`. (4) Tag shows an affordance at rest \u2014 a boundary stroke, a remove control, or both \u2014 where Badge is always FILLED: a tone tint with a 1px edge in the tone's border color (subtle), or a solid tone fill (bold), and never an interactive color. Which at-rest cue Tag uses is the Tag lane's design call, and the one thing it may not do is look like this badge. Since 2026-09-28 the shapes differ too: the status label takes the small radius (`radius.sm`) and Tag keeps the pill (`radius.round`). (5) Tag's remove control is its own \xD7 glyph in a square slot; Badge nests nothing.","Whether the status label belongs here or in Tag. The brief records the field split: MUI, Ant and Carbon fold the status label into Chip or Tag; Fluent, Primer and Polaris ship it as its own badge or label. The owner put it here (static means Badge), and the Badge-or-Tag test is interactivity: if it has an action, a remove control or a selected state, it is a Tag.",'Hide at zero by default (`showZero: false`), per the brief; some systems show "0" for a count the user has just cleared. Kept as the brief states it.'],unverified:["The circular-overlap inset of about 14.6%, from the brief, derived from a circle's geometry (1 \u2212 1/\u221A2, halved). Not measured against any shipping system here.","The count member's circle at one digit is an approximation: `space.075` inline padding around one digit against `space.025` block padding around the label line. It is about 1px off square in the example brands' fonts by arithmetic, and has not been measured on a live Figma host.","The dot binds `control.size.sm.dot`, the small selection control's dot rung, because it is the tier's density-scaled 8px dot. It borrows a control token for a non-control; a badge-specific rung would be a new token name."],evolution:["The `genre` variant axis (owner-approved, 2026-09-27): the count and dot project to Figma beside the status label, fifteen members at the time. Before it, the count and dot existed in code only.","The axis is renamed `genre` \u2192 `type` (owner, 2026-09-28), so Badge and Tag use one name for which kind of the component a member is. The values (`status | count | dot`) are unchanged; the prop, the paint keys, the padding and corner keys and the Figma variant property move with it.","Bold tone fills for the count and dot (owner-approved with the genre axis): `foreground.<tone>` under `text.on-<tone>`, with the bold neutral on the inverse surface `inverse.foreground.tertiary` under `inverse.text.primary`.","The `emphasis` axis (owner decisions, 2026-09-28): the status label comes in `subtle` and `bold`, and the count and dot stay bold-only, so the Figma set is twenty members through `figmaProperties.excludeCoordinates`. This replaces the first fix for the invisible neutral, which painted every neutral status label with the bold inverse fill and made it the loudest status label on the page.","The subtle tints separate by their edge (#1735, owner decision 2026-09-28). The tone tints measure 1.06\u20131.40:1 against the page and the neutral tint 1.00:1 in both high-contrast modes, so the tint alone gave the pill no shape. The subtle status label now carries a 1px edge in the tone's border role, at least 3.75:1 against the page (`border.secondary` for neutral, at least 3.20:1), and the tint is no longer held to 3:1.","The status label's corner is the small radius, `radius.sm` (owner decision, 2026-09-28): 2px in nb and prism3, 4px in aurora, so it scales per brand. The count and the dot stay `radius.round`. Before it every type was a pill, and a subtle status label with its 1px edge read close to Tag's outlined pill.","A leading icon on the status label, as the brief allows, painted from the tone's icon role.","A size axis (small, medium, large) for the count and status label, once a host needs more than one."]}};var za={id:"tag",name:"Tag",aliases:["chip","filter-tag","filter-chip","input-tag","input-chip","removable-tag","dismissible-tag","selectable-tag","choice-chip","interaction-tag","checkable-tag","facet"],category:"foundations",status:"draft",summary:"An interactive token a user toggles or removes. A static label is a badge.",description:`A compact, interactive token of one of two types. A select tag toggles on and off, such as a filter; while selected it takes a tint, a 2px outline and, by default, a check mark after the label. The label keeps its weight, so its own width does not change; the check mark, when shown, adds its width and one gap. A dismissible tag carries a remove control, a \xD7 in a square slot at its trailing end, named "Remove" followed by the tag's label, such as an applied filter or a recipient in a field. Tags usually sit in a group that owns the selection model, arrow-key movement between tags and where focus goes after a removal. At rest a tag always shows an outline.`,props:[{name:"label",type:"string",required:!0,description:"The tag text. One word where possible, two or three for a specific entity such as a name or an email address. A long label wraps; it is never cut off."},{name:"type",type:"enum: 'select' | 'dismissible'",values:["select","dismissible"],default:"select",required:!1,description:"Which interaction the tag carries. select = toggles on and off, and shows its selected state. dismissible = carries a remove control and has no selected state. This is the component's own prop, not the HTML type attribute, and it is never passed to the element."},{name:"selected",type:"boolean",default:"false",required:!1,description:"Whether a select tag is on. A selected tag takes a tint and a 2px outline, and shows a check mark unless showCheck is off, so the state never rests on color alone. Ignored on a dismissible tag."},{name:"showCheck",type:"boolean",default:"true",required:!1,description:"Whether a selected select tag shows its check mark after the label. On by default. With it off, the tint and the 2px outline carry the selected state."},{name:"onClick",type:"function",required:!1,description:"The toggle a select tag fires. Suppressed while disabled or read-only."},{name:"onRemove",type:"function",required:!1,description:"Called when a dismissible tag's remove control is pressed, or when Delete or Backspace is pressed on the focused tag."},{name:"leadingIcon",type:"slot",required:!1,description:"An icon or avatar before the label, for recognition at a glance. Decorative: the label carries the name."},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Tag height, padding and label type. The height is Button's: medium clears 44px on comfortable and spacious density, and is 36px at compact. A tag is never narrower than 1.5 times its height, rounded to the nearest 8px (64px for a medium tag on comfortable density)."},{name:"disabled",type:"boolean",default:"false",required:!1,description:"Removes the tag from interaction and dims it. Don't disable every tag in a group; hide the group instead."},{name:"readOnly",type:"boolean",default:"false",required:!1,description:"Keeps full visual weight but accepts no interaction, such as a filter the user cannot change. Distinct from disabled, which dims."}],states:["rest","hover","pressed","focus-visible","disabled","read-only"],variants:{type:["select","dismissible"],selection:["unselected","selected"],size:["small","medium","large"]},axisKinds:{type:"authoring",selection:"runtime",size:"authoring"},paintKeys:["{selection}.{slot}.{state}","{selection}.{slot}"],densitySpacing:["size.{size}.padding-x","size.{size}.select.gap","size.{size}.dismissible.visible-gap","size.{size}.check-gap","size.{size}.select.padding-end"],visibleGaps:[{gap:"size.{size}.dismissible.gap",visible:"size.{size}.dismissible.visible-gap",inset:"size.{size}.dismissible.label-inset"}],tokens:{radius:"radius.round","unselected.border-width":"border-width.hairline","selected.border-width":"border-width.thick","pad-y":"space.0","label-row.padding-end":"space.0","group-gap":"space.100","focus-ring":"color.border.focus","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset","size.small.height":"size.sm.height","size.small.padding-x":"space.100","size.small.select.gap":"space.075","size.small.dismissible.visible-gap":"space.075","size.small.dismissible.gap":"space.025","size.small.check-gap":"space.050","size.small.select.padding-end":"space.100","size.small.dismissible.padding-end":"space.0","size.small.select.label-inset":"space.0","size.small.dismissible.label-inset":"space.050","size.small.icon":"icon.size.sm","size.small.type":"type.label.sm.emphasis","size.medium.height":"size.md.height","size.medium.padding-x":"space.150","size.medium.select.gap":"space.100","size.medium.dismissible.visible-gap":"space.100","size.medium.dismissible.gap":"space.050","size.medium.check-gap":"space.075","size.medium.select.padding-end":"space.150","size.medium.dismissible.padding-end":"space.0","size.medium.select.label-inset":"space.0","size.medium.dismissible.label-inset":"space.050","size.medium.icon":"icon.size.md","size.medium.type":"type.label.md.emphasis","size.large.height":"size.lg.height","size.large.padding-x":"space.200","size.large.select.gap":"space.150","size.large.dismissible.visible-gap":"space.100","size.large.dismissible.gap":"space.050","size.large.check-gap":"space.100","size.large.select.padding-end":"space.200","size.large.dismissible.padding-end":"space.0","size.large.select.label-inset":"space.0","size.large.dismissible.label-inset":"space.050","size.large.icon":"icon.size.lg","size.large.type":"type.label.lg.emphasis","unselected.border":"color.interactive.neutral.border.rest","unselected.border.hover":"color.interactive.neutral.border.hover","unselected.border.pressed":"color.interactive.neutral.border.pressed","unselected.overlay.hover":"color.interactive.neutral.overlay.hover","unselected.overlay.pressed":"color.interactive.neutral.overlay.pressed","unselected.label":"color.interactive.neutral.text.rest","unselected.label.hover":"color.interactive.neutral.text.hover","unselected.label.pressed":"color.interactive.neutral.text.pressed","unselected.icon":"color.interactive.neutral.icon.rest","unselected.icon.hover":"color.interactive.neutral.icon.hover","unselected.icon.pressed":"color.interactive.neutral.icon.pressed","selected.overlay":"color.interactive.primary.subtle-fill.selected","selected.border":"color.interactive.primary.border.rest","selected.border.hover":"color.interactive.primary.border.hover","selected.border.pressed":"color.interactive.primary.border.pressed","selected.label":"color.interactive.neutral.text.rest","selected.label.hover":"color.interactive.neutral.text.hover","selected.label.pressed":"color.interactive.neutral.text.pressed","selected.icon":"color.interactive.neutral.icon.rest","selected.icon.hover":"color.interactive.neutral.icon.hover","selected.icon.pressed":"color.interactive.neutral.icon.pressed","disabled.label":"color.disabled.text","disabled.icon":"color.disabled.icon","disabled.border":"color.disabled.icon"},anatomy:{root:"container",parts:{container:{kind:"box",role:"target",paintSlots:["overlay","border"],children:["content","dismiss","focusRing"],layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"fixed"}},height:"size.{size}.height",minWidthRatio:1.5,radius:"radius",strokeWidth:"{selection}.border-width",note:"The tag body, a pill of fixed height that hugs its content and is never narrower than 1.5 times its height, rounded to the nearest 8px; when that minimum applies, the content is centered. Unselected, it is a 1px outline with no fill; selected, it takes a tint and a 2px outline, drawn inside the pill so the box does not grow."},content:{kind:"box",role:"presentation",children:["leadingVisual","labelCheck"],layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"hug"}},padding:{block:"pad-y",inlineLabel:"size.{size}.padding-x",inlineEnd:"size.{size}.{type}.padding-end"},gap:"size.{size}.{type}.gap",note:"The row inside the pill: the optional leading icon, then the label and its check mark. It is inset by the tag's padding on both sides, except before the \xD7 slot of a dismissible tag, where the label runs straight to the slot. On a dismissible tag its gap is 4px less than the icon-to-label distance, since the label row adds a 4px inset of its own."},labelCheck:{kind:"box",role:"presentation",children:["label","check"],layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"hug"}},padding:{block:"pad-y",inlineLabel:"size.{size}.{type}.label-inset",inlineEnd:"label-row.padding-end"},gap:"size.{size}.check-gap",note:"The label and, on a selected select tag, the check mark after it, with a gap tighter than the one between the leading icon and the label. On a dismissible tag it is inset 4px at its leading edge, at every density, so the label sits 4px further in from the icon or the tag's edge."},leadingVisual:{kind:"slot",optional:!0,size:"size.{size}.icon",nesting:{kind:"swap"},note:"An optional icon or avatar before the label. Decorative: the label carries the name."},label:{kind:"text",type:"size.{size}.type",note:"The tag text, at the same weight whether or not the tag is selected, so the label keeps its width when the tag is selected; the check mark, when shown, adds a cell after it. In code a long label wraps; Figma holds one line."},check:{kind:"vector",glyph:"check",size:"size.{size}.icon",presentWhen:{selection:["selected"]},optional:!0,note:"The selected indicator, a check mark after the label. It exists only on a selected select tag and is on by default; the Check icon switch hides it, leaving the tint and the 2px outline."},dismiss:{kind:"box",role:"presentation",size:"size.{size}.height",innerTarget:!0,layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},presentWhen:{type:["dismissible"]},children:["dismissGlyph"],note:"The remove slot of a dismissible tag: a square as tall as the tag, at its trailing end, holding the \xD7 glyph."},dismissGlyph:{kind:"vector",glyph:"close",size:"size.{size}.icon",presentWhen:{type:["dismissible"]},note:"The \xD7 of a dismissible tag, a plain glyph centered in the remove slot, in the tag's icon ink."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"The shared focus ring, around the whole tag while it has keyboard focus."}},codeOnly:["read-only \u2014 a real state (readOnly), deliberately NOT a Figma variant: a read-only tag keeps the rest paint at full weight and only refuses interaction, so a member would be byte-identical to rest. It is not dimmed and is not disabled; it keeps its place in the tab order so its label stays reachable.",`The Tag prop named type \u2014 the component's own prop (select | dismissible), the same values as the Figma type axis. It is NOT the HTML type attribute and is never forwarded to the element: a select tag rendered as a <button> sets type="button" itself, so a tag inside a form never submits it. In React, destructure type out of the props before spreading the rest onto the element.`,'The select tag in code \u2014 a <button> with aria-pressed, or a role="checkbox" or listbox option when a group owns the selection (a radiogroup for single choice). The label weight is the same selected and unselected. The check mark follows showCheck; with it off, the tint and the 2px outline carry the state.',`The dismissible tag's hit target is not decided yet, and both options build from the same Figma structure. (1) The whole tag is one <button> named "Remove" followed by the label, and pressing anywhere on it removes the tag. (2) Only the \xD7 slot is the button, named the same, and the body is not interactive; the tag is then a row in a role="grid" group, the label one gridcell and the \xD7 slot a second. Either way the \xD7 slot is a square as tall as the tag, 44px at medium on comfortable density, and its click does not reach any handler on the tag body.`,"The selected tint \u2014 `interactive.primary.subtle-fill.selected`, the primary fill at an opacity step, over the page ground. A brand whose outline interaction is none has no tint, and a selected tag there shows the 2px outline and the check mark only. The outline is `interactive.primary.border` at 2px, drawn inside the box (an inset outline, outline-offset: -2px, or an inset box-shadow), never a border that would grow the tag. In forced-colors mode the tint drops out and the 2px outline and the check mark carry the state.",'The group contract (the tag group is not built yet) \u2014 the group owns the selection model (multiple: a listbox with aria-multiselectable, or pressed buttons; single: a radiogroup), and it lays tags out as a wrapping flex row with the `group-gap` binding (space.100, 8px) between tags on both axes. A dismissible group is role="grid" when the \xD7 slot alone is the target: each tag is a row, its label a gridcell and its remove control a second gridcell; the row and gridcell wrappers take display: contents so the tags wrap in the flex layout. One tab stop enters the group, Left and Right arrows move between tags (Up and Down across wrapped lines), and Delete or Backspace removes the focused tag. Never a listbox for dismissible tags: ARIA does not allow an interactive child inside role="option".',"Focus after removal \u2014 capture the removed tag's index before it goes; after the list updates, focus the next tag, else the previous one, else the group or the input that owns it. Never let focus fall to <body>.",'Overflow \u2014 a group wraps by default. A group that must stay on one line measures the available width against the tags (a ResizeObserver) and ends in a computed "+N more" tag that opens a popover of the rest; the popover is keyboard and screen-reader reachable. The measurement moves when web fonts load.',"Combobox composition \u2014 a multi-select combobox renders its values as a group of dismissible tags inside the field. At an empty caret, Backspace focuses the last tag and a second Backspace removes it.","RTL \u2014 logical properties (padding-inline, gap) mirror the row, so the leading icon moves to the right edge and the check mark and the \xD7 slot to the left. No physical directions, and no script.","text expansion \u2014 the tag has no fixed width and never truncates: a long label WRAPS onto more lines and the tag grows taller, and the full text stays visible at 200% zoom. Truncation would need the full text reachable by keyboard, touch and screen reader, and a title attribute is none of those. Translations run 30\u201350% longer. Figma holds one line of placeholder text.","Minimum width \u2014 min-inline-size is 1.5 times the tag's height, rounded to the nearest 8px: 56px small, 64px medium and 88px large on comfortable density, following the height at compact and spacious. A short label centers inside it (justify-content: center). Figma holds the same floor as a number per size, written when the component is built, so a brand change reaches it on a rebuild.","Spacing \u2014 the row is padding-inline, then the leading icon, a gap, and the label and check mark in their own inline group with a smaller gap: at medium on comfortable density, 12px padding, 8px from icon to label and 6px from label to check mark. A dismissible tag has no inline-end padding on that row, so the label runs straight to the \xD7 slot. Its label group takes padding-inline-start: 4px at every density, and the gap before it is 4px less than the icon-to-label distance (6px small, 8px medium, 8px large on comfortable density), never below 0; with no leading icon the label sits the padding plus 4px from the edge. Every value is a space token. A compact or spacious brand moves the padding, the label-to-check gap, a select tag's icon-to-label gap and a dismissible tag's icon-to-label distance one step along the space scale, and never takes a gap or that distance under 4px. The dismissible gap is not stepped: it is recomputed as that distance less 4px, so at spacious density it goes from 4px to 8px on a medium or large tag.","The hit-target expansion \u2014 a small tag is 36px tall on comfortable density and 28px at compact, and a medium tag is 36px at compact. Reaching 44px there is a code-side hit area larger than the visible box, which Figma cannot hold."]},figmaProperties:{variantAxes:["type","selection","size"],excludeCoordinates:[{type:["dismissible"],selection:["selected"]}],stateAxis:{name:"state",values:["rest","hover","pressed","focus-visible","disabled"]},gridAxis:"state",footprintVaries:["selection"],texts:{label:{part:"label",default:"Tag"}},booleans:{leadingIcon:{part:"leadingVisual",figmaName:"leading icon",default:!1},showCheck:{part:"check",figmaName:"Check icon",default:!0}},swaps:{leadingIcon:{part:"leadingVisual",figmaName:"\u21B3 swap leading icon"}}},accessibility:{role:'By type. Select: a <button> with aria-pressed, or a role="checkbox" or listbox option when a group owns the selection (a radiogroup for single choice). Dismissible: the remove control is a real button named "Remove" followed by the label; in a group of dismissible tags it sits in a role="grid" row.',wcag:["1.4.1 Use of Color (a selected tag adds a 2px outline and, by default, a check mark to its tint, never color alone)","1.4.3 Contrast (the label ink clears 4.5:1 on the tag at rest in every mode, on the page unselected and on the tint selected)","1.4.11 Non-text Contrast (the unselected outline and the selected 2px outline clear 3:1 against the page; the check mark clears 3:1 on the tint and the \xD7 clears 3:1 on its ground)","1.4.4 Resize Text / 1.4.10 Reflow (a long label wraps rather than truncating, so the full text stays visible at 200% zoom)","2.1.1 Keyboard (every tag can be toggled or removed from the keyboard)","2.4.3 Focus Order (after a removal, focus moves to the next tag, the previous one or the group, never to the top of the page)","2.4.7 Focus Visible (a focus ring around the tag on keyboard focus)","2.5.8 Target Size (Minimum) (24\xD724 \u2014 a small tag and its \xD7 slot are 36px on comfortable density and 28px at compact)","2.5.5 Target Size (Enhanced) (44\xD744, as intent \u2014 a medium tag and its \xD7 slot clear 44px on comfortable and spacious density and miss it at compact (36px); a small tag reaches 44 only at spacious density, and elsewhere through a code-side hit area)",'1.1.1 Non-text Content / 4.1.2 Name, Role, Value (the remove control is named "Remove" followed by the label, and a select tag exposes its state)'],keyboard:"Select: Space or Enter toggles. In a single-choice group, arrows move and select, as radios do. Dismissible: Enter or Space on the remove control removes the tag; in a group, one tab stop enters the group, Left and Right arrows move between tags, and Delete or Backspace removes the focused tag.",focus:"A focus ring around the whole tag on :focus-visible. In a group of dismissible tags, focus moves to the next tag after a removal, else the previous one, else the group or its input, and never to <body>.",aria:'Name the remove control "Remove" followed by the label ("Remove Marketing"), or aria-label="Remove" plus aria-labelledby pointing at the label. Never a bare "Remove" or "\xD7". A select tag exposes its state with aria-pressed, aria-checked or aria-selected, matching the role its group gives it. The check mark and a leading icon are aria-hidden. Every name is translatable, and the row mirrors under right-to-left layout.'},content:{labelPattern:'One word where possible; two or three short words only for a specific entity, such as a name, an email address or a category. Sentence case, or the casing the user typed, the same across the set. The remove control is "Remove" followed by the label.'},docs:{usage:"Use a tag for something a user acts on in place. Use a select tag for a lightweight filter or choice the user toggles; use a dismissible tag for an applied filter they can remove, or a recipient or keyword entered into a field. Put tags in a group with at least 8px between them, and let the group own selection, arrow-key movement and focus after removal. If nobody acts on it, it is a badge; if it runs an action, it is a button.",do:['Name the remove control "Remove" followed by the label',"Move focus to the next tag after a removal, else the previous one, else the group","Keep the check mark on a selected tag unless the tint and outline already read clearly in context","Keep at least 8px between tags in a group","Let a long label wrap, so the full text stays visible"],dont:["Use a tag for a status nobody can act on. That is a badge.","Use a tag to run an action. That is a button.","Use tags for a long list of choices in a form. That is a checkbox group or radio group.","Put a dismissible tag list in a listbox. A listbox option cannot contain the remove control.","Truncate a label with an ellipsis. A title attribute does not make the full text reachable by keyboard, touch or screen reader.","Disable every tag in a group. Hide the group instead."],contentGuidelines:'Keep the label to one word where possible. Use the words the data or the user supplies, such as a category, a name or a filter value, not system status words like "Failed" or "Processing"; those belong on a badge. A long label wraps onto a second line rather than being cut off.'},ai:{primaryPurpose:"Render a small interactive token the user toggles or removes in place.",whenToUse:"Inline filters toggled on and off (select), applied filters the user can remove, or recipients or keywords entered into a field (dismissible), usually in a group.",avoidWhen:"Nobody can act on it (use a badge), it runs an action (use a button), or it is a structured choice in a form submission (use a checkbox group or radio group).",commonPartners:["badge","icon","checkbox-group","radio-group"],triggerKeywords:["tag","chip","filter tag","filter chip","input tag","input chip","removable tag","dismissible tag","selectable tag","select tag","choice chip","facet","applied filter","recipient token"],generationPriority:3},composition:{composesWith:["focus-ring"],alternativeTo:["badge","button","checkbox-group","radio-group"],planned:["tag-group","combobox","toggle-button","avatar","popover"],replacesPatterns:["a removable token list built as a listbox","a clickable div styled as a pill","a bare \xD7 glyph with no accessible name"]},motion:{enter:"A tag added to a group scales from 90% to 100% as it fades in. On selection, the tint and the outline crossfade and the check mark scales in.",exit:"A removed tag fades out first, then its width and margin collapse, so the tags after it slide into the space.",reduceMotion:"Under prefers-reduced-motion, scale, slide and collapse are instant and only the opacity change remains, since the state change is the information."},notes:{contested:["The selected label and check ink stay the unselected neutral ink. The owner fixed the tint and the outline, not the ink; the primary ink fails 4.5:1 on the tint in 13 of 20 cells (lowest 3.02:1, aurora/light). Held for the owner.","The dismissible hit target: the whole tag, or only the \xD7 slot. Open by owner decision C; `codeOnly` states both. The Figma structure is the same, and the \xD7 slot is 44px at medium on comfortable density either way.","The \xD7 glyph size in its slot binds the tag's own icon rung (`size.{size}.icon`, 24px at medium), the same rung the check and the leading icon use. Held for the owner, with the slot's inner padding it implies.","A long label wraps in code, and the row centers the leading icon, the check mark and the \xD7 slot on the label block (`align: center`, as in Figma, where the label is one line). Whether they should sit on the first line instead is held for the owner.","A dismissible tag keeps the optional leading icon (the `leading icon` switch is on every member). The owner named it for Select; nothing says Dismissible drops it. Held for the owner.","The selection axis values `[unselected, selected]` (brief \xA74 and \xA715 words) against checkbox's `[unchecked, checked]`. A filter tag's ARIA state is aria-pressed, aria-checked or aria-selected depending on the group's role, so no one ARIA word fits; recorded as `disjoint` in `lint-axis-values.ts` and held for the owner.","Tone (\xA74, \xA715: neutral + info/success/warning/error) is NOT built. The owner requires the interactive family, which has no status hues, and the brief itself warns against status vocabulary in a tag (\xA77). A status-encoding tag is held for the owner.","`removing` (\xA74, the transient state) is not a state: it is motion only, and `STATES` has no such name. `unselected` is the selection axis value, not a state.","Tag group: held for the owner (#1739) \u2014 a second def (like checkbox-group) or code-only. The group is code-only, and the owner's \u2265 8px spacing is bound as `group-gap`."],unverified:["The check mark is the first part carrying both a boolean and a variant presence gate. The offline shim builds it (the node exists only at selected members, and the switch toggles it there); a real Figma host has not been checked for a boolean property that some members of a set have no node for.","The minimum width reaches Figma as a literal `minWidth` per size, written from the brand's heights before projection, Button's route. The offline shim honors it and so does Button on a real host; the nested label-and-check row inside the content row has not been checked on a real host.","A medium tag is 44px tall on comfortable density, a medium Button's height (owner decision 4), and a dismissible tag adds a 44px square. Whether a pill that tall still reads as a tag beside buttons of the same height is a visual question no gate asks.",'The selected tint is the primary fill at an opacity step over the page. Whether it reads as "selected" beside the 10% neutral hover wash of an unselected tag is a visual question no gate asks; the 2px primary outline is the measured separation.'],evolution:["Owner, 2026-09-29 (from a mockup in a real Figma file): the spacing is this spec's own `space.*` steps (padding 8/12/16, icon to label 6/8/12, label to check 4/6/8 at small/medium/large), and the label and check sit in their own row so their gap can differ from the icon's. It had bound Button's shared `size.*.padding-x` and `size.*.gap`, which the spacing model removed.",`Owner, 2026-09-29: the minimum width is 1.5 times the tag's height, rounded to the nearest 8px (decision L), replacing "never narrower than it is tall" (decision D). Figma receives it as a number per size, written from the brand's heights, since a variable cannot hold the product.`,"Owner, 2026-09-29: a dismissible tag's label row has no trailing inset, so the label runs straight to the \xD7 slot. It had kept the full inset there, held as a visual call.","Owner, 2026-09-29 (live QA on a real Figma file): a dismissible tag's label row takes a fixed 4px leading inset, and the icon-to-label gap drops from 6/8/12 to 2/4/4 to match, so the icon-to-label distance reads 6/8/8 and a tag with no icon insets its label by the padding plus 4px. A dismissible tag is 4px wider (a 24px label at medium: 80 to 84). The 4px gap floor holds the distance the eye reads, not the 2px layer gap. A select tag is unchanged.",'Owner, 2026-09-29 ("respect none"): the selected tint binds `interactive.primary.subtle-fill.selected`, which ever
