<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism3 concept v4</title>
<!--
  Concept v4: hand-written source. `node docs/superpowers/ui-redesign/build-v4.mjs` bundles the real
  engine into it and writes concept-v4.html. Prototype only: this is a design direction, not product code.
  Chrome is light only. No network: system fonts for chrome; brand faces are named with a fallback and
  a visible "Not installed" marker when this device lacks them.
-->
<style>
/* ---------- Recessive chrome: neutral, quiet, precise. Light only. ---------- */
:root{
  --c-app:#f6f6f5; --c-panel:#ffffff; --c-sunk:#f0f0ee; --c-line:#e2e2df;
  /* control boundary: the one edge on inputs, selects and unselected chips; measured >= 3:1 on panel and app */
  --c-ctl:#84847f;
  --c-ink:#1c1c1b; --c-ink-2:#4f4f4c; --c-ink-3:#5f5f5b;
  --c-sel-bg:#e8e8e5;
  --c-focus:#1d5bd6;                /* chrome accent: focus ring only, never "selected" */
  --c-warn:#7d5100; --c-warn-bg:#fdf5e4; --c-warn-line:#b98a2e;
  --c-fail:#a1261c; --c-fail-bg:#fbeeed; --c-fail-line:#c4574c;
  --c-ok:#256236; --c-ok-bg:#ecf5ee; --c-ok-line:#5b9a6a;
  --hatch:repeating-linear-gradient(135deg,#fff 0 4px,#ecece9 4px 8px);
  --r-1:4px; --r-2:8px; --r-3:12px;
  --f-ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--f-ui);color:var(--c-ink);background:#dededb;display:flex;flex-direction:column;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
code,.code{font-family:var(--f-code);font-size:12px}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- prototype harness (outside the product) ---------- */
.harness{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:#262625;color:#f2f2f0;font-size:12px;min-height:40px}
.harness b{font-weight:600;margin-right:4px}
.harness .hg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.harness button,.harness select{background:#3a3a38;border:1px solid #8a8a86;color:#f2f2f0;border-radius:4px;min-height:26px;padding:2px 8px;cursor:pointer}
.harness button[aria-pressed=true]{background:#f2f2f0;color:#1c1c1b;border-color:#f2f2f0}
.harness :focus-visible{outline-color:#8fb3ff}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.frame{background:var(--c-app);width:100%;height:100%;position:relative;overflow:hidden;box-shadow:0 0 0 1px #b5b5b1}
.frame.f-1280{width:1280px;height:900px;flex:none}
.frame.f-380{width:380px;height:420px;flex:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-app);container-type:inline-size;container-name:app}

/* ---------- basic controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--c-ctl);background:var(--c-panel);border-radius:var(--r-2);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--c-ink)}
.btn:hover{background:var(--c-sunk)}
.btn.primary{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.btn.primary:hover{background:#3a3a38}
.btn.danger{background:var(--c-fail);color:#fff;border-color:var(--c-fail)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--c-sunk)}
.btn.sm{min-height:28px;padding:2px 10px;font-size:12.5px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.lnk{display:inline-flex;align-items:center;min-height:24px;border:0;background:none;padding:0 2px;color:var(--c-ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:inherit}
.lnk.muted{color:var(--c-ink-2)}
::placeholder{color:var(--c-ink-3);opacity:1}
select,input[type=text],input[type=number],textarea{min-height:32px;border:1px solid var(--c-ctl);border-radius:var(--r-2);background:#fff;padding:4px 8px;max-width:100%}
textarea{width:100%;min-height:120px;font:12px/1.5 var(--f-code)}
input[type=color]{width:36px;height:32px;padding:2px;border:1px solid var(--c-ctl);border-radius:var(--r-2);background:#fff;flex:none;cursor:pointer}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--c-ink);margin:0}
input[type=range]{width:100%;min-height:24px;accent-color:var(--c-ink);margin:0}
label.hit{display:inline-flex;align-items:center;gap:4px;min-width:28px;min-height:28px;cursor:pointer}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--c-ink-2)}
.small{font-size:12px}
.tabnum{font-variant-numeric:tabular-nums}

/* verdicts */
.v{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid transparent;white-space:nowrap;min-height:24px}
.v.ok{background:var(--c-ok-bg);color:var(--c-ok);border-color:var(--c-ok-line)}
.v.warn{background:var(--c-warn-bg);color:var(--c-warn);border-color:var(--c-warn-line)}
.v.fail{background:var(--c-fail-bg);color:var(--c-fail);border-color:var(--c-fail-line)}
.v.info{background:var(--c-sunk);color:var(--c-ink-2);border-color:var(--c-line)}
.v.busy{background:#fff;color:var(--c-ink);border-color:var(--c-ctl)}
.tag{display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font-size:11.5px;background:var(--c-sunk);color:var(--c-ink-2);border:1px solid var(--c-line);white-space:nowrap;min-height:20px}
.tag.ovr{background:#fff;color:var(--c-ink);border-color:var(--c-ink)}
.tag.der{background:var(--hatch);color:var(--c-ink-2)}
.tag.anc{background:#fff;color:var(--c-ink);border-style:dashed;border-color:var(--c-ink-2)}
.tag.agent{background:#eef2fb;color:#23407a;border-color:#8ea4d0}
.tag.fail{background:var(--c-fail-bg);color:var(--c-fail);border-color:var(--c-fail-line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--c-ok)}.dot.fail{background:var(--c-fail)}.dot.warn{background:var(--c-warn)}.dot.busy{background:var(--c-ink)}
.sw{display:inline-block;width:16px;height:16px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);vertical-align:middle;flex:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--c-line);min-height:52px;flex:none}
.brandbtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px;border:1px solid var(--c-ctl);border-radius:var(--r-2);background:#fff;cursor:pointer;max-width:260px}
.brandbtn .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandbtn .dirty{font-size:11.5px;color:var(--c-ink-2)}
.verdict{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid;cursor:pointer;font-size:12.5px;background:#fff}
.verdict.ok{color:var(--c-ok);border-color:var(--c-ok-line);background:var(--c-ok-bg)}
.verdict.fail{color:var(--c-fail);border-color:var(--c-fail-line);background:var(--c-fail-bg)}
.verdict.stale{color:var(--c-ink-2);border-color:var(--c-ctl)}
.spacer{flex:1}
.top .nar{display:none}
.strip{display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;background:#fff;border-bottom:1px solid var(--c-line);font-size:12px;flex:none;cursor:pointer;width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.strip .bar{flex:0 0 72px}
.banner{display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:12.5px;border-bottom:1px solid;flex:none;flex-wrap:wrap}
.banner.fail{background:var(--c-fail-bg);color:var(--c-fail);border-color:var(--c-fail-line)}
.banner.warn{background:var(--c-warn-bg);color:var(--c-warn);border-color:var(--c-warn-line)}
.banner.info{background:#fff;color:var(--c-ink);border-color:var(--c-line)}
.banner b{font-weight:600}

/* ---------- menus and popovers (non-modal) ---------- */
.popwrap{position:relative;display:inline-flex}
.pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--c-ctl);border-radius:var(--r-2);box-shadow:0 10px 32px rgba(0,0,0,.16);padding:6px;min-width:220px}
.pop.right{right:0}
.pop .mi{display:flex;width:100%;align-items:center;gap:8px;min-height:32px;padding:4px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
.pop .mi:hover{background:var(--c-sunk)}
.pop .mi[disabled]{opacity:.55;cursor:not-allowed}
.pop .mi .k{margin-left:auto;font-size:11.5px;color:var(--c-ink-2)}
.pop hr{border:0;border-top:1px solid var(--c-line);margin:6px 0}
.pop .why{font-size:12px;color:var(--c-ink-2);padding:4px 10px}
.health{width:min(440px,92cqi);padding:0}
.health section{padding:12px 14px;border-top:1px solid var(--c-line)}
.health section:first-child{border-top:0}
.health h3{font-size:12px;margin:0 0 6px;color:var(--c-ink-2);font-weight:600;letter-spacing:.02em}
.health ul{margin:0;padding:0;list-style:none}
.health li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12.5px}
.health li .dot{margin-top:5px}

/* ---------- work area ---------- */
.work{flex:1;display:grid;min-height:0;grid-template-columns:var(--lv,40%) minmax(0,1fr);position:relative}
.lvp{background:#fff;min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--c-line);container-type:inline-size;container-name:lvp}
.pvp{display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;container-name:pvp;position:relative}
.gutter{position:absolute;top:0;bottom:0;left:var(--lv,40%);width:24px;margin-left:-12px;cursor:col-resize;z-index:6;touch-action:none;background:none;border:0}
.gutter::after{content:"";position:absolute;top:0;bottom:0;left:11px;width:2px;background:transparent}
.gutter:hover::after,.gutter:focus-visible::after{background:var(--c-focus)}
.gutter:focus-visible{outline:none}

/* domain tabs */
.navrow{flex:none;border-bottom:1px solid var(--c-line);padding:8px 20px 0;display:flex;flex-direction:column;gap:8px;background:#fff}
.tabsw{position:relative;display:flex;align-items:flex-end}
.tabs{display:flex;gap:2px 18px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:6px 0;min-height:36px;font-size:13.5px;color:var(--c-ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--c-ink)}
.tab[aria-selected=true]{color:var(--c-ink);border-bottom-color:var(--c-ink);font-weight:600}
.tabcue{flex:none;display:flex;align-items:center;gap:0;padding-left:6px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 12px)}
.tabcue button{min-width:28px;min-height:32px;border:1px solid var(--c-ctl);background:#fff;border-radius:6px;cursor:pointer;padding:0 6px}
.domsel{display:none}
.searchw{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.searchw input{flex:1;min-height:34px;border-radius:999px;padding:4px 14px}
.lvbody{flex:1;overflow:auto;padding:0 28px 64px;min-height:0}
.dh{padding:18px 0 4px}
.dh h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.dh p{margin:0;color:var(--c-ink-2);font-size:13px}
.sc{margin-top:36px}
.sh{margin-bottom:16px}
.eyebrow{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-3);margin-bottom:4px}
.sh h3{font-size:15.5px;margin:0;font-weight:600}
.advrow{margin-top:40px;padding-top:18px;border-top:1px solid var(--c-line)}
.advrow .sc{margin-top:28px}
.nextrow{margin-top:32px}
.srchead{margin:24px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-3)}

/* lever rows */
.lever{border:0;padding:0;margin:0 0 26px;min-width:0}
.lever > legend,.lever > .lab{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0;margin-bottom:8px;font-weight:600;font-size:13.5px;width:100%}
.lever .lab label,.lever legend .lname{font-weight:600}
.lever .readout{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--c-ink-2)}
.lever .ctl{display:flex;flex-direction:column;gap:8px;min-width:0}
.lever .state{font-size:12px;color:var(--c-warn);background:var(--c-warn-bg);border-left:3px solid var(--c-warn-line);padding:5px 8px;border-radius:0 4px 4px 0}
.lever .state.info{color:var(--c-ink-2);background:var(--c-sunk);border-left-color:var(--c-ctl)}
.lever .sub{font-size:12px;color:var(--c-ink-2)}
.lever.refused{outline:2px solid var(--c-fail-line);outline-offset:8px;border-radius:2px}
.lever.refused .refmark{display:block;color:var(--c-fail);font-size:12px;margin-top:6px}
.lever .refmark{display:none}
.lever.hl{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:#f0f0ee;box-shadow:0 0 0 10px #f0f0ee}100%{background:transparent;box-shadow:0 0 0 10px transparent}}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--c-ctl);background:#fff;font:600 12px/1 Georgia,serif;font-style:italic;cursor:pointer;color:var(--c-ink-2);padding:0;flex:none}
.ibtn[aria-expanded=true]{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.tip{font-size:12.5px;font-weight:400;color:var(--c-ink);background:var(--c-sunk);border-radius:6px;padding:8px 10px;margin:0 0 8px;line-height:1.5;width:100%}

/* chips: a native radio group, styled as pills */
.chips{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chips > legend{padding:0}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 14px;border:1px solid var(--c-ctl);background:#fff;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chip .ck{display:none;font-weight:700}
.chip:hover{border-color:var(--c-ink)}
.chip:has(input:checked){background:var(--c-sel-bg);border:1.5px solid var(--c-ink);font-weight:600;padding:3.5px 13.5px}
.chip:has(input:checked) .ck{display:inline}
.chip:has(input:focus-visible){outline:2px solid var(--c-focus);outline-offset:3px}
.chip:has(input:disabled){opacity:.5;cursor:not-allowed;border-style:dashed}
.chips.sm .chip{min-height:28px;padding:2px 10px;font-size:12.5px}
.chips.sm .chip:has(input:checked){padding:1.5px 9.5px}
.chips.multi .chip{border-radius:6px}

/* slider with named stops */
.slider{display:flex;flex-direction:column;gap:2px}
.ticks{position:relative;height:20px;margin:0 8px;font-size:11px;color:var(--c-ink-2)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:4px}
.ticks span::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:5px;background:var(--c-ctl)}
.ticks span.on{color:var(--c-ink);font-weight:600}
.colorrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colorrow input[type=text]{width:100px;font-family:var(--f-code);font-size:12px}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:28px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;border:1px solid var(--c-ctl);background:#fff;position:relative;cursor:pointer;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--c-ink-2);transition:left .12s}
.switch input:checked{background:var(--c-ink);border-color:var(--c-ink)}
.switch input:checked::after{left:19px;background:#fff}
.switch input:focus-visible{outline:2px solid var(--c-focus);outline-offset:3px}

/* per mode disclosure */
.pm{border-top:1px dashed var(--c-line);margin-top:4px;padding-top:4px}
.pm > .pmh{display:inline-flex;align-items:center;gap:6px;min-height:28px;border:0;background:none;padding:0;cursor:pointer;font-size:12.5px;color:var(--c-ink-2)}
.pm > .pmh b{color:var(--c-ink);font-weight:600}
.pm > .pmh::before{content:"▸";font-size:10px}
.pm > .pmh[aria-expanded=true]::before{content:"▾"}
.pmb{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px 14px;border-left:2px solid var(--c-line);margin:4px 0 0 3px}
.pmr{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}
.pmr .mn{font-size:12.5px;font-weight:600;padding-top:5px;display:flex;flex-direction:column;gap:2px}
.pmr .mn .tag{align-self:flex-start}
.pmr.der{color:var(--c-ink-2)}
.pmr .auto{font-size:12px;color:var(--c-ink-2)}
.pmnote{font-size:12px;color:var(--c-ink-2);margin:0}
@container lvp (max-width:420px){.pmr{grid-template-columns:1fr}}

/* list editors */
.le{display:flex;flex-direction:column;gap:6px}
.le .it{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.le .it input[type=text]{width:130px}
.le .it input[type=number]{width:90px}

/* role x mode matrix */
.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.mx th,.mx td{padding:4px 6px;border-bottom:1px solid var(--c-line);text-align:left;vertical-align:middle}
.mx thead th{position:sticky;top:0;background:#fff;z-index:1;font-weight:600;color:var(--c-ink-2);white-space:nowrap}
.mx th.der,.mx td.der{background:var(--hatch)}
.mx th.cur,.mx td.cur{box-shadow:inset 2px 0 0 var(--c-ink),inset -2px 0 0 var(--c-ink)}
.mx thead th.cur{box-shadow:inset 2px 0 0 var(--c-ink),inset -2px 0 0 var(--c-ink),inset 0 2px 0 var(--c-ink)}
.mx .rn{font-family:var(--f-code);font-size:11.5px;white-space:nowrap}
.cellb{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;border:1px solid transparent;background:none;border-radius:6px;padding:2px 4px;text-align:left;cursor:pointer}
.cellb:hover{border-color:var(--c-ctl)}
.cellb[disabled]{cursor:default}
.cellb[disabled]:hover{border-color:transparent}
.cellb .st{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.cellb .st small{color:var(--c-ink-2)}
.cellb.below .st small{color:var(--c-fail);font-weight:600}
.famh td{background:#fafaf9;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3);padding-top:10px}
.famh button{border:0;background:none;cursor:pointer;min-height:24px;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.mxwrap{overflow:auto;max-height:560px;border:1px solid var(--c-line);border-radius:var(--r-2)}
.mxlist{display:none}
@container lvp (max-width:700px){ .lvp .mxwrap{display:none} .lvp .mxlist{display:block} }
.picker{border:1px solid var(--c-ctl);border-radius:var(--r-2);background:#fff;padding:10px;margin:6px 0 10px}
.picker .steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-top:8px}
.picker .stp{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px;border:1px solid var(--c-line);border-radius:4px;background:#fff;cursor:pointer;min-height:48px;font-size:11px;text-align:left}
.picker .stp .chipc{height:16px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.picker .stp.below{color:var(--c-fail)}
.picker .stp.cur{border:1.5px solid var(--c-ink);background:var(--c-sel-bg);font-weight:600}
.picker .stp:hover{border-color:var(--c-ink)}

/* ---------- preview pane ---------- */
.pvh{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;flex:none;border-bottom:1px solid var(--c-line);background:var(--c-app)}
.pvh select{min-height:34px}
.modeseg{display:inline-flex;border-radius:var(--r-2);overflow:hidden;border:1px solid var(--c-ctl)}
.modeseg button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 10px;border:0;border-left:1px solid var(--c-ctl);background:#fff;cursor:pointer;font-size:12.5px;white-space:nowrap}
.modeseg button:first-child{border-left:0}
.modeseg button.der{background:var(--hatch)}
.modeseg button[aria-pressed=true]{background:var(--c-ink);color:#fff}
.modeseg button:focus-visible{outline-offset:-3px;outline-color:var(--c-focus);box-shadow:inset 0 0 0 4px #fff}
.modeseg .mdot{display:inline-flex;align-items:center;gap:3px;font-size:11px}
.modesel{display:none}
@container pvp (max-width:760px){ .modeseg{display:none} .modesel{display:inline-block} }
.pin[aria-pressed=true]{background:var(--c-sel-bg);border:1.5px solid var(--c-ink);font-weight:600}
.pvb{flex:1;overflow:auto;padding:16px;min-height:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp > div{min-width:0}
.cmph{font-size:12px;font-weight:600;color:var(--c-ink-2);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.board{background:#fff;border:1px solid var(--c-line);border-radius:var(--r-3);margin-bottom:14px;overflow:hidden}
.board > header{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--c-line);background:#fbfbfa;flex-wrap:wrap}
.board > header h2{font-size:13.5px;margin:0;flex:1;min-width:140px}
.board > .in{padding:14px}
.hint{margin:6px 0 0;font-size:12px;color:var(--c-ink-2)}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border-bottom:1px solid var(--c-line);padding:5px 8px;text-align:left;vertical-align:middle}
table.t th{font-weight:600;color:var(--c-ink-2);background:#fafaf9;position:sticky;top:0;z-index:1}
table.t td.fail{background:var(--c-fail-bg);color:var(--c-fail);font-weight:600}
.scroll{overflow:auto;max-height:520px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.checker{background:repeating-conic-gradient(#dcdcd9 0% 25%,#fff 0% 50%) 0/12px 12px}
.nf{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-ui);color:var(--c-warn);background:var(--c-warn-bg);border:1px solid var(--c-warn-line);border-radius:4px;padding:0 6px;min-height:20px;white-space:nowrap}

/* ramps */
.ramp{margin-bottom:14px}
.ramp h3{font-size:12.5px;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.rampg{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:1px}
.rampg .c{height:38px;position:relative;border-radius:2px}
.rampg .c.anc::after{content:"";position:absolute;left:50%;bottom:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #1c1c1b}
.rampg .k{font:10px/1.25 var(--f-code);color:var(--c-ink-2);text-align:center;overflow:hidden;word-break:break-all;padding-top:2px}
.rampg .k b{display:block;color:var(--c-ink);font-weight:600}
@container pvp (max-width:980px){ .rampg{grid-template-columns:repeat(10,minmax(0,1fr))} }

/* specimen: brand values only, via inline custom properties */
.spec{font-family:var(--b-body);color:var(--t1);background:var(--bg);padding:22px;position:relative;border-radius:var(--r-3);border:1px solid var(--c-line)}
.spec [data-role]{cursor:pointer}
.spec [data-role]:focus-visible{outline:2px solid var(--c-focus);outline-offset:3px}
.spec .hl{outline:2px dashed #1c1c1b;outline-offset:3px}
.spec h1{font-family:var(--b-display);font-weight:var(--w-display);font-size:clamp(26px,5cqi,40px);line-height:1.1;margin:0 0 8px;color:var(--t1)}
.spec .lead{font-size:15px;color:var(--t2);max-width:52ch;margin:0 0 14px}
.spec .eyb{font-family:var(--b-eyebrow);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tb);margin:0 0 6px;font-weight:600}
.spec .b{min-height:var(--h-md);padding:0 var(--pad-md);min-width:var(--minw-md);border-radius:var(--rad-ctl);font:var(--w-label) 14px var(--b-label);border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.spec .b svg{width:16px;height:16px;flex:none}
.spec .b{white-space:nowrap}
.spec .b.p{background:var(--if);color:var(--ion)}
.spec .b.n{background:var(--nf);color:var(--non)}
.spec .b.o{background:transparent;color:var(--itx);border-color:var(--ibd)}
.spec .b.d{background:var(--dsf);color:var(--dson)}
.spec .b.x{background:var(--df);color:var(--don);cursor:not-allowed}
.spec .btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.spec .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:10px}
.spec .card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad-lg);padding:14px;box-shadow:var(--sh)}
.spec .card h3{font-family:var(--b-title);font-weight:var(--w-title);margin:6px 0 4px;font-size:17px}
.spec .card p{margin:0 0 8px;font-size:13.5px;color:var(--t2)}
.spec .card .media{height:84px;border-radius:var(--rad-md);background:var(--bg3)}
.spec .price{font-weight:600;color:var(--t1)}
.spec a{color:var(--lk);text-decoration:underline;text-underline-offset:2px}
.spec .badge{display:inline-flex;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sbg);color:var(--sfg)}
.spec .field{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:4px}
.spec .field .lb{color:var(--t1);font-weight:600}
.spec .field .inp{min-height:var(--h-md);border:1px solid var(--fb);border-radius:var(--rad-sm);padding:0 12px;display:flex;align-items:center;color:var(--fph);background:var(--ffill)}
.spec .field .msg{color:var(--t2);font-size:12px}
.spec .rowsp{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
.spec .swrow{display:flex;gap:6px;flex-wrap:wrap}
.spec .swb{display:flex;flex-direction:column;gap:3px;font:11px var(--f-code);color:var(--t2);min-width:74px;border:0;background:none;padding:0;text-align:left}
.spec .swb i{display:block;height:34px;border-radius:6px;border:1px solid var(--bd)}
.spec .sech{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin:18px 0 8px}
.spec .icons{display:flex;gap:12px;align-items:center}
.spec .ic{width:24px;height:24px;display:inline-flex;border:0;background:none;padding:0}
.spec .ic svg{width:24px;height:24px}
.callout{position:sticky;bottom:0;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--c-ctl);border-radius:var(--r-2);padding:8px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.08)}

/* size & shape, motion, layout */
.bars{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.bars .bx{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.bars .bx i{display:block;width:40px;background:var(--c-ink);border-radius:3px}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.shp{border:1px solid var(--c-line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:12px}
.shp.on{border:1.5px solid var(--c-ink);background:var(--c-sel-bg)}
.shp i{display:block;width:96px;height:32px;border:1.5px solid var(--c-ink);background:#fff}
.bl{display:flex;flex-direction:column;gap:10px}
.bl .brow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bl .bb{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#2c2c2a;color:#fff;border-radius:6px;font-size:12px;position:relative;box-sizing:border-box}
.bl .bb.edges{justify-content:space-between}
.bl .bb svg{width:14px;height:14px;flex:none}
.bl .dim{font-size:11px;color:var(--c-ink-2)}
.curve{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.curve figure{margin:0;border:1px solid var(--c-line);border-radius:8px;padding:8px;font-size:12px}
.curve svg{width:100%;height:90px}
.bps{display:flex;flex-direction:column;gap:8px}
.bpr{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-size:12px}
.gridv{display:grid;gap:var(--g);padding:0 var(--m);height:28px;background:var(--c-sunk);border-radius:4px}
.gridv i{background:#c9d4ec;border-radius:2px}

/* ---------- activity drawer ---------- */
.drawer{flex:none;border-top:1px solid var(--c-ctl);background:#fff;display:flex;flex-direction:column;min-height:0}
.drawer.open{height:min(52%,440px)}
.drh{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 12px;flex:none;flex-wrap:wrap}
.drh .ttl{display:inline-flex;align-items:center;gap:8px;border:0;background:none;min-height:32px;cursor:pointer;font-weight:600;padding:0}
.drh .last{font-size:12px;color:var(--c-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.drawer.open .drh{border-bottom:1px solid var(--c-line);padding:6px 12px}
.drb{flex:1;overflow:auto;padding:10px 12px 16px;min-height:0}
.agent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.op{border:1px solid var(--c-line);border-radius:var(--r-2);margin-bottom:8px;background:#fff}
.op > .oph{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 10px;border:0;background:none;cursor:pointer;text-align:left;flex-wrap:wrap}
.op > .oph b{font-weight:600}
.op > .oph .when{margin-left:auto;font-size:11.5px;color:var(--c-ink-2)}
.op .opb{padding:0 12px 12px;font-size:12.5px}
.op .opb ul{margin:4px 0;padding-left:18px}
.phase{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.pbar{height:6px;background:var(--c-sunk);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--c-line)}
.pbar i{display:block;height:100%;background:var(--c-ink);transition:width .1s}
.dep{display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0}
.counts button{border:0;background:none;padding:0;min-height:24px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.egroup{border-left:3px solid var(--c-fail-line);padding:6px 10px;margin:8px 0;background:#fffafa;border-radius:0 6px 6px 0}
.egroup.rep{border-left-color:var(--c-ctl);background:#fafaf9}
.egroup h4{margin:0 0 3px;font-size:12.5px}
.egroup .fix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pick{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto;border:1px solid var(--c-line);border-radius:6px;padding:4px}
.pick label{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;min-height:32px;padding:2px 6px;border-radius:4px;cursor:pointer;font-size:12.5px}
.pick label:hover{background:var(--c-sunk)}
.pick label small{color:var(--c-ink-2)}
.pend{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:0 6px;border:1px dashed var(--c-warn-line);color:var(--c-warn);border-radius:4px;min-height:20px}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
.optgrid fieldset{border:0;padding:0;margin:0}
.optgrid legend{font-weight:600;font-size:12.5px;padding:0;margin-bottom:4px}
.panelbox{border:1px solid var(--c-ctl);border-radius:var(--r-2);padding:12px;margin-bottom:10px;background:#fff}
.panelbox h3{font-size:13.5px;margin:0 0 6px}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--c-ctl);border-radius:12px;padding:0;width:min(640px,94vw);max-height:90vh;color:var(--c-ink);box-shadow:0 14px 44px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(28,28,27,.38)}
dialog .dh2{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--c-line)}
dialog .dh2 h2{font-size:15px;margin:0;flex:1}
dialog .dbody{padding:14px 16px;overflow:auto;max-height:62vh}
dialog .dfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--c-line);background:#fff;flex-wrap:wrap}
dialog.full{position:fixed;margin:0;max-height:none;max-width:none;border-radius:0;display:flex;flex-direction:column}
dialog.full[open]{display:flex}
dialog.full .dbody{flex:1;max-height:none}
dialog.full .dfoot{position:sticky;bottom:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.opt{border:1px solid var(--c-ctl);border-radius:var(--r-2);padding:12px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:72px}
.opt:hover{border-color:var(--c-ink)}
.opt b{font-weight:600}
.opt small{color:var(--c-ink-2)}
.opt.def{border:1.5px solid var(--c-ink)}
.err{color:var(--c-fail);font-size:12.5px}
.dtabs{display:flex;gap:18px;border-bottom:1px solid var(--c-line);margin-bottom:12px}
pre.sample{background:var(--c-sunk);padding:10px;border-radius:6px;overflow:auto;max-height:220px;font:11.5px/1.5 var(--f-code);margin:0}
.toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:50;max-width:90%}

/* ---------- mid width ---------- */
@container app (max-width:1040px){ .top .hide-mid{display:none!important} }

/* ---------- narrow mode (Q7): one pane, one 36px top row ---------- */
@container app (max-width:560px){
  .top{min-height:36px;height:36px;padding:0 6px;gap:6px}
  .wide{display:none!important}
  .top .nar{display:inline-flex}
  .brandbtn{min-height:28px;padding:2px 8px;max-width:120px;flex:0 1 auto;min-width:0}
  .brandbtn .dirty{display:none}
  .vdot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--c-ctl);background:#fff;cursor:pointer;padding:0;flex:none}
  .pane{display:inline-flex;border:1px solid var(--c-ctl);border-radius:6px;overflow:hidden;flex:none}
  .pane button{min-height:26px;padding:0 8px;border:0;background:#fff;cursor:pointer;font-size:12px}
  .pane button[aria-pressed=true]{background:var(--c-ink);color:#fff}
  .more{min-width:28px;min-height:28px;padding:0 6px}
  .work{grid-template-columns:1fr}
  .lvp,.pvp{grid-column:1;grid-row:1;border-right:0}
  .work[data-pane=settings] .pvp{display:none}
  .work[data-pane=preview] .lvp{display:none}
  .gutter{display:none}
  .lvp{display:block;overflow:auto}
  .navrow{padding:6px 12px 0;border-bottom:0;gap:6px;flex-direction:row;align-items:center}
  .tabsw{display:none}
  .domsel{display:block;flex:1;min-width:0;min-height:30px}
  .searchw{padding:0;flex:1;min-width:0}
  .searchw input{min-height:30px;padding:2px 10px;width:100%}
  .lvbody{overflow:visible;padding:0 12px 24px}
  .dh{padding:6px 0 0}.dh h2{font-size:15px;margin:0}.dh p{display:none}
  .sc{margin-top:14px}.sh{margin-bottom:8px}.sh h3{font-size:13px}.eyebrow{display:none}
  .lever{margin-bottom:12px}
  .lever > legend,.lever > .lab{margin-bottom:4px;font-size:13px}
  .chip{min-height:28px;padding:2px 10px;font-size:12.5px}
  .chip:has(input:checked){padding:1.5px 9.5px}
  select,input[type=text],input[type=number]{min-height:30px}
  .pvp{overflow:auto;display:block}
  .pvh{padding:6px 10px;gap:6px}
  .pvb{overflow:visible;padding:10px}
  .pvp{position:static}
  .drawer.open{position:absolute;inset:0;height:auto;z-index:30}
  .work.sheet .pvp{display:block!important}
  .work.sheet .lvp{display:none!important}
  .drawer:not(.open){display:none}
  .cmp{grid-template-columns:1fr}
  .spec{padding:14px}
}
</style>
</head>

ace: 'default' }, follow: ['surface'] }` asks for (re-verified against `nestVariantMatch`). STROKE WIDTH (closed #1266): `PartDef` gained `strokeWidth`, `focus-ring`'s `ring` part binds it, and every projected member carries a bound `strokeWeight`. Before it, both executors fell through to `if (!node.strokeWeight) \u2026 = 1` and the ring pasted at 1px in every brand \u2014 half its declared thickness, and 3px of visible gap where 2 was designed, because the compensation above had already assumed 2. What is LEFT is one keyword: `PartDef` has no field for a stroke's style, and cannot usefully have one, because Figma expresses `solid`/`dashed` as a `dashPattern` of pixel runs rather than as a keyword \u2014 so `focus.ring.style` resolves against every brand and has nowhere to bind. A schema decision under #740. Read the remaining gap as \"the ring pastes without its dash style\", not as \"the ring pastes without its stroke\".","min-width derivation \u2014 a literal per size at build (#1667): height \xD7 multiplier, rounded up to 8px, from baseline-density heights. Frozen, not live; a per-mode density keeps the baseline floor.","Locked to edges (#1667) \u2014 in code, padding plus absolutely positioned icons: the button keeps `inline-size: auto` above its `min-inline-size` floor, each icon side pads by `calc(padding-x-visual + icon + gap)`, and the icons sit `position: absolute` at `padding-x-visual` from their edge, vertically centered, so the label centers in the space beside them. Figma holds the same shape with the reserve and the inset as literal px per size (its padding binds one variable, not a sum), so a brand change reaches them only on a rebuild, as with the floor.","width (auto | full) \u2014 declared as a variant axis but deliberately NOT projected into Figma (#487 \xA74). A designer resizes an auto-layout frame; a variant axis for it doubles the whole set to buy nothing a drag does not already do.","Label overflow (brief \xA79) \u2014 the label wraps to a
