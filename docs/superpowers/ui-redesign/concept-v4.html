thumb affordance \u2014 a check when on, an X when off, a cue beyond track color and thumb position. On by default; turn it off where the thumb position and track color are enough. The Figma set carries it as the `State icon` boolean, default on, so both surfaces start from the same default. Never the sole state signal \u2014 thumb position carries the state. Not hardcoded "On"/"Off" text, which is rejected outright.'},{name:"size",type:"enum: 'small' | 'medium'",values:["small","medium"],default:"medium",required:!1,description:"Two rungs, not three: switches rarely warrant a large. Scales the track's height and length and the thumb's diameter. All read `control.size.*`, which moves a rung with brand density; `icon.size.*` would measure the wrong thing. The host row passes its own size through by `follow`."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"The disabled skin \u2014 a contrast-exempt fill/border/thumb treatment. Set on the host, followed here."},{name:"aria-label",type:"string",required:!1,description:"Required only for a genuinely standalone control with no host row to name it \u2014 the Row provides the accessible name, so a nested control must NOT double-label."}],states:["rest","hover","pressed","focus-visible","disabled","error"],variants:{size:["small","medium"],selection:["off","on"]},axisKinds:{size:"authoring",selection:"runtime"},paintKeys:["{selection}.{slot}.{state}","{selection}.{slot}","{slot}"],tokens:{"off.fill":"color.background.tertiary","off.border":"color.interactive.neutral.border.rest","off.border.hover":"color.interactive.neutral.border.hover","off.border.pressed":"color.interactive.neutral.border.pressed","off.border.error":"color.border.danger","off.indicator":"color.interactive.neutral.border.rest","off.icon":"color.background.tertiary","on.fill":"color.interactive.primary.fill.selected","on.fill.hover":"color.interactive.primary.fill.hover","on.fill.pressed":"color.interactive.primary.fill.pressed","on.border.error":"color.border.danger","on.indicator":"color.interactive.primary.on-fill","on.icon":"color.interactive.primary.fill.selected","focus-ring":"color.border.focus","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset","disabled.fill":"color.disabled.fill","disabled.border":"color.disabled.border","disabled.indicator.on-fill":"color.disabled.on-fill","disabled.icon.on-fill":"color.disabled.border",radius:"radius.round","border-width":"border-width.thick","size.small.control":"control.size.sm.track","size.medium.control":"control.size.md.track","size.small.track":"control.size.sm.width","size.medium.track":"control.size.md.width","size.small.dot":"control.size.sm.thumb","size.medium.dot":"control.size.md.thumb","size.small.inset":"control.size.sm.inset","size.medium.inset":"control.size.md.inset"},anatomy:{root:"track",parts:{track:{kind:"box",role:"target",paintSlots:["fill","border"],height:"size.{size}.control",width:"size.{size}.track",radius:"radius",strokeWidth:"border-width",padding:{block:"size.{size}.inset",inlineLabel:"size.{size}.inset"},layout:{direction:"row",align:"center",justify:"start",sizing:{x:"fixed",y:"fixed"}},children:["thumb","focusRing"],note:"The pill AND the nominal hit-target marker (the real hit target is the whole labeled ROW, which lives on `switch-row`; `role: target` is here only because the schema requires exactly one per anatomy \u2014 the same nominal marker `focus-ring`'s `ring` part and `checkbox-control`'s `control` carry). Its two dimensions are two decisions: 2:1 is the ratio the field converges on, and it is the tier's."},thumb:{kind:"box",role:"presentation",paintSlots:["indicator"],size:"size.{size}.dot",radius:"radius",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},positionWhen:{selection:{off:"start",on:"end"}},children:["onGlyph","offGlyph"],note:"The thumb \u2014 ONE part whose position varies, not two that take turns. Its fill is selection-keyed (no single ink bounds both tracks). It clears the track's ends at both extremes (#997: the track's uniform `inset` padding). It carries the state glyph, which travels with it. Its slide is motion and has no expression here; what this schema carries is the two endpoints."},onGlyph:{kind:"vector",glyph:"check",size:"size.{size}.dot",optional:!0,presentWhen:{selection:["on"]},note:"The on affordance (a check). Built at `selection=on`; its visibility is the `State icon` boolean (code: `showStateLabel`), default on. Never the sole state signal \u2014 thumb position already carries it."},offGlyph:{kind:"vector",glyph:"close",size:"size.{size}.dot",optional:!0,presentWhen:{selection:["off"]},note:"The off affordance (an X). Built at `selection=off`; its visibility is the same `State icon` boolean as the check (code: `showStateLabel`), default on. The glyph is `close`, the set's X."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring` component, inset from the TRACK so the ring surrounds the pill. On the track and never the thumb: the thumb moves, and an indicator that moves with it competes with the one thing that signals state."}},codeOnly:['read-only \u2014 deliberately not a state of this atom. It is the field/row-level concern the brief calls "the awkward one" (a lock affordance, not an ink \u2014 and the one candidate token, `color.border.secondary`, resolves to the same step as the rest border in all four brands). The Row decides it.',"pending \u2014 a THUMB SWAP (a spinner replaces the thumb) and an `aria-busy` lock, not a skin. `button` spells exactly this as an `overlay` part (#848), so the mechanism exists and the part is unauthored here \u2014 a second concern in a PR whose subject is the split and the affordance.","THE THUMB'S TRAVEL AS MOTION. `positionWhen` states WHERE the thumb is at each coordinate; the slide between them is the animation the component is most recognized by, and a Figma member is static. The code contract is the `motion` block (KB switch brief \xA78).","THE GLYPH'S OWN MICRO-MOTION \u2014 the check/X draw and the cross-fade onto the thumb on an async toggle. A Figma variant carries no motion, so the glyphs are static outlines at every coordinate; the `motion` block states the thumb's own slide, not the glyph draw.","THE WHOLE-ROW HIT TARGET. A bare track is 24px tall at `small` and 32px at `medium` in every corpus brand (the density-windowed `control.size.*.track` ladder runs 16\u201340px, so a compact `small` track is 16px, under SC 2.5.8's 24px minimum on its own). The accessible target is the labeled ROW, which is `switch-row` and not this atom, at every density. This def is nested, never placed alone, precisely so the target is supplied one level up."]},figmaProperties:{variantAxes:["selection","size"],stateAxis:{name:"state",values:["rest","hover","pressed","focus-visible","disabled","error"]},booleans:{showStateLabel:{part:["onGlyph","offGlyph"],default:!0,figmaName:"State icon"}}},accessibility:{role:'The visual control only \u2014 the accessible switch role, name and aria-checked (announced "on"/"off", never "checked") belong to the host input the Row wires. A standalone use must supply role and name itself.',wcag:["1.4.1 Use of Color (thumb POSITION distinguishes on from off; the glyph is a legibility aid, never the color-independence answer)","1.4.11 Non-text Contrast (the off-track border, load-bearing) / 2.4.13 Focus Appearance (the nested ring, offset, \u22653:1)","4.1.2 Name Role Value (carried by the host; this atom is presentational when nested)"],keyboard:"None of its own \u2014 the atom is not a tab stop. Focus, Space-to-toggle and the tab order belong to the host input; the ring here renders the host's `:focus-visible` state.",focus:"The nested focus ring surrounds the TRACK on `:focus-visible`, never the thumb (the thumb moves, so a ring traveling with it reads as two indicators). Offset, keyboard traversal only.",aria:'When nested in a host row, the host provides the accessible name through `aria-labelledby` \u2014 never double-label. The role is `switch`, announced "on"/"off"; putting `aria-pressed` on it corrupts the announcement (that is a toggle button). The glyph is decorative (`aria-hidden`) \u2014 the role+state already carries on/off.'},content:{labelPattern:"None \u2014 the atom carries no label. The setting name and its rules live on Switch.Row (`switch-row`).",errorPattern:"None of its own \u2014 an outcome-error boundary is a color treatment the host coordinate selects; the message is the Row's."},docs:{usage:"Do not place this on its own. It is the track-and-thumb Switch.Row nests, so a fix to its border weight or its fill grammar reaches the row without being copied. Build it before the row that nests it (the nest resolves by name against the live file). A standalone use is only for a control with an external label and its own aria wiring.",do:["Nest this from Switch.Row rather than redrawing the track per host","Let the host row pass `selection`, `state` and `showStateLabel` through, and `follow` its size, so the nested control tracks the row","Let thumb POSITION carry the state; treat the glyph as a legibility aid, not the color-independence answer","Supply an external aria-label only when using the control genuinely alone"],dont:["Place a bare track as the clickable element \u2014 the labeled row is the hit target, and a compact small track (16px) is under the SC 2.5.8 minimum on its own","Double-label a nested control \u2014 the host row already provides the accessible name","Put the focus ring on the thumb \u2014 it moves, so the indicator would travel with it",'Hardcode "On"/"Off" text beside the control \u2014 the glyph affordance and the role announcement carry it'],contentGuidelines:"The atom has no copy of its own; all label, description and error text belongs to the row that composes it."},ai:{primaryPurpose:"Render the atomic switch control \u2014 the painted pill, its traveling thumb, the X/checkmark state glyph and the focus ring \u2014 for a host row to nest.",whenToUse:"Nested by the labeled Switch.Row (the common case), or standalone only for a control with an external label and its own aria wiring.",avoidWhen:"You want the labeled case (that is Switch.Row), a staged binary submitted with a form (Checkbox.Row / Checkbox.Control), or a mutually-exclusive one-of-many (Radio.Control). Never place a bare track as the clickable element \u2014 the hit target is the labeled row.",commonPartners:["switch-row","focus-ring"],triggerKeywords:["switch control","switch track","toggle control","switch thumb","toggle handle"],generationPriority:3},composition:{composesWith:["focus-ring"],alternativeTo:["checkbox-control","radio-control"],replacesPatterns:["the painted track and thumb inlined in a switch row"],supersededBy:[]},motion:{enter:"none (present on mount)",exit:"none",reduceMotion:"The thumb slides across the track in ~150\u2013200ms, ease-in-out, with a synchronized track-color crossfade; it is the receipt that the immediate change registered. Translate the thumb (`transform`), never animate width or layout, and do not spring it. Under prefers-reduced-motion the slide drops and the thumb snaps (0ms); the track-color crossfade may remain if it stays under flashing thresholds. On an async toggle the thumb snaps to the new position and a spinner cross-fades onto it; if the change fails, the thumb slides back."},notes:{contested:["THE ATOM IS A SEPARATE COMPONENT rather than kept inline in the row, and the #1354 precondition made it earn that: the split was built ONLY after confirming the switch Row nests it (the composition check), which it does \u2014 the switch was already a row containing a control subtree, the shape checkbox had before #1226. The rejected alternative (keep the track inline and let the family diverge) is exactly the per-def duplication #1011 found had shipped the identical fill/border pairing across three defs.","THE THUMB IS AN `indicator` BOX THAT PARENTS A GLYPH, which #910's #864 rule refused until this def widened it. The widening is scoped to a `size`+`radius` disc (a deliberately-shaped filled mark), not a blanket permission \u2014 the #864 case was an SVG wrapper frame with no radius, where the fill was an incidental square. The rejected alternative was a transparent wrapper box inside the thumb to make the glyph an indirect child: it passes the literal check while reproducing the exact fill-behind-glyph #864 exists to prevent, which is a gate dodge the house discipline forbids (a false positive is narrowed with a reason, not worked around).","THE STATE GLYPH IS ONE FIGMA BOOLEAN (`State icon`, default on) OVER TWO SELECTION-GATED PARTS, not a variant axis (owner, 2026-09-28). A `showStateLabel` boolean VARIANT axis would add a name to the closed `VARIANT_AXES` family vocabulary for one def AND double the member count (24 \u2192 48). The node-visibility boolean does neither: the check and the X are each built at their own `selection` value and each carries the property, so a designer turns the glyph off once, in the panel, and the set stays at 24. The cost is a narrowing of #1331's refusal \u2014 a boolean may now target parts that are `presentWhen`-gated, but only when they share one axis and cover all its values, so every member still has a node to toggle.","THE OFF TRACK IS A LIGHT SURFACE STEP (`background.tertiary`) WITH A DARK THUMB, not the neutral button fill (owner, 2026-09-28). The neutral button fill is the one the `neutralEmphasis` lever darkens, and under `strong` emphasis on a brand-neutral action palette it made the off and on tracks both near-black (NB master theme: #2D2C2C off, #34383D on). A surface step no interactive lever moves keeps off light in every brand; the dark thumb in the border's ink is Material 3's unselected shape and Prism 2's. The cost: hover and pressed do not step the off fill (no darker surface step exists, and the overlay wash replaces a fill rather than layering on it).","OFF HOVER AND PRESSED SHOW NO VISIBLE CHANGE, like checkbox and radio at unchecked (owner-decided, 2026-09-28). The off fill holds its rest value \u2014 the tier has no surface step darker than `background.tertiary`, and the interactive overlay wash REPLACES a box's fill (one `fills` array) rather than layering on it, so a 10% wash over the page would read lighter than `tertiary`. The `off.border.hover`/`.pressed` keys stay bound and resolve to the rest border in this tier. The rejected alternative was a new darker surface role, a token mint and a CONTRACT MINOR.","THE DISABLED GLYPH TAKES `disabled.border`, not the thumb's `disabled.on-fill` (#1764, owner-directed 2026-09-28). Both keys bound `disabled.on-fill` before, so the glyph drew in its own thumb's color and could not be seen \u2014 and the glyph now defaults on. `disabled.border` equals the disabled track in every corpus mode, so the glyph repeats the rest-state inversion, 3.04\u20135.49:1 against the thumb. `disabled.text` was measured and rejected at 1.21\u20131.79:1."],unverified:["THE GLYPH IN THE THUMB IS UNVERIFIED ON A REAL HOST for legibility at its smallest size. The thumb is `control.size.*.thumb` = 0.75 \xD7 the track (Prism 2's 24-in-32, #1425), its own tier field rather than radio's `dot`. In every corpus brand the thumb is 18px at `small` and 24px at `medium`, so its ~71%-inset glyph is ~12.7px and ~17px. The smallest case is compact density `small`, a 16px track with a 12px thumb and a ~8.5px glyph. The affordance is most useful at `medium`, and the row, not the atom, is what reaches SC 2.5.8.","THE THUMB IS SELECTION-KEYED \u2014 the off thumb is the dark `interactive.neutral.border.rest`, the on thumb the light `primary.on-fill`; no single ink bounds both tracks. This def adopts Prism 2's TREATMENT \u2014 light filled off track, bordered off state, darker handle, glyph in thumb \u2014 through semantic tokens rather than its literal values.","READ-ONLY AND PENDING BIND NOTHING here and are not even states of the atom \u2014 they are the Row's (a lock affordance; a spinner swap). Recorded so nobody reads their absence as an oversight.","THE INHERITED FOCUS-RING BINDING is now two layers deep (#1280/#1290), the same as `checkbox-control`: the ring is nested inside the track and the track inside the row, so an inherited dimension binding would have to be cleared twice. The symptom to look for: a nested ring sitting at the md control height instead of hugging the track."],evolution:["THE ON/OFF AFFORDANCE SIMPLIFIED across the field (KB switch brief \xA713): Material dropped its in-thumb icon emphasis, and thumb position plus track color now carry the state, with hardcoded On/Off text rejected. This atom keeps the glyph ON by default (the `State icon` boolean; `showStateLabel` in code), matching Prism 2, and treats it as a legibility aid \u2014 never the state signal.",'`role="switch"` MATURED from a newer role backed by checkbox fallbacks into the standard that distinguishes a switch from a checkbox in assistive tech (KB switch brief \xA713). The atom is presentational; the host row carries the role.']}};var Ra={id:"switch-row",name:"Switch.Row",aliases:["switch","toggle","toggle-switch","on-off","switch-group"],category:"form",status:"draft",inherits:"checkbox-row",summary:"Labeled switch for a setting that applies immediately. Label leads, switch trails.",description:"A control for a binary on/off setting that takes effect IMMEDIATELY \u2014 no save, no submit; the flip is both the input and the execution command. The labeled ROW: it nests a Switch.Control (the track, thumb and state glyph) and carries the setting label, with the whole row as the hit target and the control at the trailing edge. Independent by definition: there is no Switch.Group, which closes the selection-control decomposition arc (checkbox has an optional group, radio a mandatory one, switch none). A settings list of switches is a list of rows, not a selection group. Not a staged binary submitted with a form (Checkbox.Row \u2014 if a submit button sits anywhere in the flow, it is a Checkbox.Row), not an action or view-mode toggle (a toggle button with aria-pressed, not built yet), not a one-of-two exclusive labeled choice (Radio.Group, or a segmented control, not built yet).",props:[{name:"checked",type:"boolean",required:!1,description:"The binary, with `defaultChecked` for the uncontrolled form \u2014 native naming. `onChange` is expected to apply the effect IMMEDIATELY: that expectation is the component's contract, and a switch whose change is committed by a later Save button is a Checkbox.Row. For an async effect the controlled value is the SERVER-CONFIRMED source of truth with optimistic local state layered over it."},{name:"label",type:"node",required:!1,description:'Rich content, and part of the hit target \u2014 the Checkbox.Row label model, inherited. Names the SETTING as a stable noun or adjective phrase in sentence case ("Airplane mode"), never the state ("Airplane mode is on") and never an action ("Turn on airplane mode"). It does NOT change on toggle: a label that flips Enable/Disable is disorienting and is a common bug.'},{name:"description",type:"node",required:!1,description:"Helper beneath the label, describedby-wired. Where the consequence of the setting goes \u2014 what turning it on will actually do."},{name:"labelPosition",type:"enum: 'leading' | 'trailing'",values:["leading","trailing"],default:"leading",required:!1,description:"Where Switch.Row differs structurally from Checkbox.Row and Radio.Row, whose control always leads. Defaults to label-leading because a switch's habitat is the settings row, with the toggle at the row's trailing edge where the eye expects it; flip to control-leading when a switch sits inline among other form controls. A PROP and not a variants axis: it changes a row's direction and no ink at any coordinate, so it is an anatomy concern (see the header)."},{name:"isPending",type:"boolean",required:!1,default:!1,description:"A first-class state here, because an immediate change can still wait on the network. Locks input, swaps the thumb for a spinner and announces `aria-busy`. The practice ships optimistic-by-default \u2014 flip instantly, revert and message on failure \u2014 with this as the alternative for high-latency or critical toggles where an inconsistent intermediate is genuinely harmful."},{name:"readOnly",type:"boolean",required:!1,default:!1,description:'Supported, which is not obvious for a toggle. Enterprise dashboards need users to review permission sets and system config they lack authority to change, and disabling those drops them from the tab order while swapping to static text hides the setting from screen readers. So: `aria-readonly="true"`, focusable and IN the tab order, at full WCAG contrast (unlike disabled), and visually distinct from disabled.'},{name:"showStateLabel",type:"boolean",required:!1,default:!0,description:'The on/off affordance \u2014 a checkmark in the thumb when on, an X when off. On by default, matching the `State icon` boolean in the Figma set; turn it off where thumb position plus track color are enough. Never the sole state signal. Exposed from the nested Switch.Control, which carries the glyph. This is NOT hardcoded "On"/"Off" text adjacent to the label, which is rejected outright: it competes with the track, duplicates the screen-reader output, and does not localize.'},{name:"size",type:"enum: 'small' | 'medium'",values:["small","medium"],default:"medium",required:!1,description:"Two rungs, not three: switches rarely warrant a large. Scales the row: the label-to-control gap, the row's minimum height, the label's type, and \u2014 passed through to the nested control by `follow` \u2014 the track's height and length and the thumb's diameter."}],states:["rest","hover","pressed","focus-visible","disabled","read-only","pending","error"],variants:{size:["small","medium"]},axisKinds:{size:"authoring"},paintKeys:["{slot}"],densitySpacing:["size.{size}.gap"],tokens:{label:"color.text.primary","disabled.label":"color.disabled.text","size.small.gap":"space.100","size.medium.gap":"space.100","size.small.min-height":"size.sm.height","size.medium.min-height":"size.md.height","size.small.control-box":"control.size.sm.line-box","size.medium.control-box":"control.size.md.line-box","size.small.control":"control.size.sm.track","size.medium.control":"control.size.md.track","size.small.text":"type.body.sm.default","size.medium.text":"type.body.md.default"},anatomy:{root:"row",parts:{row:{kind:"box",role:"target",layout:{direction:"row",align:"start",justify:"start",sizing:{x:"hug",y:"hug"}},gap:"size.{size}.gap",children:["label","trackBox"]},label:{kind:"text",type:"size.{size}.text",note:`The accessible name AND the second half of the hit target. Names the SETTING as a stable noun phrase and does not change on toggle \u2014 a label flipping between Enable and Disable is this component's most common copy bug. Rich content in code; a plain text node in Figma. Must NOT become hardcoded "On"/"Off" text beside the name, which duplicates the screen-reader output and does not localize.`},trackBox:{kind:"box",role:"presentation",height:"size.{size}.control-box",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"fixed"}},children:["control"]},control:{kind:"nest",nests:"switch-control",height:"size.{size}.control",nesting:{kind:"nest-exposed",variant:{selection:"off",state:"rest"},expose:["selection","state","showStateLabel"],follow:["size"]},note:"An in-flow instance of `switch-control` taking the control cell inside the line-box wrapper. It EXPOSES the control's selection, state and showStateLabel (the consumer drives them from the Row), follows the Row's size, and pins its own height so it is centered within the taller wrapper rather than stretched to fill it."}},codeOnly:["read-only \u2014 a `states` value the Figma set does not carry. Since #1354 the Row projects a SIZE-ONLY set (no stateAxis): the control's `state` is EXPOSED from the nested `switch-control` and the consumer drives it from the Row, so no state is enumerated into the Row's own matrix. read-only binds NOTHING even in code: the brief recommends a lock affordance over a styled locked control, and the one candidate token resolves to the same step as the rest border in all four brands.","pending \u2014 first-class in `props` and carried by no Figma member. It is a THUMB SWAP (a spinner replaces the thumb) on the nested control plus an `aria-busy` lock, not a row skin; `button`'s `overlay` part (#848) is the mechanism, unauthored on the control here. The Row's own per-state LABEL treatment (`disabled.label` dimming the text) is the CODE projection's, not Figma's \u2014 `lint-paint` arm 2 reads `def.states` for reachability, so `disabled.label` stays reachable and keyed for code while the Figma SET collapses to size-only.","states \u2014 the documented cost of collapsing 24 members to 2 (the #1354 decomposition). A disabled Row in Figma shows the disabled CONTROL (the exposed state) beside a full-ink label, because the Row no longer multiplies state.","showStateLabel \u2014 the X/checkmark affordance is exposed from the nested `switch-control` as a consumer property (React prop, `.ai.json` option, Figma exposed property). In Figma it is the control's own `State icon` boolean (default on), which the exposed nested instance surfaces on the Row, so the Row declares no boolean of its own for it. See `switch-control.ts`.","min-height \u2014 `size.*.min-height` is the row's FLOOR and Figma has no floor. `PartDef` carries `height`, which is fixed, so binding it on the row would clip a wrapping label at the one coordinate that matters most. The row hugs its children instead and the keys stay bound for the code projection.","THE FULL-WIDTH SETTINGS ROW, this component's actual habitat and layout rather than anatomy. The row HUGS its children here, so `label` and the control sit adjacent with the gap between them; a settings panel stretches the row and pins the control to the trailing edge, and `justify` on a hugging row cannot express that. `labelPosition: trailing` \u2014 the control-leading order for a switch among other form controls \u2014 is the same kind of fact: a prop that reorders this row, and the reordered form is the code projection's.","The `description` prop \u2014 helper text beneath the label, describedby-wired, where the CONSEQUENCE of the setting goes. A second text part under `label` rather than beside it, which would change the row's vertical shape for content that is optional at every member.","RTL \u2014 the label-leading row mirrors AND the thumb travel flips (`on` sits at the inline-END). Logical properties make that automatic in CSS; a Figma projection would need it stated, and nothing does."]},figmaProperties:{variantAxes:["size"],texts:{label:{part:"label",default:"Switch label"}},booleans:{}},accessibility:{role:'switch (native <input type="checkbox" role="switch">), with aria-checked true/false \u2014 announced "on"/"off", NOT "checked"',wcag:["4.1.2 Name Role Value (the switch role and aria-checked doing the work)","1.4.1 Use of Color (thumb POSITION distinguishes on from off, never track color alone; the thumb glyph is a legibility aid on top of that)","1.4.11 Non-text Contrast (the off-state track must be distinguishable from the background) / 2.4.13 Focus Appearance","2.5.8 Target Size \u2014 intent: the whole row is the target, as in Checkbox.Row. No padding is bound, so the 24\xD724 minimum is met by the consumer's layout, not by a number this def carries","4.1.3 Status Messages (the async outcome or error of an immediate change)"],keyboard:"Each switch is its own tab stop \u2014 like Checkbox.Row, unlike Radio.Row, and there is no group to traverse. SPACE toggles, which is the canonical W3C activation; some systems also accept Enter. Nothing else: no arrow keys, because a switch is never one of a mutually-related set.",focus:":focus-visible ring on the TRACK, never the thumb \u2014 the thumb moves, and a ring that travels with it reads as two indicators. Offset, at least 3:1, keyboard traversal only. A read-only switch STAYS in the tab order and stays focusable; a disabled one is removed from it.",aria:'Three roles are easily confused: checkbox is role="checkbox" (announced "checked"), switch is role="switch" (announced "on"/"off"), and a toggle button is role="button" + aria-pressed (announced "pressed"). Putting aria-pressed on a switch is a recurring and severe error that CORRUPTS the announcement. Prefer the styled native input \u2014 <input type="checkbox" role="switch"> keeps focus, activation and the a11y tree for free. ANNOUNCE THE IMMEDIATE EFFECT: aria-checked flips on toggle; for an async effect set aria-busy during flight and announce the outcome politely (4.1.3). If the toggle changes the page layout (it reveals or removes content), announce that change through an aria-live region. The thumb glyph is decorative (aria-hidden) \u2014 the role and state already carry on/off. TWO IMPLEMENTATION TRAPS: the IA2 quirk, where both aria-pressed buttons and role="switch" map internally to IA2_ROLE_TOGGLE_BUTTON \u2014 author to the ARIA spec regardless; and shadow-DOM label detachment, where wrapping a web-component switch in a native <label> does NOT associate the name with the input inside the shadow root, so set aria-label or aria-labelledby explicitly.'},content:{labelPattern:'Names the SETTING, not the state and not the action \u2014 "Airplane mode", "Location services"; not "Airplane mode is on" and not "Turn on airplane mode". A stable noun or adjective phrase that does NOT change on toggle: a label flipping between Enable and Disable is disorienting and is a common bug. Positive framing is mandatory \u2014 the on state is the affirmative, so off never means a double negative. Sentence case, no terminal punctuation. Long labels wrap; the fixed-width track does not shrink. AND REJECT HARDCODED ADJACENT "On"/"Off" TEXT, which is the label rule this control has and its siblings do not: it competes with the track state, produces duplicative screen-reader output, and does not localize. The track plus the role="switch" announcement already carries it; where legibility genuinely demands more, use the thumb glyph affordance (`showStateLabel`) rather than words.',errorPattern:`An OUTCOME failure, not a validation failure: say what did not happen and that it reverted \u2014 "Couldn't turn on notifications. Try again." Near the control, as a status message rather than a field error. Never "Invalid input"; there was no input to invalidate.`},docs:{usage:"Use for a binary on/off setting that applies IMMEDIATELY \u2014 notifications, dark mode, Wi-Fi, a feature flag in a settings panel. Compose into a list or settings row with the label leading and the switch at the trailing edge, which is the habitat this control comes from. There is no group: a panel of switches is a list of rows, and each switch owns its own independent boolean and fires its own mutation. Default to optimistic updates with revert-and-message on failure, and reach for `pending` only where an inconsistent intermediate would genuinely harm.",do:["Apply the change the instant it is toggled \u2014 the immediacy IS the contract","Put the label first and the switch at the row's trailing edge; flip to control-leading only when a switch sits inline among other form controls","Name the setting, not the state, and keep the label the same on and off","Default to optimistic: flip immediately, then revert and say what failed if the effect did not take","Guard the re-toggle race \u2014 lock input on the first interaction until the effect resolves","Support read-only for settings a user may review but not change: focusable, in the tab order, at full contrast","Let thumb POSITION carry the state, and add the thumb glyph (`showStateLabel`) where legibility demands a cue beyond color"],dont:["Use a switch for a binary that is submitted with a form \u2014 if a Save button sits anywhere in the flow it is a Checkbox.Row (Apple's HIG reserves switches for immediate settings)","Use a switch whose toggle reveals a sub-form that must be filled before the data is valid \u2014 that is progressive disclosure, not an immediate mutation, and it is the most common real misuse","Put aria-pressed on a switch \u2014 it corrupts the announcement; aria-pressed is a toggle BUTTON","Reach for a Switch.Group \u2014 there is none, deliberately: a settings list is a list of rows",'Hardcode "On"/"Off" text beside the label \u2014 use the thumb glyph affordance instead','Add a third or indeterminate state \u2014 role="switch" coerces aria-checked="mixed" to false',"Put the focus ring on the thumb \u2014 it moves, so the indicator would travel with it","Use a switch for a consequential or destructive change \u2014 its immediacy is wrong for a costly or hard-to-reverse effect; pair it with a confirmation, or use a Checkbox.Row with an explicit Save","Use a switch where the user cannot observe the result \u2014 immediacy is the contract, so an effect nobody can perceive is a reason to reconsider the control"],contentGuidelines:"The label names the setting and never changes. The description says what turning it on will do. Async failures say what did not happen and that it reverted."},ai:{primaryPurpose:"Set a binary on/off value that takes effect immediately, with no save step, via a labeled row that nests the track-and-thumb control.",whenToUse:"A single independent setting that applies the moment it is flipped \u2014 a notification preference, dark mode, a feature flag \u2014 usually in a settings row or list with the label leading.",avoidWhen:"The change is staged and committed by a Save or Submit button (Checkbox.Row \u2014 the presence of that button anywhere in the flow is the tell), the toggle reveals a sub-form that must be completed for the data to be valid (Checkbox.Row again; the most common misuse), it is a single consent or agreement (Checkbox.Row), it performs an action or sets a view mode rather than holding a setting (a toggle button with aria-pressed, not built yet), it is a one-of-two exclusive labeled choice (Radio.Group, or a segmented control, not built yet), or a third indeterminate state is needed (Checkbox.Row). Also do not reach for this def expecting a group: there is no Switch.Group by decision.",commonPartners:["switch-control","focus-ring"],triggerKeywords:["switch","toggle","toggle switch","on off","on/off","enable","setting","immediate","feature flag","dark mode"],generationPriority:2},composition:{composesWith:["switch-control"],alternativeTo:["checkbox-row","radio-row"],replacesPatterns:["a checkbox misused for an immediate-effect setting","two radios standing in for an obvious binary on/off","an aria-pressed toggle button misused to hold a state setting"],supersededBy:[],planned:["card","toggle-button","segmented-control"]},motion:{enter:"none (present on mount)",exit:"none",reduceMotion:"The nested control carries the thumb slide (~150\u2013200ms, ease-in-out, snapping to 0ms under prefers-reduced-motion). The Row's motion is the async outcome: on an optimistic toggle the thumb snaps to the new state and a spinner cross-fades onto it while pending; on failure the thumb slides back, the track flashes the error color, and a message says what did not happen, so the reversal is explained. Under prefers-reduced-motion the slide back snaps too; the message still appears."},notes:{contested:['THE `selection` VALUES ARE `[off, on]`, DIVERGING FROM checkbox\'s AND radio\'s `[unchecked, checked]`. #910 settled the axis NAME for the family and left the values open with an ARIA recommendation, so this is a decision taken against that recommendation. Three grounds: paint-key values describe what is on SCREEN and appear in no ARIA tree; `role="switch"` is announced "on"/"off", so ARIA\'s own OUTPUT is on/off even though its PROPERTY is aria-checked; and `checked` is the word that carries this component\'s most common misuse. Since #1354 the values live on `switch-control` (the def that carries the axis), and the Row exposes them. The cost is real and unchecked by anything: the family now spells one axis two ways, and there is no cross-def values census in the engine. If the family should have one vocabulary, this is the entry to delete.','THE TRACK IS DELIBERATELY ASYMMETRIC ABOUT ITS RIM (off paints a fill AND a border, on paints a fill only), and that asymmetry, the light surface-step off track with its dark thumb, and the selection-keyed thumb ink all moved to `switch-control` with the painted surface. They are the one place in the selection family where the border survived #1011, and the reason is measured (the light off fill measures 1.00\u20131.38:1 against the page, so the off rim is the only edge the track has). Removing `off.border` "for consistency" breaks 1.4.11 on every brand at once. Since the off track moved to `background.tertiary` its fill and border are different families, so `lint-paint.ts` arm 4 no longer measures the pair \u2014 the border\'s reason is 1.4.11 alone. Full reasoning: `switch-control.ts` and `checkbox-control.ts`.',"THE ASYNC MODEL SHIPS BOTH STANCES \u2014 optimistic-by-default with revert-and-message, plus a first-class `pending` lock. The field genuinely splits here, and the brief's reconciliation is deliberate: mandating optimism universally puts the whole orchestration burden on every consumer, and mandating the lock kills the immediacy that is the entire component.","READ-ONLY IS SUPPORTED, against the brief author's own first instinct and adopted on the external pass's enterprise argument: users review permission sets and system config they lack authority to change, and disabling those drops them from the tab order while swapping to static text hides the setting from screen readers.","THE LABEL SIDE DEFAULTS TO LEADING, the opposite of every other control in the corpus, because the default follows the dominant habitat (the settings row). It is a prop, not a `variants` axis, because it paints nothing.","THE ON/OFF AFFORDANCE (the thumb glyph) DEFAULTS ON \u2014 `showStateLabel: true` in code and the `State icon` boolean on in Figma (owner, 2026-09-28), matching Prism 2. The contested part is not the default but what the glyph is FOR: a legibility aid, never the 1.4.1 answer, since thumb position already carries the state. Hardcoded adjacent On/Off text is rejected outright. The glyph lives on `switch-control`; why it is a node-visibility boolean rather than a variant axis is argued there."],unverified:["THE DECOMPOSITION IS UNVERIFIED ON A REAL HOST, the same way `checkbox-control`'s was: the nested control instance must pin its own HEIGHT (the track height) rather than stretch to the `control-box` line box, and whether the instance's inherited sizing mode cooperates with the row's auto-layout is a real-host question the offline shim cannot answer. The symptom to look for: a control instance stretched to the line-box height instead of centered within it. The control is non-square, so the Row pins HEIGHT only and the width is the control's own 2:1 \u2014 a narrower pin than checkbox's square.","THE THUMB GLYPH IS UNVERIFIED ON A REAL HOST for legibility at its smallest size. Since #1425 the thumb is 0.75 \xD7 the track (`control.size.*.thumb`), 18px at `small` and 24px at `medium` in every corpus brand, so the glyph is ~12.7px and ~17px after its optical inset; the smallest case is compact density `small`, a 12px thumb and a ~8.5px glyph. The measurement is in `switch-control.ts`.","THE LABEL SIDE HAS ONE EXPRESSION AND `labelPosition` STILL HAS NONE. The anatomy states the DEFAULT (`row.children` is `[label, trackBox]`, label-leading); the flipped order the prop selects is not expressible, because a prop is not a coordinate. RTL is the sharper half and inverts twice over (the row mirrors AND the thumb travel flips).","THE TRAVEL'S TWO ENDPOINTS ARE EXPRESSED AND THE MOTION BETWEEN THEM IS NOT \u2014 on `switch-control` now. The ~150\u2013200ms ease-in-out slide with the synchronized track-color crossfade (dropping to 0ms under prefers-reduced-motion) is the animation the component is most recognized by and has no expression in the schema.",'THE role="switch" ANNOUNCEMENT INSIDE A SHADOW ROOT on older Safari with VoiceOver, where no explicit aria-label or aria-labelledby is set (KB switch brief \xA715, from Material 3\'s notes). The `aria` block already tells a web-component host to set the name explicitly; whether older Safari announces the role and state correctly across the shadow boundary is not checked by anything here.',"THE WHOLE-ROW HIT TARGET NOW HAS A NODE AND STILL HAS NO NUMBER. `row` is the part it lands on; the padding that would expand it to SC 2.5.8's 24\xD724 is a per-consumer decision about the surrounding layout, so no value is bound. It is sharper here than on the siblings because the row is label-leading (the control sits at the trailing edge, furthest from the label) and the track is 24px tall at `small` in every corpus brand, 16px at compact density."],evolution:['FROM AESTHETIC TO SEMANTIC. Switch-versus-checkbox was once treated as a styling choice; `role="switch"` enforcement and Apple\'s App Store rejections made the immediate-effect contract the boundary, not a look (KB switch brief \xA713).','`role="switch"` MATURED from a newer role backed by checkbox fallbacks into the standard that distinguishes switch from checkbox in assistive tech.',"ASYNC MOVED INTO THE COMPONENT CONTRACT. Components moved from presenting a boolean toward handling optimistic updates and pending state themselves (Primer's `loading`, Fluent's async triggers) \u2014 the reason `isPending` is first-class here.","THE ON/OFF AFFORDANCE SIMPLIFIED. Material dropped its in-thumb icon emphasis; position and color carry the state, and hardcoded On/Off text is rejected. The thumb glyph (`showStateLabel`, the `State icon` boolean in Figma) stays on by default as a legibility aid, never the state signal.",'SWITCH SEPARATED FROM TOGGLE BUTTON (`role="switch"` + aria-checked against `aria-pressed`), where older systems conflated them.']}};var Aa={id:"select",name:"Select",aliases:["dropdown","picker","select-menu","listbox","select-panel","exposed-dropdown-menu"],category:"form",status:"draft",summary:"Closed control for picking one value from a known set. The menu is the platform's.",description:"A control for choosing ONE value from a known, bounded set \u2014 the closed, native-first field: label, a bordered control showing the current value or a placeholder with a trailing chevron, and a helper/validation message below. Composes the shared FieldLabel and FieldMessage. The open menu is the platform's (native or a separate listbox), not modeled here. Single-choice only: a choice of several values is a Checkbox.Group, or a multi-select, not built yet. Not free-form text (TextField), not a small always-visible set (Radio.Group, or a segmented control, not built yet), not a set the user filters by typing (a combobox, not built yet).",props:[{name:"label",type:"string | node",required:!0,description:"The visible, persistent label, rendered as the nested FieldLabel. Required \u2014 a select always carries a programmatic name. Never the placeholder."},{name:"value",type:"string",required:!1,description:"The displayed text \u2014 the selected option's label, or the placeholder when nothing is chosen. Controlled: pair with onChange. When it holds the placeholder the ink is the muted placeholder role; a chosen value shows the full-contrast value ink \u2014 the same empty-vs-value polarity text-field uses. This is an internal, content-driven distinction, not a variant a designer picks."},{name:"placeholder",type:"string",required:!1,description:'The null state shown before a choice is made \u2014 plainly the thing to choose ("Country"), not an instruction ("Select a country from the list"), and omittable when the label suffices. Muted, and never load-bearing \u2014 it is not the label, not a real option, and it vanishes once a value is chosen.'},{name:"options",type:"array",required:!1,description:"The bounded set of choices. The select band is roughly 5\u201315 familiar options: at 4\u20135 or fewer an always-visible Radio.Group reads better, and past about 15 a filtering combobox (not built yet) scans better."},{name:"onChange",type:"function",required:!1,description:"Fires with the newly chosen value (also onBlur / onFocus). A controlled value with no onChange is read-only by accident."},{name:"helpText",type:"string | node",required:!1,description:"Persistent guidance, rendered as the nested FieldMessage in its default status; wired via aria-describedby. Show the constraint before failure."},{name:"validation",type:"enum: 'default' | 'error' | 'warning' | 'success'",values:["default","error","warning","success"],default:"default",required:!1,description:"The validation state. Each non-default status swaps the control border to its own boundary (border-only \u2014 `error` \u2192 danger, `warning` \u2192 warning, `success` \u2192 success) AND sets the nested message to the matching status; `default` is neutral. The values align with FieldMessage's status axis, so this drives the nested message directly."},{name:"validationMessage",type:"string | node",required:!1,description:'The validation text shown at error / warning / success. For error, say what is wrong AND how to fix it (SC 3.3.3), never "Invalid".'},{name:"showMessage",type:"boolean",default:!0,required:!1,description:"Whether the composed FieldMessage is shown. ON \u2014 the default \u2014 renders the helper / validation message below the control; turning it off hides the message entirely (a select with no helper or validation text). Never hides a message the field needs: an error still sets aria-invalid and the message carries the reason, so hide it only when there is genuinely nothing to say."},{name:"leadingIcon",type:"slot",required:!1,description:"An optional leading glyph before the value (a category or status mark), aria-hidden. Hidden by default; the file nominates the swap target. Signals the field's purpose; validation never mutates it."},{name:"required",type:"boolean",default:!1,required:!1,description:"Sets required / aria-required, and turns on the FieldLabel's required marker."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"Native disabled \u2014 removed from tab order, not submitted, contrast-exempt. Reserve for a choice irrelevant in the current state."},{name:"readOnly",type:"boolean",default:!1,required:!1,description:"Distinct from disabled: focusable, submitted with the form, and at full contrast, with the value shown and not changeable. Native <select> has no readonly attribute, only disabled, so a read-only select is the custom control with aria-readonly, or a hidden input mirroring the value beside a non-interactive display."},{name:"isPending",type:"boolean",default:!1,required:!1,description:"Async options are loading \u2014 a spinner replaces the chevron and the control sets aria-busy. Not an empty state: the option list is still arriving. The same name Button and TextField use."},{name:"id",type:"string",required:!1,description:"Wiring + form submission; auto-generated with useId if omitted, tying the label to the control and stitching the aria-describedby chain to the message."},{name:"name",type:"string",required:!1,description:"A real control name so the field works uncontrolled, in a native form, and with Server Actions."}],states:["rest","hover","filled","focus-visible","disabled","read-only","pending","empty"],variants:{status:["default","error","warning","success"]},axisKinds:{status:"runtime"},paintKeys:["{status}.{slot}.{state}","{slot}.{state}","{slot}"],densitySpacing:["pad-x","pad-y","gap"],tokens:{radius:"radius.sm","min-height":"size.md.min-height","pad-x":"space.200","pad-y":"space.100",gap:"space.100","root-gap":"space.100","icon-size":"icon.size.sm","border-width":"border-width.hairline","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset-field",type:"type.body.md.default",fill:"color.field.fill","overlay.hover":"color.interactive.neutral.overlay.hover",border:"color.field.border.rest","border.hover":"color.field.border.hover","border.focus-visible":"color.border.focus","border.read-only":"color.field.border.rest","error.border.rest":"color.border.danger","error.border.hover":"color.border.danger","error.border.focus-visible":"color.border.danger","error.border.empty":"color.border.danger","error.border.filled":"color.border.danger","error.border.read-only":"color.border.danger","warning.border.rest":"color.border.warning","warning.border.hover":"color.border.warning","warning.border.focus-visible":"color.border.warning","warning.border.empty":"color.border.warning","warning.border.filled":"color.border.warning","warning.border.read-only":"color.border.warning","success.border.rest":"color.border.success","success.border.hover":"color.border.success","success.border.focus-visible":"color.border.success","success.border.empty":"color.border.success","success.border.filled":"color.border.success","success.border.read-only":"color.border.success",label:"color.text.primary","label.rest":"color.text.secondary","label.hover":"color.text.secondary","label.focus-visible":"color.text.secondary","label.empty":"color.text.secondary",icon:"color.icon.primary","disabled.fill":"color.disabled.fill","disabled.border":"color.disabled.border","disabled.label.on-fill":"color.disabled.on-fill","disabled.icon.on-fill":"color.disabled.on-fill"},anatomy:{root:"container",parts:{container:{kind:"box",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"root-gap",children:["label","control","message"]},label:{kind:"nest",nests:"field-label",nesting:{kind:"nest-exposed",variant:{size:"small",emphasis:"secondary",weight:"regular",state:"rest"},expose:["size","emphasis","weight"]},crossAxisFill:!0,note:"The accessible name, composed rather than re-declared. Nest-exposed (#1438): its label text, required marker and size/emphasis/weight surface on the select so a designer sets them here; a fix to FieldLabel still reaches this without a copy. Starts at the select default (small / secondary / regular). Fills the field's width (#1503), so a long name wraps."},control:{kind:"box",role:"target",paintSlots:["overlay","fill","border"],layout:{direction:"row",align:"center",justify:"space-between",sizing:{x:"fill",y:"hug"}},minHeight:"min-height",minWidth:320,radius:"radius",strokeWidth:"border-width",padding:{block:"pad-y",inlineLabel:"pad-x"},gap:"gap",children:["content","chevron","focusRing"]},content:{kind:"box",layout:{direction:"row",align:"center",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"gap",children:["leadingVisual","placeholder","value"]},leadingVisual:{kind:"slot",optional:!0,size:"icon-size",nesting:{kind:"swap"},note:"An optional purpose glyph before the value, aria-hidden. Absent by default; the caller nominates the icon."},placeholder:{kind:"text",type:"type",presentWhen:{state:["rest","hover","focus-visible","disabled","empty"]},wrap:!0,note:"The prompt before a choice is made, in the placeholder ink (the disabled ink when disabled). Shown on the empty control: rest, hover, focus and disabled. Wraps rather than truncating, and the control grows taller."},value:{kind:"text",type:"type",presentWhen:{state:["filled","read-only","pending"]},wrap:!0,note:"The chosen option's label, in the value ink. Shown on the filled and read-only control. Wraps rather than truncating (#1758), and the control grows taller."},chevron:{kind:"vector",glyph:"chevron-down",size:"icon-size",note:"The disclosure affordance, aria-hidden \u2014 the control's role conveys that it opens a menu. A downward chevron, painted the primary icon role so it matches the value text and the leading glyph (#1343)."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring`. Rings the control, takes no cell, and has its own stroke \u2014 so the focus signal never contends with the control's own border."},message:{kind:"nest",nests:"field-message",nesting:{kind:"nest-fixed",variant:{status:"default"},follow:["status"]},optional:!0,crossAxisFill:!0,note:"Helper or validation text, composed rather than re-declared. Its status follows select's validation by name, so error / warning / success reach the message without a value mapping. Shown by default; the `showMessage` boolean (#1426) hides the whole part where the field has nothing to say. Fills the field's width (#1503)."}},codeOnly:["the OPEN MENU / listbox \u2014 the whole option list is the platform's (a native `<select>`'s popup is OS-drawn; a custom one is a separate listbox/popover surface). This def models the CLOSED control only, so there is no `expanded` state and no option-list anatomy. A designer building the open menu reaches for a menu/listbox component, not a variant of this one.","the label / describedby WIRING \u2014 the host generates ids (useId), ties the FieldLabel to the control, stitches the FieldMessage into aria-describedby, and sets aria-invalid on error. Figma has no accessibility tree and no node-to-node reference, so the nested label and message sit near the control and are associated by proximity alone (the same ceiling `field-label` and `field-message` each hit). aria-expanded / aria-haspopup describe the popup this def does not model.",'empty \u2014 a real STATE in code (nothing is chosen, so the control shows the placeholder), NOT a Figma variant (#1344): in Figma the empty control IS the rest, hover and focus-visible members, showing the `placeholder` layer in `text.secondary`, and `filled` is the member showing the `value` layer in `text.primary`. In code emptiness is a content condition that co-occurs with every interaction, so `empty` stays in `states` (`label.empty` and `error.border.empty` keep the "required field left unchosen" coordinate) and is held out of the projected `stateAxis`, leaving status(4) \xD7 state(6) = 24 members with read-only. In code the prompt and the chosen label are one control\'s content, never two elements.',"the nested LABEL's disabled dimming \u2014 select fixes the FieldLabel to `state=rest` because field-label's state vocabulary (rest / disabled) is not select's (rest / hover / filled / focus-visible / disabled / read-only / pending / empty), so it cannot be followed by value. In code a disabled select dims its label; in Figma the nested label reads at its rest configuration regardless. A projection limit, not a design choice.","pending \u2014 a real STATE (async options are loading: a spinner replaces the chevron and the control sets aria-busy), deliberately NOT a Figma variant, text-field's posture. Its delta is a runtime spinner swap with no distinct static skin a designer picks from a matrix, so it stays in `states` and is held out of the projected `stateAxis`, leaving status(4) \xD7 state(6) = 24 members.","the NATIVE <select> has no readonly attribute, only disabled (KB select brief \xA74, \xA711). The projected read-only member shows the value at full contrast behind the editable field's boundary (`field.border.rest`, #1710); in code that member is the custom control with aria-readonly, or a hidden input mirroring the value for form submission.","the KEYBOARD MODEL \u2014 typeahead to a matching option, arrow keys to move within the open list, Enter/Space to open and commit, Escape to close. All of it belongs to the interaction the closed control opens INTO, which is not modeled here."]},figmaProperties:{variantAxes:["status"],stateAxis:{name:"state",values:["rest","hover","filled","focus-visible","disabled","read-only"]},gridAxis:"state",texts:{placeholder:{part:"placeholder",default:"Placeholder"},value:{part:"value",default:"Selected option"}},booleans:{leadingIcon:{part:"leadingVisual",figmaName:"leading icon",default:!1},showMessage:{part:"message",figmaName:"message",default:!0}},swaps:{leadingIcon:{part:"leadingVisual",figmaName:"\u21B3 swap leading icon"}}},accessibility:{role:`Trigger: a native <select>, or a custom button or role="combobox" (ARIA 1.2) with aria-haspopup="listbox", aria-expanded and aria-controls. Popup: role="listbox" with role="option" children carrying aria-selected \u2014 the platform's or a listbox component's, not modeled here.`,wcag:["1.3.5 Identify Input Purpose (autocomplete on a select collecting user information, such as a country)","1.3.1 Info and Relationships (label + describedby association)","3.3.1 Error Identification / 3.3.2 Labels or Instructions / 3.3.3 Error Suggestion","1.4.3 Contrast (value + placeholder) / 1.4.11 Non-text Contrast (control boundary \u22653:1 \u2014 the rest, hover and read-only borders are gated on `background.secondary`, the darkest permissible ground) / 2.4.13 Focus Appearance","4.1.2 Name/Role/Value (role, and the expanded state of the popup) / 2.5.8 Target Size"],keyboard:"The closed control is one Tab stop; Space / Enter / Down open it. Inside the open list (not modeled here) arrows move, typeahead jumps, Enter commits, Escape closes and returns focus to the control. SC 1.4.13 (the list stays open while hovered and Escape dismisses it) and SC 2.1.1 (every option, including scrolled ones, is reachable without a pointer) apply to that open list, which the platform or a listbox component owns, so this closed control does not claim them.",focus:":focus-visible ring on the control, boundary \u22653:1 (1.4.11 / 2.4.13). The control is the focus target; forwardRef reaches it so a form can focus the first invalid field on submit.",aria:"The host generates ids, ties the label to the control and the message into aria-describedby, and sets aria-invalid on error. The placeholder is NOT the accessible name. A custom control mirrors the native listbox contract (aria-expanded, aria-activedescendant); prefer the native <select> where its OS menu is acceptable, because it is correct for free."},content:{labelPattern:"Noun phrase, sentence case, \u22643 words, no trailing colon; never the placeholder (see field-label).",errorPattern:"What is wrong AND how to fix it (SC 3.3.3); icon + text, not color-only (carried by the nested field-message)."},docs:{usage:"Use to choose ONE value from a known, bounded set where the options are not worth showing all at once. Always render a visible label (the nested FieldLabel); show the constraint in helper text before failure; drive the nested FieldMessage's status from the validation state. The open menu is the platform's \u2014 prefer a native <select> where its OS menu is acceptable. The select band is roughly 5\u201315 familiar options: at 4\u20135 or fewer an always-visible Radio.Group reads better, and past about 15 a filtering combobox (not built yet) scans better. One value only; for several, use a Checkbox.Group.",do:["Render a visible, associated label (FieldLabel) above the control","Show a muted placeholder as a prompt, never as the label or a real option","Drive validation through the status axis so the border and the nested message agree","Prefer the native control where its OS menu is acceptable \u2014 the listbox contract is correct for free"],dont:["Use the placeholder as the label, or put a real, selectable option in it","Model the open menu as a state of this control \u2014 it is a separate listbox / popover surface","Signal a status with the border color alone \u2014 the nested message carries the text + icon","Reach for a select when the user types to filter (a combobox, not built yet) or the set is two mutually-exclusive options (Radio.Group)"],contentGuidelines:'Label = noun phrase, sentence case, no trailing colon. Placeholder = the plain null state ("Country"), not an instruction, and omittable when the label suffices. Error says what + how to fix, never "Invalid".'},ai:{primaryPurpose:"Choose one value from a known, bounded set, with an associated label and helper/validation message, modeling the closed control.",whenToUse:"One-of-a-known-set choices too numerous or space-costly to show all at once \u2014 a country, a status, a category.",avoidWhen:"The value is free-form text (TextField), the user types to filter a suggestion list (a combobox, not built yet \u2014 a different ARIA contract), more than one value may be chosen (Checkbox.Group, or a multi-select, not built yet \u2014 this select is single-choice), the set is 4\u20135 options or fewer and worth showing at once (Radio.Group, or a segmented control, not built yet), the set runs past about 15 options (a combobox), or the choice is a binary that takes effect instantly (Switch.Row).",commonPartners:["field-label","field-message","focus-ring","icon"],triggerKeywords:["select","dropdown","picker","choose","option list"],generationPriority:2},composition:{composesWith:["field-label","field-message","focus-ring"],alternativeTo:["text-field","radio-group","checkbox-group"],replacesPatterns:["a bare <select> with no label wiring","placeholder-as-label"],supersededBy:[],planned:["form","menu","combobox","segmented-control"]},motion:{enter:"The open list (the platform's or a listbox component's): ~100\u2013150ms opacity fade with a small vertical translate (translateY(-4px) \u2192 0), anchored to the control. The chevron rotates on open under the same rule.",exit:"The open list closes faster than it opens \u2014 ~75ms, a fade without translate \u2014 so dismissal reads as instant.",reduceMotion:"Under prefers-reduced-motion, drop the translate and scale and keep an accelerated opacity fade (~50ms); the chevron rotation follows the same rule. The closed control's border and state changes are short token-driven transitions, text-field's ~100\u2013150ms, and resolve to an instant color change under reduced motion."},notes:{contested:["Native <select> vs a custom listbox \u2014 this def models the closed control both share and leaves the open menu to the platform (native-first). A fully custom, styleable menu is a separate listbox/popover surface, chosen when the native menu's look is unacceptable and the extra ARIA cost is accepted.","SINGLE vs MULTIPLE choice \u2014 the brief carries a `multiple` prop (\xA73, \xA715: value becomes an array, Space toggles and keeps the list open, a token or count summary, leading checkboxes). This def is single-choice by decision (#1699, owner-delegated): a choice of several values goes to Checkbox.Group, or to a multi-select, not built yet. The alternative is `multiple` here, which changes the keyboard contract and the value type, so it is a second component's worth of behavior behind one flag.","THE BRIEF'S OTHER VARIANT AXES, NOT DECLARED (brief \xA74, \xA715). `size` [small, medium, large] is deferred (#1699 decision 2): the control binds the single `md` rung, and adding the ladder is text-field's `props.size` + `size.*` shape, a separate decision. `density` [comfortable, compact] follows the brand's density lever rather than a per-component axis. `selection` [single, multiple] and `multi-summary` [count, tokens] are the single-choice decision above. `rendering` [native, custom] is the native-first call in the first entry: this def models the closed control both share. `mode: creatable` blurs toward a combobox (brief \xA74) and belongs with that component, not built yet. None is in `VARIANT_AXES` today, which is closed (#847).","error as a border swap vs a full validation border set \u2014 settled as text-field settles it. Until #1517 error was the ONLY status that colored the border; #1517 (owner-directed, Prism 2 parity) extended the swap to warning and success, which the token tier already emits as `border.warning`/`border.success`, so every non-default status now colors its own boundary AND carries the message."],unverified:["The nested label and message now FILL the field's width (#1503, `crossAxisFill` \u2192 `layoutAlign: STRETCH`), spanning the 320 control rather than hugging narrower \u2014 the gap this note used to record (a `nest` cannot bind sizing, #1299, so it once sat at its natural width) is closed. The control is floored at 320 (`minWidth`) and the column hugs to it, so the field reads at 320 and the two nested parts stretch to match, each instance FIXED across (#1751) so its text wraps at that width (#1757); `test:roundtrip` measures the stretch and the wrap on the offline host, but whether a real host keeps the stretch on a nested INSTANCE is the standing offline-arm caveat (below).","A long value or placeholder WRAPS and the control grows taller (#1758), with no ellipsis on the Figma member. Measured on the offline host. A NATIVE <select> draws its selected value on one line, so the code-side reading needs the #1758 audit's answer for the native element.","The leading glyph is a node-visibility BOOLEAN (#1331): the node is built at every member with `visible:false` and shown by the `leading icon` switch. In Figma auto-layout a `visible:false` child is EXCLUDED from the flow \u2014 it takes no space or gap \u2014 so a hidden glyph should add no gap to `content`, exactly as the absent slot did. The offline shims gate the boolean property, the built `visible=false` and the `componentPropertyReferences.visible` wiring, but NOT auto-layout's exclusion of invisible children: whether a real host reflows `content` when the switch toggles is a host question no Node gate answers. Symptom on a real host: a persistent gap where the hidden glyph sits, or the field not tightening when leading is off."],evolution:["READ-ONLY KEEPS THE EDITABLE FIELD'S BOUNDARY (owner decision, 2026-09-29, #1710). The read-only member binds `field.border.rest`, the same border as the rest and filled members, in every mode. The earlier `border.secondary` binding measured 2.69\u20132.81:1 on `background.secondary` in light, below the 1.4.11 floor, and `field.border.rest` is already the quietest neutral step that clears 3:1 there, so no fainter read-only edge can pass. Read-only is carried by its semantics (aria-readonly; still focusable and submitted) and by the affordances its member does not draw (no caret, no hover wash), not by a fainter edge.","STYLING ERA (~2015\u20132020): custom <div> listboxes to escape the unstyleable native element, at the cost of industry-wide accessibility regressions (KB select brief \xA713).","ACCESSIBILITY ERA (~2020\u20132024): headless libraries (React Aria, Radix) codify the ARIA 1.2 listbox and combobox patterns correctly, with JavaScript positioning and focus management dominating the payload.","PLATFORM ERA (2025\u2013present): the Popover API, CSS Anchor Positioning and `appearance: base-select` let a native <select> carry custom styling and rich option content, collapsing the native-versus-custom trade. Directional and unverified in the brief \u2014 the reason this def stays native-first and models only the closed control."]}};var Ea={id:"veil",name:"Veil",aliases:["wash","photo-wash","image-overlay","image-scrim","media-wash","photo-overlay"],category:"foundations",status:"draft",summary:"Wash over media so text stays legible, solid or fading from one edge. Verify contrast.",description:"A designer-selectable wash placed over a photograph or video so text set on top of it stays legible. Full-bleed, and chosen per image: pick a DARK wash under light text or a LIGHT wash under dark text (the `value` axis), then the intensity for how much the image needs muting, then the direction \u2014 a solid wash over the whole image, or one strongest at the edge the text sits on and fading to clear at the opposite edge. The intensity is a magnitude \u2014 a stronger wash mutes the image more \u2014 not a contrast guarantee, because the result depends on the specific photo; verify contrast against your own image. Not the modal backdrop, which is a separate mode-varying fill (scrim.default) that dialogs reference directly.",props:[{name:"value",type:"enum: 'dark' | 'light'",values:["dark","light"],default:"dark",required:!1,description:"The wash's polarity \u2014 a DARK wash to lift light text off the image, a LIGHT wash to lift dark text. The designer picks it per image from what the photo needs; there is no automatic choice, because which polarity a given photograph wants is a judgment about that image."},{name:"intensity",type:"enum: 'subtle' | 'medium' | 'strong'",values:["subtle","medium","strong"],default:"medium",required:!1,description:"How much the wash mutes the image, weakest to strongest. A magnitude, not a contrast promise \u2014 a stronger wash darkens (or lightens) the photo more, and whether the text on top clears its floor depends on the image, so verify contrast against your own photo. subtle keeps the image most present; strong mutes it most."},{name:"direction",type:"enum: 'full' | 'from-top' | 'from-bottom' | 'from-left' | 'from-right'",values:["full","from-top","from-bottom","from-left","from-right"],default:"full",required:!1,description:"Where the wash sits. full is a solid wash over the whole image. from-top, from-bottom, from-left and from-right put the full intensity at that edge and fade linearly to clear at the opposite edge \u2014 for text that sits along one edge. The intensity applies at the named edge only, so verify contrast where the text actually sits."}],states:[],variants:{value:["dark","light"],intensity:["subtle","medium","strong"],direction:["full","from-top","from-bottom","from-left","from-right"]},axisKinds:{value:"authoring",intensity:"authoring",direction:"authoring"},paintKeys:["{value}.{intensity}"],tokens:{"dark.subtle":"color.veil.dark.subtle","dark.medium":"color.veil.dark.medium","dark.strong":"color.veil.dark.strong","light.subtle":"color.veil.light.subtle","light.medium":"color.veil.light.medium","light.strong":"color.veil.light.strong","dark.clear":"color.veil.dark.clear","light.clear":"color.veil.light.clear","nominal-side":"container.narrow"},anatomy:{root:"wash",parts:{wash:{kind:"box",role:"target",paintSlots:["fill"],gradient:{axis:"direction",angles:{"from-top":180,"from-bottom":0,"from-left":90,"from-right":270},fadeTo:"{value}.clear"},size:"nominal-side",note:"The wash itself: one box, one fill, no children. Full-bleed in use \u2014 it stretches to cover the image behind it \u2014 so its standalone size is nominal and a designer resizes it. It carries no border and no radius, because a wash has no edge of its own; it covers the media edge to edge. At a directional member the fill is a two-stop linear gradient, the chosen intensity at the named edge fading to clear at the opposite one."}},codeOnly:["full-bleed \u2014 a veil covers its container edge to edge, which is a LAYOUT fact (the box fills its parent) that a STANDALONE Figma component cannot hold: there is no parent to fill, and a fill-sized root acquires no extent at all (the 100\xD7100 default-frame defect `lint-standalone-floor.ts` exists for). So the standalone member binds a NOMINAL square side (`container.narrow`, 720px) and a designer resizes or sets it to fill over their image. In code the veil is an absolutely-positioned or inset overlay sized to its media container; the fixed nominal square is the placeholder that reads as a wash in the library.","directional washes in code \u2014 a `from-*` member is a CSS linear gradient from the veil role at the named edge to the clear role at the opposite edge, two stops. from-top is `linear-gradient(to bottom, var(--color-veil-dark-strong), var(--color-veil-dark-clear))` for a dark strong veil; from-bottom is `to top`, from-left `to right`, from-right `to left`. Use `light` on both stops for a light veil. `full` is the solid role alone (`background: var(--color-veil-dark-strong)`). A browser interpolates the stops premultiplied, so its fade never passes through gray; Figma interpolates them unpremultiplied, which is why each polarity has its own clear end \u2014 clear white for a light veil \u2014 so the fade keeps the wash's hue on both.","the intensity is a magnitude, not a state \u2014 subtle/medium/strong is how much the wash mutes the image, and Figma carries it as a variant coordinate a designer selects, never a runtime state. A veil has no interaction states at all (`states: []`), so there is no hover, press or focus member; a control placed on top of the veil carries its own states."]},figmaProperties:{variantAxes:["value","intensity","direction"],booleans:{}},accessibility:{role:"none \u2014 a presentational overlay. The veil conveys no information of its own; it is a wash behind text, so it is aria-hidden and the text on top carries the accessible content.",wcag:["1.4.3 Contrast (Minimum) \u2014 the veil exists to help text on an image clear 4.5:1 (or 3:1 for large text), but it cannot GUARANTEE it: the result depends on the photo, so the contrast is verified against the real image, not assumed from the wash","1.4.11 Non-text Contrast \u2014 where content on the veil is itself a UI boundary, the same per-image verification applies","1.4.1 Use of Color \u2014 the wash lifts text off the image; it is not itself a carrier of meaning"],focus:"None \u2014 the veil is not focusable and takes no place in the tab order. It is a decorative layer behind content; the interactive elements sit on top of it and own their own focus.",aria:"Mark the veil aria-hidden \u2014 it is presentational and announcing it would add nothing to the text it sits behind. Never place text INSIDE the veil node as its only home; the veil is a background layer, and the text is a sibling on top so assistive tech reads the text directly. The veil is a legibility aid, not a substitute for verified contrast: check the text against the actual image, because the wash cannot promise a ratio over an unknown photo."},content:{labelPattern:'A veil carries no text of its own \u2014 it is a wash behind other content. Where its variants are named in a UI, name the polarity and the magnitude plainly: "Dark, medium" rather than a WCAG floor, because the rung is a magnitude and not a contrast promise.'},docs:{usage:"Place a veil between a photograph (or video) and the text set over it, so the text stays legible. Pick the polarity from the image and the text on it \u2014 a DARK wash under light text, a LIGHT wash under dark text \u2014 then the intensity for how much the image needs muting: subtle keeps the photo most present, strong mutes it most. Then the direction: full for text anywhere on the image, or a from-top, from-bottom, from-left or from-right fade when the text sits along one edge \u2014 the wash is at full intensity on that edge, fading to clear at the opposite edge. The veil is full-bleed, sized to its media container, with the text and any controls as siblings on top rather than children of the wash. Treat the intensity as a starting point and VERIFY the text's contrast against your own image \u2014 the wash cannot guarantee a ratio over an unknown photo. For the mode-varying backdrop behind a modal, use scrim.default instead; the veil is for media.",do:["Pick the polarity from the image \u2014 a dark wash under light text, a light wash under dark text","Use a directional wash from the edge the text sits on \u2014 from-bottom for a caption along the bottom","Verify the text's contrast against the actual photo; the intensity is a magnitude, not a guaranteed ratio","Size the veil to its media container and keep the text and controls as siblings on top of it","Mark the veil aria-hidden \u2014 it is a presentational background layer"],dont:["Read the intensity as a contrast promise \u2014 a stronger wash mutes the image more, but whether text clears its floor depends on the photo","Reach for a veil as the modal backdrop \u2014 that is scrim.default, a separate mode-varying fill dialogs reference directly","Put the text inside the veil node \u2014 the text is a sibling on top, so assistive tech reads it directly and the wash stays decorative","Set text in the clear half of a directional wash \u2014 the intensity holds only at the named edge, so text away from it sits on the unmuted photo"],contentGuidelines:'The veil holds no copy. Where its variants surface in a UI, name the polarity and magnitude ("Dark, strong") rather than a contrast floor.'},ai:{primaryPurpose:"Place a designer-selected wash over a photograph or video so text set on top of it stays legible, choosing the wash's polarity and magnitude per image.",whenToUse:"Text or controls sit over a photograph or video and need to stay readable against a varied image. Pick a dark wash under light text or a light wash under dark text, then the intensity for how much the image needs muting, then the direction \u2014 full for text anywhere, or a fade from the edge the text sits on \u2014 and verify contrast against the real photo where the text sits.",avoidWhen:"The overlay is the backdrop behind a modal or dialog (that is scrim.default, a mode-varying fill referenced directly, not this component), the surface behind the text is a solid color rather than an image (bind a semantic background or text role directly and the contrast is known), or the text sits in the clear half of a directional wash (move it to the named edge or use full).",commonPartners:["icon","button","image-placeholder"],triggerKeywords:["veil","wash","photo wash","image overlay","image scrim","photo overlay","text over image","darken image","media wash","gradient scrim","gradient overlay","fade overlay"],generationPriority:3},composition:{composesWith:[],alternativeTo:[],replacesPatterns:["a hand-tuned semi-transparent rectangle over an image with an ad-hoc opacity"],supersededBy:[],planned:["scrim"]},notes:{contested:["THE FILL SLOT IS `fill`, NOT `overlay`, and that is a call made in this def rather than an oversight (there is no brief to make it). A veil IS conceptually a tint over whatever is beneath it, which is what `BOX_PAINT_SLOTS`' `overlay` slot names \u2014 and `lint-paint.ts` arm 4 excludes `overlay` from its redundant-edge measurement for exactly that reason (a tint's alpha would be mis-measured as opaque). The veil binds `fill` because the wash IS the box's whole paint here \u2014 there is no ground fill beneath it that the wash sits over WITHIN this component; the image it washes is a sibling behind the veil node, not a fill on it. `fill` and `overlay` would resolve the same variable and reach the same node; `fill` is the primary slot and the one a slot-free paint template answers, which keeps the grammar to a single template.","THE `value` VALUES ARE LOWER-CASE `dark`/`light`, not the capitalized `Dark`/`Light` a UI shows, and that is forced by `lint-paint.ts` arm 1 rather than a style choice. Arm 1 splits a paint key's ref on `.` and checks the key's LEAD segment is a member \u2014 so a key led by `Dark` binding `color.veil.dark.*` would fail, because `dark` (the role segment) is not `Dark` (the lead). The corpus convention is lower-case axis values anyway (`unchecked`, `off`, `filled`, `regular`), with the capitalized form left to the UI label; `weight` makes the same split (`bold` \u2192 `type.body.*.strong`). So the KEY carries the lower-case axis value and the REF carries the matching lower-case role segment, and arm 1 covers every veil fill with no exemption. Spelling the values `Dark`/`Light` would need six `PROVENANCE_EXCEPTIONS` entries for no gain, which is fixing a false positive by narrowing a scan \u2014 the move this repo forbids."],unverified:["A DIRECTIONAL WASH'S CONTRAST IS HIGHEST AT ITS NAMED EDGE AND FALLS TO NONE AT THE OPPOSITE ONE (#1318). The intensity
