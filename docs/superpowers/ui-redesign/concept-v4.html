y brand whose outline interaction is not none now emits \u2014 one leaf on overlay-neutral, the family on solid-tint. It replaced `interactive.primary.overlay.selected`, a 20% neutral wash on the default lever rather than a primary tint. On none there is no tint.',`Owner, 2026-09-29: a selected tag with the check shown is one glyph and one gap wider than its unselected twin (30px at medium on comfortable density), and the width is not reserved, so a group reflows on toggle. It was held as a contested item against decision E's "nothing reflows".`,"Owner, 2026-09-29: selected hover and pressed keep the tint and step the 2px outline (`interactive.primary.border.hover` / `.pressed`). It was held as a contested item.","Owner, 2026-09-29: the Figma switch for the Select check is `Check icon` (it was `check mark`); the code prop stays `showCheck`. The Dismissible \xD7 has no switch: it is the tag's action and is on every member.","Badge's hook, answered point by point. (1) Tag binds `color.interactive.*` only (plus disabled and the focus ring). (2) Tag has hover, pressed, focus-visible and disabled members, and selection as an axis. (3) Tag is in `lint-hit-target.ts` INTERACTIVE, 44px at medium. (4) Tag is a pill with an outline at rest, a tint and a 2px primary outline when selected; the status badge has a small radius and a tone fill, and binds no interactive role. (5) Tag no longer nests IconButton.Neutral: the \xD7 is a glyph in a square slot. `test.ts` holds (1) and (4) against Badge's projected rest paint.","Two types, Select and Dismissible (owner, 2026-09-28), replace the three interactions (clickable | selectable | removable) of 2026-09-27. The plain clickable tag is dropped: an action in place is a Button. `type` is the variant axis name Badge shares (Badge's `genre` was renamed to match), and the code prop of the same name replaces `interaction`.","The dual-action tag (select the body, remove with the \xD7, brief \xA72) is gone: Select has no dismiss at all (#1743), which also removed the \xD7 on the selected fill that measured 2.09\u20132.86:1.","The remove control stopped nesting IconButton.Neutral (#1741): the nested 36px small icon button inside a 44px tag was the one target `lint-hit-target.ts` could not see. The \xD7 is now a plain glyph in a square slot the tag's height, which the gate measures.","Selected is a tint and a 2px outline, no longer the primary fill with on-fill ink, and the label weight is the same both ways (owner, 2026-09-28). The check mark moved from before the label to after it and became switchable.","The label wraps rather than truncating (#1758): the earlier guidance, an ellipsis paired with a title or tooltip, left the full text unreachable by keyboard, touch and screen reader.",'The brief\'s `Token` alias is not carried as a bare alias: in this repo "token" means a design token, and an agent asked for one would land here. "recipient token" is kept as a trigger phrase.',"A leading icon rung one smaller than the control rung (Button's #1350 offset) would suit a text-bearing tag; it is an owner exception in `lint-rung-names.ts`, so the 1:1 rung ships and the offset is held."]}};var Na=[pa,ma,ra,la,da,ca,ha,ua,ga,fa,ba,ya,wa,va,xa,ka,Ta,$a,Sa,Ra,Aa,Ea,Oa,Ca,Ia,za];var Pa=t=>t.variants??{};var La=t=>{let e=t.figmaProperties;if(!e)return 0;let n=e.variantAxes??[],o=g=>(Pa(t)[g]??[]).map(String),s=n.reduce((g,f)=>g*(Pa(t)[f]?.length??1),1),l=e.excludeCoordinates??[],u=g=>n.reduce((f,b)=>{let w=o(b);for(let R of g)b in R&&(w=w.filter(L=>R[b].includes(L)));return f*w.length},1),d=0;for(let g=1;g<2**l.length;g++){let f=l.filter((b,w)=>g&1<<w);d+=(f.length%2?1:-1)*u(f)}return(s-d)*(e.stateAxis?.values.length??1)*2**(e.slotAxes??[]).length};var to=t=>{let e=t.trim();return e.length>=2&&(e[0]==='"'&&e[e.length-1]==='"'||e[0]==="'"&&e[e.length-1]==="'")?e.slice(1,-1):e},qs=t=>{let e=t.trim();return e.length>=2&&(e[0]==='"'&&e[e.length-1]==='"'||e[0]==="'"&&e[e.length-1]==="'")},Da=t=>{let e=t.trim();return tral hue",control:"slider",required:!0,min:0,max:360,step:1,unit:"\xB0",description:"Hue the grays lean toward (a small chroma tints them to the brand for cohesion).",stops:{warm:60,cool:250}},{key:"neutral.chroma",group:"color",label:"Neutral chroma",control:"slider",required:!0,min:0,max:.03,step:.001,description:"Peak neutral chroma (~0.004\u20130.02); tapers to near-0 at the ramp ends. 0 = pure gray.",stops:{pure:0,subtle:.006,tinted:.012,saturated:.02}},{key:"neutral.anchor",group:"color",label:"Pin a neutral",control:"color",advanced:!0,description:"Optional. A pre-defined brand gray, pinned verbatim at its lightness step; the ramp is built around it (hue/chroma from the anchor) instead of the cast. Set for a client that ships their own neutral; omit to derive from hue + chroma."},{key:"brandColors",group:"color",label:"Additional brand colors",control:"list",itemLabel:"brand color (name + OKLCH)",description:"Secondary / tertiary / accents \u2014 any number; each becomes its own ramp and can drive actions."},{key:"actionPalette",group:"color",label:"Action palette",control:"palette-ref",default:"primary",description:"Which palette drives interactive/action color. Defaults to primary; point at an accent when the hero color is a poor CTA."},{key:"linkPalette",group:"color",label:"Link palette",control:"palette-ref",default:"primary",description:"Which palette drives link color. Defaults to following the action palette; point at primary, neutral, or an accent to give links their own color. The contrast floor holds either way. A link palette that is not color-distinct from body text (e.g. neutral) prompts a warning to underline links for WCAG 1.4.1 \u2014 pair it with an underlined link role."},{key:"status.success",group:"color",label:"Success color",control:"color",advanced:!0,description:"Optional measured override; omit to let the engine synthesize from a canonical hue."},{key:"status.warning",group:"color",label:"Warning color",control:"color",advanced:!0,description:"Optional measured override; omit to synthesize."},{key:"status.danger",group:"color",label:"Danger color",control:"color",advanced:!0,description:"Optional measured override; omit to reuse the brand red (if red) or carve a dedicated one."},{key:"status.info",group:"color",label:"Info color",control:"color",advanced:!0,description:"Optional measured override; omit to synthesize from the canonical blue hue."},{key:"surfaces",group:"color",label:"Page surfaces",control:"object",advanced:!0,description:"Non-default page surface per mode (e.g. a warm off-white). The contrast floor moves with it."},{key:"strictInteractiveContrast",group:"color",label:"Strict interactive contrast",control:"toggle",advanced:!0,default:!1,description:"Opt-in (off by default). The inverse filled button steps its fill per state; the primary and destructive labels\u2019 colored ink clears AA at rest but dips on the transient hover/pressed steps. On swaps both inverse labels to the neutral high-contrast ink so every state clears AA \u2014 guaranteed legibility over brand color."},{key:"linkStateRungs",group:"color",label:"Link states",control:"object",advanced:!0,description:"Optional. Set how far each engaged link state \u2014 hover, pressed, visited \u2014 steps from the resting link, one state at a time, as a count of ramp steps. An unset state keeps the tuned walk; the resting link and its focus follow the action palette. Each step is held to the link\u2019s contrast floor, so it respaces a state without dropping the link below 4.5:1."},{key:"radiusScale",group:"form",label:"Corner softness",control:"slider",default:1,min:0,max:2,step:.5,description:"0 = sharp, 1 = default, 2 = soft. Scales the radius ramp.",stops:{sharp:0,modest:.5,standard:1,soft:1.5,round:2}},{key:"density",group:"form",label:"Density",control:"enum",default:"comfortable",options:[{value:"comfortable",label:"Comfortable"},{value:"compact",label:"Compact"},{value:"spacious",label:"Spacious"}],description:"Sets control heights, and moves each component\u2019s padding and gaps one step on the spacing scale. The name stays stable; the metrics shift. Spacing follows the brand\u2019s density, not the mode\u2019s: a mode\u2019s density changes control heights only."},{key:"controlShape",group:"form",label:"Control shape",control:"enum",default:"rounded",options:[{value:"boxed",label:"Boxed"},{value:"hairline",label:"Hairline"},{value:"rounded",label:"Rounded"},{value:"pill",label:"Pill"}],description:"Corner shape for pill-able controls like buttons. Boxed is sharp (0px); hairline is a fixed 1px edge; rounded follows corner softness; pill is a full height \xF7 2, whatever the softness."},{key:"buttonIcons",group:"form",label:"Button icons",control:"enum",default:"attached",options:[{value:"attached",label:"Attached to label"},{value:"edges",label:"Locked to edges"}],description:"Where button icons sit. Attached to label keeps them beside the label. Locked to edges pins them to the button edges and centers the label in the space between."},{key:"buttonContentSize",group:"form",label:"Button label & icon",control:"enum",default:"match",options:[{value:"match",label:"Match button size"},{value:"smaller",label:"One step smaller"}],description:"The label and icon size of a medium button. One step smaller gives it the small button\u2019s label and icon at the same height and padding. Small and large buttons are unchanged."},{key:"buttonLabelWeight",group:"form",label:"Button label weight",control:"enum",default:"emphasis",options:[{value:"default",label:"Default"},{value:"emphasis",label:"Emphasis"}],description:"The weight role a button label binds: Emphasis (600 at the stock weight roles) or Default (400). Default adds that weight to the label styles. Tags and badges keep Emphasis."},{key:"buttonMinWidthMultiplier",group:"form",label:"Button minimum width",control:"slider",default:2.25,min:1,max:4,step:.25,unit:"\xD7 height",description:"A button is at least its height times this wide, rounded up to the 8px grid, so a short label never makes a stubby button."},{key:"baseMd",group:"form",label:"Radius anchor",control:"slider",advanced:!0,default:4,min:2,max:12,step:1,unit:"px",description:"The radius.md value (px) at scale 1."},{key:"radiusHairline",group:"form",label:"Hairline radius",control:"toggle",advanced:!0,default:!1,description:"Opt-in (off by default). On adds a fixed 1px radius.hairline for near-sharp brands \u2014 the scaled ramp only reaches even values, so this is the way to a 1px corner."},{key:"typography.typeScale",group:"type",label:"Type scale",control:"enum",default:"default",options:[{value:"compact",label:"Compact"},{value:"default",label:"Default"},{value:"expressive",label:"Expressive"}],description:"Shifts heading sizes (display, title and eyebrow) up/down the ladder; body/label/caption/code stay put."},{key:"typography.families",group:"type",label:"Font families",control:"object",description:"The face each text category draws from (+ a variable-font flag). A single name auto-pads a system fallback stack; `code: null` opts out of code styles."},{key:"typography.weightRoles",group:"type",label:"Weight roles \u2192 numeric",control:"object",advanced:!0,description:"Map subtle/default/emphasis/strong/max to the brand\u2019s numeric weights (defaults 300/400/600/700/900)."},{key:"typography.displayCeiling",group:"type",label:"Display size ceiling",control:"enum",advanced:!0,default:"3xl",options:[{value:"sm",label:"display.sm (1 rung)"},{value:"md",label:"display.md (2 rungs)"},{value:"lg",label:"display.lg (3 rungs)"},{value:"xl",label:"display.xl (4 rungs)"},{value:"2xl",label:"display.2xl (5 rungs)"},{value:"3xl",label:"display.3xl (all 6)"}],description:"Highest display rung the brand ships; rungs above it are omitted. Named by rung, not px, so the type scale preset cannot change how many rungs survive."},{key:"typography.titleFloor",group:"type",label:"Title floor",control:"enum",advanced:!0,default:18,options:[{value:   return `<div class="slider"><input type="range" id="${cid(k, m)}" min="${L.min}" max="${L.max}" step="${L.step}" value="${cur}" ${dat(k, m, lever)} aria-valuetext="${esc(sliderReadout(L, cur))}"${label ? ` aria-label="${esc(label)}"` : ''}>${ticks ? `<div class="ticks" aria-hidden="true">${ticks}</div>` : ''}</div>`;
}
function colorCtl(k, oklch, { m, lever, label } = {}) {
  const hx = hexOf(oklch);
  return `<div class="colorrow"><input type="color" id="${cid(k, m)}" value="${hx}" ${dat(k, m, lever)} data-color="1" aria-label="${esc(label || 'Color')}"><input type="text" id="${cid(k, m, 'hex')}" value="${hx}" ${dat(k, m, lever)} data-color="hex" aria-label="${esc((label || 'Color') + ' hex')}" spellcheck="false"><span class="small muted tabnum">OKLCH ${oklch.l.toFixed(3)} ${oklch.c.toFixed(3)} ${Math.round(oklch.h * 10) / 10}°</span></div>`;
}
const infoBtn = (key, label) => `<button type="button" class="ibtn" id="i-${slug(key)}" aria-label="About ${esc(label)}" aria-expanded="${S.tipOpen === key}" aria-controls="tip-${slug(key)}" data-act="tip" data-key="${esc(key)}">i</button>`;

/** One lever block. `fieldset` for chip groups (the legend names the radio group). */
function lever(key, inner, { fieldset = false, forId, readout = '', state = '', pm = '', label, tipExtra = '', keys, id } = {}) {
  const L = LEV[key];
  const lab = label || (L ? L.label : key);
  const desc = (L ? L.description : '') + tipExtra;
  const ks = keys || [key];
  const refused = S.refusal && ks.some((k) => S.refusal.key === k || String(S.refusal.key).startsWith(k + '.'));
  const tip = desc ? `<div class="tip" id="tip-${slug(key)}"${S.tipOpen === key ? '' : ' hidden'}>${esc(desc)}</div>` : '';
  const info = desc ? infoBtn(key, lab) : '';
  const ro = readout ? `<span class="readout tabnum" id="ro-${slug(key)}">${readout}</span>` : '';
  const head = fieldset
    ? `<legend><span class="lname">${esc(lab)}</span>${info}${ro}</legend>`
    : `<div class="lab">${forId ? `<label for="${forId}">${esc(lab)}</label>` : `<span>${esc(lab)}</span>`}${info}${ro}</div>`;
  const tag = fieldset ? 'fieldset' : 'div';
  return `<${tag} class="lever${refused ? ' refused' : ''}" id="${id || 'lv-' + slug(key)}" data-keys="${esc(ks.join(' '))}">${head}${tip}<div class="ctl">${inner}</div>${state}${pm}<span class="refmark" role="note">Refused. The preview keeps the last valid theme.</span></${tag}>`;
}
const sent = (m) => (/[.?]$/.test(m.trim()) ? m.trim() : m.trim() + '.');
const stateLine = (text, info) => `<p class="state${info ? ' info' : ''}">${text}</p>`;

/* ---------------- Per mode disclosure (model B) ---------------- */
function perMode(key, { keys, row, surfaces = false, note = '' }) {
  const ks = keys || [key];
  const ms = modesOn().filter((m) => m !== 'light' && (!surfaces || m === 'dark' || isDerived(m)));
  const n = ks.length ? ovCount(ks) : 0;
  const open = !!S.pmOpen[key];
  const id = `pm-${slug(key)}`;
  const rows = ms.map((m) => {
    if (isDerived(m)) {
      if (surfaces && m !== 'hc-dark' && m !== 'hc-light') return '';
      const st = R.st.per[m];
      return `<div class="pmr der"><div class="mn">${esc(mLabel(m))}<span class="tag der">Derived</span></div><div class="small">Follows ${esc(follows(m))}. No settings of its own. <span class="v ${st.f ? 'fail' : 'ok'}">${st.f ? `${st.f} of ${st.n} below floor` : `All ${st.n} pairs at or above floor`}</span></div></div>`;
    }
    return `<div class="pmr"><div class="mn">${esc(mLabel(m))}<span class="tag${customBase(m) ? '' : ''}">${kindTag(m)}</span></div><div>${row(m)}</div></div>`;
  }).join('');
  const body = ms.length ? rows : `<p class="pmnote">Only light is on. Turn on another mode in Brand › Modes to set values per mode.</p>`;
  return `<div class="pm"><button type="button" class="pmh" id="${id}" aria-expanded="${open}" aria-controls="${id}-b" data-act="pm" data-key="${esc(key)}">Per mode · <b>${n ? plural(n, 'override') : 'follows base'}</b></button><div class="pmb" id="${id}-b"${open ? '' : ' hidden'}>${note ? `<p class="pmnote">${note}</p>` : ''}${body}</div></div>`;
}
const autoFollow = (m, text) => `Auto: follows ${esc(follows(m))} (${esc(text)})`;
const resetLink = (k, m, lever) => `<button type="button" class="lnk muted small" data-act="reset" data-k="${esc(k)}" data-m="${esc(m)}" data-lever="${esc(lever)}">Reset to ${esc(follows(m))}</button>`;

/* =====================================================================================
   Lever renderers, keyed by the `ctl` of a HOMES row.
   ===================================================================================== */
const optsOf = (key) => (LEV[key].options || []).map((o) => ({ v: o.value, l: o.label }));
const optLabel = (key, v) => (LEV[key].options || []).find((o) => o.value === v)?.label ?? String(v);
const paletteNames = () => ['primary', ...(S.input.brandColors || []).map((b) => b.name)];
const libraryFaces = () => {
  const set = new Set(S.input.typography?.typefaceLibrary || []);
  for (const f of R.t.typography.families) set.add(f.stack[0]);
  for (const b of Object.values(P3.examples)) for (const [g, v] of Object.entries(b.typography?.families || {})) if (typeof v === 'string') set.add(v);
  return [...set];
};

const CTL = {
  name: () => lever('id', `<input type="text" id="f-id" value="${esc(S.input.id)}" ${dat('id', '', 'id')} spellcheck="false">`, { forId: 'f-id', label: 'Brand name', tipExtra: '' }),

  primary: () => lever('primary', colorCtl('primary', S.input.primary, { label: 'Primary brand color' }) + `<span class="sub">Pinned at step ${esc(String(R.t.roleAnchorStep.brand).padStart(3, '0'))} of the primary ramp.</span>`, { forId: cid('primary', ''), readout: '' }),

  neutral: () => {
    const n = S.input.neutral || {};
    const follow = !!n.auto;
    const hueL = LEV['neutral.hue'], chL = LEV['neutral.chroma'];
    const hue = follow ? S.input.primary.h : n.hue;
    const pinned = !!n.anchor;
    const a = lever('neutral.hue',
      chips('neutral.auto', [{ v: true, l: 'Follow primary' }, { v: false, l: 'Custom hue' }], follow, { lever: 'neutral.hue', name: 'c-neutral-source' })
      + (follow ? `<span class="sub">Hue follows primary: ${Math.round(hue * 10) / 10}°.</span>` : slider('neutral.hue', hueL, n.hue, { label: 'Neutral hue' })),
      { fieldset: true, readout: follow ? `${Math.round(hue)}° · follows primary` : sliderReadout(hueL, n.hue),
        state: pinned ? stateLine(`A pinned neutral in Advanced sets the ramp: ${esc(hexOf(n.anchor))}. Hue and chroma are its readout.`, true) : '' });
    const b = lever('neutral.chroma', slider('neutral.chroma', chL, n.chroma, { label: 'Neutral chroma' }), { forId: cid('neutral.chroma', ''), readout: sliderReadout(chL, n.chroma) });
    return a + b;
  },

  personality: () => {
    const cur = S.input.personality || [];
    const box = `<div class="chips multi" role="group" aria-label="Personality words">${Object.keys(P3.TRAITS).map((w) => `<label class="chip"><input type="checkbox" id="pw-${w}" data-act="personality" data-word="${w}"${cur.includes(w) ? ' checked' : ''}><span class="ck" aria-hidden="true">✓</span>${w}</label>`).join('')}</div>`;
    const sets = cur.map((w) => `${w}: ${Object.entries(P3.TRAITS[w].levers).map(([k, v]) => `${LEV[k]?.label || k} → ${v}`).join(', ')}`);
    return `<div class="lever" id="lv-personality"><div class="lab"><span>Personality words</span></div><div class="ctl">${box}<span class="sub">${cur.length ? esc(sets.join('. ')) + '.' : 'Each word fills settings you have not set yet. Settings you set win.'}</span></div></div>`;
  },

  modes: () => {
    const on = (S.input.modes || ['light', 'dark', 'hc-light', 'hc-dark']);
    const list = ['dark', 'hc-light', 'hc-dark', 'wireframe'];
    const note = { dark: 'Customizable: per-mode values and role overrides.', 'hc-light': 'Derived: follows light.', 'hc-dark': 'Derived: follows dark.', wireframe: 'Derived: follows light.' };
    const customs = S.input.customModes || [];
    return `<div class="lever" id="lv-modes"><div class="lab"><span>Modes on</span></div><div class="ctl">
      <label class="chk"><input type="checkbox" checked disabled id="mo-light"> Light <span class="small muted">Light is always generated: it's the base mode.</span></label>
      ${list.map((m) => `<label class="chk"><input type="checkbox" id="mo-${m}" data-act="modeon" data-mode="${m}"${on.includes(m) ? ' checked' : ''}> ${esc(FULL_MODE_LABEL[m])} <span class="small muted">${note[m]}</span></label>`).join('')}
    </div></div>
    <div class="lever" id="lv-custommodes"><div class="lab"><span>Custom modes</span></div><div class="ctl le">
      ${customs.map((c, i) => `<div class="it"><input type="text" id="cm-name-${i}" value="${esc(c.name)}" aria-label="Custom mode name" data-act="cmname" data-i="${i}" spellcheck="false"><label class="small row">Based on ${`<select id="cm-base-${i}" data-act="cmbase" data-i="${i}" aria-label="Based on">${['light', 'dark'].map((b) => `<option${b === c.base ? ' selected' : ''}>${b}</option>`).join('')}</select>`}</label><button type="button" class="btn sm" data-act="cmremove" data-i="${i}" id="cm-rm-${i}">Remove ${esc(c.name)}</button></div>`).join('')}
      <div><button type="button" class="btn sm" data-act="cmadd" id="cm-add">Add custom mode</button> <span class="small muted">A custom mode copies light or dark, then takes its own overrides.</span></div>
    </div></div>`;
  },

  neutralAnchor: () => {
    const a = S.input.neutral?.anchor;
    return lever('neutral.anchor', toggle('neutral.anchor.on', !!a, { lever: 'neutral.anchor', label: 'Pin a neutral', onText: 'Pinned', offText: 'Off: the ramp is derived from hue and chroma' }) + (a ? colorCtl('neutral.anchor', a, { label: 'Pinned neutral' }) : ''), { forId: cid('neutral.anchor.on', '') });
  },

  root: () => {
    const cur = S.input.root || 'prism';
    const draft = S.rootDraft ?? cur;
    const changed = draft !== cur;
    return `<div class="lever" id="lv-root"><div class="lab"><label for="f-root">Token namespace</label></div><div class="ctl">
      <div class="row wrap"><input type="text" id="f-root" value="${esc(draft)}" data-act="rootdraft" spellcheck="false" aria-describedby="root-note"><button type="button" class="btn sm" id="root-go" data-act="rootgo"${changed ? '' : ' disabled'}>Rename namespace</button></div>
      <span class="sub" id="root-note">Every token path starts with it: <code>${esc(cur)}.color.text.primary</code>.</span>
      ${changed ? stateLine(`Renames every token path: <code>${esc(cur)}.color…</code> becomes <code>${esc(draft || '…')}.color…</code>. Consumers referencing the old names stop resolving.`) : ''}
    </div></div>`;
  },

  brandColors: () => {
    const bc = S.input.brandColors || [];
    const items = bc.map((b, i) => `<div class="it"><input type="color" id="bc-c-${i}" value="${hexOf(b.oklch)}" data-act="bccolor" data-i="${i}" aria-label="${esc(b.name)} color"><input type="text" id="bc-n-${i}" value="${esc(b.name)}" data-act="bcname" data-i="${i}" aria-label="Brand color name" spellcheck="false"><span class="small muted tabnum">h ${Math.round(b.oklch.h)}°</span><button type="button" class="btn sm" id="bc-rm-${i}" data-act="bcremove" data-i="${i}">Remove ${esc(b.name)}…</button></div>`).join('');
    return lever('brandColors', `<div class="le">${items || '<span class="sub">No additional colors. The brand uses primary and the neutrals.</span>'}<div><button type="button" class="btn sm" id="bc-add" data-act="bcadd">Add brand color</button></div></div>`, {});
  },

  gradients: () => {
    const g = S.input.gradients;
    const on = !!g && (g === true || (Array.isArray(g) && g.length));
    const list = (R.t.gradient.gradients || []).map((x) => `<div class="it"><span class="sw" style="width:56px;background:linear-gradient(90deg,${x.stops.map((s) => s.hex).join(',')})"></span><b>${esc(x.name)}</b><span class="small muted">${esc(x.kind)}, ${x.stops.map((s) => stepLabel(s.aliasOf)).join(' → ')}</span></div>`).join('');
    return lever('gradients', toggle('gradients', on, { label: 'Gradients', onText: 'On', offText: 'Off' }) + (on ? `<div class="le">${list}<span class="sub">${g === true ? 'One default brand gradient.' : plural(g.length, 'custom gradient') + '. Editing stops is stubbed in this mockup.'}</span></div>` : ''), { forId: cid('gradients', '') });
  },

  palette: (row) => {
    const key = row.keys[0];
    const names = paletteNames();
    if (key === 'actionPalette') {
      return lever(key, select(key, names.map((n) => ({ v: n, l: n + (n === 'primary' ? ' (default)' : '') })), S.input.actionPalette || 'primary'), { forId: cid(key, '') });
    }
    const act = R.t.roleToPalette.action;
    const opts = [{ v: '__auto', l: `Auto: follows action palette (${act})` }, ...['primary', 'neutral', ...names.slice(1)].map((n) => ({ v: n, l: n }))];
    const cur = S.input.linkPalette ?? '__auto';
    const warn = R.t.notes.some((n) => /not color-distinct/.test(n));
    const underlined = (S.input.typography?.links ?? ['body', 'caption']).length;
    return lever(key, select(key, opts, cur), { forId: cid(key, ''), state: warn ? stateLine(`Links in ${esc(R.t.linkPalette)} match body text color: underline them (WCAG 1.4.1). ${underlined ? plural(underlined, 'category', 'categories') + ' underlined now.' : ''}`) : '' });
  },

  enum: (row) => {
    const key = row.keys[0];
    const cur = val(key);
    const PMK = { density: 1, 'motionPersonality.tempo': 1 };
    let state = '', pm = '';
    if (key === 'disabledStrategy' && cur === 'full') state = stateLine('At 4.5:1 a disabled label reads like body text. The disabled cue rests on fill, border and cursor.');
    if (PMK[key]) {
      const base = cur;
      pm = perMode(key, {
        keys: [key],
        note: key === 'density' ? "Spacing follows the brand's density, not the mode's: a mode's density changes control heights only." : '',
        row: (m) => {
          const ov = modeVal(m, key);
          const baseTxt = optLabel(key, ov === undefined && customBase(m) ? (modeVal(customBase(m), key) ?? base) : base);
          return `${ov === undefined ? `<div class="auto">${autoFollow(m, baseTxt)}</div>` : ''}${chips(key, optsOf(key), ov, { m, lever: key, sm: true })}${ov !== undefined ? resetLink(key, m, key) : ''}`;
        },
      });
    }
    return lever(key, chips(key, optsOf(key), cur), { fieldset: true, state, pm, tipExtra: key === 'motionPersonality.tempo' ? '' : '' });
  },

  disabledMin: () => {
    const full = val('disabledStrategy') === 'full';
    const cur = val('disabledMin');
    const opts = [3, 3.5, 4, 4.5].map((v) => ({ v, l: `${v}:1`, dis: full }));
    return lever('disabledMin', chips('disabledMin', opts, full ? null : cur), { fieldset: true, state: full ? stateLine('Full fixes the disabled floor at 4.5:1, so this has no effect.', true) : '' });
  },

  toggle: (row) => {
    const key = row.keys[0];
    return lever(key, toggle(key, !!val(key), { label: LEV[key].label }), { forId: cid(key, '') });
  },

  slider: (row) => {
    const key = row.keys[0]; const L = LEV[key]; const cur = Number(val(key));
    let pm = '', sub = '';
    if (key === 'radiusScale' || key === 'shadow.softness') {
      pm = perMode(key, { keys: [key], row: (m) => {
        const ov = modeVal(m, key);
        const base = customBase(m) ? (modeVal(customBase(m), key) ?? cur) : cur;
        return `${ov === undefined ? `<div class="auto">${autoFollow(m, sliderReadout(L, base))}</div>` : `<div class="auto">${esc(sliderReadout(L, ov))}</div>`}${slider(key, L, ov ?? base, { m, lever: key, label: `${L.label}, ${mLabel(m)}` })}${ov !== undefined ? resetLink(key, m, key) : ''}`;
      } });
    }
    if (key === 'buttonMinWidthMultiplier') {
      const h = R.t.dims.sizes.find((s) => s.name === 'md').height;
      sub = `<span class="sub">A medium button (${h}px) is at least ${P3.buttonMinWidth(h, cur)}px wide.</span>`;
    }
    return lever(key, slider(key, L, cur, { label: L.label }) + sub, { forId: cid(key, ''), readout: sliderReadout(L, cur), pm });
  },

  roles: () => `<div class="lever" id="lv-roles"><div class="lab"><span>Role × mode</span><span class="readout">${plural(Object.keys(R.mr.light.roles).length, 'role')} · ${plural(modesOn().length, 'mode')}</span></div><div class="ctl">${rolesMatrix({ readOnly: false })}</div></div>`,

  status: (row) => {
    const key = row.keys[0]; const role = key.split('.')[1];
    const auto = autoStatus()[role];
    const rc = S.input.roleColors?.[role];
    const st = S.input.status?.[role];
    const cur = rc ? `use:${rc}` : st ? 'custom' : '__auto';
    const hue = st ? st.h : auto.h;
    const opts = [
      { v: '__auto', l: auto.reuse ? `Auto: reuses ${auto.reuse} (${hueName(auto.h)}, ${Math.round(auto.h)}°)` : `Auto: synthesized ${hueName(auto.h)}, ${Math.round(auto.h)}°` },
      { v: 'custom', l: st ? `Custom: ${hueName(st.h)}, ${Math.round(st.h)}°` : 'Custom color' },
      ...paletteNames().map((p) => ({ v: `use:${p}`, l: `Use ${p}` })),
    ];
    return lever(key, select(key, opts, cur, { lever: key }) + (cur === 'custom' ? colorCtl(key + '.color', st, { lever: key, label: LEV[key].label }) : ''), { forId: cid(key, '') });
  },

  surfaces: () => {
    const light = S.input.surfaces?.light || {};
    const neutralSteps = palOf('neutral').steps.map((s) => s.num);
    const baseOpts = (auto) => [{ v: '__auto', l: `Auto: ${auto}` }, { v: 'white', l: 'white' }, { v: 'black', l: 'black' }, ...neutralSteps.map((n) => ({ v: n, l: `neutral ${String(n).padStart(3, '0')}` }))];
    const floorOpts = (auto) => [{ v: '__auto', l: `Auto: ${auto}` }, ...neutralSteps.map((n) => ({ v: n, l: `neutral ${String(n).padStart(3, '0')}` }))];
    const invPals = R.t.palettes.filter((p) => !['neutral', 'success', 'warning', 'danger', 'info'].includes(p.palette));
    const invOpts = (auto) => [{ v: '__auto', l: `Auto: ${auto}` }, ...neutralSteps.filter((n) => n >= 700).map((n) => ({ v: n, l: `neutral ${n}` })), ...invPals.flatMap((p) => p.steps.filter((s) => s.num >= 600).map((s) => ({ v: { palette: p.palette, step: s.num }, l: `${p.palette} ${s.key}` })))];
    const autos = (m) => ({ base: stepLabel(R.mr[m].roles['background.primary'].path), floor: floorAuto(m), inv: stepLabel(R.mr[m].roles['inverse.background.primary'].path) });
    const trio = (m, cur, compact) => {
      const a = autos(m);
      const f = (k, opts, v, lab) => `<label class="small${compact ? '' : ' row'}" style="display:flex;flex-direction:column;gap:2px">${lab}${select(`surfaces.${k}`, opts, v ?? '__auto', { m: m === 'light' ? '' : m, lever: 'surfaces', label: `${lab}, ${mLabel(m)}`, id: cid('surfaces.' + k, m) })}</label>`;
      return `<div class="row wrap" style="align-items:flex-start">${f('base', baseOpts(a.base), cur.base, 'Page')}${f('floorStep', floorOpts(a.floor), cur.floorStep, 'Contrast floor')}${f('inverseBase', invOpts(a.inv), cur.inverseBase, 'Inverse band')}</div>`;
    };
    const pm = perMode('surfaces', { surfaces: true, keys: ['surfaces.base', 'surfaces.floorStep', 'surfaces.inverseBase'], note: 'Surfaces are set for light and dark only.', row: (m) => trio(m, S.input.surfaces?.[m] || {}, true) });
    return lever('surfaces', trio('light', light, false), { pm });
  },

  interactivePalettes: () => {
    const ext = S.input.interactivePalettes || [];
    const col = (name, palette, anchorKey, cur, auto, removable, i) => {
      const steps = palOf(palette)?.steps.filter((s) => s.num >= 300 && s.num <= 900) || [];
      const opts = [{ v: '__auto', l: `Auto: ${auto}` }, ...steps.map((s) => ({ v: s.num, l: s.key }))];
      const pm = perMode(`modeAnchors.${name}`, { keys: [`modeAnchors.${name}`], row: (m) => {
        const ov = modeVal(m, `modeAnchors.${name}`);
        return `${ov === undefined ? `<div class="auto">${autoFollow(m, String(cur ?? auto))}</div>` : ''}${select(`modeAnchors.${name}`, [{ v: '__auto', l: 'Auto' }, ...steps.map((s) => ({ v: s.num, l: s.key }))], ov ?? '__auto', { m, lever: 'interactivePalettes', label: `${name} anchor, ${mLabel(m)}` })}${ov !== undefined ? resetLink(`modeAnchors.${name}`, m, 'interactivePalettes') : ''}`;
      } });
      return `<div class="panelbox" style="padding:10px"><div class="row wrap"><b>${esc(name)}</b><span class="small muted">palette ${esc(palette)}</span><span class="grow"></span><label class="small row">Anchor ${select(anchorKey, opts, cur ?? '__auto', { lever: 'interactivePalettes', label: `${name} anchor step` })}</label>${removable ? `<button type="button" class="btn sm" data-act="iprm" data-i="${i}" id="ip-rm-${i}">Remove column</button>` : ''}</div>${pm}</div>`;
    };
    const promotable = paletteNames().filter((p) => !ext.some((e) => e.palette === p) && p !== R.t.roleToPalette.action);
    const html = col('primary', R.t.roleToPalette.action, 'actionAnchorStep', S.input.actionAnchorStep, R.t.roleAnchorStep.action, false)
      + col('destructive', R.t.roleToPalette.danger, 'destructiveAnchorStep', S.input.destructiveAnchorStep, R.t.roleAnchorStep.danger, false)
      + ext.map((e, i) => col(e.name || e.palette, e.palette, `interactivePalettes.${i}.anchorStep`, e.anchorStep, 500, true, i)).join('')
      + `<div class="row wrap"><select id="ip-add-sel" aria-label="Palette to promote">${promotable.map((p) => `<option>${esc(p)}</option>`).join('')}</select><button type="button" class="btn sm" id="ip-add" data-act="ipadd"${promotable.length ? '' : ' disabled'}>Promote to a column</button></div><span class="sub">Columns are added for every mode at once. Anchors can differ per mode.</span>`;
    return lever('interactivePalettes', html, {});
  },

  rootgo: () => { const next = (S.rootDraft || '').trim(); const cur = S.input.root || 'prism'; if (!next || next === cur) return; confirmDialog({ title: `Rename namespace to ${next}`, body: `<p>Every token path changes: <code>${esc(cur)}.color.text.primary</code> becomes <code>${esc(next)}.color.text.primary</code>.</p><p>Consumers referencing the old names stop resolving, with no error. The contract version tracks names, so plan the rename with the teams that consume these tokens.</p>`, confirm: 'Rename every token path', returnId: 'f-root', onConfirm: () => { commit('root', () => { S.input.root = next; }); S.rootDraft = null; renderLevers(); } }); },
  cmadd: () => commit('modes', () => { const n = (S.input.customModes || []).length + 1; (S.input.customModes ||= []).push({ name: `custom-${n}`, base: 'light' }); }),
  cmremove: (b) => { const c = S.input.customModes[b.dataset.i]; const drops = modeDrops(c.name); const go = () => commit('modes', () => { S.input.customModes.splice(b.dataset.i, 1); for (const k of ['overrides', 'modeLevers', 'modeAnchors']) if (S.input[k]) delete S.input[k][c.name]; prune(S.input); }); if (drops.length) confirmDialog({ title: `Remove ${c.name}: drops ${plural(drops.length, 'override')}`, body: `<ul>${drops.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>`, confirm: `Remove ${c.name}`, returnId: 'cm-add', onConfirm: go }); else go(); },
  bcadd: () => commit('brandColors', () => { const n = (S.input.brandColors || []).length + 1; (S.input.brandColors ||= []).push({ name: `color-${n}`, oklch: { l: 0.58, c: 0.14, h: (S.input.primary.h + 120) % 360 } }); }),
  bcremove: (b) => removeBrandColor(Number(b.dataset.i)),
  ipadd: () => { const p = $('#ip-add-sel').value; commit('interactivePalettes', () => { (S.input.interactivePalettes ||= []).push({ palette: p }); }); },
  iprm: (b) => commit('interactivePalettes', () => { S.input.interactivePalettes.splice(Number(b.dataset.i), 1); prune(S.input); }),
  libadd: () => { const v = $('#lib-add').value.trim(); if (!v) return; commit('typography.typefaceLibrary', () => { const t = (S.input.typography ||= {}); t.typefaceLibrary = [...new Set([...(t.typefaceLibrary || []), v])]; }); },
  bpadd: () => commit('layout.breakpoints', () => { const b = R.t.layout.breakpoints.map((x) => x.px); b.push(b[b.length - 1] + 320); setP(S.input, 'layout.breakpoints', b); }),
  bprm: (b) => commit('layout.breakpoints', () => { const arr = R.t.layout.breakpoints.map((x) => x.px); arr.splice(Number(b.dataset.i), 1); setP(S.input, 'layout.breakpoints', arr); }),
};
function closeTip() { if (!S.tipOpen) return; const b = document.getElementById('i-' + slug(S.tipOpen)); if (b) { b.setAttribute('aria-expanded', 'false'); const t = document.getElementById(b.getAttribute('aria-controls')); if (t) t.hidden = true; } S.tipOpen = null; }

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ibtn') && !e.target.closest('.tip')) closeTip();
  if (S.menu && !e.target.closest('.popwrap')) { S.menu = null; renderTop(); }
  const a = e.target.closest('[data-act]');
  if (a && ACTS[a.dataset.act] && !(a.tagName === 'INPUT' && a.type !== 'button') && a.tagName !== 'SELECT') { ACTS[a.dataset.act](a, e); return; }
  const roleEl = e.target.closest('#pvb [data-role]');
  if (roleEl && roleEl.dataset.role) { const mode = roleEl.closest('.cmp > div:last-child') ? S.cmpMode : S.mode; S.sel = { role: roleEl.dataset.role, mode }; renderPvb(); }
  if (e.target.closest('#strip')) { S.drawer.open = true; renderDrawer(); $('#drawer-t')?.focus(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.closest('#dlg') || el.closest('.harness')) return;
  if (el.dataset.k) { onControlChange(el); return; }
  const act = el.dataset.act;
  const V = { viewsel: () => setView(el.value), modesel: () => { S.mode = el.value; renderPreview(); if (S.domain === 'color') renderLevers(); $('#pv-mode')?.focus(); }, cmpmode: () => { S.cmpMode = el.value; renderPvb(); },
    domsel: () => { S.domain = el.value; S.search = ''; renderLevers(); $('#domsel').focus(); }, listmode: () => { S.listMode = el.value; const id = el.id; renderLevers(); if (S.view === 'roles') renderPvb(); document.getElementById(id)?.focus(); },
    tokgroup: () => { S.tokGroup = el.value; renderPvb(); $('#tok-group').focus(); }, pickpal: () => { S.roleSel.pal = el.value; renderLevers(); $('#pk-pal').focus(); },
    surface: () => { S.surface = el.value; S.sel = null; renderPvb(); document.getElementById(el.id)?.focus(); }, ctonly: () => { S.contrastOnlyFail = el.checked; renderPvb(); $('#ct-only').focus(); },
    personality: () => commit('personality', () => { const w = el.dataset.word; const cur = new Set(S.input.personality || []); el.checked ? cur.add(w) : cur.delete(w); S.input.personality = [...cur]; if (!cur.size) delete S.input.personality; }),
    modeon: () => setModeOn(el.dataset.mode, el.checked),
    weight: () => commit('typography.weights', () => { const g = el.dataset.g, r = el.dataset.r; const av = P3.weightAvailability(R.t.typography); const set = new Set(av[g] || []); el.checked ? set.add(r) : set.delete(r); setP(S.input, `typography.weights.${g}`, P3.WEIGHT_ROLE_ORDER.filter((x) => set.has(x))); }),
    link: () => commit('typography.links', () => { const g = el.dataset.g; const cur = new Set(S.input.typography?.links ?? ['body', 'caption']); el.checked ? cur.add(g) : cur.delete(g); setP(S.input, 'typography.links', [...cur]); }),
    cmname: () => commit('modes', () => { const c = S.input.customModes[el.dataset.i]; const prev = c.name; c.name = el.value.trim(); for (const k of ['overrides', 'modeLevers', 'modeAnchors']) if (S.input[k]?.[prev]) { S.input[k][c.name] = S.input[k][prev]; delete S.input[k][prev]; } }),
    cmbase: () => commit('modes', () => { S.input.customModes[el.dataset.i].base = el.value; }),
    bccolor: () => commit('brandColors', () => { S.input.brandColors[el.dataset.i].oklch = oklchOf(el.value); }),
    bcname: () => renameBrandColor(Number(el.dataset.i), el.value.trim()),
    bp: () => commit('layout.breakpoints', () => { const arr = R.t.layout.breakpoints.map((x) => x.px); arr[Number(el.dataset.i)] = Number(el.value); setP(S.input, 'layout.breakpoints', arr); }),
    bpick: () => { S.drawer.pickId = el.value; renderDrawer(); $('#bp-' + el.value)?.focus(); },
    agent: () => ACTS.agent(el), transport: () => { S.drawer.transport = el.value; renderDrawer(); $('#agent-tr')?.focus(); },
  };
  if (V[act]) V[act]();
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.closest('#dlg') || el.closest('.harness')) return;
  if (el.id === 'lv-search') { S.search = el.value; renderLevers(); return; }
  if (el.id === 'tok-q') { S.tokQ = el.value; const pos = el.selectionStart; renderPvb(); const n = $('#tok-q'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.act === 'rootdraft') { S.rootDraft = el.value; const pos = el.selectionStart; renderLevers(); const n = $('#f-root'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.k && (el.type === 'range' || el.dataset.color === '1')) onControlInput(el);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.tipOpen) { const id = 'i-' + slug(S.tipOpen); closeTip(); document.getElementById(id)?.focus(); return; }
    if (S.menu) { const m = S.menu; S.menu = null; renderTop(); (document.getElementById(m === 'health' ? (S.narrow ? 'verdict-dot' : 'verdict-btn') : m === 'more' ? 'more-btn' : m + '-btn'))?.focus(); return; }
    if (S.roleSel && !$('#dlg').open) { ACTS.pickclose(); return; }
  }
  const t = e.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const list = [...t.closest('[role=tablist]').querySelectorAll('[role=tab]')]; let i = list.indexOf(t);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
    e.preventDefault(); list[i].click(); const id = list[i].id; setTimeout(() => document.getElementById(id)?.focus(), 0);
  }
  if (t.id === 'gutter') {
    const step = { ArrowLeft: -2, ArrowRight: 2 }[e.key];
    if (step || e.key === 'Home' || e.key === 'End') { e.preventDefault(); setSplit(e.key === 'Home' ? 28 : e.key === 'End' ? 62 : S.split + step); }
  }
});
function setSplit(v) { S.split = Math.max(28, Math.min(62, Math.round(v))); $('#work').style.setProperty('--lv', S.split + '%'); $('#gutter').setAttribute('aria-valuenow', S.split); $('#gutter').setAttribute('aria-valuetext', `Settings ${S.split}% of the width`); store.set('split', S.split); updateTabCue(); }
(() => { const g = $('#gutter'); let drag = false; g.addEventListener('pointerdown', (e) => { drag = true; g.setPointerCapture(e.pointerId); }); g.addEventListener('pointermove', (e) => { if (!drag) return; const r = $('#work').getBoundingClientRect(); setSplit(((e.clientX - r.left) / r.width) * 100); }); g.addEventListener('pointerup', () => { drag = false; }); })();
$('#lvp').addEventListener('scroll', updateTabCue, true);

/* ---------------- narrow detection ---------------- */
new ResizeObserver(() => {
  const w = $('#app').getBoundingClientRect().width; const n = w <= 560;
  if (n !== S.narrow) { S.narrow = n; renderTop(); renderPreview(); renderDrawer(); }
  updateTabCue();
}).observe($('#app'));

/* =====================================================================================
   Prototype harness
   ===================================================================================== */
function syncHarness() {
  $$('.harness [data-h]').forEach((b) => { const h = b.dataset.h; if (h === 'state') return; b.setAttribute('aria-pressed', String((h === 'host' ? S.host : S.frame) === b.dataset.v)); });
  $('#h-file').value = S.fileState;
}
function resetState(keepHost = true) {
  const host = S.host, frame = S.frame, split = S.split;
  Object.assign(S, { brandKey: 'prism3', dirty: 0, refusal: null, domain: 'brand', search: '', adv: {}, pmOpen: {}, tipOpen: null, view: 'guide', pin: false, mode: 'light', compare: false, sel: null, roleSel: null, pane: 'settings', firstRun: false, rootDraft: null, menu: null, pluginEngine: ENGINE_V, busy: null, lastBuild: {},
    drawer: { open: false, ops: {}, panel: null, agentOn: false, transport: 'file mailbox', lastCmd: null, queue: [], notices: [] } });
  if (keepHost) Object.assign(S, { host, frame, split });
  S.input = clone(P3.examples.prism3); _autoStatus = null; _dpx = null; recompute();
}
const HARNESS = {
  host: (v) => { S.host = v; S.menu = null; renderAll(); },
  frame: (v) => { S.frame = v; $('#frame').className = 'frame' + (v === '1280' ? ' f-1280' : v === '380' ? ' f-380' : ''); syncHarness(); },
  state: (v) => {
    closeDialog();
    if (v === 'reset') { resetState(); renderAll(); return; }
    if (v === 'first') {
      resetState(); S.firstRun = true; renderAll();
      if (S.host === 'plugin' && S.fileState === 'themed') { startOp('readback'); return; }
      openStart({ first: true, returnId: 'brand-btn' }); return;
    }
    if (v === 'refused') { resetState(); S.domain = 'color'; renderAll(); commit('brandColors', () => { S.input.brandColors[0].name = 'Sky blue'; }); gotoKey('color', 'brandColors'); return; }
    resetState(); S.host = 'plugin'; renderAll();
    if (v === 'apply') startOp('apply');
    if (v === 'builderr') {
      S.pluginEngine = '0.212.0';
      const op = opOf('build'); Object.assign(op, { status: 'fail', t: now(), open: true, cfg: { id: 'text-field' }, deps: [{ id: 'focus-ring', status: 'done', text: 'skipped as already present' }, { id: 'field-label', status: 'done', text: 'skipped as already present' }, { id: 'field-message', status: 'done', text: 'built, 4 members' }], history: [{ t: '09:12', verdict: `Built ${DEF['text-field'].name}`, summary: `Built 24 members of ${DEF['text-field'].name}.` }] });
      op.result = buildErrorsResult(); S.lastBuild['text-field'] = { cls: 'fail', text: 'Built with errors' }; S.lastBuild['focus-ring'] = { cls: 'ok', text: 'Built 09:12' }; S.lastBuild['field-label'] = { cls: 'ok', text: 'Built 09:12' };
      S.drawer.open = true; renderAll(); $('#op-build-h')?.focus();
    }
    if (v === 'agent') {
      S.drawer.agentOn = true; S.drawer.transport = 'desktop bridge';
      startOp('apply');
      startOp('build', { id: 'text-field' }, true);
      S.drawer.lastCmd = `build text-field · ${now()}`;
      S.drawer.notices.push('Agent previewed Prune stale: 16 items. Nothing was deleted; only you can confirm a delete.');
      renderDrawer();
    }
  },
};
$('.harness').addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (b) HARNESS[b.dataset.h](b.dataset.v); });
$('#h-file').addEventListener('change', (e) => { S.fileState = e.target.value; syncHarness(); });

/* ---------------- init ---------------- */
$('#h-ver').textContent = `Engine ${ENGINE_V} · contract ${CONTRACT_V} · ${DEFS.length} component sets · built ${BUILD.builtAt || ''}`;
resetState(false);
setSplit(S.split);
renderAll();
</script>
