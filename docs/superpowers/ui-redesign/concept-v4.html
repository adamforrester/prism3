 otherwise fails silently as an invisible gap in production. The vocabulary is `IconName`, generated from the icon set and imported rather than restated, so a glyph cannot enter the set and be forgotten in the API. Compile-time refusal is available to any consumer importing that type; a code projection that widens it back to `string` gives the guarantee up, and that projection is the thing to watch rather than this def. Per-glyph components (`<IconSearch/>`) are the equivalent surface for a tree-shaken delivery."},{name:"size",type:"enum: 'x-small' | 'small' | 'medium' | 'large'",values:["x-small","small","medium","large"],default:"medium",required:!1,description:"Enumerated, snapping to the fixed pixel grid \u2014 16 / 20 / 24 / 32. NOT arbitrary integers: off-grid scaling blurs strokes between hardware pixels and is the first thing an icon system must forbid. The t-shirt words are the vocabulary every other def uses; the rungs they bind are the engine's (`icon.size.*`)."},{name:"tone",type:"enum: 'inherit' | a semantic ink token",values:["inherit","primary","secondary","tertiary","brand","success","warning","danger","info"],default:"inherit",required:!1,description:"Ink. Defaults to `inherit` (`currentColor`), so the glyph tracks its host control's hover/disabled/error cascade with no JS reconciliation. A semantic value pins it instead, insulating an error glyph from an inherited color that would make it invisible. Rejects raw hex by construction \u2014 an enum has no cell for one \u2014 so contrast is enforced centrally rather than per call site."},{name:"label",type:"string",required:!1,description:'The only route to an accessible name. Present makes the glyph meaningful: `role="img"` + `aria-label`. Absent makes it decorative: `aria-hidden="true"`, which is the DEFAULT and the most common correct answer \u2014 a named icon beside its own text double-announces ("Email, Email"). Inside an icon-only control the WRAPPER carries the name and this stays absent; never name both.'}],states:[],variants:{name:[...Qn],tone:["inherit","primary","secondary","tertiary","brand","success","warning","danger","info"]},axisKinds:{name:"runtime",tone:"runtime"},paintKeys:["tone.{tone}","{slot}"],tokens:{"size.x-small":"icon.size.xs","size.small":"icon.size.sm","size.medium":"icon.size.md","size.large":"icon.size.lg",icon:"color.icon.primary","tone.primary":"color.icon.primary","tone.secondary":"color.icon.secondary","tone.tertiary":"color.icon.tertiary","tone.brand":"color.icon.brand","tone.success":"color.icon.success","tone.warning":"color.icon.warning","tone.danger":"color.icon.danger","tone.info":"color.icon.info"},anatomy:{root:"glyph",parts:{glyph:{kind:"vector",role:"target",glyph:"{name}",note:"The glyph outline itself, drawn on the set's square artboard and scaled to whatever box it is instanced into. The geometry comes from the set (`ICON_PATHS`) by name, so this def references the vocabulary without authoring it."}},codeOnly:["tone \u2014 the ink axis, declared in `variants` and deliberately not a Figma variant, and as of #795 the reason is ONE reason rather than three. The surviving one is the interesting one and always was: `inherit` (`currentColor`) is the DEFAULT and Figma has no equivalent \u2014 a Figma node's fill is a value, never an inheritance from its host. #1211 SHARPENS that rather than softening it, and the sharpening matters because the old wording is now half wrong. It said the most common tone \"has no coordinate to occupy\"; it has one, because `paintKeys` now ends on a `{slot}` floor and a coordinate at `inherit` resolves the primary ink like any other tone-less one. What Figma still cannot carry is the MEANING: a projected `tone=inherit` member would paint that floor and be pixel-identical to `tone=primary`, so the axis would offer a value whose entire job \u2014 defer to the host \u2014 the projection silently drops while looking complete. A duplicate member that lies is worse than an absent one, which is why the axis stays in code. The other two reasons are gone, and both were OURS rather than Figma's. STRUCTURAL: this entry said `figmaAnatomySet` refuses any variant axis outside intent/appearance/size (`PROJECTABLE_VARIANT_AXES`) and throws rather than enumerating around it \u2014 #795 deleted that list, so the projector would carry `tone` today if this def asked, and the def does not ask. PAINT: `paintOf` used to key every lookup as `{intent}.{appearance}.{slot}`, so a def whose paint axis is `tone` resolved nothing; #758 replaced that with this def's own `paintKeys` and the tone ink resolves at every tone \u2014 verified in `test.ts`, which plans this def at `{tone: danger}` and asserts the `color/icon/danger` binding. So the set projects over `name` and paints along `tone`, which is the shape #795's `variantAxes` doc comment cites as the field's original meaning.",'glyph fill vs stroke \u2014 the set ships FILLED outlines (`fill="currentColor"` on a closed path, verified across every source in the set), so a materializer paints the vector and never strokes it. A stroked-icon set is the other half of the field (Feather, Lucide) and would need a stroke weight plus a cap/join treatment. `PartDef.strokeWidth` exists since #1266, but it binds the stroke a `box` draws (the focus ring\'s) and is refused on a `vector`, and there is no cap or join field at all \u2014 so a stroked glyph still has no way to be declared, which is the `stroke weight` entry below met from the geometry side. Stated here because the def now DOES declare the geometry (#864) and this is the part of it that still cannot be declared.',"optical baseline shift \u2014 a glyph's bounding box is rarely its visual center of mass, so an inline icon needs an optical shift (Material Symbols moves ~11.5% of the text size down, aligning the glyph center to the x-height rather than the box). That is a relationship between a glyph and the TEXT beside it, resolved at render; Figma centers a node in its parent frame and has nowhere to state it. The recurring polish bug the brief names \u2014 an icon sitting a pixel low beside its label \u2014 lives entirely in this gap.","stroke weight \u2014 a constant tuned to the typeface rather than a per-icon value (Atlassian's 1.5px matches its 1.5px typeface stroke by the squint test; Material's baseline is 2dp). It is a property of the SET, so no single glyph component can carry it. `PartDef.strokeWidth` (#1266) is the field a box's stroke binds, and `validateComponentDef` refuses it on a `vector`: this set's glyphs are filled outlines, so their weight is drawn into the path and a bound stroke would reach no node.",'label routing \u2014 the whole a11y contract is a DOM shape: present makes `role="img"` + `aria-label`, absent makes `aria-hidden="true"` (\xA76). Figma has no accessibility tree, so the one prop that decides whether this component is announced at all is invisible to the Figma leg. It is not a variant either \u2014 the meaningful/decorative split is semantic, not visual, and the two cells are pixel-identical.',"touch-target \u2014 the target-size floor for an icon-only control is the WRAPPER's, not the glyph's: at least 24\xD724 (SC 2.5.8, AA), and 44\xD744 on touch (SC 2.5.5, AAA; 48 on Android). A 16px glyph cannot be its own target, and this component must not grow to pretend otherwise; the Button supplies the padding while the glyph stays visually tight. Stated here because the temptation is to fix the target size where the small thing is.",'RTL mirroring \u2014 directional glyphs mirror under `dir="rtl"` (back/forward, send, undo, list indentation) and non-directional ones must not (a clock stays a clock). The robust mechanism is per-glyph `isMirroredInRTL` metadata so the component automates the transform, which makes it a fact about each member of the set rather than about this def \u2014 and Figma carries no such flag.',"delivery \u2014 inline SVG vs sprite vs variable WOFF2 is a genuine engineering trade with accessibility, bundle and rendering consequences (\xA711), and it is downstream of the design language rather than of this def: a locked fixed-stroke system ships tree-shaken inline SVG, a multi-axis one ships a variable font. The Figma leg is indifferent to all of it, and so is the token tier."]},figmaProperties:{variantAxes:["name"],booleans:{},emitAsComponents:!0},accessibility:{role:'img when meaningful (with aria-label); none when decorative (aria-hidden="true")',wcag:["1.1.1 Non-text Content (meaningful \u2192 text alternative; decorative \u2192 hidden from AT)","1.4.1 Use of Color (an icon must never be the sole carrier of meaning color conveys)","1.4.11 Non-text Contrast (a meaningful icon clears 3:1; a decorative one is exempt)","2.5.8 Target Size (the WRAPPING control's concern, never the glyph's)"],focus:"None of its own. An icon takes no focus; the control wrapping it does, and the focus ring is that control's (see `focus-ring`).",aria:'A three-way matrix, and almost every icon bug is picking the wrong cell. DECORATIVE (text beside it, or ornament): omit `label` \u2192 `aria-hidden="true"`; this is the default. MEANINGFUL STANDALONE: `label` \u2192 `role="img"` + `aria-label`, and `role="img"` is MANDATORY \u2014 without it many screen readers ignore an `aria-label` on a raw `<svg>` and leave the user on an unannounced stop. INSIDE AN ICON-ONLY CONTROL: the wrapper carries the name and the glyph stays `aria-hidden`; reversing it causes ghost focus rings and unpredictable AT behavior. Never name both.'},content:{labelPattern:`When meaningful: a concise noun or verb naming the concept or the action it fires \u2014 "Search", "Delete" \u2014 matching what the glyph depicts, not the asset's internal name. When decorative: no name at all.`,metaphorRules:"Rely on globally established metaphors rather than local idioms; keep them minimal and additive, because a complex metaphor is illegible at 16px; avoid depicting physical hardware, which dates the moment the device does. The floppy-disk save glyph endures precisely because its meaning outlived the object."},docs:{usage:"Use to reinforce meaning, speed scanning, or anchor an action alongside text. Few icons are universally understood, so a glyph beside a visible label is a wayfinding anchor for returning users rather than a replacement for the words. Pick a size from the enum, leave `tone` at `inherit` unless the glyph must resist its host's cascade, and decide the one question that matters: is this glyph meaningful (give it a `label`) or decorative (do not)? For an icon-only action, reach for Button or IconButton and leave this glyph unnamed inside it.",do:["Leave `label` off when the icon sits beside its own text \u2014 decorative is the default and the most common correct answer",'Give a meaningful standalone icon a `label`, which supplies both `role="img"` and the name',"Pick a size from the enum so the glyph lands on the pixel grid","Let `tone` inherit unless an inherited color would make the glyph illegible"],dont:["Make the icon the interactive element \u2014 an icon-only control is a Button, and the name and the hit target (at least 24\xD724; 44\xD744 on touch) live on the wrapper","Name both the wrapper and the glyph (it double-announces, and causes ghost focus rings)","Scale a glyph to an arbitrary size \u2014 off-grid scaling blurs strokes between hardware pixels","Pass a raw hex color \u2014 that moves contrast enforcement out to the call site","Invent a one-off glyph outside the set; the set is the discipline and an ad-hoc glyph is debt"]},ai:{primaryPurpose:"Render a set glyph at a grid size, routed correctly into or out of the accessibility tree.",whenToUse:"Beside a label to reinforce meaning, or standalone with a `label` when the glyph itself carries the meaning.",avoidWhen:"As an interactive element. An icon-only action is a Button (or IconButton) with an accessible name and a hit target of at least 24\xD724 (44\xD744 on touch), containing an unnamed glyph \u2014 reaching for Icon there puts the affordance on a node with no focus management, no keyboard listeners and no touch target. Also avoid it as an illustration (larger, narrative, its own component), a logo, or a thumbnail; and avoid naming a glyph that sits beside its own text.",commonPartners:["button","icon-button","text-field","field-message","select","tag"],triggerKeywords:["icon","glyph","symbol","svg","chevron","arrow","search icon","close icon"],generationPriority:2},composition:{composesWith:[],alternativeTo:[],replacesPatterns:["legacy icon fonts","ad-hoc inline SVGs outside the set"],planned:["link","menu","illustration","logo","thumbnail","emoji","avatar"]},motion:{enter:"none",exit:"none",reduceMotion:"Static \u2014 an icon has no motion of its own. A glyph moves only as part of its host's state transition (a chevron rotating on expand, an outlined glyph cross-fading to filled), and the host owns that motion and its reduced-motion behavior."},notes:{contested:["Delivery \u2014 tree-shaken inline SVG (the default for a locked fixed-stroke language) vs a variable WOFF2 font (for multi-axis / optical-sizing systems) vs an SVG sprite. Legacy ligature/PUA icon fonts are settled as dead; the FONT model is not (\xA711).","Sizing model \u2014 px grid vs `em`. This def binds the grid; an `em` treatment belongs on the container an icon sits inline with.","Taxonomy \u2014 literal glyph names (`chevron-right`) vs semantic ones (`next`). The field's resolution, adopted here: literal names for the immutable primitives, semantic names at an alias layer above them."],unverified:["The brief flags an externally-supplied figure that font glyphs render materially faster than inline SVG in high-frame-rate tests, pending source backing. Nothing in this def depends on it."],evolution:["Delivery has swung between network and rendering optimization. Under HTTP/1.1, connection limits favored CSS sprites and legacy icon fonts to cut requests. HTTP/2 multiplexing removed that bottleneck, and the field moved to tree-shaken inline SVG to fix the accessibility and flash-of-unstyled-content failures of font hacks. Now inline-SVG DOM weight is the bottleneck in dense interfaces, and parametric design (optical sizing, responsive weight, smooth micro-motion) pulls toward a hybrid: variable WOFF2 fonts for flexibility and a small DOM, beside ever-better tree-shaking for SVG.","Multi-tone and variable fill became a state pair (outlined and filled) rather than two unrelated glyphs, and the set-as-versioned-API discipline hardened into alias maps, deprecation entry points and rename codemods. The consensus the practice adopts: the delivery mechanism is secondary to a strict, declarative, correctly labeled accessible API."]}};var ma={id:"focus-ring",name:"FocusRing",aliases:["focus-indicator","focus-outline"],category:"foundations",status:"draft",summary:"Keyboard-focus ring nested by focusable components. Build first; don't place alone.",description:"The shared keyboard-focus indicator: a stroke drawn OUTSIDE its host's bounds, separated from them by an offset (2px for controls, so an unbroken sliver of background sits between the control's own border and the ring; 0 for fields, whose own border supplies the separation). Authored once and nested by every focusable component rather than re-drawn per host \u2014 the ring belongs to no single component, which is why its tokens are top-level families.",props:[{name:"surface",type:"enum: 'default' | 'inverse'",values:["default","inverse"],default:"default",required:!1,description:"The ground the ring is drawn against. `default` for a normal surface; `inverse` for a dark or brand-filled one, where the default ring would sit on a similar hue and lose its 3:1 separation. A host that cannot know its ground picks `default`; a host that carries its own `surface` axis passes it through (see Button), so the ring on a dark band is the inverse ring."},{name:"offset",type:"enum: 'control' | 'field'",values:["control","field"],default:"control",required:!1,description:"How far outside the host the ring sits. `control` is the standard \u22482px gap; `field` is 0, because an input's own border already supplies the separation and a gap there reads as a double border. Two values because the token tier already emits exactly two (`focus.ring.offset` and `focus.ring.offset-field`)."}],states:[],variants:{surface:["default","inverse"],offset:["control","field"]},axisKinds:{surface:"authoring",offset:"authoring"},paintKeys:["{slot}"],tokens:{border:"color.border.focus",width:"focus.ring.width",style:"focus.ring.style","offset.control":"focus.ring.offset","offset.field":"focus.ring.offset-field","nominal-side":"size.md.height"},anatomy:{root:"ring",parts:{ring:{kind:"box",paintSlots:["border"],strokeWidth:"width",size:"nominal-side",role:"target",note:"The ring itself: one node, zero children, `clipsContent: false`. Nested by a host as an ABSOLUTE sibling, so it takes no cell in the host's row and its size is the host's bounds grown by the host's `inset` \u2014 which is why it binds no radius of its own and why its own square side is nominal, supplied only so the component is buildable on its own and overwritten the moment it is nested. The one dimension it truly owns is its stroke's width, because that one is nobody else's to supply."}},derived:{"ring-radius":"host radius + ring offset \u2014 a ring sitting 2px outside a radius-4 corner needs radius 6 to stay concentric, or the straight run of the ring cuts the curve of the corner. Derived per host rather than authored here, because the ring does not know what it surrounds; a host overrides the instance.","ring-bounds":"host bounds + 2 \xD7 offset on each axis \u2014 the ring is positioned at -offset and sized to the grown box, with STRETCH constraints on both axes so it tracks the host when a designer resizes a variant."},codeOnly:["offset \u2014 the context parameter (`control` \u22482px / `field` 0), and the one axis this def deliberately does NOT project (#795, decided on #801's measurement). Not a projector limit: the enumeration would carry it happily now that it reads `variantAxes`. The reason is that the offset is consumed by the HOST's `inset` binding and Figma's `x`/`y` accept no variable, so #801 measured the payload resolving it to a NUMBER at paste and writing that \u2014 an axis over it would ship two members differing only by a value the platform cannot hold, and a designer switching `offset=field` on an instance would see nothing move. So it stays a paste-time parameter the host supplies: `text-field`'s field-specific offset comes from the PARENT at paste, not from a coordinate on this set. An already-pasted ring does not re-position when a brand changes `focus.ring.offset`, unlike every bound paint, which re-themes.","stroke style \u2014 `focus.ring.style` resolves against every emitted brand and there is no Figma property to bind it to. In CSS the ring is an `outline` and its style is a keyword (`solid`, `dashed`); Figma has no keyword, only `dashPattern`, an array of pixel runs \u2014 so projecting a `dashed` ring means inventing a rhythm the token does not carry, and projecting `solid` means writing nothing, which is what happens already. This entry is the REMAINDER of one that used to read \"stroke weight and stroke color\", and the narrowing is the record worth keeping: a stroke is three things and this def could express none of them, because `PartDef`'s vocabulary was gap / height / radius / size / type / inset / padding. COLOR left in #933 (`paintSlots` names the edge and the projector binds the paint) and WIDTH in #1266 (`PartDef.strokeWidth`, bound on the `ring` part above). What is left under #740 is one keyword, not the ring's visual substance \u2014 and Button's own ceiling entry described the whole thing as a deliberate trade, which it never was.","the stroke, restated as the materialization ceiling \u2014 the def PROJECTS as of #795 (`figmaProperties` below declares `surface`, and the set builds two members with their ink bound), and what it projects is not yet a ring. Before #795 this entry said the def was deliberately not materializable because a `variantAxes: ['color']` block would validate and then throw; that is now false, and the honest replacement is narrower: nesting resolves by NAME against the live file (`compByName.get(n.nestTarget)`), so once the projected set is pasted, Button's `nests: 'focus-ring'` binds to OUR members rather than to a hand-built component \u2014 which closes the docs/14 \xA71 inversion for the NODE. #1266 closed it for the STROKE as well \u2014 each member carries `bound.strokeWeight -> focus/ring/width`, so \"the members are strokeless\" is no longer the right reading and was the reading two other files quoted. #1280 closed the last of it: the members carried no EXTENT, which made the def unbuildable and therefore unpublishable, and therefore un-nestable by the very hosts the nesting resolved for \u2014 a deadlock, admitted here for two releases as `figmaProperties.notStandalone`. A nominal square side closes it. What remains under this entry is one keyword and no geometry at all.",":focus-visible condition \u2014 the ring appears on exactly one host state, and that state is a POINTER-vs-KEYBOARD distinction the browser makes at runtime. Figma has no state machine, so a projected ring is a variant coordinate a designer selects, never a state an interaction triggers. This is why Button's `focusRing` part declares `when: 'focus-visible'` \u2014 the condition has to be stated in the def, because nothing downstream can infer it.","high-contrast / forced-colors \u2014 a focus indicator must survive a forced-colors mode that replaces every authored color, which in CSS means `outline` rather than a border or box-shadow (an outline is preserved where a shadow is dropped). Figma has no forced-colors concept and no outline primitive distinct from a stroke, so the one property that keeps the ring visible for the users who most depend on it cannot be expressed in the Figma leg at all.","the 3:1 adjacent-contrast contract \u2014 1.4.11 requires the ring to clear 3:1 against BOTH the surface behind it and the control edge beside it, which is a relationship between three colors resolved per host and per mode. The `surface` axis is the design's answer to it (`inverse` exists because the default ring fails against a brand-filled surface), but the contract itself is a computation over a host this def cannot see, so no single ring component can carry it."]},figmaProperties:{variantAxes:["surface"],booleans:{}},accessibility:{role:"none \u2014 a presentational sibling. The ring has no role of its own; it renders the focus state of the control it surrounds.",wcag:["2.4.7 Focus Visible (a visible indicator on every keyboard-focusable control \u2014 so the ring sits outside its host and must not be clipped by an ancestor, hence `clipsContent: false`)","1.4.11 Non-text Contrast (the ring is gated at 3:1 against the page per mode, 4.5:1 in high contrast; against the control edge it depends on the host \u2014 the offset is what makes that achievable)","2.4.11 Focus Not Obscured (Minimum) \u2014 the page's concern, not the ring's: a focused control must not be entirely hidden by author content such as a sticky header or a banner. The ring cannot see the page it is on, so the layout meets this, not this component.","2.4.13 Focus Appearance (AAA) \u2014 the intent, not gated: an indicator whose area and change of contrast are large enough to see. The offset and width tokens are the levers, and no gate measures a brand against this criterion."],focus:"This component IS the focus appearance. It is drawn for `:focus-visible` rather than `:focus`, so a pointer click does not raise it while keyboard navigation does \u2014 the distinction browsers make and the one a design system must not flatten. Never suppress it without replacing it: removing the indicator is the single most common 2.4.7 failure.",aria:"None, and that is a contract rather than an absence. The ring is presentational \u2014 the focus state is already conveyed by the platform focus itself, so an `aria-*` attribute here would announce something assistive tech already knows. It must never be given a role that makes it a stop in the tab order: a focusable focus ring is a node the user can land on with nothing to do."},docs:{usage:"Build this component first, then leave it to hosts: every focusable component nests it by name. Don't place it in a layout. In code it is an `outline` with `outline-offset`, so it survives forced-colors mode.",do:["Nest the shared ring rather than re-authoring a focus treatment per component","Pick `surface: inverse` on a dark or brand-filled surface, where the default ring loses its 3:1 separation","Pick `offset: field` for inputs, whose own border already supplies the separation","Keep the ring outside the host's bounds and the host un-clipped, so the ring is never cut off (2.4.7)"],dont:["Draw the ring on the host's own border \u2014 an outline appearance then has to give up its border for it, and the two contend for one stroke at different palette steps","Remove the indicator without replacing it (the most common 2.4.7 failure)","Render it for `:focus` rather than `:focus-visible` \u2014 a ring after every mouse click trains users to ignore it","Implement it as a box-shadow: shadows are dropped in forced-colors mode and the indicator vanishes for the users who need it most","Make it focusable or give it an ARIA role \u2014 it is presentational"]},ai:{primaryPurpose:"Render the shared keyboard-focus indicator for a focusable control.",whenToUse:"Nested by any component that can receive keyboard focus, as an absolute sibling \u2014 the host declares it and picks the surface and offset.",avoidWhen:'As a standalone element, as a decorative outline, or as a hover/selected treatment. It is not a border and not an emphasis ring: rendering it outside `:focus-visible` destroys the one signal keyboard users navigate by. Never re-author a per-component focus treatment instead of nesting this \u2014 that is how a system ends up with N rings and N contrast bugs. "Standalone" here means placed in a layout: the component IS built on its own, because a host can only nest one that already exists.',commonPartners:["button","button-destructive","button-neutral","icon-button","icon-button-destructive","icon-button-neutral","text-field","textarea","select","checkbox-control","radio-control","switch-control"],triggerKeywords:["focus ring","focus indicator","focus outline","focus visible","keyboard focus"],generationPriority:2},composition:{composesWith:[],alternativeTo:[],planned:["link"],replacesPatterns:["a per-component focus border","a box-shadow focus glow"]},notes:{evolution:["Where the ring is drawn \u2014 on the host's own border versus as an offset sibling outside it. Decided as the offset sibling, by measurement rather than preference: a ring on the border must win the single stroke a Figma node has away from an `outline` appearance's border, and in CSS it collapses the background sliver 1.4.11 depends on (button.md:34; docs/32, \"The focus ring is an ABSOLUTE sibling\").",'Whether the ring is one shared component or a per-component treatment. Decided as shared, and the token tier said so first \u2014 `focus.ring.*` and `color.border.focus` are top-level families, and `focus.ring.offset-field` emits separately (docs/32, "The focus ring wants to be a shared nested component").',"Offset values \u2014 the field ships 2px broadly and 0 for inputs. Both emit, and this def exposes the choice as the `offset` axis rather than picking one."]}};var ga={id:"field-label",name:"FieldLabel",aliases:["label","form-label"],category:"form",status:"draft",summary:"Visible label that names a field, with an optional required marker.",description:"The visible, persistent label above a form field \u2014 the field's accessible name \u2014 with a required marker (a boolean, off by default) and a size that pairs with the control. A shared field part: the same component above every field control. Static top-aligned by default (the practice default; floating labels are out of favor).",props:[{name:"label",type:"string | node",required:!0,description:'The label text \u2014 a noun phrase, sentence case, \u22643 words, no trailing colon ("Email address", not "Enter your email address here").'},{name:"htmlFor",type:"string",required:!0,description:"The id of the field it names \u2014 a native <label for>. Set by the host when composed inside a field component (useId)."},{name:"required",type:"boolean",default:!1,required:!1,description:"Whether the field is required. ON shows the marker beside the label; OFF, the default, hides it \u2014 the host's own `required` prop defaults off too. Never the sole signal: the field also carries required / aria-required, so the state is not marker-only."},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"small",required:!1,description:"Three steps. Scales the TYPE (`type.body.{sm,md,lg}` = 14/16/18px), not padding alone. `small`, the default, is what every field host nests. The two groups pass their own size through; select, text-field and textarea each project one size and nest the `small` label."},{name:"emphasis",type:"enum: 'secondary' | 'primary'",values:["secondary","primary"],default:"secondary",required:!1,description:"The label's ink. `secondary`, the default, is the de-emphasized label every field host nests; `primary` is the full-strength ink for a label that has to lead. Semantic ROLES, never shades \u2014 `color.text.{primary,secondary}` \u2014 so a brand changing its text palette carries this without the def moving."},{name:"weight",type:"enum: 'regular' | 'bold'",values:["regular","bold"],default:"regular",required:!1,description:"How heavy the label reads. These are intents, not role names: `regular` resolves the brand's default body weight, `bold` the heaviest body weight the brand ships \u2014 Bold (700) on a brand that ships it, Medium (500) where that is its heaviest body cut. Use it for a label that has to carry a section, not for emphasis inside a form \u2014 a form where every label is bold has no emphasis in it."}],states:["rest","disabled"],variants:{size:["small","medium","large"],emphasis:["secondary","primary"],weight:["regular","bold"]},axisKinds:{size:"authoring",emphasis:"authoring",weight:"authoring"},weightIntent:{axis:"weight",group:"body"},paintKeys:["{emphasis}.{slot}"],tokens:{gap:"space.050","primary.label":"color.text.primary","primary.indicator":"color.text.primary","secondary.label":"color.text.secondary","secondary.indicator":"color.text.secondary","disabled.label":"color.disabled.text","disabled.indicator":"color.disabled.text","size.small.regular.text":"type.body.sm.default","size.medium.regular.text":"type.body.md.default","size.large.regular.text":"type.body.lg.default","size.small.bold.text":"type.body.sm.strong","size.medium.bold.text":"type.body.md.strong","size.large.bold.text":"type.body.lg.strong"},anatomy:{root:"label",parts:{label:{kind:"box",role:"target",layout:{direction:"row",align:"baseline",justify:"start",sizing:{x:"fill",y:"hug"}},placementWidth:320,gap:"gap",children:["text","indicator"]},text:{kind:"text",type:"size.{size}.{weight}.text",wrap:!0,note:"The accessible name. Wraps at the field's width rather than running past it. A native <label for> in the code projection; a plain text node in Figma, where the association cannot exist."},indicator:{kind:"text",type:"size.{size}.{weight}.text",paintSlot:"indicator",optional:!0,note:'The required marker ("*"), in the indicator ink beside the name. Hidden by default (the `required` boolean, off by default) and shown when the field is marked required. Never the sole signal: the field carries required / aria-required.'}},codeOnly:["the DISABLED dim (#1339) \u2014 the label dims when its FIELD is disabled, and the field's native disabled is the source of truth. This is ONE mechanism, the `disabled` STATE: it projects as a Figma variant carrying the dimmed ink (`disabled.label` / `disabled.indicator` \u2192 `color.disabled.text`, kept above the 3:1 contrast floor), and in code it is driven by the disabled field's context (the CSS cascade / a data-attribute), NOT by a `disabled` prop on the label \u2014 the old prop that duplicated the state axis was removed. So a designer sees the dimmed variant in Figma, and a code consumer gets the dim from the field it names, with no second knob to keep in sync. When field-label is NESTED (select, checkbox, text-field), the host fixes it to `state=rest` and the code drives the dim, exactly as those defs' own `codeOnly` entries record.","htmlFor / label association \u2014 the entire reason this component exists (\xA76) and it has no Figma expression at all. A native `<label for=id>` is what makes the name programmatic; Figma has no accessibility tree and no node-to-node reference a materializer could write, so the projection is two text nodes that LOOK like a label and carry none of the relationship. A designer reviewing the Figma member cannot see whether the field is actually named, which is the one property this def is for.","the visually-hidden case \u2014 \xA76's only label-less shape is a label that exists in the DOM and is clipped from view (a search field). That is a CSS technique with two hard requirements Figma cannot hold: the node must stay in the accessibility tree, so `display: none` and `visibility: hidden` are both wrong, and it must still be present. A Figma variant with the text node deleted expresses the opposite of what the technique does \u2014 an absent label rather than a hidden-but-announced one \u2014 so it is deliberately not projected as a coordinate.",'sentence-case and \u22643-word content rules \u2014 `content.labelPattern` states them and no projection enforces them. Figma carries a placeholder string, and a placeholder is a suggestion: a designer typing "Please enter your email address here:" produces a member that is structurally perfect and violates three of the four rules at once. The enforcement surface is review and lint in the code tier, which is worth admitting rather than implying the def governs copy.']},figmaProperties:{variantAxes:["size","emphasis","weight"],stateAxis:{name:"state",values:["rest","disabled"]},texts:{label:{part:"text",default:"Label"},required:{part:"indicator",figmaName:"required marker",default:"*"}},booleans:{required:{part:"indicator",default:!1}}},accessibility:{role:"none (native <label> element)",wcag:["1.3.1 Info and Relationships (native <label for> ties the name to the control)","3.3.2 Labels or Instructions (every field has a visible, programmatic label)","1.4.3 Contrast (both emphasis inks, text.primary and text.secondary, are gated at 4.5:1; the disabled ink is contrast-exempt and held at 3:1)"],aria:"Prefer a native <label for=id>; use aria-label / aria-labelledby only when a visible label genuinely cannot be shown (a search field with a hidden label \u2014 and it still exists in the DOM). The required marker is visual; the field carries required / aria-required so the state is not marker-only."},content:{labelPattern:"Noun or noun phrase, sentence case, concise, \u22643 words, no trailing colon. Not an instruction \u2014 that belongs in helper text."},docs:{usage:"Place above every field as its accessible name. Wire htmlFor to the field id. Set the `required` boolean per field (on shows the marker, off hides it), consistently across a form. Reuse the same component above every field control so the label-is-always-present contract holds family-wide.",do:["Always render a label, even for search (visually-hidden, still in the DOM)","Keep it a short noun phrase in sentence case, no trailing colon","Set `required` consistently across a form, and back the marker with aria-required \u2014 never the marker alone"],dont:["Use the placeholder as the label (it vanishes on input \u2014 fails SC 3.3.2)",'Write an instruction as the label ("Enter your email here") \u2014 that is helper text',"Rely on the required marker as the only required signal"]},ai:{primaryPurpose:"Name a form field visibly and programmatically.",whenToUse:"Above every field control \u2014 the accessible name for the input.",avoidWhen:"As a section heading or standalone text (use a heading) \u2014 this is bound to one control via htmlFor. Never omit it in favor of a placeholder.",commonPartners:["text-field","textarea","select","checkbox-group","radio-group","field-message"],triggerKeywords:["label","field label","form label","required indicator"],generationPriority:3},composition:{composesWith:[],alternativeTo:[],planned:["number-field"],replacesPatterns:["an aria-label standing in for a visible label"]},motion:{enter:"none (present on mount)",exit:"none",reduceMotion:"None of its own \u2014 a static top-aligned label does not move. The floating-label slide (KB text-field brief \xA78) is the one label motion in the field, and it is a host treatment this part does not model. The disabled dim is a color change on the host's state transition."},notes:{contested:["Whether to mark required or optional \u2014 the field settled on Prism 2's `Required` boolean, reconciling away the old none/required/optional axis (#1338); a brand marking the optional minority instead leaves `required` off. The DEFAULT is off since #1699 (owner-delegated), where Prism 2 defaults it on: every host's own `required` prop defaults off, and a marker shown by default claims a requirement the field has not declared.","Floating vs static label; static top-aligned is the default here (brief \xA72, \xA713)."],evolution:["FLOATING LABELS OUT OF FAVOR: the static top-aligned label is now the assumed default for accessibility, i18n and density; Material 3 keeps floating as an option (KB text-field brief \xA713).","PLACEHOLDER-AS-LABEL is universally an anti-pattern \u2014 settled, though legacy code persists. This part is the visible label that replaces it."]}};var fa={id:"field-message",name:"FieldMessage",aliases:["helper-text","help-text","field-error","validation-message","caption"],category:"feedback",status:"draft",summary:"Helper or validation caption below a field; status sets its icon and ink.",description:"The small icon + caption below a form field. In its default status it is persistent helper guidance (the format shown BEFORE failure); its error / warning / success statuses carry a validation result. A shared field part \u2014 the same component under every field control, not re-authored per host. Icon + text together, never color alone.",props:[{name:"status",type:"enum: 'default' | 'error' | 'warning' | 'success'",values:["default","error","warning","success"],default:"default",required:!1,description:"default = helper guidance (neutral); error / warning / success = a validation result. The status re-points both the caption ink and the icon at the matching semantic role."},{name:"message",type:"string | node",required:!0,description:'The message text. For error status, say what is wrong AND how to fix it (SC 3.3.3) \u2014 "Enter a valid email, e.g. name@example.com", not "Invalid input".'},{name:"icon",type:"slot",required:!1,description:"Overrides the leading status glyph, aria-hidden (the text carries the meaning). Rarely needed: each validation status already picks its own mark \u2014 an exclamation in a triangle for error, in a circle for warning, a circled check for success \u2014 so this is for a host with a domain-specific status mark, not for supplying the one the status implies. On the default status there is no glyph unless one is supplied here, which is what makes it the only status where this prop adds a node rather than replacing one."},{name:"id",type:"string",required:!1,description:"Set by the host so it can reference this node from the field's aria-describedby chain. Auto-generated with useId when composed inside TextField."}],states:[],variants:{status:["default","error","warning","success"]},axisKinds:{status:"runtime"},paintKeys:["{status}.{slot}"],tokens:{type:"type.caption.md.default",gap:"space.075","glyph-size":"icon.size.xs","default.label":"color.text.secondary","default.icon":"color.icon.secondary","error.label":"color.text.danger","error.icon":"color.icon.danger","warning.label":"color.text.warning","warning.icon":"color.icon.warning","success.label":"color.text.success","success.icon":"color.icon.success"},anatomy:{root:"message",parts:{message:{kind:"box",role:"target",layout:{direction:"row",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},placementWidth:320,gap:"gap",minHeight:"glyph-size",children:["iconError","iconWarning","iconSuccess","text"]},iconError:{kind:"vector",glyph:"warning-triangle",size:"glyph-size",presentWhen:{status:["error"]},note:"The error glyph, aria-hidden \u2014 the caption carries the meaning. An exclamation in a triangle, and the only status whose enclosure is not a circle: shape is the channel that survives when the ink cannot be told from `warning`'s. Its ink is `error.icon`, applied as `descendantFills` (never a fill on the artboard \u2014 #864), so the icon+text pairing that satisfies SC 1.4.1 is one token decision rather than two."},iconWarning:{kind:"vector",glyph:"error-circle",size:"glyph-size",presentWhen:{status:["warning"]},note:"The warning glyph, aria-hidden. An exclamation in a CIRCLE \u2014 the same mark as `error`'s in a different enclosure, which is what the reference asks for. Its ink is `warning.icon`."},iconSuccess:{kind:"vector",glyph:"check-circle",size:"glyph-size",presentWhen:{status:["success"]},note:"The success glyph, aria-hidden \u2014 a circled check. Its ink is `success.icon`."},text:{kind:"text",type:"type",wrap:!0,note:"The message itself. `paintSlot` is absent because the default `label` is right: this is the only text node, and its ink is the status's text role."}},codeOnly:["aria-describedby wiring \u2014 the message's entire relationship to its field is a DOM one the HOST owns (\xA76): the field references this node's id in its describedby chain and sets aria-invalid on error. Figma has no accessibility tree and no node-to-node reference, so the projection is a glyph and a caption that sit below a field and are associated with it by proximity alone. This is the same ceiling `field-label`'s htmlFor hits, and it is the reason both defs are presentational in Figma and load-bearing in code.","the live region \u2014 a message that appears or changes after render must be announced without stealing focus, which the host does by wrapping it in a polite live region. That is a runtime announcement behavior with no visual expression at all: the Figma member for `status=error` looks identical whether the message was there on load or arrived on blur, and the difference is the whole of whether a screen-reader user learns about it.",'the icon SLOT in code, where Figma now has none \u2014 the one asymmetry #1010 introduced, recorded because it is a real difference and not an oversight. The three validation members each carry a FIXED glyph chosen by status, so there is no INSTANCE_SWAP property on the Figma side at all: an error member cannot be made to show a check mark, which is the reachable-wrong-state the old entry here worried about. `props.icon` survives as a code-side override for a host with a domain-specific status glyph, and nothing in Figma corresponds to it. The previous entry claimed this def "cannot bind WHICH glyph each tone shows" because "`PartKind` has no vector kind" \u2014 true when written, falsified by #920 (39 glyphs) and #864 (`kind: \'vector\'` + `glyph`), and it is retired rather than edited because its premise, not its wording, was the thing that expired.',"the default status's OPTIONAL icon, which is now the only half of this that Figma cannot express. Since #1010 the two sides agree on the common case \u2014 no glyph on the default status, three fixed glyphs on the validation statuses \u2014 so what is left is narrower than the entry it replaces: in code a host MAY pass `props.icon` on the default status and get a glyph painted `default.icon`, and there is no Figma member for that. A member either has the node or does not, so \"optional in the same sense the prop is\" has no projection, and adding a boolean property for it would offer a designer a toggle whose ON state has no glyph to show. **The reason the previous entry gave had expired and the entry had not**, which is why this one is worth reading carefully: it said the part is always-present because `present()` builds no optional part outside the two slot names it hardcodes \u2014 accurate for a `kind: 'slot'` part, and false the moment these became `presentWhen`-gated `vector` parts, since `presentWhen` IS a mechanism for variant-scoped absence (#910). The gating is what let the default tone lose its glyph at all."]},figmaProperties:{variantAxes:["status"],footprintVaries:["status"],texts:{message:{part:"text",default:"This is a status message."}},swaps:{},booleans:{}},accessibility:{role:"none (rendered text; the host associates it via aria-describedby)",wcag:["1.4.1 Use of Color (status is carried by icon + text, never color alone)","3.3.1 Error Identification / 3.3.3 Error Suggestion (the error status names the problem and the fix \u2014 wired by the host)","3.3.2 Labels or Instructions (the default status states the format or constraint before the user can fail)","1.4.3 Contrast (caption ink clears 4.5:1; the engine gates text.<role> per mode)","1.4.11 Non-text Contrast (the status glyph's ink, icon.<role>, is gated at 3:1 per mode)","1.3.1 Info and Relationships / 4.1.2 Name, Role, Value (the host associates the message through aria-describedby and sets aria-invalid on error)","4.1.3 Status Messages (a message that arrives without focus moving to its field must still reach assistive tech \u2014 the host decides how)"],aria:'The status icon is aria-hidden \u2014 the caption text carries the meaning, so a non-default status starts with a visually hidden prefix that names it ("Error:"), announced even where the glyph is not. The prefix is translatable, like the message after it \u2014 a hard-coded English prefix before a localized message is a broken reading. The message does NOT self-announce; the host field references its id in aria-describedby (and sets aria-invalid on error). If the message appears/changes dynamically, the host wraps it in a polite live region so it is announced without stealing focus.'},content:{errorPattern:'Say what is wrong AND how to fix it (SC 3.3.3): "Enter a valid email address, e.g. name@example.com" \u2014 specific, human, not "Invalid input", not blaming the user.',labelPattern:'Default status carries the format up front ("Use 8+ characters") so the guidance is seen before failure, not only in the error.'},docs:{usage:"Place directly below a field to carry persistent helper guidance (default status) or a validation result (error / warning / success). Reuse the same component under every field control so the icon-plus-text, gated-contrast contract holds everywhere. The field wires it into aria-describedby.",do:["Show the format/constraint in the default status BEFORE the user can fail","Pair the status with an icon so it is never color-only","Let the host own aria-describedby + aria-invalid; keep this node presentational"],dont:["Signal error with color alone (fails SC 1.4.1)","Duplicate the error into a self-announcing live region here AND on the host \u2014 the host owns announcement","Use warning as a hard blocker \u2014 it is a soft, non-blocking caution (many systems fold it into helper/error)"],contentGuidelines:`Say what is wrong and how to fix it, with the constraint stated: "Enter a valid email address, like name@example.com", "First name must be 35 characters or less" \u2014 never "Invalid" or an error code. Use plain language with no blame ("Enter your first name", not "You forgot to enter your name") and no humor. Reuse the field label's own words, and keep the message identical to its line in any error summary. Use a success status sparingly, for an asynchronous confirmation such as "Username available". In the default status, state the requirement up front so the error never has to.`},ai:{primaryPurpose:"Carry helper guidance or a validation result below a form field, as icon + caption.",whenToUse:"Under any field control that needs persistent guidance or an error/warning/success message.",avoidWhen:"As a standalone alert or toast (use an alert/banner) \u2014 this is field-scoped and associated to one control. Never as the sole color-coded error signal without text.",commonPartners:["text-field","textarea","select","checkbox-row","field-label","icon"],triggerKeywords:["helper text","help text","error message","validation message","field error","caption","hint"],generationPriority:3},composition:{composesWith:[],alternativeTo:[],planned:["number-field","tooltip","inline-message"]},motion:{enter:"A short fade as the message is inserted. The field grows to hold it and pushes the content below down (dynamic expansion). Never positioned absolutely to avoid that shift \u2014 it would overlap the next field's label.",exit:"none",reduceMotion:"Under prefers-reduced-motion the message snaps in with no fade. The row reserves the glyph's height in every status, so a status change moves nothing; inserting or removing the message still shifts the layout below it."},notes:{contested:["Whether warning is a distinct status \u2014 many systems fold it into helper/error; kept here as an optional soft caution (brief \xA74).","THREE PARTS WHERE ONE TEMPLATE WOULD DO, and whether the grammar should gain a value\u2192glyph map (#1010). `PartDef.glyph` is templatable on a variant axis today, but `resolveGlyph` substitutes the axis VALUE verbatim \u2014 so `glyph: '{status}'` asks for glyphs literally named `error` / `warning` / `success` and throws. A map (`glyphByValue: { status: { error: 'warning-triangle', \u2026 } }`) would collapse these three near-identical parts to one and would generalize: any def whose axis selects a glyph hits this, and `checkbox`'s `mark`/`dash` pair is the same shape from before the glyph set existed. What it would COST is the reason it is contested rather than proposed: the map is a second place a glyph name can be written, so `lint-glyph-geometry.ts` (which ranges over parts) and the nearest-name error (which fires at resolve time) would both need to learn it, and a def could then name a glyph for an axis value that no longer exists with nothing failing. Three explicit parts are verbose and each one is independently checkable by the gates that already exist. Revisit when a THIRD def needs it \u2014 two is not yet a pattern."],unverified:["The 16px glyph beside an 11px caption, optically. `icon.size.xs` is the only 16px rung and is 16 in every brand (it aliases `dimension.16` on the fixed grid), while `type.caption.md` resolves `font.size.11` \u2014 so the ARTBOARD is 45% larger than the caption's type size. That is expected rather than wrong (an icon artboard is ink plus its surrounding air, and this set's ink fills roughly 58-71% of it), and the reference asks for a glyph \"at the same optical weight as the text\", which is a judgment no gate here makes. Check it in Figma against a real caption before treating the size as settled.","The WRAPPING case, which is where this def meets #1009 and is deliberately not fixed here. The row is `align: 'start'`, so the glyph aligns to the top of the caption box; #1009's reference for the sibling control shows the mark aligning to the FIRST LINE of a wrapping label, which is neither top nor block-center and is not the same rule as `start` once the caption's line-height exceeds the glyph. A single-line message cannot tell the two apart, and every member this def projects is single-line. Measure a two-line message before assuming `start` is the rule #1009 lands on."]}};var ba={id:"text-field",name:"TextField",aliases:["text-input","input","textbox","formfield"],category:"form",status:"draft",summary:"Single-line text field: label, input, and helper or validation message.",description:"A single-line control for free-form, non-enumerable text \u2014 names, emails, SKUs, short queries. A composed host: label + input + helper/validation message, with the accessibility wiring (id generation, aria-describedby chain, aria-invalid) handled internally. Not multi-line (Textarea), not a known set (Select, or a combobox), not numeric-formatted (a number field), not suggestion-backed (a combobox). The combobox and number field are not built yet.",props:[{name:"label",type:"string | node",required:!0,description:"The visible, persistent label (rendered as FieldLabel). Required \u2014 a visually-hidden label is the only label-less case, and it still exists in the DOM. Never the placeholder."},{name:"value",type:"string",required:!1,description:"Controlled value; pair with onChange. A controlled value with no onChange is read-only by accident."},{name:"defaultValue",type:"string",required:!1,description:"Uncontrolled initial value \u2014 preferred for form-library ergonomics."},{name:"onChange",type:"function",required:!1,description:"Change handler (also onBlur / onFocus)."},{name:"type",type:"enum: 'text' | 'email' | 'url' | 'tel' | 'search' | 'password'",values:["text","email","url","tel","search","password"],default:"text",required:!1,description:"Attribute-only variants (mobile keyboard + autofill). Not number: numeric input needs a number field (not built yet). search / password are better served by their thin specializations."},{name:"placeholder",type:"string",required:!1,description:'An example only ("name@example.com"); vanishes on input; nothing load-bearing lives here.'},{name:"helpText",type:"string | node",required:!1,description:"Persistent guidance (rendered as FieldMessage, default status); wired via aria-describedby. Show the format BEFORE failure."},{name:"validation",type:"enum: 'default' | 'error' | 'warning' | 'success'",values:["default","error","warning","success"],default:"default",required:!1,description:"The validation state. Each non-default status swaps the input border to its own boundary (border-only \u2014 `error` \u2192 danger, `warning` \u2192 warning, `success` \u2192 success) AND sets the nested message to the matching status; `default` is neutral. `error` also sets aria-invalid. The values align with FieldMessage's status axis, so this drives the nested message directly."},{name:"validationMessage",type:"string | node",required:!1,description:'The validation text shown at error / warning / success, added to aria-describedby. For error, say what is wrong AND how to fix it (SC 3.3.3), never "Invalid".'},{name:"showMessage",type:"boolean",default:!0,required:!1,description:"Whether the composed FieldMessage is shown. ON \u2014 the default \u2014 renders the helper / validation message below the input; turning it off hides the message entirely (a field with no helper or validation text). Never hides a message the field needs."},{name:"required",type:"boolean",default:!1,required:!1,description:"Sets required / aria-required, and turns on the FieldLabel's required marker."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"Native disabled \u2014 removed from tab order, not submitted, silent to AT, contrast-exempt. Reserve for fields irrelevant in the current state."},{name:"readOnly",type:"boolean",default:!1,required:!1,description:"Distinct from disabled: focusable, selectable and copyable, submitted with the form, and passes contrast. Use for a value the user may read/copy but not edit (a generated key). The component's live edge."},{name:"autoComplete",type:"string (WHATWG token)",required:!1,description:"Satisfies SC 1.3.5 Identify Input Purpose \u2014 an accessibility obligation, not a convenience."},{name:"inputMode",type:"enum: 'text' | 'numeric' | 'decimal' | 'tel' | 'email' | 'url' | 'search'",values:["text","numeric","decimal","tel","email","url","search"],required:!1,description:"Selects the mobile virtual keyboard."},{name:"prefix",type:"string",required:!1,description:'A leading TEXT affix inside the field, before the value \u2014 a currency symbol or a unit ("$", "\u20AC"). Not part of the value and aria-hidden, so the label or helper text carries what it means. Follows the locale\'s placement (a symbol before or after the number). A glyph is `leadingIcon`, not this.'},{name:"suffix",type:"string",required:!1,description:'A trailing TEXT affix inside the field, after the value \u2014 a unit or a domain ("kg", ".com"). Not part of the value and aria-hidden, so the label or helper text carries what it means. A glyph or a clear / reveal action is `trailingIcon` / `clearable`, not this.'},{name:"leadingIcon",type:"slot",required:!1,description:"An optional leading glyph before the value (a purpose or category mark, such as search), aria-hidden and never the accessible name. Hidden by default; the file nominates the swap target. Signals the field's purpose; validation never mutates it."},{name:"trailingIcon",type:"slot",required:!1,description:"An optional trailing glyph at the field's trailing edge \u2014 a decorative mark (aria-hidden), or the glyph of a clear / reveal action, which in code is a focusable button with its own accessible name. The decorative-vs-interactive split is load-bearing. Hidden by default; the file nominates the swap target. Figma carries the glyph, not the action's behavior."},{name:"clearable",type:"boolean",default:!1,required:!1,description:"Adds a labeled Clear button that announces the cleared state and RETURNS FOCUS to the input (the recurring trap is stranding focus)."},{name:"isPending",type:"boolean",default:!1,required:!1,description:"Async validation/value \u2014 a spinner replaces an adornment without .danger","error.border.read-only":"color.border.danger","error.border.empty":"color.border.danger","error.border.filled":"color.border.danger","warning.border.rest":"color.border.warning","warning.border.hover":"color.border.warning","warning.border.focus-visible":"color.border.warning","warning.border.read-only":"color.border.warning","warning.border.empty":"color.border.warning","warning.border.filled":"color.border.warning","success.border.rest":"color.border.success","success.border.hover":"color.border.success","success.border.focus-visible":"color.border.success","success.border.read-only":"color.border.success","success.border.empty":"color.border.success","success.border.filled":"color.border.success",icon:"color.icon.primary","disabled.fill":"color.disabled.fill","disabled.border":"color.disabled.border","disabled.label.on-fill":"color.disabled.on-fill","disabled.icon.on-fill":"color.disabled.on-fill","size.small.height":"size.sm.height","size.small.pad-x":"space.200","size.small.pad-y":"space.075","size.medium.height":"size.md.height","size.medium.pad-x":"space.200","size.medium.pad-y":"space.100","size.large.height":"size.lg.height","size.large.pad-x":"space.300","size.large.pad-y":"space.100"},anatomy:{root:"container",parts:{container:{kind:"box",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"root-gap",children:["label","control","message"]},label:{kind:"nest",nests:"field-label",nesting:{kind:"nest-exposed",variant:{size:"small",emphasis:"secondary",weight:"regular",state:"rest"},expose:["size","emphasis","weight"]},crossAxisFill:!0,note:"The accessible name, composed rather than re-declared. Nest-exposed: its label text, required marker and size/emphasis/weight surface on the text-field; a fix to FieldLabel still reaches this without a copy. Starts at the field default (small / secondary / regular). Fills the field's width, so a long name wraps."},control:{kind:"box",role:"target",paintSlots:["overlay","fill","border"],layout:{direction:"row",align:"center",justify:"space-between",sizing:{x:"fill",y:"fixed"}},height:"min-height",minWidth:320,radius:"radius",strokeWidth:"border-width",padding:{block:"pad-y",inlineLabel:"pad-x"},gap:"gap",children:["content","trailingVisual","focusRing"]},content:{kind:"box",layout:{direction:"row",align:"center",justify:"start",sizing:{x:"fill",y:"hug"}},clipsContent:!0,gap:"gap",children:["leadingVisual","entry"]},leadingVisual:{kind:"slot",optional:!0,size:"icon-size",nesting:{kind:"swap"},note:"An optional purpose glyph before the value, aria-hidden. Absent by default; the caller nominates the icon."},entry:{kind:"box",layout:{direction:"row",align:"center",justify:"start",sizing:{x:"hug",y:"hug"}},children:["caret","placeholder","value"]},caret:{kind:"box",role:"presentation",paintSlots:["caret"],width:"caret-width",height:"caret-height",layout:{direction:"row",align:"center",justify:"start",sizing:{x:"fixed",y:"fixed"}},presentWhen:{state:["focus-visible"]},note:"The insertion point on the focused empty field, immediately before the placeholder, in the value ink. Code draws the native caret, colored by `caret-color`."},placeholder:{kind:"text",type:"type",presentWhen:{state:["rest","hover","focus-visible","disabled","empty"]},note:"The placeholder, in the placeholder ink (the disabled ink when disabled). Shown on the empty field: rest, hover, focus and disabled. One line; a long one clips at the value row's edge."},value:{kind:"text",type:"type",presentWhen:{state:["filled","read-only","pending"]},note:"The entered value, in the value ink. Shown on the filled and read-only field. One line, never ellipsized (#1758): in code it scrolls with the caret, and in Figma a long value clips at the value row's edge."},trailingVisual:{kind:"slot",optional:!0,size:"icon-size",nesting:{kind:"swap"},note:"An optional trailing affix at the trailing edge (a clear / reveal glyph), aria-hidden as a glyph. Absent by default; the caller nominates the icon. Its interactive behavior is code-only."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring`. Rings the control, takes no cell, and has its own stroke \u2014 so the focus signal never contends with the input's own border."},message:{kind:"nest",nests:"field-message",nesting:{kind:"nest-fixed",variant:{status:"default"},follow:["status"]},optional:!0,crossAxisFill:!0,note:"Helper or validation text, composed rather than re-declared. Its status follows the field's validation by name, so error / warning / success reach the message without a value mapping. Shown by default; the `showMessage` boolean hides the whole part where the field has nothing to say. Fills the field's width, so a long message wraps."}},codeOnly:["size \u2014 the small / medium / large ladder is a code-API PROP + geometry tokens (`size.{small,medium,large}.*`), NOT a variants axis and NOT a projected Figma variant. Figma renders the single `md` rung (the bare geometry keys \u2014 the field control is one interactive target, and a projected size axis would triple the set for geometry a designer reads off one member); a code consumer picks the density via the `size` prop. It is kept off `variants` deliberately: `size` is `figmaAnatomyPlan`'s positional argument, so a declared size axis MUST project a rung (#795), which is why select \u2014 the template for this def \u2014 also expresses its single size as bare `md` geometry rather than a `size` variant. Same not-projected posture as the `style` axis, reached a different way.","style \u2014 the outline / filled / underline treatment is theming, not an API axis: `style` carries the single value `outline` and filled/underline are a brand skin over the same anatomy, so there is nothing for a Figma variant to enumerate. Admitted here rather than projected.","pending \u2014 a real STATE (a spinner replaces an adornment while async validation/value resolves, and the field sets aria-busy), deliberately NOT a Figma variant. Its delta is a runtime spinner swap with no distinct static skin a designer picks from a matrix \u2014 the pending member would differ from `rest` only by a node Figma cannot animate \u2014 so it stays in `states` (the code tier carries it) and is admitted OUT of the projected `stateAxis`.",'empty \u2014 a real STATE in code (the field holds no value, so it shows the placeholder), NOT a Figma variant: in Figma the empty field IS the rest, hover and focus-visible members, which show the `placeholder` layer in `text.secondary`, and `filled` is the member showing the `value` layer in `text.primary`. In code emptiness is a content condition that co-occurs with every interaction, so `empty` stays in `states` (`label.empty` and `error.border.empty` keep the "required field left blank" coordinate) and is held out of the projected `stateAxis` with `pending`, leaving status(4) \xD7 state(6) = 24 members over rest / hover / filled / focus-visible / disabled / read-only. In code the placeholder and the value are one <input>: its `placeholder` attribute and its value, never two elements.',"the FOCUS CARET \u2014 Figma draws a static bar before the placeholder on the focus-visible member. Code draws the browser's native caret, blinking, at the insertion point, with `caret-color` set from `color.text.primary` (the `caret` binding), so it keeps the value ink over the placeholder's muted one.","the TRAILING AFFIX is an INTERACTIVE control in code \u2014 a clear or reveal button that is its own Tab stop with its own accessible name (see the `trailingIcon` / `clearable` props and the a11y block) and RETURNS focus to the input when it acts. Figma has no accessibility tree and no node-to-node reference, so `trailingVisual` projects ONLY the glyph: a member cannot express that the affix is focusable, labeled, or that activating it clears the field. The presence boolean + swap carry which glyph shows and whether it shows; the interaction is the host's.","prefix / suffix \u2014 the TEXT affixes (a currency symbol, a unit) are code-API props with no Figma part. The field projects the two glyph slots (`leadingIcon` / `trailingIcon`); a text affix is a string beside the value in the same row, and adding it to the projection is a separate anatomy decision (#1699).","the label / describedby WIRING \u2014 the host generates ids (useId), ties the FieldLabel to the input, stitches the FieldMessage into aria-describedby, and sets aria-invalid on error. Figma has no accessibility tree and no node-to-node reference, so the nested label and message sit near the input and are associated by proximity alone (the same ceiling `field-label` and `field-message` each hit).","the nested LABEL's disabled dimming \u2014 the field fixes the FieldLabel to `state=rest` because field-label's state vocabulary (rest / disabled) is not the field's, so it cannot be followed by value. In code a disabled field dims its label; in Figma the nested label reads at its rest configuration regardless. A projection limit, not a design choice.","the KEYBOARD MODEL \u2014 native text editing, Escape-to-clear when clearable, and IME composition guards (do not validate mid-composition). All of it is runtime interaction the closed static member cannot carry."]},figmaProperties:{variantAxes:["status"],stateAxis:{name:"state",values:["rest","hover","filled","focus-visible","disabled","read-only"]},gridAxis:"state",texts:{placeholder:{part:"placeholder",default:"Placeholder"},value:{part:"value",default:"Entered text"}},booleans:{leadingIcon:{part:"leadingVisual",figmaName:"leading icon",default:!1},trailingIcon:{part:"trailingVisual",figmaName:"trailing icon",default:!1},showMessage:{part:"message",figmaName:"message",default:!0}},swaps:{leadingIcon:{part:"leadingVisual",figmaName:"\u21B3 swap leading icon"},trailingIcon:{part:"trailingVisual",figmaName:"\u21B3 swap trailing icon"}}},accessibility:{role:"textbox (native <input>)",wcag:["1.3.5 Identify Input Purpose (autocomplete \u2014 the most field-specific SC)","1.3.1 Info and Relationships (label + describedby association)","3.3.1 Error Identification / 3.3.2 Labels or Instructions / 3.3.3 Error Suggestion","1.4.3 Contrast (value + placeholder) / 1.4.11 Non-text Contrast (field boundary \u22653:1 \u2014 the rest, hover and read-only borders are gated on `background.secondary`, the darkest permissible ground) / 2.4.13 Focus Appearance","4.1.2 Name/Role/Value / 2.5.8 Target Size","3.3.7 Redundant Entry / 3.3.8 Accessible Authentication (WCAG 2.2) \u2014 page-level criteria: the form and its flow meet them on login and checkout; the field supports them through autocomplete and by allowing paste"],keyboard:"Native text editing. Tab focuses the input; interactive affixes (clear / reveal) are SEPARATE tab stops with their own accessible names. Escape clears when clearable.",focus:":focus-visible ring, boundary \u22653:1 (1.4.11 / 2.4.13) \u2014 the field is a primary focus target. forwardRef must reach the <input>, not the wrapper, so consumers can focus on load / focus the first invalid field on submit.",aria:'The host generates ids (useId) and stitches aria-describedby across helper + error, and sets aria-invalid on error \u2014 the consumer never hand-manages ids (the highest-frequency real a11y failure). placeholder is NOT the accessible name. Error timing: validate on blur, re-validate on input after the first error, announce politely, and on submit move focus to the first invalid field (with an error summary on a long form). While pending, aria-busy; the field stays focusable. Do not fire validation mid-IME-composition. Set dir="auto" on the input so content direction can differ from UI direction.'},content:{labelPattern:"Noun phrase, sentence case, \u22643 words, no trailing colon; never the placeholder (see field-label).",errorPattern:"What is wrong AND how to fix it (SC 3.3.3); icon + text, not color-only (see field-message).",emptyPattern:"The empty state is the label plus an optional placeholder \u2014 there is no separate empty UI."},docs:{usage:"Use for free-form, non-enumerable single-line input \u2014 names, titles, SKUs, identifiers, short queries. Always render a visible label; show the format in helper text before failure; keep validation timing with the form library. The field nests FieldLabel above and FieldMessage below; the host wires the ids and aria-describedby chain.",do:["Always render a visible, associated label (FieldLabel) \u2014 visually-hidden only for search","Distinguish readOnly (copyable, submitted, full-contrast) from disabled (silent, exempt)","Emit a real <input name> so it works uncontrolled, in a native form, with Server Actions","Separate a decorative glyph (aria-hidden) from an interactive trailing action (a labeled button)","Follow the error-timing contract: validate on blur, re-validate on input after the first error, move focus to the first invalid field on submit, and show an error summary on a long form (the form library runs it; the field renders it)"],dont:["Use the placeholder as the label, or put load-bearing text in it",'Use type="number" for numeric input \u2014 use a number field, not built yet (email/url/tel stay as type here)',"Bake a validation engine or timing into the field \u2014 render the error you are handed","Signal error with the border color alone \u2014 the message carries the text + icon"],contentGuidelines:'Label = noun phrase, sentence case, no trailing colon. Placeholder = example only. Helper carries the format up front. Error says what + how to fix, never "Invalid input".'},ai:{primaryPurpose:"Capture a single line of free-form, non-enumerable text with an associated label and helper/validation message.",whenToUse:"Names, emails, titles, SKUs, identifiers, short queries \u2014 any single-line text the system cannot offer as a fixed set.",avoidWhen:"The value comes from a known set (Select, Radio.Group, or a combobox), spans multiple lines (Textarea), is numeric-formatted (a number field), is boolean (Checkbox.Row or Switch.Row), is a date (a date picker), or needs suggestions (a combobox \u2014 the moment a suggestion list attaches you are in combobox territory with a different ARIA contract).",commonPartners:["field-label","field-message","icon","button","spinner"],triggerKeywords:["text field","text input","input","form field","textbox","email field","search field"],generationPriority:2},composition:{composesWith:["field-label","field-message","focus-ring"],alternativeTo:["textarea","select","checkbox-row","switch-row"],replacesPatterns:["bare input without label wiring","placeholder-as-label","type=number for formatted numeric"],planned:["form","tooltip","combobox","number-field","search-field","date-picker","password-field"]},motion:{enter:"none (present on mount)",exit:"none",reduceMotion:"State transitions \u2014 the border color on focus or status, the helper-to-validation message swap \u2014 are short, token-driven and eased out, ~100\u2013150ms. A validation message must not jolt the layout: reserve its space or grow the height gently. Under prefers-reduced-motion these resolve to an instant color or position change so the state stays perceivable. The pending spinner is functional; aria-busy carries its state regardless."},notes:{contested:["Bundled props vs composed slots \u2014 ship both: props for the 90% vertical-form case, composed FieldLabel/FieldMessage slots for the 10% custom layout (brief \xA73).","How far to split the typed family \u2014 NumberField separate; SearchField/PasswordField thin specializations; email/url/tel stay as type+attributes (brief \xA73).","Validation ownership/timing \u2014 presentational default; the form library owns timing (brief \xA73, \xA76).","pressed \u2014 the brief lists it as a runtime state (\xA74, touch-down feedback before the virtual keyboard rises), largely a mobile concern. Not declared: `pressed` is not a field state here (see `tokens`), so a touch-down carries no skin of its own. The alternative is a `pressed` state with its own skin, which no field role emits today (`color.field.border.pressed` does not exist).","density [comfortable, compact, fluid] \u2014 the brief's second variant axis (\xA74, \xA715). Not declared: the engine's density is a brand lever that moves every control's rungs, and `size` covers per-field scale. Carbon's borderless `fluid` field is a separate treatment, not built.","prefix / suffix as TEXT affixes vs merged away (#1699 decision 3, owner-delegated: one prop per slot). They were glyph-or-action slots duplicating `leadingIcon` / `trailingIcon`. Chosen: keep the names for the text affixes (a currency symbol, a unit \u2014 brief \xA79's locale placement). In the brief, `prefix` / `suffix` name the adornment slots (\xA72, \xA715) and \xA710 maps `leadingVisual` / `trailingVisual` onto them; here the glyph adornments are the two icon slots, so the names are reused for the text affixes, with the glyphs on the two icon slots and the clear action on `clearable`. The alternative, dropping `prefix` / `suffix` entirely, loses the text affix a currency or unit field needs."],unverified:["Polaris migration to framework-agnostic Web Components (<s-text-field>, Shadow DOM) \u2014 needs _source-text backing, shared with the Button brief (brief \xA711, \xA714).","The field's width (#1518, #1757): the control carries a `minWidth: 320` floor, the label and the message stretch across the column it holds (`crossAxisFill`, with the nested instance's own FIXED mode), and `content` grows inside the control. So the field reads at 320, the label and message wrap at that width, and a long value clips at `content`'s edge instead of widening the field. Measured on the offline host; whether the live host keeps a stretch on a nested INSTANCE is the standing nesting caveat.","A long value or placeholder CLIPS at `content`'s edge in Figma (`clipsContent`, #1758), with no ellipsis \u2014 the native single-line input it stands for scrolls with the caret, so the full text stays reachable in code. The clip is modelled offline; the live host has not been checked.","The leading and trailing glyphs are node-visibility BOOLEANS (#1331/#1494): each node is built hidden and shown by its switch. In Figma auto-layout a `visible:false` child is excluded from the flow, so a hidden glyph should add no gap \u2014 but whether a real host reflows `content` / the control when a switch toggles is a host question no Node gate answers. Symptom on a real host: a persistent gap where a hidden glyph sits, or the trailing affix not pinning tight when off."],evolution:["READ-ONLY KEEPS THE EDITABLE FIELD'S BOUNDARY (owner decision, 2026-09-29, #1710). The read-only member binds `field.border.rest`, the same border as the rest and filled members, in every mode. The earlier `border.secondary` binding measured 2.69\u20132.81:1 on `background.secondary` in light, below the 1.4.11 floor, and `field.border.rest` is already the quietest neutral step that clears 3:1 there, so no fainter read-only edge can pass. Read-only is carried by its semantics (aria-readonly; still focusable and submitted) and by the affordances its member does not draw (no caret, no hover wash), not by a fainter edge.","warning as a distinct state (brief \xA74 calls it optional; many systems fold it into helper/error). Settled here as a STATUS, not a state: `warning` is a value of the `status` axis with its own border (`color.border.warning`, #1517) and its own message status, so the field signals it on both.","FLOATING LABELS OUT OF FAVOR. Static top-aligned labels are now the assumed default for accessibility, i18n and density; Material 3 keeps floating as an option (KB text-field brief \xA713). This field composes the static FieldLabel.","PLACEHOLDER-AS-LABEL is universally an anti-pattern \u2014 settled, though legacy code persists.","THE TYPED FAMILY IS SPLITTING into discrete components (a number field) for tree-shaking and localized behavior; the practice holds email / url / tel as `type` + attributes on this field (brief \xA73).","ACCESSIBILITY WIRING MOVED INTO CONTEXT. Generated ids and the aria-describedby chain are stitched by the component, removing the most frequent manual-ARIA error from the consumer.","VALIDATION TIMING CONVERGED on validate-on-blur, re-validate after the first error, focus-first-invalid and an error summary for long forms; autocomplete hardened into an SC 1.3.5 obligation, and WCAG 2.2 raised the bar on login and checkout fields (3.3.7, 3.3.8)."]}};var ya={id:"textarea",name:"Textarea",aliases:["text-area","multiline-input","multiline-text-field","textbox","comment-box"],category:"form",status:"draft",inherits:"text-field",summary:"Multi-line text field: label, input area, and helper or validation message.",description:"A control for free-form text expected to wrap across multiple lines \u2014 comments, descriptions, messages, feedback. Shares the form-field substrate with TextField (label, helper/error, the aria-describedby wiring); differs in the sizing model, the prominence of the character counter, and who owns the Enter key. Not single-line (TextField), not formatted or structured (a rich-text editor), not code (a code editor), not a value from a known set (Select, or a combobox, not built yet).",props:[{name:"value",type:"string",required:!1,description:"Controlled value; pair with onChange. The same prop as TextField's, restated here because the Figma text property is keyed by it."},{name:"placeholder",type:"string",required:!1,description:"An example only; vanishes on input; nothing load-bearing lives here. The same prop as TextField's, restated here because the Figma text property is keyed by it."},{name:"showMessage",type:"boolean",default:!0,required:!1,description:"Whether the composed FieldMessage is shown. ON, the default, renders the helper or valida
