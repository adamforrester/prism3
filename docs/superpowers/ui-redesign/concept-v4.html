tion message below the field; turning it off hides the message entirely. The same prop as TextField's. Never hides a message the field needs."},{name:"rows",type:"number",default:3,required:!1,description:'Initial and minimum height, in LINES not pixels \u2014 a line count recomputes against the current line-height when the user raises their font size, where a pixel floor does not. Also a content cue: two rows signals brevity, six signals "write more". `cols` is dead on the web; width comes from CSS.'},{name:"resize",type:"enum: 'none' | 'vertical' | 'auto'",values:["none","vertical","auto"],default:"vertical",required:!1,description:"The sizing model in ONE prop, so two props cannot contradict each other. `vertical` (the drag handle) for standalone form fields; `auto` (grow within minRows/maxRows) for composers; `none` where layout stability wins. NEVER horizontal or both \u2014 altering the inline dimension shatters grid and flex layouts for no user gain."},{name:"minRows",type:"number",required:!1,description:'Auto-grow floor, in lines. Only meaningful with resize="auto".'},{name:"maxRows",type:"number",required:!1,description:"Auto-grow cap, in lines; beyond it the field scrolls. ALWAYS set this when auto-growing \u2014 an uncapped field pushes the submit button off-screen on a long paste, which is a shipped failure in the field, not a hypothetical."},{name:"maxLength",type:"number",required:!1,description:"Character limit, counted by GRAPHEME (Intl.Segmenter) rather than UTF-16 code unit \u2014 a flag emoji costs 4 units and a ZWJ family up to 11, so a .length limit hits non-Latin and emoji users artificially early. Enforce SOFT: allow the overflow, set aria-invalid, show the counter in error, block submit. Never the native hard maxlength, which silently truncates pasted overflow with no signal to anyone, AT users included."},{name:"showCount",type:"boolean",default:!1,required:!1,description:"The character counter \u2014 first-class here, unlike on TextField. Only ever with a real limit: a counter on an unlimited field implies a cap that does not exist."},{name:"spellCheck",type:"boolean",required:!1,description:"Native passthrough; worth surfacing because structured input often wants it off."},{name:"submitOnEnter",type:"boolean",default:!1,required:!1,description:'Composer opt-in: Enter submits, Shift+Enter inserts a newline. NOT the base default \u2014 Enter inserting a newline is the platform contract a multi-line field advertises via aria-multiline, and hijacking it silently can lose a screen-reader user a drafted message. Whenever true, pair it with a real visible submit button and a visible "Shift+Enter for a new line" hint (SC 3.3.2). A composer that submits on Enter by default is its own specialization, named MessageComposer or ChatInput (brief \xA73, \xA710), not this base field.'},{name:"validation",type:"enum: 'default' | 'error' | 'warning' | 'success'",values:["default","error","warning","success"],default:"default",required:!1,description:"The validation state. Each non-default status swaps the field border to its own boundary (border-only \u2014 `error` \u2192 danger, `warning` \u2192 warning, `success` \u2192 success) and sets the composed message to the matching status; `default` is neutral. `error` also sets aria-invalid. The same prop, with the same values, as TextField and Select."},{name:"validationMessage",type:"string | node",required:!1,description:'The validation text shown at error / warning / success, added to aria-describedby. For error, say what is wrong AND how to fix it, with the number when it is a length limit (SC 3.3.3), never "Invalid".'},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales type and padding ONLY \u2014 height belongs to rows / auto-grow, so the substrate's height tiers do not transfer."}],states:["rest","hover","filled","focus-visible","disabled","read-only","pending","empty"],variants:{style:["outline"],status:["default","error","warning","success"]},axisKinds:{style:"authoring",status:"runtime"},paintKeys:["{status}.{slot}.{state}","{slot}.{state}","{slot}"],densitySpacing:["pad-x","pad-y","size.{size}.pad-x","size.{size}.pad-y"],tokens:{fill:"color.field.fill","overlay.hover":"color.interactive.neutral.overlay.hover",label:"color.text.primary","label.rest":"color.text.secondary","label.hover":"color.text.secondary","label.focus-visible":"color.text.secondary","label.empty":"color.text.secondary",caret:"color.text.primary","caret-width":"border-width.hairline","caret-height":"control.size.md.line-box",border:"color.field.border.rest","border.hover":"color.field.border.hover","border.focus-visible":"color.border.focus","border.read-only":"color.field.border.rest","error.border.rest":"color.border.danger","error.border.hover":"color.border.danger","error.border.focus-visible":"color.border.danger","error.border.read-only":"color.border.danger","error.border.empty":"color.border.danger","error.border.filled":"color.border.danger","warning.border.rest":"color.border.warning","warning.border.hover":"color.border.warning","warning.border.focus-visible":"color.border.warning","warning.border.read-only":"color.border.warning","warning.border.empty":"color.border.warning","warning.border.filled":"color.border.warning","success.border.rest":"color.border.success","success.border.hover":"color.border.success","success.border.focus-visible":"color.border.success","success.border.read-only":"color.border.success","success.border.empty":"color.border.success","success.border.filled":"color.border.success","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset-field","disabled.fill":"color.disabled.fill","disabled.label.on-fill":"color.disabled.on-fill","disabled.border":"color.disabled.border",radius:"radius.sm","pad-x":"space.200","pad-y":"space.100","root-gap":"space.100","border-width":"border-width.hairline",type:"type.body.md.default",icon:"color.icon.secondary","disabled.icon.on-fill":"color.disabled.on-fill","grip-size":"icon.size.xs","grip-inset":"border-width.hairline","counter-type":"type.caption.md.default",indicator:"color.text.secondary","disabled.indicator":"color.disabled.text","size.small.pad-x":"space.200","size.small.pad-y":"space.075","size.medium.pad-x":"space.200","size.medium.pad-y":"space.100","size.large.pad-x":"space.300","size.large.pad-y":"space.100"},anatomy:{root:"container",parts:{container:{kind:"box",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"root-gap",children:["label","body"]},label:{kind:"nest",nests:"field-label",nesting:{kind:"nest-exposed",variant:{size:"small",emphasis:"secondary",weight:"regular",state:"rest"},expose:["size","emphasis","weight"]},crossAxisFill:!0,note:"The accessible name, composed rather than re-declared. Nest-exposed: its label text, required marker and size/emphasis/weight surface on the textarea. Starts at the field default (small / secondary / regular). Fills the field's width, so a long name wraps."},body:{kind:"box",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},crossAxisFill:!0,children:["control","messageRow"]},control:{kind:"box",role:"target",paintSlots:["overlay","fill","border"],layout:{direction:"row",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},minWidth:320,radius:"radius",strokeWidth:"border-width",padding:{block:"pad-y",inlineLabel:"pad-x"},children:["caret","placeholder","value","grip","focusRing"]},caret:{kind:"box",role:"presentation",paintSlots:["caret"],width:"caret-width",height:"caret-height",layout:{direction:"row",align:"center",justify:"start",sizing:{x:"fixed",y:"fixed"}},presentWhen:{state:["focus-visible"]},note:"The insertion point on the focused empty field, immediately before the placeholder, in the value ink. Code draws the native caret, colored by `caret-color`."},placeholder:{kind:"text",type:"type",wrap:!0,verticalAlign:"top",lines:"rows",presentWhen:{state:["rest","hover","focus-visible","disabled","empty"]},note:"The placeholder, in the placeholder ink (the disabled ink when disabled). Shown on the empty field: rest, hover, focus and disabled. Wraps across the field width and reserves the default rows of its own line height."},value:{kind:"text",type:"type",wrap:!0,verticalAlign:"top",lines:"rows",presentWhen:{state:["filled","read-only","pending"]},note:"The entered value, in the value ink. Shown on the filled and read-only field. Wraps across the field width and reserves the default rows of its own line height."},grip:{kind:"vector",glyph:"resize-grip",size:"grip-size",corner:"bottom-right",inset:"grip-inset",optional:!0,note:"The resize grip at the bottom-right corner, decorative: in code it is the browser's own handle. Pinned out of the flow, so the control keeps one size with it on or off. Shown by default (the `resize handle` boolean), since `resize` defaults to `vertical`."},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring`. Rings the control, takes no cell, and has its own stroke."},messageRow:{kind:"box",layout:{direction:"row",align:"start",justify:"end",sizing:{x:"fill",y:"hug"}},gap:"root-gap",crossAxisFill:!0,children:["messageCell","counterCell"]},messageCell:{kind:"box",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},paddingTop:"root-gap",grow:!0,optional:!0,children:["message"]},message:{kind:"nest",nests:"field-message",nesting:{kind:"nest-fixed",variant:{status:"default"},follow:["status"]},crossAxisFill:!0,note:"Helper or validation text, composed rather than re-declared. Its status follows the field's validation by name. Shown by default; the `message` boolean hides it, with the space above it."},counterCell:{kind:"box",layout:{direction:"row",align:"start",justify:"end",sizing:{x:"hug",y:"hug"}},paddingTop:"root-gap",optional:!0,children:["counter"]},counter:{kind:"text",type:"counter-type",paintSlot:"indicator",note:"The character counter, at the end of the message row. Hidden by default (the `character count` boolean), matching `showCount`, and independent of the message: either, both or neither can show. Beside the message it takes no height the row does not already have."}},codeOnly:["size \u2014 the small / medium / large ladder is a code-API PROP + padding tokens (`size.{small,medium,large}.pad-*`), NOT a variants axis and NOT a projected Figma variant. Figma renders the single `md` rung (the bare `pad-x` / `pad-y` keys), text-field's shape: a declared size axis must project a rung (#795), so the single-projected-size field is expressed by the prop and tokens.","style \u2014 the outline / filled / underline treatment is theming, not an API axis: `style` carries the single value `outline`, so there is nothing for a Figma variant to enumerate.","pending \u2014 a real STATE (content streaming into the field, with aria-busy), deliberately NOT a Figma variant: its delta is runtime behavior with no distinct static skin, so it stays in `states` and is admitted out of the projected `stateAxis`.","empty \u2014 a real STATE in code (the field holds no value, so it shows the placeholder), NOT a Figma variant, text-field's posture: in Figma the empty field IS the rest, hover and focus-visible members, showing the `placeholder` layer in `text.secondary`, and `filled` is the member showing the `value` layer in `text.primary`. It and `pending` are the two states held back, leaving the projected set at status(4) \xD7 state(6) = 24 members. In code the placeholder and the value are one <textarea>: its `placeholder` attribute and its value, never two elements.","the FOCUS CARET \u2014 Figma draws a static bar before the placeholder on the focus-visible member. Code draws the browser's native caret, blinking, at the insertion point, with `caret-color` set from `color.text.primary` (the `caret` binding), so it keeps the value ink over the placeholder's muted one.","rows / minRows / maxRows and auto-grow \u2014 Figma has no numeric component property, so `rows` is not a Figma property: the value text reserves the `rows` prop's DEFAULT line count (3) of its own line height, frozen at paste. A designer wanting more rows types more lines (the box grows) or resizes the instance; `minRows` / `maxRows` and the auto-grow measurement are runtime behavior.","the RESIZE HANDLE's behavior (`resize`) \u2014 Figma draws a decorative grip behind the `resize handle` boolean, on by default because `resize` defaults to `vertical`. In code the handle is the browser's own, drawn at the inline-end corner (bottom-left in a right-to-left layout); Figma members are drawn left to right, so the grip sits bottom-right. `auto` and `none` draw no handle in code; in Figma, switch the boolean off.",'the CHARACTER COUNTER\'s live value (`maxLength` / `showCount`) \u2014 Figma draws a static "0 / 200" caption trailing the message, behind the `character count` boolean, off by default like `showCount`. Code counts graphemes, sets tabular numerals (`font-variant-numeric: tabular-nums`, which the type tokens do not carry, so Figma uses the caption style as it is) and paints the counter in the error role past the limit. In Figma, as in code, the counter and the message switch independently. In a right-to-left layout the counter anchors to the inline end, the LEFT, with the resize handle (brief \xA79); Figma members are drawn left to right.',"the label / describedby WIRING and the counter's two-node live region \u2014 the host generates ids, ties the FieldLabel to the textarea, stitches the FieldMessage and the counter into aria-describedby, and sets aria-invalid. Figma has no accessibility tree, so the nested parts are associated by proximity alone.","the nested LABEL's disabled dimming \u2014 the field fixes the FieldLabel to `state=rest` (its state vocabulary is not the field's), so in Figma the nested label reads at rest regardless. A projection limit, not a design choice.","the KEYBOARD MODEL \u2014 native multi-line editing, the Enter key (a newline unless submitOnEnter), IME composition guards and the resize drag. All of it is runtime interaction the closed static member cannot carry."]},figmaProperties:{variantAxes:["status"],stateAxis:{name:"state",values:["rest","hover","filled","focus-visible","disabled","read-only"]},gridAxis:"state",texts:{placeholder:{part:"placeholder",default:"Placeholder"},value:{part:"value",default:"Entered text"},maxLength:{part:"counter",figmaName:"count",default:"0 / 200"}},booleans:{showMessage:{part:"messageCell",figmaName:"message",default:!0},resize:{part:"grip",figmaName:"resize handle",default:!0},showCount:{part:"counterCell",figmaName:"character count",default:!1}}},accessibility:{role:'textbox (native <textarea>), with the implicit aria-multiline="true"',wcag:["4.1.3 Status Messages (the counter and over-limit live region \u2014 the most Textarea-specific SC)","1.4.4 Resize Text / 1.4.10 Reflow (the field, counter and resize handle must survive 200% zoom and 320px without colliding or clipping)",'3.3.2 Labels or Instructions (the "Shift+Enter for a new line" hint whenever Enter submits)',"1.3.5 Identify Input Purpose / 1.3.1 Info and Relationships (inherited substrate wiring)","3.3.1 Error Identification / 3.3.3 Error Suggestion (over-limit states the overage and how to fix it)","1.4.3 Contrast / 1.4.11 Non-text Contrast (field boundary \u22653:1 \u2014 the rest, hover and read-only borders are gated on `background.secondary`, the darkest permissible ground) / 2.4.13 Focus Appearance / 4.1.2 Name Role Value","2.5.8 Target Size \u2014 intent: the resize handle is the browser's own control, sized by the browser, so this def does not set its target. The 16px grip drawn in Figma is decorative, not the target"],keyboard:"Native multi-line editing with undo/redo, spellcheck and IME. Enter inserts a newline \u2014 that is the contract aria-multiline advertises and the default. submitOnEnter inverts it for composers, and then Shift+Enter inserts the newline, a real submit button still exists, and the swap is stated visibly near the field.",focus:":focus-visible with the field ring (`focus.ring.offset-field`, 0 offset). An inset indicator for large surfaces is not built. forwardRef must reach the <textarea> itself, not the wrapper. Auto-resize must not move the caret or scroll the viewport \u2014 the measurement is synchronous with input, and it must also run on PROGRAMMATIC value changes (a reset, or AI-inserted text), which is the common auto-grow bug.",aria:'The counter is the central problem and it is two nodes, not one: the visual counter is aria-hidden and updates instantly, while a separate visually-hidden node carries announcements. Two channels \u2014 the static limit folded into aria-describedby so tabbing in announces the ceiling, and a threshold-based polite live region that speaks only near the limit (per-keystroke counting makes the field unusable), escalating to assertive only on breach. Over-limit sets aria-invalid and is ANNOUNCED, never color-only. aria-busy while content streams. Preserve the native aria-multiline; do not reconstruct a textarea from contenteditable, which loses undo/redo, spellcheck, reliable IME and form submission. Set dir="auto" so content direction can differ from UI direction, and do not run counting or auto-grow measurement mid-IME-composition.'},content:{labelPattern:"Noun phrase, sentence case, no trailing colon \u2014 the substrate discipline (see field-label).",errorPattern:'What is wrong AND how to fix it, with the number: "Description must be under 500 characters. Remove 24 to continue." (SC 3.3.3). May replace the helper text to conserve vertical space, provided it still carries the original constraint.',emptyPattern:'Label plus an optional placeholder. The placeholder may model the expected SHAPE ("Describe the issue, including steps to reproduce") but still vanishes on the first keystroke \u2014 and the recall cost is higher here than on a single-line field, because a user may write several paragraphs, tab away, and come back to a prompt that is long gone. Nothing load-bearing lives in it.'},docs:{usage:"Use for free-form text expected to exceed one line \u2014 comments, descriptions, messages, feedback, multi-line addresses. Pick the sizing model by context: fixed-height-plus-scroll for a field inside a long form (so the form does not reflow as the user types), auto-grow for a composer (so the message box follows the message). Right-size the initial rows to the expected input. Compose FieldLabel above and FieldMessage below exactly as TextField does; the host wires the ids and the aria-describedby chain.",do:["Set maxRows whenever auto-growing \u2014 uncapped growth pushes the submit affordance off-screen on a long paste","Enforce a character limit softly (allow over, flag invalid, block submit) and count by grapheme, not by string length","Announce the over-limit through the live region and aria-invalid \u2014 color alone is not a signal","Normalize \\r\\n to \\n on paste before counting or storing, and resize once per paste rather than once per inserted line","Keep a read-only textarea scrollable and selectable, so the whole value stays reachable \u2014 far more text is hidden here than in a single-line field","Reserve space in the footer for the validation message and the counter, so an over-limit error does not push the resize handle"],dont:["Offer horizontal or both resize \u2014 it shatters grid and flex layouts and breaks responsive viewports","Use the native maxlength attribute for substantial text \u2014 it silently swallows pasted overflow with no feedback","Bake submit-on-Enter into the base component \u2014 it is a composer opt-in that always keeps a real submit button and a visible hint","Reach for contenteditable to add formatting \u2014 cross the boundary to a real rich-text editor instead",'Drop in a one-row Textarea as a "bigger input" \u2014 the semantics and the Enter behavior differ from TextField'],contentGuidelines:'Counter reads "240 / 280" or "40 characters remaining"; over-limit reads "12 characters over the limit" \u2014 constructive and numeric, never "Too long." If Enter submits, say so near the field.'},ai:{primaryPurpose:"Capture multi-line free-form text with an associated label, an optional soft character limit, and a stated sizing model.",whenToUse:"Comments, descriptions, messages, feedback, notes, commit-message bodies, a multi-line address \u2014 any input that predictably runs past the ~40\u201360 characters a single-line field shows comfortably, or that legitimately needs user-authored line breaks.",avoidWhen:'The value is a single line (TextField \u2014 and do not substitute a one-row Textarea, the Enter semantics differ), needs formatting or structure such as bold, links, @-mentions or embedded media (a rich-text editor \u2014 a <textarea> holds a plain string and nothing else), is source code (a real code editor, for syntax highlighting and bracket matching), or comes from a known set (Select, or a combobox, not built yet). Also avoid reaching for it as a general "big box of text" when the content is genuinely structured \u2014 that is the rich-text signal.',commonPartners:["field-label","field-message","button","icon","spinner"],triggerKeywords:["textarea","text area","multiline","multi-line input","comment box","message box","description field","composer"],generationPriority:2},composition:{composesWith:["field-label","field-message","focus-ring"],alternativeTo:["text-field","select"],replacesPatterns:["a one-row textarea used as a tall input","a contenteditable div used for plain multi-line text"],planned:["form","rich-text-editor","combobox","code-editor"]},motion:{enter:"none (present on mount)",exit:"none",reduceMotion:"State transitions follow text-field's ~100\u2013150ms token-driven contract. AUTO-GROW HAS NO HEIGHT TRANSITION: the height changes instantly on each keystroke, because an eased height lags behind the typing and reflows the layout below on every frame; if a transition is used at all it stays at or under 100ms and drops under prefers-reduced-motion. While the user drags the resize handle, strip every transition off the node, or the edge lags behind the cursor."},notes:{contested:['resize as a VARIANT AXIS vs a prop \u2014 brief \xA715 lists `resize: [none, vertical, auto]` under `variants`, and \xA74 calls it "more like an author-chosen variant than a runtime state". Declared here as a prop ONLY. Two reasons: `VARIANT_AXES` is closed (#847) and does not contain `resize`, and adding it would duplicate a member already carried by the prop \u2014 the exact criticism `modifiers` carries in the vocabulary\'s own header (#845). The named alternative is to admit `resize` to `VARIANT_AXES` with a stated reason, which is the right move IF the drag handle turns out to need a projected Figma member. It did not: the grip is pinned out of the flow, so it moves no box and a `resize handle` boolean carries it (2026-09-25).','modifiers: [auto-grow, show-count] \u2014 brief \xA715 lists these as an axis. Not declared, and NOT a judgment call: `modifiers` is not in `VARIANT_AXES`. #845 removed it \u2014 from both defs that carried it and from the vocabulary itself (`component-schema.ts` \xA72 of the closed-vocabulary header: "**RESOLVED (#845): removed, from both defs and from this list**"; `button.ts` opens its variants block with `NO modifiers AXIS`). Since `variants` is typed `Partial<Record<VariantAxis, string[]>>`, declaring it does not compile, and `validateComponentDef` rejects it a second time at runtime. The reason it was removed is the same one that would disqualify it here \u2014 its values are not alternatives along one dimension: `auto-grow` is already a value of `resize`, `show-count` is already a boolean prop, and a textarea can be both at once, which is what makes them booleans rather than coordinates. The real alternative is to petition to RE-OPEN `VARIANT_AXES` with a stated reason, the way the `resize` entry above contemplates for itself. (An earlier version of this entry said the alternative was to "declare it and accept the duplication", which reads as a trade-off available to the author and is not one \u2014 the file would not build. Corrected in #904; the conclusion never moved, only the reason under it.)',"The focus indicator on a large surface \u2014 brief \xA74 argues a saturated ring around a 600\xD7400 textarea is visual noise and favors an inset indicator or a background/border tint (Atlassian). This def binds the same `focus.ring.offset-field` the substrate does, because that is the only field ring the engine emits. The alternative is a large-surface ring token, which is engine surface a def should not author unilaterally.","Enter-key ownership \u2014 submit-on-Enter is an opt-in here, never the base default. The alternative (composers invert it by default) is what chat surfaces actually ship, and the brief rejects it for the base component because silently hijacking Enter breaks the platform expectation for every non-chat use.","Soft vs hard maxLength \u2014 soft, always. The alternative is the native maxlength attribute, which is one line of code and silently truncates pasted overflow; the brief rejects it on AT grounds specifically, since input simply stops being accepted with no announcement.","Distinct component vs a multiline prop on TextField \u2014 Polaris and Material 3 model this as `multiline={4}` on a universal field. The practice ships a distinct component (brief \xA71), and the reason is machinery rather than symmetry: auto-grow measurement, resize chrome, scroll management, line-break normalization and grapheme counting are non-overlapping with a single-line field and would tax every plain input in the app."],unverified:['CSS `field-sizing: content` as the auto-grow mechanism \u2014 the brief calls it the biggest near-term implementation shift and prioritizes it behind an @supports query with the ghost-sizer JS polyfill as fallback. It also says explicitly not to treat its own version numbers (Chromium 123+, "Firefox following") as settled. NOT verified in this pass, which was authoring rather than research; verify before any implementation reads it as current.',"The Polaris unbounded-growth bug cited in brief \xA73 and \xA713 as the evidence for always setting maxRows \u2014 attributed to the external research pass, no `_source-text` backing in the vault. The RULE stands on its own reasoning; the citation is what is unverified.","The error stroke belongs on the CONTAINER, not the input, so a Windows scrollbar docks inside the error boundary rather than breaking it (brief \xA74). The Figma anatomy strokes the `control` box that wraps the text, which is that reading; the code-side node split (a wrapper carrying the border around the native <textarea>) is not expressed by anything a gate reads.","The reserved rows are the value text's `minHeight` (rows \xD7 its line height), written by the executor after the text is appended to the auto-layout control. That Figma accepts and keeps a `minHeight` on a TEXT child of an auto-layout frame, with `textAutoResize: HEIGHT`, is modeled offline (the shim and the read-back) and not yet confirmed on a live host. Symptom if it is not kept: a `minHeight -> DISCARDED` miss, and a one-line-tall control.","With both the `message` and `character count` switches off, the message row is an auto-layout frame with no visible child, and the field relies on the host collapsing it to zero height (it has no padding of its own; the space above each part lives in that part's cell). Modeled offline, not yet confirmed on a live host. Symptom if it does not collapse: a sliver below the control.","The resize grip is an ABSOLUTE child of the auto-layout control, placed at the control's built size and constrained `MAX`/`MAX`. That the host keeps it in the corner when the value text grows the control after paste (a designer typing more lines) is modeled offline, not yet confirmed on a live host. Symptom if it does not: a grip left at the old corner, inside the grown box.",'Brief \xA74 says `size` scales "typography and padding only". The projected `md` rung expresses both halves: this def and text-field each bind `type.body.md.default` for the value text (#1494). The code-API ladder does not: `size.{small,medium,large}.*` binds padding only, so a small or large textarea changes its padding and keeps the `md` type. Whether the field family binds a type role per size is a substrate question, filed as #862 rather than decided in a child def.',"rows / minRows / maxRows are in LINES and therefore resolve against the computed line-height, which brief \xA79 warns must be the RENDERED line box rather than an assumed Latin one (Arabic, Thai and Devanagari grow differently). No token expresses a line-height for this def to bind, so the constraint lives in prose only and nothing checks it."],evolution:["READ-ONLY KEEPS THE EDITABLE FIELD'S BOUNDARY (owner decision, 2026-09-29, #1710). The read-only member binds `field.border.rest`, the same border as the rest and filled members, in every mode. The earlier `border.secondary` binding measured 2.69\u20132.81:1 on `background.secondary` in light, below the 1.4.11 floor, and `field.border.rest` is already the quietest neutral step that clears 3:1 there, so no fainter read-only edge can pass. Read-only is carried by its semantics (aria-readonly; still focusable and submitted) and by the affordances its member does not draw (no caret, no hover wash), not by a fainter edge.","AUTO-GROW IS BECOMING THE COMPOSER DEFAULT, with maxRows-plus-scroll as the safety valve, learned after early systems shipped unbounded growth (KB textarea brief \xA713).","CSS `field-sizing: content` IS RETIRING JAVASCRIPT AUTO-GROW, moving the measurement off the main thread into the browser engine \u2014 the largest near-term implementation change, with support still to verify (see `notes.unverified`).","SOFT LIMITS OVER HARD maxlength: allow the overflow, flag it, block submit, rather than truncating silently.","THE CHARACTER COUNTER MATURED from an afterthought into an audited sub-component: an aria-hidden visual counter plus a threshold-based polite live region.","AI CO-AUTHORING IS THE EMERGING FRONTIER: content streamed into the field makes `pending` (aria-busy) newly relevant. A signal to watch, not a practice default.","THE VARIANT-PROP vs DISTINCT-COMPONENT SPLIT PERSISTS; the practice ships a distinct Textarea (see `notes.contested`)."]}};var wa={id:"checkbox-control",name:"Checkbox.Control",aliases:["checkbox-box","check-control","checkbox-atom"],category:"form",status:"draft",summary:"Checkbox box with check/dash glyph and focus ring. Nested by Checkbox.Row; no label.",description:"The atomic checkbox control \u2014 the painted square with its check or dash glyph and its focus ring, and nothing else. Nested by the labeled Checkbox.Row rather than placed on its own: it carries no label, no description and no hit-target padding, so a standalone use needs an external aria-label. Carries the three-value selection axis (unchecked / checked / indeterminate) whose mark is a real part gated on the coordinate, the per-rung clamped corner, and the 2px control border.",props:[{name:"checked",type:"boolean",required:!1,description:"The filled/checked appearance. Driven by the host row from the group's value array \u2014 a bare Checkbox.Control is styled by the coordinate, not wired to state here."},{name:"indeterminate",type:"boolean",default:!1,required:!1,description:'The mixed appearance \u2014 the dash glyph. PRESENTATIONAL, for parent/child select-all hierarchy, never a third value a user clicks to; the host carries `aria-checked="mixed"`.'},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the control square (both axes from one key, square by construction), its corner and its glyph. The host row passes its own size through by `follow`, so the nested control tracks the row."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"The disabled skin \u2014 a contrast-exempt fill/border/glyph treatment. Set on the host, followed here."},{name:"aria-label",type:"string",required:!1,description:"Required only for a genuinely standalone control with no host row to name it \u2014 the Row provides the accessible name through the label, so a nested control must NOT double-label."}],states:["rest","hover","pressed","focus-visible","disabled","error"],variants:{size:["small","medium","large"],selection:["unchecked","checked","indeterminate"]},axisKinds:{size:"authoring",selection:"runtime"},paintKeys:["{selection}.{slot}.{state}","{selection}.{slot}","{slot}"],tokens:{"unchecked.border":"color.field.border.rest","unchecked.border.hover":"color.field.border.hover","unchecked.border.error":"color.border.danger","checked.fill":"color.interactive.primary.fill.selected","checked.fill.hover":"color.interactive.primary.fill.hover","checked.fill.pressed":"color.interactive.primary.fill.pressed","checked.border.error":"color.border.danger","checked.icon":"color.interactive.primary.on-fill","indeterminate.fill":"color.interactive.primary.fill.selected","indeterminate.fill.hover":"color.interactive.primary.fill.hover","indeterminate.fill.pressed":"color.interactive.primary.fill.pressed","indeterminate.border.error":"color.border.danger","indeterminate.icon":"color.interactive.primary.on-fill","focus-ring":"color.border.focus","ring-width":"focus.ring.width","ring-offset":"focus.ring.offset","disabled.fill":"color.disabled.fill","disabled.border":"color.disabled.border","disabled.icon.on-fill":"color.disabled.on-fill","size.small.radius":"control.size.sm.radius","size.medium.radius":"control.size.md.radius","size.large.radius":"control.size.lg.radius","border-width":"border-width.thick","size.small.control":"control.size.sm.height","size.medium.control":"control.size.md.height","size.large.control":"control.size.lg.height"},anatomy:{root:"control",parts:{control:{kind:"box",role:"target",paintSlots:["fill","border"],size:"size.{size}.control",radius:"size.{size}.radius",strokeWidth:"border-width",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"fixed",y:"fixed"}},children:["mark","dash","focusRing"],note:"The control square AND the nominal hit-target marker. The real hit target is the whole labeled ROW, which lives on `checkbox-row`; this square is not independently clickable. `role: target` is here only because the schema requires exactly one per anatomy \u2014 the same nominal marker `focus-ring`'s `ring` part carries."},mark:{kind:"vector",glyph:"check",size:"size.{size}.control",glyphScale:.8,presentWhen:{selection:["checked"]},note:"The check, inset to 0.8 of the box (#1346) via a padded artboard rather than a shrunk frame. Its ink is `checked.icon` (`descendantFills`, never a fill on the artboard \u2014 #864). Its draw transition is stated in `motion`; the Figma members are static."},dash:{kind:"vector",glyph:"minus",size:"size.{size}.control",glyphScale:.8,presentWhen:{selection:["indeterminate"]},note:'The mixed-state dash, inset to 0.8 of the box (#1346), the same as the check. Never the sole signal \u2014 `aria-checked="mixed"` carries it to assistive tech, which the host row sets.'},focusRing:{kind:"absolute",when:"focus-visible",nests:"focus-ring",inset:"ring-offset",strokeInset:"ring-width",nesting:{kind:"nest-fixed",variant:{surface:"default"}},note:"An absolutely-positioned sibling nesting the shared `focus-ring` component, inset from the control so the ring surrounds the square."}},codeOnly:['read-only \u2014 deliberately not a state of this atom. It is the field/row-level concern the brief calls "the awkward one" (static text over a styled locked control), so there is no box treatment to project and the state is absent rather than admitted-and-unbound. The Row and the Group decide it.',"motion \u2014 the check-glyph draw animation (brief \xA78: a stroke-dasharray draw at roughly 100-150ms, morphing dash to check, bypassed under prefers-reduced-motion). The def states it in `motion`; a Figma variant carries no motion, so the two glyph parts are static outlines at every coordinate.","RTL \u2014 the check and dash glyphs do NOT mirror: the check shape is recognized as drawn in every script, so the SVG keeps its standard stroke direction (brief \xA79). The row around this atom mirrors; the atom does not. Figma members are drawn left to right; for this atom that is also the right-to-left rendering.","The whole-row hit target. A bare control square is a 12-24px box that fails SC 2.5.8 in isolation; the accessible target is the labeled ROW, which is `checkbox-row` and not this atom. This def is nested, never placed alone, precisely so the target is supplied one level up."]},figmaProperties:{variantAxes:["selection","size"],stateAxis:{name:"state",values:["rest","hover","pressed","focus-visible","disabled","error"]},booleans:{}},accessibility:{role:"The visual control only \u2014 the accessible checkbox role, name and aria-checked (true/false/mixed) belong to the host input the Row wires. A standalone use must supply role and name itself.",wcag:["1.4.11 Non-text Contrast (the control boundary \u2014 border on the empty box, self-bounding fill on the filled one)","2.4.13 Focus Appearance (the nested focus ring, offset, at least 3:1 against the adjacent surface and the control edge)","4.1.2 Name Role Value (carried by the host; this atom is presentational when nested)"],keyboard:"None of its own \u2014 the atom is not a tab stop. Focus, Space-to-toggle and the tab order belong to the host input; the ring here renders the host's `:focus-visible` state.",focus:"The nested focus ring surrounds the square on `:focus-visible`, offset so an unbroken sliver of background separates the ring from the control's own border (WCAG 1.4.11). Keyboard traversal only, never mouse or touch.",aria:'When nested in a host row, the host provides the accessible name through `aria-labelledby` \u2014 never double-label. Relying on the visual dash glyph alone to convey indeterminate is a failure; `aria-checked="mixed"` carries it, and the host sets it.'},content:{labelPattern:"None \u2014 the atom carries no label. The consent line and its rules live on Checkbox.Row (`checkbox-row`).",errorPattern:"None of its own \u2014 an error boundary is a color treatment the host coordinate selects; the message is Checkbox.Group's (`checkbox-group`)."},docs:{usage:`Do not place this on its own as a form control. It is the box Checkbox.Row nests, so a fix to its corner, its border weight or its fill grammar reaches the row and the group without being copied. Build it before the row that nests it (the nest resolves by name against the live file). It is also the unit a host nests when the label is decoupled \u2014 a select-all in a table's first column, a card-select where the card is the accessible name, a list or menu row. Nested that way, the host names the control through aria-labelledby, the host owns the hit target (the whole row toggles, unless the row has its own primary action \u2014 then the control is a secondary affordance with its own name, such as "Select <item>"), and the enclosing collection is the group: it owns the selected ids and select-all, so no Checkbox.Group goes inside a list. Resolve every nested case to one model \u2014 the whole row is one control, or the control is a named secondary affordance \u2014 never a control inside a row that is itself a button or link with no clear click target.`,do:["Nest this from Checkbox.Row rather than redrawing the box per host","Let the host row expose `selection` and `state` and `follow` its size, so the nested control tracks the row","Supply an external aria-label only when using the control genuinely alone, with no labeled row to name it","Nest it in a table cell, card or list row when the label is decoupled \u2014 the host row supplies the name and the collection owns the selection"],dont:["Place a bare control square as the clickable element \u2014 it fails SC 2.5.8 in isolation; the labeled row is the hit target","Double-label a nested control \u2014 the host row already provides the accessible name","Reach for this atom when you want the labeled case \u2014 that is Checkbox.Row","Nest a Checkbox.Group inside a selectable list \u2014 the collection is the group","Put the control inside a row that is itself a button or link with no clear model of which one a click hits"],contentGuidelines:"The atom has no copy of its own; all label, description and error text belongs to the row and the group that compose it."},ai:{primaryPurpose:"Render the atomic checkbox control \u2014 the painted square with its check or dash glyph and focus ring \u2014 for a host row to nest.",whenToUse:"Nested by the labeled Checkbox.Row (the common case), or by a host whose label is decoupled \u2014 a table select-all, a card-select, a selectable list row \u2014 where the host names the control and the collection owns the selection. Standalone only with an external label and its own aria wiring.",avoidWhen:"You want the labeled case (that is Checkbox.Row), a mutually-exclusive one-of-many (Radio.Control), or an immediate-effect toggle (Switch.Control). Never place a bare control square as the clickable element \u2014 the hit target is the labeled row.",commonPartners:["checkbox-row","focus-ring","checkbox-group"],triggerKeywords:["checkbox control","checkbox box","check box atom","checkbox square"],generationPriority:3},composition:{composesWith:["focus-ring"],alternativeTo:["radio-control","switch-control"],replacesPatterns:["the painted control inlined in a checkbox row"],supersededBy:[]},motion:{enter:"On check, the check glyph draws in as a pen stroke (SVG stroke-dashoffset) while the fill crossfades in, about 100-150ms, eased. Indeterminate to checked morphs the dash into the check.",exit:"On uncheck, the same glyph transition runs back and the fill crossfades out.",reduceMotion:"Under prefers-reduced-motion, the draw and any spatial animation are bypassed and the box flips instantly; a crossfade under 150ms may remain, since opacity does not trigger vestibular symptoms. No layout motion."},notes:{contested:["THE NOMINAL `role: target`. A bare control square is not independently the hit target \u2014 SC 2.5.8 wants the whole labeled row \u2014 so `target` here is the interaction marker the schema requires exactly one of, not a claim the square is clickable. The same nominal marker `focus-ring`'s `ring` part carries, and stated so a reader does not infer a 12-24px clickable square."],unverified:["NESTED-INSTANCE SIZING IS UNMEASURED ON A REAL HOST. No def used `kind: nest` in flow before #1226 step 2. The row has since been built in Figma (the owner's plugin-import QA rounds), but no recorded read-back measures the nested instance's sizing there. The control instance must HUG (sit at its own square) rather than FILL the row's line-box wrapper \u2014 it binds `size` on the nest part so its own square is pinned, and the wrapper centers it \u2014 but whether the instance's inherited sizing mode cooperates with the row's auto-layout is a real-host question the offline shim cannot answer. The symptom to look for: a control instance stretched to the line-box height instead of centered within it.","THE INHERITED FOCUS-RING BINDING, now two layers deep (#1280). The ring binds a nominal square side and an instance inherits its main component's bindings; #1280 left it open whether that nominal side survives `resize()` when inherited through an instance. After this split the ring is nested inside the control and the control inside the row, so an inherited dimension binding would have to be cleared twice. Batches with #1290. The symptom: a nested ring sitting at the md control height instead of hugging its host's box.","THE PADDED-ARTBOARD GLYPH INSET IS UNVERIFIED ON A REAL HOST (#1346). `glyphScale: 0.8` emits the mark/dash on an artboard padded to `grid \xF7 0.8` with a NEGATIVE viewBox origin (`-3 -3 30 30`) so the same path centers in the larger canvas. The offline model asserts the document, the read-back box (`glyphViewBox` = the padded dims) and the ink-fit; what it cannot see is whether `figma.createNodeFromSvg` positions a negative-origin viewBox as centered and whether the imported vector holds 0.80 through the frame's subsequent resize to the box. Same posture as the nest-sizing note above. The symptom to look for: a check that renders full-bleed (the pad was ignored) or off-center toward the top-left (the negative origin was dropped)."],evolution:["THE ATOM IS A SEPARATE COMPONENT rather than kept inline in the row. Settled by #1226's composition model (owner): a shared piece is single-sourced so a fix propagates to every host that nests it. The rejected alternative \u2014 keeping the control inline and copying it into radio and switch \u2014 is exactly the per-def duplication #1011 found had shipped the identical fill/border pairing across three defs. The nest costs one indirection; the copy costs three chances to drift.","RADIO AND SWITCH SPLIT AFTER THIS ONE. This entry used to say they were not split here: this was checkbox step 2 only, with the radio atom filed next and switch out of scope over its moving thumb. Both followed \u2014 `radio-control` (#1348, one `dot` box, no dash) and `switch-control` (#1354).","Styling the native input won (brief \xA713): `appearance: none` plus a pseudo-element or SVG replaced both the `role=checkbox` div and the hidden-input-plus-fake-box hacks, keeping native semantics. That is the input this atom paints.","The `indeterminate` ref callback superseded `useLayoutEffect` for performance in large lists (brief \xA713) \u2014 the mixed state is a DOM property the host sets, which is why this atom only draws the dash."]}};var va={id:"checkbox-row",name:"Checkbox.Row",aliases:["checkbox","check","tickbox","checkbox-field"],category:"form",status:"draft",inherits:"text-field",summary:"Labeled checkbox for a staged on/off choice. The whole row is the hit target.",description:"A control for an independent binary choice that is staged into a form and submitted \u2014 on/off, included/excluded, agreed/not \u2014 optionally one of many in a set. The labeled ROW: control and rich-content label, with the whole row as the hit target. Carries the indeterminate (mixed) visual state for select-all hierarchy, which no sibling control has. Not an immediate-effect toggle (Switch.Row), not a mutually-exclusive one-of-many (Radio.Group), not an action with a pressed state (a toggle button, not built yet).",props:[{name:"checked",type:"boolean",required:!1,description:"The controlled binary. Pair with `onChange`; use `defaultChecked` for the uncontrolled form. Named for the DOM attribute rather than the framework idiom \u2014 `checked`, not `isChecked`/`isSelected`. Inside a Checkbox.Group this is derived from the group's value array and a consumer should not also wire it here."},{name:"defaultChecked",type:"boolean",default:!1,required:!1,description:"Uncontrolled initial value. Never `true` for a consent checkbox \u2014 pre-checked consent is a dark pattern and, for marketing consent, often unlawful."},{name:"indeterminate",type:"boolean",default:!1,required:!1,description:'The mixed visual state \u2014 dash glyph, `aria-checked="mixed"`. PRESENTATIONAL: the underlying value is still true/false, and this is for parent/child select-all hierarchy only, never a third state a user can click to. There is no `indeterminate` HTML attribute \u2014 it is a DOM PROPERTY (`node.indeterminate = true`), which is the single most common checkbox bug; in React apply it through a synchronous ref callback rather than a JSX prop.'},{name:"label",type:"node",required:!1,description:'Rich content: a node, not a string. The substrate\'s label is a string above the field; this one sits inline-end, doubles as the hit target, and must be able to hold a link, because the single most common real checkbox label is a consent line with one in it ("I agree to the Terms of Service"). A standalone control with no label is `checkbox-control`, which then requires an external `aria-label`/`aria-labelledby`.'},{name:"description",type:"node",required:!1,description:"Optional helper beneath the label, describedby-wired \u2014 the detail that qualifies the choice without lengthening the label."},{name:"onChange",type:"(checked: boolean, event) => void",required:!1,description:"Restated rather than inherited: the substrate's change yields a string, this one yields the resulting BOOLEAN alongside the event."},{name:"value",type:"string",required:!1,description:'The string submitted when checked (the platform default is `"on"`), and the element this row contributes to a Checkbox.Group\'s array. An unchecked box submits nothing at all rather than a false value \u2014 the missing-key trap.'},{name:"readOnly",type:"boolean",default:!1,required:!1,description:'Restated only for the caveat: `<input type="checkbox">` has NO working `readonly` \u2014 only `disabled` \u2014 so a genuinely read-only checkbox needs `aria-readonly` plus a prevented toggle, or is better rendered as static text. Decide which explicitly; the default of doing neither is a control that looks interactive and silently is not.'},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the control square, the label's type ramp, the box\u2194label gap and the row's minimum height. The square reads `control.size.<rung>.height` on BOTH axes \u2014 square by construction rather than by two tokens agreeing \u2014 and not `icon.size.*`, which is 16/20/24 in every brand the engine ships and so would hold a control rigid that should move with brand density."}],states:["rest","hover","pressed","focus-visible","disabled","read-only","error"],variants:{size:["small","medium","large"]},axisKinds:{size:"authoring"},paintKeys:["{slot}"],densitySpacing:["size.{size}.gap"],tokens:{label:"color.text.primary","disabled.label":"color.disabled.text","pad-y":"space.150","pad-x":"space.0","size.small.gap":"space.100","size.medium.gap":"space.100","size.large.gap":"space.150","size.small.min-height":"size.sm.height","size.medium.min-height":"size.md.height","size.large.min-height":"size.lg.height","size.small.control-box":"control.size.sm.line-box","size.medium.control-box":"control.size.md.line-box","size.large.control-box":"control.size.lg.line-box","size.small.control":"control.size.sm.height","size.medium.control":"control.size.md.height","size.large.control":"control.size.lg.height","size.small.text":"type.body.sm.default","size.medium.text":"type.body.md.default","size.large.text":"type.body.lg.default"},anatomy:{root:"row",parts:{row:{kind:"box",role:"target",layout:{direction:"row",align:"start",justify:"start",sizing:{x:"hug",y:"hug"}},gap:"size.{size}.gap",padding:{block:"pad-y",inlineLabel:"pad-x"},minWidth:320,children:["controlBox","label"]},controlBox:{kind:"box",role:"presentation",height:"size.{size}.control-box",layout:{direction:"row",align:"center",justify:"center",sizing:{x:"hug",y:"fixed"}},children:["control"]},control:{kind:"nest",nests:"checkbox-control",size:"size.{size}.control",nesting:{kind:"nest-exposed",variant:{selection:"unchecked",state:"rest"},expose:["selection","state"],follow:["size"]},note:"An in-flow instance of `checkbox-control` taking the control cell inside the line-box wrapper. It EXPOSES the control's selection and state (the consumer drives them from the Row), follows the Row's size, and binds its own square so it is centered within the taller wrapper rather than stretched to fill it."},label:{kind:"text",type:"size.{size}.text",wrap:!0,note:"The accessible name AND the second half of the hit target. Rich content in code (a consent line carries a link); a plain text node in Figma, where a nested link cannot exist. It WRAPS to a second line rather than overflowing (#1424) \u2014 it fills the row's main axis and reflows."}},codeOnly:["read-only \u2014 a `states` value the Figma set does not carry. Since #1330 the Row projects a SIZE-ONLY set (no stateAxis): the control's `state` is EXPOSED from the nested `checkbox-control` and the consumer drives it from the Row, so no state \u2014 read-only least of all \u2014 is enumerated into the Row's own matrix. read-only binds NOTHING even in code (see `states`): the brief calls it \"the awkward one\" and recommends static text over a styled locked control, so there is no treatment to project at either level.","states \u2014 the Row's per-state LABEL treatment (`disabled.label` dimming the text when the field is disabled) is the CODE projection's, not Figma's. Since #1330 the Figma set is size-only and `state` is exposed from the nested control, so a disabled Row in Figma shows the disabled CONTROL (the exposed state) beside a full-ink label. `lint-paint` arm 2 reads `def.states` for reachability, so `disabled.label` stays reachable and keyed for code; it is the Figma SET that cannot show it, because the Row no longer multiplies state. The documented cost of collapsing 54 members to 3 (the #761 reversal).","min-height \u2014 `size.*.min-height` is the row's FLOOR (48 at medium on nb) and Figma has no floor. `PartDef` carries `height`, which is fixed, so binding it here would state the wrong quantity and clip a wrapping consent label at the one coordinate that matters most. The row hugs its children instead and the keys stay bound for the code projection, where `min-height` is the property they name.","The whole-row hit target beyond the row's own extent. SC 2.5.8 wants 24x24 and Apple/Material want 44/48 on touch; the row reaches that at `medium` and not at `small`, and the padding that would expand it is a per-consumer decision about the surrounding layout rather than a property of this component. `row` is the node it lands on \u2014 that is what this block newly makes expressible \u2014 but the value is not the def's to pick.","The label's RICH CONTENT. `label` is typed `node` and its commonest real value is a consent line with a link in it; a Figma text node holds characters, so the projected placeholder is flat text and the link exists only in code.","motion \u2014 the nested control's glyph micro-motion (brief \xA78: a stroke-dasharray draw morphing dash to check). It is `checkbox-control`'s, stated in that def's `motion`; the Row carries none of its geometry or motion, and a Figma variant carries no motion at either level.","The `description` prop \u2014 helper text beneath the label, describedby-wired. It is a second text part under `label`, and adding it would double the row's vertical shape for content that is optional at every one of the three members. Left to the code projection, as on `radio-row`.","RTL \u2014 the row mirrors through logical properties: the control moves to the right and the label flows leftward from it, with the padding flipped. The CHECK GLYPH does not mirror \u2014 the check shape is recognized as drawn in every script, so the SVG keeps its standard stroke direction (brief \xA79). Figma members are drawn left to right.","text expansion \u2014 labels run 150-200% longer in German or Russian (brief \xA79). The label wraps freely and the control stays on the first line (#1201), so a long label does not break the row. The Figma members carry the English placeholder only."]},figmaProperties:{variantAxes:["size"],texts:{label:{part:"label",default:"Checkbox label"}},booleans:{}},accessibility:{role:'checkbox (native <input type="checkbox">), with aria-checked true / false / mixed',wcag:["2.5.8 Target Size \u2014 the intent: the whole ROW is the target, because the 12\u201324px box fails in isolation. The default (medium) row is held to a 44px minimum height on comfortable and spacious density; small and compact rows are not measured.",'4.1.2 Name Role Value (role, checked AND mixed \u2014 `aria-checked="mixed"` must be set explicitly)',"1.3.1 Info and Relationships (group structure)","3.3.2 Labels or Instructions (the visible row label)","3.3.1 Error Identification / 3.3.3 Error Suggestion \u2014 the intent, not met today. In a set, the group carries the message and announces it once, and the group error display is not designed yet. An isolated row recolors its own boundary but nests no message part, so the text that names the error is its host's.","1.4.11 Non-text Contrast / 2.4.13 Focus Appearance (control boundary and focus indicator)","3.3.7 Redundant Entry (repeated consents)"],keyboard:"Each checkbox is its OWN Tab stop and Space toggles \u2014 the key cross-control difference from Radio.Group, which is one Tab stop for the group with arrows moving within it. NEVER override Enter: Enter submits the enclosing form, and hijacking it breaks universal web behavior.",focus:":focus-visible ring on the CONTROL, offset, at least 3:1 \u2014 keyboard traversal only, not mouse or touch. The visual box stays tight while the interactive footprint is generous: the hit target is expanded by padding on the row WRAPPER (the icon-button parallel), so clicking the label or the surrounding space toggles. The target aims for at least 24x24, scaling to 44 (Apple) / 48 (Material) on touch. The label sits inline-end of the control, not above it.",aria:'Prefer the styled native input \u2014 `appearance: none` plus a pseudo-element or SVG keeps role, checked state and Space-to-toggle for free; a `role="checkbox"` div is a last resort and must reproduce aria-checked (true/false/mixed) exactly. Relying on the visual dash glyph alone to convey indeterminate is an accessibility failure. For a set, `role="group"` plus `aria-labelledby` is the default over `fieldset`/`legend` \u2014 both are valid, but fieldset has flexbox and grid quirks that make it hard to style predictably, and role=group on a div keeps the layout freedom while preserving the shared-label announcement. Group error and required associate to the GROUP and announce once; an individual row never owns its own required or error. When the control is nested in a host row, the host provides the accessible name through aria-labelledby \u2014 never double-label.'},content:{labelPattern:'A POSITIVE statement of what becomes true when checked \u2014 "Subscribe to newsletter", never "Do not send me emails", which a user has to mentally invert in order to uncheck. Sentence case, no terminal period for a terse single-sentence label; apply punctuation only for multi-sentence or legal labels. Abstract shared words up into the group label, so "Notification preferences" lets its rows read "Email", "SMS", "Push".',errorPattern:'Group-level for a set \u2014 "Select at least one option" \u2014 stating what is wrong and how to fix it (SC 3.3.3). An isolated row recolors its own boundary; inside a group the rows stay neutral and the group carries the message.'},docs:{usage:'Use a single Checkbox.Row for one independent opt-in (a consent line, "Remember me"), and a Checkbox.Group to select any number \u2014 zero to many \u2014 from a bounded set. Use the indeterminate state for a select-all broadcasting partial selection over a table or tree. Compose FieldMessage below exactly as TextField does; the host wires the ids and the aria-describedby chain. Past roughly 7-10 options, scanning and vertical space suffer and a filtering multi-select combobox (not built yet) is the better control.',do:["Make the whole row the hit target with padding on the wrapper \u2014 the visual box stays tight while the interactive footprint aims for 24x24 and beyond",'Set aria-checked="mixed" explicitly for indeterminate \u2014 the dash glyph alone conveys nothing to assistive tech',"Let the GROUP own required, validation and the value array; a row inside a group never manages its own error","Accept rich content in the label, so a consent line can carry the link it needs","Phrase the label positively, and state exactly what is being agreed to on a consent checkbox"],dont:["Pre-check a consent checkbox \u2014 a dark pattern, and for marketing consent often unlawful","Offer indeterminate as a third state a user can click to \u2014 it is hierarchy only, set programmatically","Pass `indeterminate` as a JSX prop and expect it to work \u2014 there is no such HTML attribute; set the DOM property through a ref","Override Enter to toggle \u2014 Enter submits the form, and that expectation is universal","Center-align the whole control+label row \u2014 on a wrapping label it floats the control to the middle of the paragraph; center the control within a single line-box instead, so it holds the first line","Reach for a checkbox where the change takes effect instantly \u2014 that is Switch.Row, and the difference is staged versus immediate"],contentGuidelines:'The label states what becomes true when checked. Group errors read "Select at least one option" rather than "Invalid". Consent labels name the thing agreed to in full.'},ai:{primaryPurpose:"Capture an independent binary choice that is staged into a form and submitted, with an associated label that doubles as the hit target and an optional indeterminate state for select-all hierarchy.",whenToUse:'A single opt-in (consent, "remember me", "include X"), or any-number-from-a-set selection where the change applies on save rather than instantly. The indeterminate state when a parent row summarizes a partially-selected set of children.',avoidWhen:"The change takes effect the instant it is toggled (Switch.Row \u2014 the boundary is staged versus immediate, and only Checkbox.Row has indeterminate), the options are mutually exclusive (Radio.Group \u2014 any-number versus exactly-one; a two-option exclusive choice is Radio.Group, never two checkboxes), the control is really an action with a pressed state in a dense toolbar (a toggle button with aria-pressed, not built yet), or the set runs past roughly 7-10 options (a filtering multi-select combobox or listbox, not built yet).",commonPartners:["checkbox-control","checkbox-group","field-label","field-message","focus-ring","button"],triggerKeywords:["checkbox","check box","tickbox","check","select all","consent","terms and conditions","opt in"],generationPriority:2},composition:{composesWith:["checkbox-control"],alternativeTo:["switch-row","radio-row"],replacesPatterns:['a bare <input type="checkbox"> with no label wiring','a role="checkbox" div where a styled native input would do'],supersededBy:[],planned:["form","toggle-button","combobox","listbox"]},motion:{enter:"None of the row's own (present on mount). On check, the nested Checkbox.Control draws its glyph and crossfades its fill, about 100-150ms.",exit:"None of the row's own. On uncheck, the nested control runs the same glyph transition back.",reduceMotion:"No layout motion. Under prefers-reduced-motion, the nested glyph flips instantly; a crossfade under 150ms may remain."},notes:{contested:['`alignment` (top/baseline vs center) is in brief \xA715\'s variants block and is NOT an axis here. The brief calls top/baseline "the non-negotiable default, not center", and a non-negotiable default with one admissible value is not an axis \u2014 it has no dimension. It is a layout rule for the anatomy block to encode. The alternative is to declare it and accept an axis of one, which `modifiers` already demonstrates the cost of (#845). #1201 REFINED how that rule is encoded without weakening it: the control+label ROW is still top-aligned (never centered \u2014 `test.ts` #1009 half-1 enforces it), but the control now sits in a `controlBox` exactly one label line-box tall and centers WITHIN that box, so a single-line label reads centered and a wrapping one keeps the control on the first line. That is the construction #1009 filed and could not build, unblocked by baking the line-box to a fixed px per rung (`control.size.*.line-box`) \u2014 the one thing a Figma variable can hold that `fontSize \xD7 ratio` is not.',"The group's `orientation` and `density` are in brief \xA715's variants block and are not here because they are `CheckboxGroup`'s axes, not this component's. The alternative is folding the group into this def, which is the monolithic decomposition the brief evaluates and rejects (\xA72).","BORDER AND FILL AT ONE COORDINATE \u2014 #1011's third finding, and the answer is NEITHER of the two the issue offered. The defect: a selected box named `fill.selected` for its fill and let its border fall through to `border.rest`, so two bindings that must AGREE about the box's boundary disagreed. Both resolved, both named tokens this def chose, and the box shipped with a visible seam \u2014 #802's class again, and the second on this component after #967's `role: 'target'` conflation. The issue asked whether this needs a new EXPRESSION or is PER-DEF CARE. It is a third thing. It needs no new expression: the grammar already says it, because an unbound slot returns `undefined` and paints nothing, so the ABSENCE of `unchecked.fill` IS the binding \"this coordinate has no fill\" \u2014 the fix was deleting seven keys, not adding a field. And per-def care is exactly what had already failed: the radio and switch defs of the time carried the identical pairing because they copied this def verbatim, which is per-def care performed correctly three times over one wrong premise. What was missing was neither vocabulary nor diligence but ENFORCEMENT, so the answer is a gate \u2014 `lint-paint.ts` arm 4, which measures whether a fill is self-bounding against the page (>= 3:1, SC 1.4.11) and fails a same-family border drawn beside one. It named all three defs in a single run before any of them was fixed. The measured fact underneath, which is why the rule generalizes rather than describing these three: `interactive.<intent>.fill.*` and `interactive.<intent>.border.*` were byte-identical at every rung they SHARE across the brands measured then (5 brands x 4 modes), and the border ladder has NO `selected` rung at all \u2014 so `fill.selected` beside `border.rest` was never two shades of one idea, it was a fill that moved and a border that could not follow. The asymmetry to keep in view: switch's OFF track KEEPS its rim, because no brand's neutral fill clears 3:1 (1.21-1.58:1 at rest) and the rim is that track's only edge \u2014 which is precisely why arm 4 asks about the FILL's contrast rather than comparing the two bindings to each other."],unverified:["THE CONTROL SQUARE IS NOW BOUND (#951 emitted `control.size.<rung>`, closing #900), and what is unverified moved with it rather than away. The square reads `control.size.<rung>.height` on both axes: 16/20/24 in all four shipped brands at comfortable density, which lands in the brief's stated 16-18px range at `md`, and 12/16/20 at COMPACT density (the `minimal-compact` fixture since aurora moved to comfortable, #1215), whose `sm` square is 12px. No compact checkbox has been built on a real host. Two things to check when one is: whether a 12px box reads as a checkbox at all, and \u2014 separately, because it is a different failure \u2014 that a 12px box does not become a 12px TARGET. SC 2.5.8 wants 24x24, and the row is what has to supply it; the square's own edge was never the target. The old form of this note read \"the box's edge is unexpressible today\" and the ladder it warned against is worth keeping: `icon.size.*` resolves, typechecks and passes every gate here, and is 16/20/24 in every shipped brand at every density, so binding to it would hold the control rigid against exactly the brand density `control.size.*` exists to move.","The unchecked box has no `pressed` binding. `color.field.border.*` emits `rest` and `hover` only, so a pressed unchecked box falls through to its rest border. Reaching into `color.interactive.neutral.border.pressed` for that one coordinate would put two families on one ladder, which is the inconsistency `lint-paint.ts` arm 1 exists to see in its axis-led form. The checked and indeterminate coordinates DO paint pressed, so the gap is asymmetric \u2014 worth knowing before anyone reads the pressed row as covered.",'`read-only` is declared and binds nothing (see `states`). The brief calls it "the awkward one" and recommends static text over a styled locked control, so there is no treatment to bind; a consumer choosing `aria-readonly` plus a prevented toggle has no token telling them what it should look like.',"The whole-row hit target \u2014 at least 24x24 (SC 2.5.8), 44 (Apple) / 48 (Material) on touch \u2014 is STILL not expressed, and the anatomy block landing is what makes that precise rather than resolving it. The row hugs its content on both axes, so its height is the taller of the square and the label's line box; `size.*.min-height` is a floor that `PartDef` has no field to state (it carries `height`, which is fixed, and binding a floor there would clip a consent label that wraps to two lines \u2014 the common case). So the keys stay bound for the code projection and the Figma row carries no floor at all. Measured on aurora at `small` while it was compact (before #1215, and before #1433b gave the row 12px of block padding): a 12px square beside `body.sm` at 14px on `line-height-role.normal` (1.5), so the row hugged to 21px \u2014 short of 24, and the square is not what closes the gap. `lint-hit-target` holds the default (medium) row's `min-height` to 44px on comfortable and spacious density; `small` is not measured, which is why `accessibility.wcag` states 2.5.8 as intent (#1698). Named in `anatomy.codeOnly` as well, where the projection can see it.","The check-glyph micro-motion (brief \xA78: an SVG stroke-dasharray draw at roughly 100-150ms, morphing dash to check) is stated in `checkbox-control`'s `motion`, and nothing checks it: `motion` is prose, and no token binding in either def points at the emitted `motion.duration-ms.*`."],evolution:["THE PAINT GRAMMAR IS AXIS-LED and the exemption is declared per-AXIS in `lint-paint.ts` (`NON_FAMILY_AXES`) rather than per-key. RESOLVED, not open \u2014 kept here because the rejected alternative is the instructive part. This def first shipped SLOT-led (`fill.checked`), which skips arm 1 by construction, since that rule only examines a key whose literal lead is an axis value: the same net coverage, none of the visibility, and exactly the shape the house rule forbids \u2014 a false positive is fixed by adding to the exemption list, never by narrowing a scan. The other alternative, axis-led with a `PROVENANCE_EXCEPTIONS` entry per binding, was costed at roughly four times `field-message`'s whole list for this one def; the axis-level entry replaces all twenty with one declaration that `radio-control` and `switch-control` inherit. What stays genuinely open is only the underlying fact, and it is a TOKEN-TIER claim anyone can check: the tier emits no `color.checked.*` family and should not grow one. If that stops being true, arm 1 should cover this axis and the exemption fails as no-longer-exercised, which is the direction it is checked in.","`checked`/`indeterminate` as a variant AXIS rather than as two `STATES` entries \u2014 and, since #1330, EXPOSED from the nested control rather than enumerated on the Row. The alternative (two states) is real and cheaper but wrong: `{state}` holds one value per coordinate, so `checked` x `hover` would not fail \u2014 it would fall back and paint the unchecked hover border. `selection` earns its axis in the shape a flat state property could not \u2014 the mark and the dash are two PARTS gated on it (`presentWhen`), not two paint treatments, so collapsing it into `state` would put a tick and a dash at one coordinate. What #1330 changed is WHERE the axis lives, not whether it is one: the atom (`checkbox-control`) carries the 3 selections x 3 sizes x 6 states = 54-member set, and the Row EXPOSES `selection` + `state` from it (projecting a size-only 3-member set) instead of re-enumerating the 54 it used to. The #761 reversal, owner-approved, QA-measured. Settled by evidence.","THE BOX'S CORNER \u2014 CLOSED by #1015, and the answer was engine surface after all. This entry ran for three revisions saying `radius.sm` was correct and needed no def change, and each revision was right about the fact it measured and wrong about the question. What it kept measuring: 2px is what four of five brands resolve, and aurora's 4px is its own `radiusScale: 2` lever working as designed. What it never asked: whether ONE corner value can be right for THREE box sizes. It cannot. `radius.sm` is a rung on the CARD ramp, and a card scales with the page while this box scales with the type \u2014 so the same 4px token is a fourteenth of aurora's card corner and a THIRD of its 12px `small` square. The proportion is the defect, not the value, which is why \"2px is correct\" and \"the binding is wrong\" were both true and the entry could not see it. Now `control.size.<rung>.radius` = `min(radius.sm, snap2(edge \xF7 8))`, a sibling of the `height` it is derived from, bound per rung. Prism 2's own controls sit at ~1/8 of their edge, which is where the ratio comes from; `min` is what makes the change non-destructive, because a bare ratio would round nb's 24px `large` corner UP from 2 to 4 and move four brands to fix one. Aurora moves 4 \u2192 2 at all three rungs and nothing else moves at all. The alternative this entry named \u2014 a dedicated control-radius RUNG on the radius ramp \u2014 was the shape rejected: a rung cannot see the box EDGE, so it would be a fourth name that still could not scale with the thing it corners. What is genuinely NOT fixed: the ratio and the 2px radius sub-grid cannot both hold on a 12px edge, so aurora's `small` lands at 0.167 rather than the 0.125 the ratio targets, and the sub-grid wins on purpose (a 1.5px corner is not a corner). The binding reaches the built NODE, pinned by a per-rung read-back in `apps/plugin/test-write-components.ts` that recomputes the clamp from the brand's own `radius.sm` and box edge rather than trusting the emitter \u2014 `radius/round` for radio stays asserted beside it, so \"checkbox only\" is enforced rather than intended.","`Checkbox.Control` IS A SEPARATE COMPONENT (`checkbox-control`, #1226 step 2) \u2014 the atom this Row nests. `checkbox-group` IS BUILT (#1347) \u2014 it nests this Row and owns the contract the brief specifies (\xA72): the value array, group-level required/validation, `orientation` \u2014 none of which is expressible from this Row, which is why the group is its own def rather than folded in. It is a three-def family decision: `radio-row` refines this decomposition with the group made mandatory, and `switch-row` with no group at all.","THE CHECK-GLYPH MOTION HAS A HOME. It was recorded here as having no expression because the schema had no motion field. The schema has `motion`; the draw is stated on `checkbox-control`, where the glyph is, and this Row's `motion` names the rest (#1698).",'Field POV (brief \xA713): styling the native input won over the `role=checkbox` div and the hidden-input hacks; the group became a first-class component owning the value array and validation; `role="group"` + `aria-labelledby` replaced `fieldset`/`legend`; the decomposition converged on a labeled row, a distinct group and an exposed atomic primitive \u2014 the shape this family is; and the `indeterminate` ref callback superseded `useLayoutEffect` for large lists.']}};var xa={id:"checkbox-group",name:"Checkbox.Group",aliases:["checkbox-set","checkboxes","checkbox-list","multiselect","checkbox-fieldset","choice-list"],category:"form",status:"draft",summary:"Labeled stack of Checkbox rows. Owns the value array, required and validation.",description:"A labeled set for selecting any number \u2014 zero to many \u2014 from a bounded list of options. A required section label (FieldLabel) above a vertical stack of Checkbox.Row options. Owns the contract a single row cannot: the value array, group-level required, and all validation, announced once for the group. Use for a small bounded multi-select; past roughly 7-10 options a filtering multi-select combobox (not built yet) scans better. Not exactly-one selection (Radio.Group), not a single independent opt-in (a lone Checkbox.Row), not an immediate-effect setting list (a list of Switch.Row).",props:[{name:"label",type:"string | node",required:!0,description:`The group heading, rendered as the nested FieldLabel and the group's accessible name (role="group" + aria-labelledby). Names the decision the set answers ("Notification preferences"), letting its rows read the abstracted-up short labels ("Email", "SMS", "Push").`},{name:"value",type:"string[]",required:!1,description:"The controlled array of checked option values. The GROUP owns it; each row's checked appearance is DERIVED (`checked = value.includes(row.value)`), never wired on the row. Pair with `onChange`; use `defaultValue` for the uncontrolled form."},{name:"defaultValue",type:"string[]",required:!1,description:"Uncontrolled initial selection. Never pre-check a consent option \u2014 a dark pattern, and for marketing consent often unlawful."},{name:"onChange",type:"(value: string[], event) => void",required:!1,description:"Fires with the NEW value array when any row toggles. The group dispatches it; a row never owns its own onChange inside a group."},{name:"required",type:"boolean",default:!1,required:!1,description:"Whether at least one option must be chosen. Off by default. Drives the nested FieldLabel's required marker and aria-required on the group. Group-level: an individual row never owns its own required. A form that marks the optional minority instead sets this false."},{name:"size",type:"enum: 'small' | 'medium' | 'large'",values:["small","medium","large"],default:"medium",required:!1,description:"Scales the group \u2014 the label's type and every row (control square, label ramp, gap) together, passed into the nested FieldLabel and rows by `follow`, so the group scales with the rest of the form."},{name:"name",type:"string",required:!1,description:"A shared control name so the set submits as one field and works uncontrolled in a native form."},{name:"disabled",type:"boolean",default:!1,required:!1,description:"Disables the whole set \u2014 every row and the label dim, driven by the group's context (the field's native disabled is the source of truth). Not projected as a Figma state; the group has no disabled treatment of its own."}],states:["rest"],variants:{size:["small","medium","large"]},axisKinds:{size:"authoring"},tokens:{gap:"space.0","pad-y":"space.100","pad-x":"space.0"},anatomy:{root:"container",parts:{container:{kind:"box",role:"target",layout:{direction:"column",align:"start",justify:"start",sizing:{x:"fill",y:"hug"}},gap:"gap",padding:{block:"pad-y",inlineLabel:"pad-x"},minWidth:320,children:["label","row1","row2","row3"]},label:{kind:"nest",nests:"field-label",nesting:{kind:"nest-fixed",variant:{size:"medium",emphasis:"secondary",weight:"bold",state:"rest"},follow:["size"]},crossAxisFill:!0,note:"The group heading and accessible name, composed rather than re-declared, configured secondary and bold, with its required marker following the group's `required`. Its size follows the group; a fix to FieldLabel reaches here without a copy. Fills the group's width, so a long heading wraps."},row1:{kind:"nest",nests:"checkbox-row",nesting:{kind:"nest-fixed",variant:{size:"medium"},follow:["size"]},crossAxisFill:!0,note:"The first Checkbox.Row \u2014 always present. Nests the labeled row (which nests the control), following the group's size. Fills the group's width. Its checked state is derived from the group's value a
