<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism3 concept C: Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Inter:wght@300..900&display=swap" rel="stylesheet">
<style>/* ---------- Recessive chrome: neutral, quiet, precise ---------- */
:root{
  --c-bg:#f6f6f5; --c-panel:#ffffff; --c-sunk:#efefee; --c-line:#dcdcda; --c-line-2:#c4c4c1;
  --c-ink:#1c1c1b; --c-ink-2:#555553; --c-ink-3:#6b6b68; /* 3 = 5.3:1 on white */
  --c-warn:#8a5a00; --c-warn-bg:#fdf6e7; --c-fail:#a1261c; --c-fail-bg:#fbeeed; --c-ok:#2c6b3a; --c-ok-bg:#edf6ef;
  --c-sel:#1c1c1b;
  --r-1:4px; --r-2:6px;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --brand-display:"Bricolage Grotesque",var(--f-ui);
  --brand-body:"Inter",var(--f-ui);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--f-ui);color:var(--c-ink);background:#e9e9e7}
button,input,select,textarea{font:inherit;color:inherit}
code,.code{font-family:var(--f-code);font-size:12px}
:focus-visible{outline:2px solid var(--c-sel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* prototype harness (outside the product) */
.harness{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:#2b2b2a;color:#f2f2f0;font-size:12px}
.harness strong{font-weight:600}
.harness .seg button{background:#3c3c3a;border:1px solid #555;color:#f2f2f0}
.harness .seg button[aria-pressed=true]{background:#f2f2f0;color:#1c1c1b}
.stage{height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;overflow:auto}
.frame{background:var(--c-bg);width:100%;height:100%;position:relative;overflow:hidden;box-shadow:0 0 0 1px #bdbdb9}
.frame.f-1280{width:1280px;height:900px;max-width:100%;max-height:100%}
.frame.f-min{width:380px;height:420px}
.frame.plugin-host::before{content:"Prism3";position:absolute;top:0;left:0;right:0;height:22px;padding:3px 8px;font-size:11px;background:#fff;border-bottom:1px solid var(--c-line);color:var(--c-ink-2);z-index:5}
.frame.plugin-host .app{top:22px}
.app{position:absolute;inset:0;container-type:inline-size;container-name:app;display:flex;flex-direction:column;background:var(--c-bg)}

/* controls */
.btn{min-height:28px;padding:4px 10px;border:1px solid var(--c-line-2);background:var(--c-panel);border-radius:var(--r-1);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--c-sunk)}
.btn.primary{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.btn.primary:hover{background:#3a3a38}
.btn.danger{background:var(--c-fail);color:#fff;border-color:var(--c-fail)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--c-sunk)}
.btn.sm{min-height:24px;padding:2px 8px;font-size:12px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border-radius:var(--r-1);overflow:hidden}
.seg button{min-height:26px;padding:2px 9px;border:1px solid var(--c-line-2);margin-left:-1px;background:var(--c-panel);cursor:pointer}
.seg button:first-child{margin-left:0;border-radius:var(--r-1) 0 0 var(--r-1)}
.seg button:last-child{border-radius:0 var(--r-1) var(--r-1) 0}
.seg button[aria-pressed=true]{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.seg button.locked{background:repeating-linear-gradient(135deg,#fff,#fff 4px,#f1f1ef 4px,#f1f1ef 8px)}
.seg button.locked[aria-pressed=true]{background:#555553;border-color:#555553}
select,input[type=text],input[type=number],textarea{min-height:28px;border:1px solid var(--c-line-2);border-radius:var(--r-1);background:#fff;padding:3px 6px}
input[type=range]{width:100%;min-height:24px;accent-color:var(--c-ink)}
input[type=color]{flex:none;min-width:28px;width:28px;height:28px;padding:0;border:1px solid var(--c-line-2);border-radius:var(--r-1);background:#fff}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--c-ink);margin:4px}
label.chk{display:inline-flex;align-items:center;gap:4px;min-height:24px;cursor:pointer}
.muted{color:var(--c-ink-2)}
.small{font-size:12px}
.h{font-weight:600;font-size:13px;margin:0}
.hr{border:0;border-top:1px solid var(--c-line);margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* status verdicts (UI term "pill" today; proposed label: verdict) */
.v{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;font-size:11.5px;border:1px solid transparent;white-space:nowrap}
.v.ok{background:var(--c-ok-bg);color:var(--c-ok);border-color:#cfe5d4}
.v.warn{background:var(--c-warn-bg);color:var(--c-warn);border-color:#f0dfb8}
.v.fail{background:var(--c-fail-bg);color:var(--c-fail);border-color:#f1cfcb}
.v.info{background:var(--c-sunk);color:var(--c-ink-2);border-color:var(--c-line)}
.v.busy{background:#fff;color:var(--c-ink);border-color:var(--c-line-2)}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;background:var(--c-sunk);color:var(--c-ink-2);border:1px solid var(--c-line);white-space:nowrap}
.tag.auto{background:#fff}
.tag.ovr{background:#fff;color:var(--c-ink);border-color:var(--c-ink)}
.tag.lock{background:repeating-linear-gradient(135deg,#fff,#fff 3px,#eeeeec 3px,#eeeeec 6px)}
.sw{display:inline-block;width:16px;height:16px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);vertical-align:middle;flex:none}
.sw.lg{width:28px;height:28px}

/* lever rows */
.lever{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 10px;padding:7px 0;border-bottom:1px solid #ededeb;align-items:start}
.lever .lab{display:flex;flex-direction:column;gap:2px}
.lever .lab b{font-weight:500}
.lever .desc{font-size:11.5px;color:var(--c-ink-3)}
.lever .ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.lever .meta{display:flex;gap:4px;flex-wrap:wrap}
.lever .stop{font-size:11.5px;color:var(--c-ink-2)}
.lever .why{font-size:11.5px;color:var(--c-ink-2);background:var(--c-sunk);padding:3px 6px;border-radius:3px}
@container app (max-width:600px){.lever{grid-template-columns:1fr}}

/* step picker */
.picker{border:1px solid var(--c-line-2);border-radius:var(--r-2);background:#fff;padding:8px;margin:6px 0}
.picker .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.picker .st{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px;border:1px solid var(--c-line);border-radius:3px;background:#fff;cursor:pointer;min-height:44px;font-size:11px;text-align:left}
.picker .st .chip{height:16px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.picker .st.below{color:var(--c-fail)}
.picker .st[aria-pressed=true]{outline:2px solid var(--c-ink);outline-offset:-1px}
.picker .st:hover{border-color:var(--c-ink)}
.picker .auto{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px dashed var(--c-line-2);border-radius:3px;width:100%;background:#fff;cursor:pointer;min-height:28px;text-align:left}

/* dialogs */
dialog{border:1px solid var(--c-line-2);border-radius:8px;padding:0;width:min(600px,94vw);max-height:90vh;color:var(--c-ink);box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(28,28,27,.35)}
dialog header,dialog footer{padding:12px 16px;display:flex;align-items:center;gap:8px}
dialog header{border-bottom:1px solid var(--c-line)}
dialog header h2{font-size:15px;margin:0;flex:1}
dialog footer{border-top:1px solid var(--c-line);justify-content:flex-end}
dialog .body{padding:14px 16px;overflow:auto;max-height:64vh}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.opt{border:1px solid var(--c-line-2);border-radius:var(--r-2);padding:10px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:64px}
.opt[aria-pressed=true]{outline:2px solid var(--c-ink);outline-offset:-1px}
.opt b{font-weight:600}
pre.sample{background:var(--c-sunk);padding:10px;border-radius:var(--r-1);overflow:auto;max-height:200px;font:11.5px/1.5 var(--f-code);margin:0}
.fieldset{border:0;padding:0;margin:0 0 10px}
.fieldset legend{font-weight:600;margin-bottom:4px;padding:0}
.err{color:var(--c-fail);font-size:12px}

/* banners and toasts */
.banner{display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:12.5px;border-bottom:1px solid}
.banner.fail{background:var(--c-fail-bg);color:var(--c-fail);border-color:#f1cfcb}
.banner.warn{background:var(--c-warn-bg);color:var(--c-warn);border-color:#f0dfb8}
.banner.info{background:#fff;color:var(--c-ink);border-color:var(--c-line)}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;z-index:50;max-width:90%}

/* tables */
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border-bottom:1px solid #ececea;padding:5px 6px;text-align:left;vertical-align:middle}
table.t th{font-weight:600;color:var(--c-ink-2);background:#fafaf9;position:sticky;top:0;z-index:1}
table.t tr.failrow td{background:#fdf5f4}
.scroll-x{overflow-x:auto}

/* figma results */
.fx{border:1px solid var(--c-line);border-radius:var(--r-2);background:#fff;margin-bottom:8px}
.fx summary{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;list-style:none;min-height:36px}
.fx summary::-webkit-details-marker{display:none}
.fx .fx-body{padding:0 10px 10px;font-size:12px}
.fx .fx-body li{margin:2px 0}
.bar{height:6px;background:var(--c-sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-ink)}
.log{font-size:12px;border-left:2px solid var(--c-line);padding-left:10px;margin:4px 0}
.log li{list-style:none;margin:5px 0}
.log ul{padding:0;margin:0}

/* specimens use only brand values (inline vars) */
.spec{font-family:var(--brand-body);color:var(--t1);background:var(--bg);border-radius:0;padding:24px;position:relative}
.spec [data-role],.spec [data-obj]{cursor:pointer;outline-offset:3px}
.spec .sel-mark{outline:2px dashed #1c1c1b!important;outline-offset:3px}
.spec .nav{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:22px}
.spec .logo{font-family:var(--brand-display);font-weight:700;font-size:18px;color:var(--tb)}
.spec .navlinks{display:flex;gap:14px;font-size:14px;color:var(--t2)}
.spec h1{font-family:var(--brand-display);font-weight:700;font-size:clamp(30px,4.6cqi,48px);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em;color:var(--t1);font-variation-settings:"wdth" 90}
.spec .lead{font-size:16px;color:var(--t2);max-width:52ch;margin:0 0 16px}
.spec a{color:var(--lk);text-decoration:underline}
.spec .btns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 26px}
.spec .b{min-height:44px;padding:0 20px;border-radius:var(--rad);font:600 15px var(--brand-body);border:1px solid transparent;display:inline-flex;align-items:center;gap:8px}
.spec .b.p{background:var(--if);color:var(--ion)}
.spec .b.n{background:var(--nf);color:var(--non)}
.spec .b.o{background:transparent;color:var(--if);border-color:var(--if)}
.spec .b.d{background:var(--dsf);color:var(--dst);}
.spec .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.spec .card{background:var(--card);border-radius:calc(var(--rad) * 1.5);padding:16px;box-shadow:var(--shadow)}
.spec .card h3{font-family:var(--brand-display);margin:0 0 6px;font-size:18px}
.spec .card p{margin:0 0 8px;font-size:14px;color:var(--t2)}
.spec .muted-brand{color:var(--tbm);font-size:13px;font-weight:600}
.spec .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sbg);color:var(--sfg)}
.spec .field{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:6px}
.spec .field span{color:var(--t2)}
.spec .field div{min-height:40px;border:1px solid var(--fb);border-radius:var(--rad);padding:9px 10px;color:var(--t3);background:transparent}
.spec .inv{margin-top:22px;background:var(--ibg);color:var(--it);padding:22px;border-radius:calc(var(--rad) * 1.5)}
.spec .inv h2{font-family:var(--brand-display);margin:0 0 6px;font-size:24px}
.spec .inv p{margin:0;opacity:1;color:var(--it2)}
.spec .fail-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#a1261c;box-shadow:0 0 0 2px #fff}

/* views */
.rampv{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));border-radius:4px;overflow:hidden}
.rampv div{height:34px;position:relative}
.rampv div.anc::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #1c1c1b}
.rampk{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));font-size:9.5px;color:var(--c-ink-3);text-align:center}
.checker{background:repeating-conic-gradient(#e6e6e4 0% 25%,#fff 0% 50%) 0/12px 12px}
.board{background:#fff;border:1px solid var(--c-line);border-radius:var(--r-2);margin-bottom:16px;overflow:hidden}
.board > header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--c-line);background:#fbfbfa}
.board > header h2{font-size:13px;margin:0;flex:1}
.board > .in{padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}

/* ---- Concept C: Workbench ---- */
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--c-line);min-height:56px;flex:none}
.modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.modesel{display:none;min-height:34px;border-radius:999px;padding:4px 12px}
.chip{min-height:32px;padding:4px 14px;border:1px solid var(--c-line-2);background:#fff;border-radius:999px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{border-color:var(--c-ink)}
.chip[aria-pressed=true]{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.chip.der{background:repeating-linear-gradient(135deg,#fff,#fff 4px,#f1f1ef 4px,#f1f1ef 8px)}
.chip.der[aria-pressed=true]{background:#555553;border-color:#555553;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c-ink);flex:none}
.dot.fail{background:var(--c-fail)}.dot.ok{background:var(--c-ok)}.dot.warn{background:var(--c-warn)}
.chip[aria-pressed=true] .dot{box-shadow:0 0 0 1.5px #fff}
.work{flex:1;display:grid;min-height:0;grid-template-columns:var(--lv,40%) minmax(0,1fr);position:relative}
.lvp{background:#fff;overflow:auto;min-width:0;border-right:1px solid var(--c-line)}
.pvp{display:flex;flex-direction:column;min-width:0;min-height:0}
.gutter{position:absolute;top:0;bottom:0;left:var(--lv);width:14px;margin-left:-7px;cursor:col-resize;z-index:6;touch-action:none}
.gutter::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:transparent}
.gutter:hover::after,.gutter:focus-visible::after{background:var(--c-ink)}
.navrow{position:sticky;top:0;z-index:4;background:#fff;padding:10px 24px 0;border-bottom:1px solid var(--c-line)}
.navrow .chips{display:flex;flex-wrap:wrap;gap:8px}
.in{padding:0 32px 72px}
.searchw{padding:22px 0 6px}
.searchw input{width:100%;min-height:40px;border-radius:10px;padding:8px 14px;border:1px solid var(--c-line-2)}
.dh{padding:22px 0 8px}
.dh h2{font-size:24px;margin:0 0 8px;letter-spacing:-.01em}
.dh p{margin:0;color:var(--c-ink-2);font-size:13.5px;max-width:46ch;line-height:1.55}
.note{margin:18px 0 0;padding:12px 14px;background:var(--c-sunk);border-radius:10px;font-size:12.5px;color:var(--c-ink-2);line-height:1.5}
.sc{margin-top:52px}
.sh{margin-bottom:26px}
.eyebrow{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-3);margin-bottom:6px}
.sh h3{font-size:16px;margin:0;font-weight:600}
.sh .note2{margin:8px 0 0;font-size:12.5px;color:var(--c-ink-2);max-width:48ch;line-height:1.5}
.lnk{border:0;background:none;padding:0;color:var(--c-ink);text-decoration:underline;cursor:pointer;font-size:inherit}
.lvp .lever{display:block;padding:0;border:0;margin:0 0 32px}
.lvp .lever:last-child{margin-bottom:0}
.lvp .lever .lab{gap:4px;margin-bottom:12px}
.lvp .lever .lab b{font-size:14px;font-weight:600}
.lvp .lever .desc{font-size:12.5px}
.lvp .lever .ctl{gap:12px}
.lvp .lever .meta{gap:8px;align-items:center}
.lvp .lever .meta:empty{display:none}
.lvp .lever.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:#efefee;box-shadow:0 0 0 10px #efefee}100%{background:transparent;box-shadow:0 0 0 10px transparent}}
.lvp select{min-height:40px;border-radius:10px;padding:6px 12px;width:100%}
.lvp input[type=text]{min-height:40px;border-radius:10px;padding:6px 12px;width:100%}
.lvp .row input[type=text]{width:auto;min-width:0;flex:1}
.lvp input[type=color]{width:40px;min-width:40px;height:40px;border-radius:10px}
.lvp .seg{display:flex;flex-wrap:wrap;gap:8px;overflow:visible}
.lvp .seg button{margin:0;border-radius:999px!important;min-height:34px;padding:4px 16px;font-size:13px}
.lvp .seg button[aria-pressed=true]{background:#efefee;color:var(--c-ink);border-color:var(--c-ink);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:2px 16px}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:6px 0;min-height:34px;font-size:14px;color:var(--c-ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--c-ink)}
.tab[aria-pressed=true]{color:var(--c-ink);border-bottom-color:var(--c-ink);font-weight:600}
.tabs.sm .tab{font-size:13px;min-height:30px}
.stat{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--c-ink-2);padding:6px 8px;border-radius:6px;min-height:34px}
.stat:hover{background:var(--c-sunk);color:var(--c-ink)}
.stat[aria-pressed=true]{color:var(--c-ink);font-weight:600;background:var(--c-sunk)}
.modes .seg button{min-height:32px;padding:3px 14px}
.modes .seg button.der{background:repeating-linear-gradient(135deg,#fff,#fff 4px,#f1f1ef 4px,#f1f1ef 8px)}
.modes .seg button.der[aria-pressed=true]{background:#555553;color:#fff}
.dl{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.lvp .row.wrap[role=group]{gap:8px}
.lvp .row.wrap[role=group] .btn{border-radius:999px;min-height:34px;padding:4px 16px;font-size:13px}
.lvp .row.wrap[role=group] .btn[aria-pressed=true]::before{content:"✓";margin-right:6px;font-weight:700}
.lvp .row.wrap[role=group] .btn[aria-pressed=true]{background:#efefee!important;color:var(--c-ink)!important;border-color:var(--c-ink);font-weight:600}
.lvp .row.wrap:has(input[data-act=modeon]){flex-direction:column;align-items:flex-start;gap:0}
.lvp label.chk:has(input[data-act=modeon]){min-height:34px;gap:8px;font-size:13.5px}
.lvp .why{padding:8px 12px;border-radius:8px;line-height:1.5}
.rst{border:0;background:none;color:var(--c-ink-2);text-decoration:underline;cursor:pointer;font-size:12px;padding:2px 0}

ACT.lvreset=t=>{const k=t.dataset.k,L=LV[k],pm=L.sc==='M'&&isCust(S.mode);const prev=pm?S.lvMode[S.mode][k]:S.lv[k];if(pm)delete S.lvMode[S.mode][k];else delete S.lv[k];record({kind:'lv',k,mode:pm?S.mode:null,prev,next:undefined,label:L.l});buildPalettes();renderAll();toast(`${L.l} reset to default`)};
ACT.golever=t=>{const k=t.dataset.k,L=LV[k],d=domOf(k);UC.q='';UC.domain=d;UC.last=d;UC.pane='settings';if(L.a)UC.adv[d]=true;UC.hl=null;if(UC.follow)UC.view=viewFor(k);renderAll();const el=scrollLvp(`.lvp [data-key="${k}"]`);if(el){el.classList.add('flash');const c=el.querySelector('input,select,button');c&&c.focus({preventScroll:true})}};
ACT.gorole=t=>{const id=t.dataset.role;UC.q='';UC.domain='color';UC.last='color';UC.pane='settings';UC.rf='all';UC.roleOpen=id;UC.hl=id;if(UC.follow)UC.view='specimen';renderAll();scrollLvp('#role-'+id.replace(/\./g,'_'))};
ACT.changes=()=>{UC.domain='health';UC.hopen.changes=true;renderAll()};
ACT.apply=()=>{UC.domain='file';UC.pane='settings';runApply()};
const _exb=ACT.export;ACT.exbrief=()=>{EX.tab='brief';openExport();$$('#dlg-export [data-act=extab]').forEach(b=>{const on=b.dataset.v==='brief';b.setAttribute('aria-pressed',on);b.setAttribute('aria-selected',on)})};
ACT.export=()=>{EX.tab='tokens';$$('#dlg-export [data-act=extab]').forEach(b=>{const on=b.dataset.v==='tokens';b.setAttribute('aria-pressed',on);b.setAttribute('aria-selected',on)});_exb()};
const _fr=ACT.frame;ACT.frame=t=>{UC.pane='settings';_fr(t)};

/* selecting a specimen element opens its role, or its domain */
function findRow(el){const r=el.closest('[data-role],[data-obj]');if(!r||!r.closest('#pvb'))return;
 if(r.dataset.role){ACT.gorole({dataset:{role:r.dataset.role}});return}
 const o=r.dataset.obj;UC.domain=o==='heading'?'type':o==='button'?'components':'shape';UC.last=UC.domain;UC.pane='settings';UC.q='';UC.hl=null;renderAll();const p=$('#lvp');if(p)p.scrollTop=0;toast(`${domLabel(UC.domain)} settings drive the ${o}`)}
document.addEventListener('click',e=>{if(e.target.closest('[data-act],select,input,label,button'))return;if(e.target.closest('#pvb .spec'))findRow(e.target)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('#pvb .spec')&&(e.target.dataset.role||e.target.dataset.obj)){e.preventDefault();findRow(e.target)}
 if(e.target.classList&&e.target.classList.contains('gutter')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const p=Math.max(28,Math.min(62,parseFloat(UC.split)+(e.key==='ArrowRight'?2:-2)));UC.split=p.toFixed(1)+'%';renderAll();const g=$('.gutter');g&&g.focus()}});
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.gutter');if(!g)return;e.preventDefault();const w=$('.work');
 const move=ev=>{const r=w.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width*100;p=Math.max(28,Math.min(62,p));UC.split=p.toFixed(1)+'%';w.style.setProperty('--lv',UC.split)};
 const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);renderAll()};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)});
document.addEventListener('input',e=>{if(e.target.id==='q'){UC.q=e.target.value;const r=$('#qres'),b=$('#dombody'),has=!!UC.q.trim();if(r){r.innerHTML=searchHTML();r.hidden=!has}if(b)b.hidden=has}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.actChange;
 if(a==='view'){UC.view=t.value;renderAll()}if(a==='modesel'){S.mode=t.value;UC.vfix=null;window._pk=null;renderAll()}if(a==='def'){S.fig.buildDef=t.value}});
/* preview follows the setting being edited */
function keyOf(el){const x=el.closest&&el.closest('[data-lv],[data-lvset],[data-lvhex],[data-lvhue]');if(!x)return null;return x.dataset.lv||x.dataset.lvset||'primary'}
function roleFor(k){return Object.keys(ROLE_LEVERS).find(id=>ROLE_LEVERS[id].includes(k))||null}
['input','change','click','focusin'].forEach(ev=>document.addEventListener(ev,e=>{const k=keyOf(e.target);if(!(k&&LV[k]))return;const v=viewFor(k),r=v==='specimen'?roleFor(k):null;
 if(v!==UC.view||(r&&r!==UC.hl&&ev!=='input')){UC.view=v;if(r)UC.hl=r;else if(v!=='specimen')UC.hl=null;renderPreview()}},true));

injectDialogs();wire();loadBrand('aurora');initFig();renderAll();
</script>
</body>
