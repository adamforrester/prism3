  padding: 0 var(--t-pad); border: 0; border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); background: var(--p3-bg-page);
  font-size: var(--p3-fs-12); cursor: pointer; text-align: left; color: var(--p3-text);
}
.strip .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .prog { flex: 0 0 var(--p3-l-strip-bar); }
.banner {
  flex: none; display: flex; gap: var(--p3-space-150); align-items: center; flex-wrap: wrap;
  padding: var(--p3-space-150) var(--t-pad); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1);
  background: var(--p3-fill-1); font-size: var(--p3-fs-14);
}
.banner .ico { color: var(--p3-bad-icon); }
.banner b { color: var(--p3-bad-text); }
.banner details summary { cursor: pointer; min-height: var(--p3-hit-min); display: inline-flex; align-items: center; color: var(--p3-text-2); }

/* ── Menus and popovers (non-modal) ────────────────────────────────────────────────────── */
.popwrap { position: relative; display: inline-flex; }
.pop {
  position: absolute; z-index: 40; top: calc(100% + var(--p3-space-050)); left: 0; min-width: var(--p3-l-menu);
  display: grid; padding: var(--p3-space-050); border-radius: var(--p3-radius-lg); background: var(--p3-bg-page);
  border: var(--p3-bw-hairline) solid var(--p3-line-2);
}
.pop.right { left: auto; right: 0; }
.pop .mi {
  display: flex; width: 100%; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-ctl-h-sm);
  padding: 0 var(--p3-space-150); border: 0; background: none; border-radius: var(--p3-radius-md); cursor: pointer; text-align: left; white-space: nowrap;
}
.pop .mi:hover { background: var(--p3-overlay-hover); }
.pop .mi[disabled] { color: var(--p3-text-2); cursor: not-allowed; }
.pop .mi[disabled]:hover { background: none; }
.pop .mi .k { margin-left: auto; font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.pop .mi .ck { visibility: hidden; }
.pop .mi[aria-checked="true"] { font-weight: var(--p3-fw-emphasis); }
.pop .mi[aria-checked="true"] .ck { visibility: visible; }
.pop hr { border: 0; border-top: var(--p3-bw-hairline) solid var(--p3-line-1); margin: var(--p3-space-050) 0; width: 100%; }
.pop .why { font-size: var(--p3-fs-12); color: var(--p3-text-2); padding: var(--p3-space-050) var(--p3-space-150); margin: 0; }
.pop .ph { font-size: var(--p3-fs-12); color: var(--p3-text-2); padding: var(--p3-space-100) var(--p3-space-150) var(--p3-space-050); margin: 0; }

/* ── Work area ─────────────────────────────────────────────────────────────────────────── */
.work { flex: 1; display: grid; min-height: 0; grid-template-columns: var(--lv, 42%) minmax(0, 1fr); position: relative; }
.lvp {
  background: var(--p3-levers-bg); min-width: 0; min-height: 0; display: flex; flex-direction: column;
  border-right: var(--p3-bw-hairline) solid var(--p3-line-1);
}
.pvp { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; background: var(--p3-bg-page); }
.gutter {
  position: absolute; top: 0; bottom: 0; left: var(--lv, 42%); width: var(--p3-hit-min);
  margin-left: calc(var(--p3-hit-min) / -2); cursor: col-resize; z-index: 6; touch-action: none; background: none; border: 0; padding: 0;
}
.gutter::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - var(--p3-bw-hairline)); width: var(--p3-bw-thick); background: transparent;
}
.gutter:hover::after, .gutter:focus-visible::after { background: var(--p3-ctl-edge); }
.gutter:focus-visible { outline: none; }

/* Domain tabs: text tabs with an underline indicator on one hairline (real tablist) */
.navrow { flex: none; padding: 0 var(--t-pad); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); background: var(--p3-levers-bg); }
.tabsw { position: relative; display: flex; align-items: stretch; }
.tabs { display: flex; gap: var(--p3-space-200); overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: inline-flex; align-items: center; min-height: var(--p3-bar-h); padding: 0; flex: none;
  border: 0; border-bottom: var(--p3-bw-thick) solid transparent; margin-bottom: calc(-1 * var(--p3-bw-hairline));
  background: none; color: var(--p3-text-2); cursor: pointer; white-space: nowrap;
  transition: color var(--t-dur) var(--p3-ease), border-color var(--t-dur) var(--p3-ease);
}
.tab:hover { color: var(--p3-text); }
.tab[aria-selected="true"] { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); border-bottom-color: var(--p3-text); }
.tab:focus-visible { outline: none; }
.tab:focus-visible::before {
  content: ""; position: absolute; inset: var(--p3-space-150) calc(-1 * var(--p3-space-075));
  border: var(--p3-focus-width) solid var(--p3-ctl-edge); border-radius: var(--p3-radius-md); pointer-events: none;
}
.tabcue { flex: none; display: flex; align-items: center; padding-left: var(--p3-space-100); background: var(--p3-levers-bg); }
.domrow { display: none; }
.lvbody { flex: 1; overflow: auto; min-height: 0; padding: var(--p3-space-300) var(--t-pad) var(--p3-space-500); scroll-padding-top: var(--p3-space-300); }
.search { position: relative; display: block; margin-bottom: var(--p3-space-300); }
.search input { width: 100%; padding-left: var(--p3-space-500); }
.search .ico { position: absolute; left: var(--p3-space-200); top: 50%; transform: translateY(-50%); color: var(--p3-icon-2); pointer-events: none; }
.dintro { margin: 0 0 var(--p3-space-400); color: var(--p3-text-2); }
/* V7, V8: each lever section is a white card on the gray levers panel (IA-2), a hairline edge, no shadow. */
.sec {
  display: grid; gap: var(--p3-space-300); scroll-margin-top: var(--p3-space-300); padding: var(--p3-space-300);
  background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-lg);
}
.sec + .sec, .advb > .sec:first-child { margin-top: var(--p3-space-200); }
.advrow, .nextrow { margin-top: var(--p3-space-300); }
.sec-h { display: grid; gap: var(--p3-space-050); margin: 0; }
.sec-h h3 { margin: 0; font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); line-height: var(--p3-lh-compact); }
.sec-h p { margin: 0; color: var(--p3-text-2); font-size: var(--p3-fs-14); line-height: var(--p3-lh-cozy); max-width: var(--p3-l-measure); }
.srchead { margin: var(--p3-space-400) 0 var(--p3-space-150); font-size: var(--p3-fs-12); color: var(--p3-text-2); font-weight: var(--p3-fw-emphasis); }

/* Lever rows: 8px from label to control, 24px between rows */
.lever { display: grid; gap: var(--p3-space-100); border: 0; padding: 0; margin: 0; min-width: 0; }
.lever > legend, .lever > .lab {
  display: flex; align-items: center; gap: var(--p3-space-050); min-height: var(--p3-hit-min); width: 100%; padding: 0;
  font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); color: var(--p3-text); line-height: var(--p3-lh-compact);
}
fieldset.lever > legend { margin-bottom: var(--p3-space-100); float: left; }
fieldset.lever > legend + * { clear: both; }
.lever .readout { margin-left: auto; color: var(--p3-text-2); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-default); font-variant-numeric: tabular-nums; }
.lever .ctl { display: grid; gap: var(--p3-space-100); min-width: 0; }
.lever .sub { font-size: var(--p3-fs-12); color: var(--p3-text-2); line-height: var(--p3-lh-cozy); }
.lever.refused { outline: var(--p3-bw-thick) solid var(--p3-bad-icon); outline-offset: var(--p3-space-150); border-radius: var(--p3-radius-lg); }
.lever .refmark { display: none; }
.lever.refused .refmark { display: flex; gap: var(--p3-space-100); color: var(--p3-bad-text); font-size: var(--p3-fs-12); }
.lever.refused .refmark .ico { color: var(--p3-bad-icon); }
.lever.hl { outline: var(--p3-bw-thick) solid var(--p3-ctl-edge); outline-offset: var(--p3-space-150); border-radius: var(--p3-radius-lg); }
.info {
  flex: none; display: inline-grid; place-items: center; width: var(--p3-hit-min); height: var(--p3-hit-min); padding: 0;
  border: 0; border-radius: var(--p3-radius-md); background: transparent; color: var(--p3-icon-2); cursor: pointer;
}
.info:hover, .info[aria-expanded="true"] { background: var(--p3-overlay-hover); color: var(--p3-icon); }
.tip {
  margin: 0; padding: var(--p3-space-150) var(--p3-space-200); border-radius: var(--p3-radius-lg); background: var(--p3-fill-1);
  color: var(--p3-text); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-default); line-height: var(--p3-lh-cozy); width: 100%;
}
.note { display: flex; gap: var(--p3-space-100); align-items: flex-start; margin: 0; font-size: var(--p3-fs-12); line-height: var(--p3-lh-cozy); color: var(--p3-text); }
.note .ico { color: var(--p3-warn-icon); margin-top: var(--p3-space-025); }
.note.hint { color: var(--p3-text-2); }
.note.hint .ico { color: var(--p3-icon-2); }
.note.bad .ico { color: var(--p3-bad-icon); }

/* Chips: a native radio group. Selected keeps the rest fill; the edge goes from 1px field edge to 2px in
   the neutral control edge, the label to 500, and a check appears, so it is never edge alone. */
.chips { display: flex; flex-wrap: wrap; gap: var(--p3-space-100); border: 0; margin: 0; padding: 0; min-width: 0; }
.chip {
  position: relative; flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: var(--p3-space-075);
  min-height: var(--p3-ctl-h); padding: 0 calc(var(--p3-space-200) - var(--p3-bw-hairline)); border-radius: var(--p3-radius-lg);
  border: var(--p3-bw-hairline) solid var(--t-edge); background: var(--p3-bg-page); cursor: pointer; white-space: nowrap;
  transition: border-color var(--t-dur) var(--p3-ease);
}
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.chip .ck { display: none; }
.chip:hover { border-color: var(--p3-field-edge-hover); }
.chip:has(:checked) {
  border: var(--p3-bw-thick) solid var(--p3-ctl-edge); padding: 0 calc(var(--p3-space-200) - var(--p3-bw-thick));
  font-weight: var(--p3-fw-emphasis);
}
.chip:has(:checked) .ck { display: block; }
.chip:has(:focus-visible) { outline: var(--p3-focus-width) solid var(--p3-ctl-edge); outline-offset: var(--p3-focus-offset); }
.chip:has(:disabled) { cursor: not-allowed; color: var(--p3-text-2); border-style: dashed; }
.chip:has(:disabled) input { cursor: not-allowed; }
.chips.sm .chip { min-height: var(--p3-ctl-h-xs); font-size: var(--p3-fs-12); padding: 0 calc(var(--p3-space-150) - var(--p3-bw-hairline)); }
.chips.sm .chip:has(:checked) { padding: 0 calc(var(--p3-space-150) - var(--p3-bw-thick)); }
.chips.fit .chip { flex: 0 0 auto; }

/* Segmented control: a tinted track with no outline; the selected segment lifts to the page surface with
   an edge that clears 3:1 against the track. Concentric corners: 6 = 4 + the 2px inset. */
.seg { display: flex; border: 0; margin: 0; padding: var(--p3-space-025); gap: var(--p3-space-025); min-width: 0; background: var(--p3-fill-1); border-radius: var(--p3-radius-lg); }
.seg > label, .seg > button {
  position: relative; flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--p3-space-075);
  min-height: calc(var(--p3-ctl-h-sm) - 2 * var(--p3-space-025)); padding: 0 var(--p3-space-150); border-radius: var(--p3-radius-md);
  color: var(--p3-text-2); cursor: pointer; border: var(--p3-bw-hairline) solid transparent; white-space: nowrap; background: none;
  font-size: inherit; transition: background-color var(--t-dur) var(--p3-ease), color var(--t-dur) var(--p3-ease);
}
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.seg > label:hover, .seg > button:hover { color: var(--p3-text); }
.seg > label:has(:checked), .seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] {
  background: var(--p3-bg-page); color: var(--p3-text); border-color: var(--t-edge); font-weight: var(--p3-fw-emphasis);
}
.seg > label:has(:focus-visible) { outline: var(--p3-focus-width) solid var(--p3-ctl-edge); outline-offset: var(--p3-focus-offset); z-index: 1; }
.seg > button:focus-visible { z-index: 1; }
.seg.sm > label, .seg.sm > button { min-height: calc(var(--p3-ctl-h-xs) - 2 * var(--p3-space-025)); font-size: var(--p3-fs-12); padding: 0 var(--p3-space-100); }
.seg > button.der:not([aria-pressed="true"]) { background-image: var(--hatch); }

/* Slider with named stops: a thin rail, the filled part in the text color, a page-colored thumb */
.slider { display: grid; gap: var(--p3-space-050); }
.slider input[type="range"] { appearance: none; -webkit-appearance: none; width: 100%; height: var(--p3-hit-min); margin: 0; background: transparent; cursor: pointer; }
.slider input::-webkit-slider-runnable-track {
  height: var(--p3-space-050); border-radius: var(--p3-radius-pill);
  background: linear-gradient(to right, var(--p3-icon) var(--pct), var(--p3-line-2) var(--pct));
}
.slider input::-moz-range-track { height: var(--p3-space-050); background: var(--p3-line-2); border-radius: var(--p3-radius-pill); }
.slider input::-moz-range-progress { height: var(--p3-space-050); background: var(--p3-icon); border-radius: var(--p3-radius-pill); }
.slider input::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: var(--p3-thumb); height: var(--p3-thumb); border-radius: var(--p3-radius-pill);
  background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-field-edge-hover);
  margin-top: calc((var(--p3-space-050) - var(--p3-thumb)) / 2); transition: border-color var(--t-dur) var(--p3-ease);
}
.slider input:hover::-webkit-slider-thumb { border-color: var(--p3-ctl-edge); }
.slider input::-moz-range-thumb { width: var(--p3-thumb); height: var(--p3-thumb); border-radius: var(--p3-radius-pill); background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-field-edge-hover); }
.slider input:focus-visible { outline: none; }
.slider input:focus-visible::-webkit-slider-thumb { outline: var(--p3-focus-width) solid var(--p3-ctl-edge); outline-offset: var(--p3-focus-offset); }
.ticks { position: relative; height: calc(var(--p3-fs-12) * 2); font-size: var(--p3-fs-12); color: var(--p3-text-2); margin: 0 calc(var(--p3-thumb) / 2); }
.ticks span { position: absolute; left: var(--at); transform: translateX(-50%); white-space: nowrap; }
.ticks span.first { transform: translateX(calc(-1 * var(--p3-thumb) / 2)); }
.ticks span.last { transform: translateX(calc(-100% + var(--p3-thumb) / 2)); }
.ticks span.on { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); }

/* Switch: off is an outlined track with a gray knob; on is the inverse-filled track */
.switch { display: inline-flex; align-items: center; gap: var(--p3-space-150); position: relative; min-height: var(--p3-ctl-h-xs); cursor: pointer; }
.switch .track {
  position: relative; width: var(--p3-track-w); height: var(--p3-track-h); border-radius: var(--p3-radius-pill);
  border: var(--p3-bw-hairline) solid var(--t-edge); background: var(--p3-bg-page); flex: none;
  transition: background-color var(--t-dur) var(--p3-ease), border-color var(--t-dur) var(--p3-ease);
  pointer-events: none; /* v5 finding: the drawn track sat over its input and swallowed every click */
}
.switch .knob {
  position: absolute; top: calc(var(--p3-thumb-inset) - var(--p3-bw-hairline)); left: calc(var(--p3-thumb-inset) - var(--p3-bw-hairline));
  width: var(--p3-thumb); height: var(--p3-thumb); border-radius: var(--p3-radius-pill); background: var(--p3-icon-2);
  transition: transform var(--t-dur) var(--p3-ease);
}
.switch input { position: absolute; left: 0; top: 50%; transform: translateY(-50%); opacity: 0; margin: 0; cursor: pointer; width: var(--p3-track-w); height: var(--p3-track-h); }
.switch:has(:checked) .track { background: var(--p3-inv-bg); border-color: var(--p3-inv-bg); }
.switch:has(:checked) .knob { background: var(--p3-inv-text); transform: translateX(calc(var(--p3-track-w) - var(--p3-thumb) - 2 * var(--p3-thumb-inset))); }
.switch:has(:focus-visible) .track { outline: var(--p3-focus-width) solid var(--p3-ctl-edge); outline-offset: var(--p3-focus-offset); }

/* Per mode disclosure: the body is an inset group */
.pm { display: grid; }
.pmh {
  justify-self: start; display: inline-flex; align-items: center; gap: var(--p3-space-050); min-height: var(--p3-hit-min);
  padding: 0 var(--p3-space-050) 0 0; border: 0; background: none; cursor: pointer; color: var(--p3-text-2); font-size: var(--p3-fs-12); border-radius: var(--p3-radius-md);
}
.pmh:hover { color: var(--p3-text); }
.pmh b { color: var(--p3-text); }
.pmh .ico { transition: transform var(--t-dur) var(--p3-ease); }
.pmh[aria-expanded="true"] .ico { transform: rotate(90deg); }
.pmb { display: grid; gap: var(--p3-space-200); margin-top: var(--p3-space-100); padding: var(--p3-space-200); border-radius: var(--p3-radius-lg); background: var(--p3-fill-1); font-size: var(--p3-fs-12); }
.pmr { display: grid; grid-template-columns: var(--p3-l-pm-label) minmax(0, 1fr); gap: var(--p3-space-150); align-items: start; }
.pmr .mn { display: grid; gap: var(--p3-space-050); justify-items: start; font-weight: var(--p3-fw-emphasis); padding-top: var(--p3-space-050); }
.pmr .body { display: grid; gap: var(--p3-space-100); min-width: 0; }
.pmr .auto { color: var(--p3-text-2); }
.pmr.der { color: var(--p3-text-2); }
.pmnote { margin: 0; color: var(--p3-text-2); }
.lvp[data-w="slim"] .pmr { grid-template-columns: minmax(0, 1fr); }

/* List editors */
.le { display: grid; gap: var(--p3-space-100); }
.le .it { display: flex; gap: var(--p3-space-100); align-items: center; flex-wrap: wrap; min-width: 0; }
.le .it > input[type="text"] { flex: 1 1 var(--p3-l-num); min-width: 0; }
.le .it .nm { min-width: var(--p3-l-pm-label); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-l-field-col), 1fr)); gap: var(--p3-space-150) var(--p3-space-200); }
.group { display: grid; gap: var(--p3-space-150); padding: var(--p3-space-200); border-radius: var(--p3-radius-lg); border: var(--p3-bw-hairline) solid var(--p3-line-1); }
.group-h { display: flex; align-items: center; gap: var(--p3-space-100); flex-wrap: wrap; }

/* Tables */
.tscroll { overflow: auto; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--p3-fs-12); }
table.t th, table.t td {
  text-align: left; vertical-align: middle; padding: var(--p3-space-100) var(--p3-space-200) var(--p3-space-100) 0;
  border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); font-weight: var(--p3-fw-default);
}
table.t thead th { color: var(--p3-text-2); font-weight: var(--p3-fw-emphasis); white-space: nowrap; position: sticky; top: 0; background: var(--p3-bg-page); z-index: 1; }
table.t tbody th { font-weight: var(--p3-fw-emphasis); }
table.t td.fail { color: var(--p3-bad-text); }
table.t .ico { display: inline-block; vertical-align: middle; }

/* Role × mode matrix: scrolls both ways, role column and header row pinned (Q1) */
.mxwrap { overflow: auto; max-height: var(--p3-l-matrix-h); border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-lg); }
.mx { border-collapse: separate; border-spacing: 0; font-size: var(--p3-fs-12); min-width: 100%; }
.mx th, .mx td { padding: var(--p3-space-050) var(--p3-space-100); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); text-align: left; vertical-align: middle; background: var(--p3-bg-page); }
.mx thead th { position: sticky; top: 0; z-index: 2; font-weight: var(--p3-fw-emphasis); color: var(--p3-text-2); white-space: nowrap; padding-top: var(--p3-space-100); padding-bottom: var(--p3-space-100); }
.mx .rn { position: sticky; left: 0; z-index: 1; font-family: var(--p3-font-mono); font-weight: var(--p3-fw-default); white-space: nowrap; color: var(--p3-text); border-right: var(--p3-bw-hairline) solid var(--p3-line-1); }
.mx thead th:first-child { left: 0; z-index: 3; border-right: var(--p3-bw-hairline) solid var(--p3-line-1); }
.mx th.der, .mx td.der { background-image: var(--hatch); }
.mx thead th.cur { color: var(--p3-text); box-sizing: border-box; border-bottom: var(--p3-bw-thick) solid var(--p3-text); }
.mx thead th .sub { display: block; font-weight: var(--p3-fw-default); }
.famh td { padding: 0 !important; }

/* ── Preview pane ──────────────────────────────────────────────────────────────────────── */

.pvp:not([data-w="wide"]) .rampg > li:nth-child(10n + 1) .c { border-radius: var(--p3-radius-lg) 0 0 var(--p3-radius-lg); }

.cont { display: grid; gap: var(--p3-space-100); padding: var(--p3-space-150); border-radius: var(--p3-radius-lg); background: var(--p3-fill-1); }

  display: flex; align-items: center; gap: var(--p3-space-100); width: 100%; min-height: var(--p3-ctl-h-sm); padding: 0;

.panelbox { display: grid; gap: var(--p3-space-200); padding: var(--p3-space-200) 0; }
.panelbox h3 { margin: 0; font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); display: flex; align-items: center; gap: var(--p3-space-100); }
.optgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-l-opt), 1fr)); gap: var(--p3-space-200) var(--p3-space-300); }
.optgrid fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--p3-space-075); min-width: 0; }
.optgrid legend { font-weight: var(--p3-fw-emphasis); font-size: var(--p3-fs-12); padding: 0; margin-bottom: var(--p3-space-075); }

/* ── Dialogs ───────────────────────────────────────────────────────────────────────────── */
dialog {
  padding: 0; width: min(var(--p3-l-dialog), var(--p3-l-dialog-vw)); max-height: var(--p3-l-dialog-vh); color: var(--p3-text); background: var(--p3-bg-page);
  border: var(--p3-bw-hairline) solid var(--p3-line-2); border-radius: var(--p3-radius-lg); font-size: var(--p3-fs-14);
}
dialog::backdrop { background: var(--p3-overlay-pressed); }
dialog .dh2 { display: flex; align-items: center; gap: var(--p3-space-100); padding: var(--p3-space-200) var(--p3-space-300); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
dialog .dh2 h2 { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); margin: 0; flex: 1; }
dialog .dbody2 { padding: var(--p3-space-300); overflow: auto; max-height: var(--p3-l-dbody-vh); display: grid; gap: var(--p3-space-200); }
dialog .dbody2 p, dialog .dbody2 ul { margin: 0; }
dialog .dbody2 h3 { font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); margin: 0; }
dialog .dfoot { display: flex; justify-content: flex-end; align-items: center; gap: var(--p3-space-100); padding: var(--p3-space-200) var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); background: var(--p3-bg-page); flex-wrap: wrap; }
dialog.full { position: fixed; margin: 0; max-height: none; max-width: none; border-radius: 0; flex-direction: column; }
dialog.full[open] { display: flex; }
dialog.full .dbody2 { flex: 1; max-height: none; }
dialog.full .dfoot { position: sticky; bottom: 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-l-opt), 1fr)); gap: var(--p3-space-150); }
.opt {
  display: grid; gap: var(--p3-space-050); align-content: start; min-height: calc(var(--p3-ctl-h) * 2); padding: var(--p3-space-200);
  border: var(--p3-bw-hairline) solid var(--t-edge); border-radius: var(--p3-radius-lg); background: var(--p3-bg-page); text-align: left; cursor: pointer;
}
.opt:hover { border-color: var(--p3-field-edge-hover); background-image: linear-gradient(var(--p3-overlay-hover), var(--p3-overlay-hover)); }
.opt small { color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.opt b { display: flex; align-items: center; gap: var(--p3-space-100); }
.err { color: var(--p3-bad-text); font-size: var(--p3-fs-12); }
.dtabs { display: flex; gap: var(--p3-space-300); border-bottom: var(--p3-bw-hairline) solid var(--p3-line-1); }
.dtabs .tab { min-height: var(--p3-ctl-h-md); }
pre.sample { background: var(--p3-fill-1); padding: var(--p3-space-150) var(--p3-space-200); border-radius: var(--p3-radius-lg); overflow: auto; max-height: var(--p3-l-pick); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-normal); margin: 0; }
.toast {
  position: absolute; left: 50%; bottom: calc(var(--p3-ctl-h-md) + var(--p3-space-200)); transform: translateX(-50%); z-index: 50; max-width: 90%;
  display: flex; gap: var(--p3-space-100); align-items: center; padding: var(--p3-space-150) var(--p3-space-200);
  background: var(--p3-bg-page); border: var(--p3-bw-hairline) solid var(--p3-line-2); border-radius: var(--p3-radius-lg); font-size: var(--p3-fs-14);
}

/* ── v6 ─────────────────────────────────────────────────────────────────────────────── */
/* IA-1: the Color sub-pages, a secondary segmented tab row under the domain tabs. Its track is the top
   bar's step, so it reads on the gray panel in both themes; the selected segment's edge is measured
   against that track (B1: the bar edge). */
.subnav { display: flex; padding: var(--p3-space-150) 0; }
.subnav .seg { flex: 1 1 auto; background: var(--p3-bar-bg); --t-edge: var(--p3-edge-bar); }
.subnav .seg > button { min-height: calc(var(--p3-ctl-h) - 2 * var(--p3-space-025)); color: var(--p3-text); }
/* Secondary text is 4.17:1 on the dark bar step, so the sub-page labels stay primary; the selected one
   is told apart by its white fill, its edge and its weight, never by color alone. */
.subnav .seg > button:focus-visible { outline: var(--p3-focus-width) solid var(--p3-ctl-edge); outline-offset: var(--p3-focus-offset); }
.advb { display: block; }
.addrow {
  display: flex; align-items: center; justify-content: center; gap: var(--p3-space-100); width: 100%; min-height: var(--p3-ctl-h);
  padding: 0 var(--p3-space-200); border: var(--p3-bw-hairline) dashed var(--t-edge); border-radius: var(--p3-radius-lg);
  background: transparent; color: var(--p3-text); font-weight: var(--p3-fw-emphasis); cursor: pointer;
}
.addrow:hover { border-color: var(--p3-field-edge-hover); background: var(--p3-overlay-hover); }
.addrow .ico { color: var(--p3-icon-2); }
.addrow.inline { width: auto; justify-content: flex-start; }
.idrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--p3-space-200); align-items: start; }
.idrow input[type="text"] { width: 100%; }
.bcrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-100); align-items: center; }
.tokchip {
  display: inline-flex; align-items: center; min-height: var(--p3-space-300); padding: 0 var(--p3-space-100);
  border: var(--p3-bw-hairline) solid var(--p3-line-1); border-radius: var(--p3-radius-md); background: var(--p3-bg-page);
  font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); color: var(--p3-text-2); white-space: nowrap;
}
.rolechip { display: inline-flex; align-items: center; gap: var(--p3-space-075); min-height: var(--p3-space-300); padding: 0 var(--p3-space-100); border-radius: var(--p3-radius-pill); background: var(--p3-fill-1); font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); white-space: nowrap; }
.rolechip i { display: block; width: var(--p3-dot); height: var(--p3-dot); border-radius: var(--p3-radius-pill); }
.badge {
  display: inline-flex; align-items: center; gap: var(--p3-space-050); min-height: var(--p3-hit-min); padding: 0 var(--p3-space-100) 0 var(--p3-space-150);
  border-radius: var(--p3-radius-pill); background: var(--p3-fill-1); color: var(--p3-text); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.badge .ico { color: var(--p3-ok-icon); width: var(--p3-space-150); height: var(--p3-space-150); }
.badge.bad { color: var(--p3-bad-text); }
.badge.bad .ico { color: var(--p3-bad-icon); }
.badge.none .ico { color: var(--p3-icon-2); }
.eyebrow { margin: 0; font-size: var(--p3-fs-12); font-weight: var(--p3-fw-emphasis); color: var(--p3-text-2); text-transform: uppercase; letter-spacing: var(--p3-ls-wide); }

/* V7: palettes as large squares with room to breathe (the current studio's ramp, 5.png) */
.pal { display: grid; gap: var(--p3-space-200); min-width: 0; }
.pal + .pal { padding-top: var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.palh { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--p3-space-200); align-items: center; }
.palh .hero { width: var(--p3-l-hero-sw); height: var(--p3-l-hero-sw); border-radius: var(--p3-radius-lg); outline: var(--p3-bw-hairline) solid var(--p3-overlay-hover); outline-offset: calc(-1 * var(--p3-bw-hairline)); }
.palh .nm { display: grid; gap: var(--p3-space-075); min-width: 0; }
.palh .nm b { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); line-height: var(--p3-lh-compact); }
.palh .meta { display: flex; flex-wrap: wrap; gap: var(--p3-space-075) var(--p3-space-100); align-items: center; }
.palh .meta .hx { font-family: var(--p3-font-mono); font-size: var(--p3-fs-14); color: var(--p3-text); }
.palh .anc { display: grid; justify-items: end; gap: var(--p3-space-050); }
.ancpill { display: inline-flex; align-items: center; gap: var(--p3-space-075); min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150); border-radius: var(--p3-radius-lg); background: var(--p3-fill-1); font-family: var(--p3-font-mono); font-size: var(--p3-fs-14); font-weight: var(--p3-fw-emphasis); }
.sqrow { display: grid; gap: var(--p3-space-100); }
.sqs {
  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border-radius: var(--p3-radius-lg); overflow: hidden;
  outline: var(--p3-bw-hairline) solid var(--p3-overlay-hover); outline-offset: calc(-1 * var(--p3-bw-hairline));
}
.sqs i { display: block; aspect-ratio: 1; position: relative; }
.sqs i.anc { outline: var(--p3-bw-thick) solid var(--p3-text); outline-offset: calc(-1 * var(--p3-bw-thick)); z-index: 1; }
.sqk { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); line-height: var(--p3-lh-compact); }
.sqk li { display: grid; gap: var(--p3-space-025); padding: 0 var(--p3-space-050); min-width: 0; overflow: hidden; }
.sqk b { color: var(--p3-text); font-weight: var(--p3-fw-emphasis); }
.sqk span { color: var(--p3-text-2); }
.sqk .anc-k b { font-weight: var(--p3-fw-strong); }
.pal .sqrow + .sqrow { margin-top: var(--p3-space-100); }
.pvp[data-w="slim"] .sqs, .pvp[data-w="slim"] .sqk { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pvp[data-w="slim"] .sqk { row-gap: var(--p3-space-100); }
.pvp[data-w="slim"] .palh { grid-template-columns: auto minmax(0, 1fr); }
.pvp[data-w="slim"] .palh .anc { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; align-items: center; justify-content: start; }

/* V8: rows with a swatch, a name and token, and a big live sample (6.png, 9.png) */
.srow { display: grid; grid-template-columns: var(--p3-l-row-sw) minmax(0, 1fr) minmax(0, var(--p3-l-sample)); gap: var(--p3-space-150) var(--p3-space-300); align-items: start; }
.srow + .srow { padding-top: var(--p3-space-250); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.srow .sw40 { width: var(--p3-l-row-sw); height: var(--p3-l-row-sw); border-radius: var(--p3-radius-lg); outline: var(--p3-bw-hairline) solid var(--p3-overlay-hover); outline-offset: calc(-1 * var(--p3-bw-hairline)); }
.srow .nm { display: grid; gap: var(--p3-space-075); min-width: 0; justify-items: start; }
.srow .nm b { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); line-height: var(--p3-lh-compact); }
.srow .nm .st { font-size: var(--p3-fs-14); color: var(--p3-text-2); }
.sbox { display: grid; gap: var(--p3-space-100); justify-items: end; min-width: 0; }
.sample {
  display: flex; align-items: center; width: 100%; min-height: var(--p3-l-sample-h); padding: 0 var(--p3-space-250); border-radius: var(--p3-radius-lg);
  font-size: var(--p3-fs-16); font-weight: var(--p3-fw-emphasis); border: var(--p3-bw-hairline) solid transparent;
}
.pvp[data-w="slim"] .srow { grid-template-columns: var(--p3-l-row-sw) minmax(0, 1fr); }
.pvp[data-w="slim"] .srow .sbox { grid-column: 1 / -1; justify-items: stretch; }
.pvp[data-w="slim"] .srow .sbox .badge { justify-self: end; }

/* V8: gradients span their container at a large size (7.png) */
.grad { display: grid; gap: var(--p3-space-150); }
.grad + .grad { padding-top: var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.gradh { display: flex; align-items: center; gap: var(--p3-space-100) var(--p3-space-150); flex-wrap: wrap; }
.gradh b { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); }
.gfield { height: var(--p3-l-grad-h); border-radius: var(--p3-radius-lg); }
.gstops { display: flex; flex-wrap: wrap; gap: var(--p3-space-100) var(--p3-space-250); }
.gstop { display: inline-flex; align-items: center; gap: var(--p3-space-075); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.gstop i { display: block; width: var(--p3-space-250); height: var(--p3-space-250); border-radius: var(--p3-radius-md); }
.gedit { display: grid; gap: var(--p3-space-200); }
.gedit + .gedit { padding-top: var(--p3-space-300); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.gedit .gtop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-100); align-items: center; }
.gedit .gbar2 { height: var(--p3-l-bp-band); border-radius: var(--p3-radius-lg); }
.gedit .gset { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-l-cell), 1fr)); gap: var(--p3-space-200); align-items: end; }
.gstoprow { display: grid; grid-template-columns: var(--p3-ctl-h-sm) minmax(0, 1fr) minmax(0, 1fr) var(--p3-l-hero-sw) auto; gap: var(--p3-space-100); align-items: center; }
.gstoprow > i { display: block; width: var(--p3-ctl-h-sm); height: var(--p3-ctl-h-sm); border-radius: var(--p3-radius-lg); }
.gstoprow input[type="number"] { width: 100%; padding: 0 var(--p3-space-100); }
.lvp[data-w="slim"] .gstoprow { grid-template-columns: var(--p3-ctl-h-sm) minmax(0, 1fr) minmax(0, 1fr) auto; }
.lvp[data-w="slim"] .gstoprow input[type="number"] { display: none; }

/* Foreground fills in the levers: a row per fill, the picker opens under it */
.fillrow { display: grid; grid-template-columns: var(--p3-ctl-h-sm) minmax(0, 1fr) minmax(0, auto); gap: var(--p3-space-150); align-items: center; }
.fillrow > .sw { width: var(--p3-ctl-h-sm); height: var(--p3-ctl-h-sm); border-radius: var(--p3-radius-lg); }
.fillrow .nm { display: grid; min-width: 0; }
.fillrow .nm b { font-weight: var(--p3-fw-emphasis); }
.fillrow .nm span { font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); color: var(--p3-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickbtn {
  display: inline-flex; align-items: center; gap: var(--p3-space-100); min-height: var(--p3-ctl-h); padding: 0 var(--p3-space-150) 0 var(--p3-space-200);
  border: var(--p3-bw-hairline) solid var(--t-edge); border-radius: var(--p3-radius-lg); background: var(--p3-bg-page); cursor: pointer; white-space: nowrap; min-width: 0;
}
.pickbtn:hover { border-color: var(--p3-field-edge-hover); }
.pickbtn[aria-expanded="true"] { border: var(--p3-bw-thick) solid var(--p3-ctl-edge); padding: 0 calc(var(--p3-space-150) - var(--p3-bw-hairline)) 0 calc(var(--p3-space-200) - var(--p3-bw-hairline)); }
.pickbtn .ico { color: var(--p3-icon-2); }
.pickbtn small { color: var(--p3-text-2); font-size: var(--p3-fs-12); }
.lvp[data-w="slim"] .fillrow { grid-template-columns: var(--p3-ctl-h-sm) minmax(0, 1fr); }
.lvp[data-w="slim"] .fillrow .pickbtn { grid-column: 1 / -1; }

/* Interactive: a row per column, live states on the right */
.irow { display: grid; grid-template-columns: minmax(0, var(--p3-l-cell)) minmax(0, 1fr); gap: var(--p3-space-150) var(--p3-space-300); align-items: start; }
.irow + .irow { padding-top: var(--p3-space-250); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.irow .nm { display: grid; gap: var(--p3-space-075); justify-items: start; }
.irow .nm b { font-size: var(--p3-fs-16); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); }
.ispecw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--p3-space-200); align-items: center; min-width: 0; }
.ibadges { display: grid; gap: var(--p3-space-050); justify-items: start; }
.pvp:not([data-w="wide"]) .ispecw { grid-template-columns: minmax(0, 1fr); }
.pvp:not([data-w="wide"]) .ibadges { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p3-space-100) var(--p3-space-150); }
.pvp[data-w="slim"] .irow { grid-template-columns: minmax(0, 1fr); }
.linkst { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p3-l-cell), 1fr)); gap: var(--p3-space-150); }
.linkst > div { display: grid; gap: var(--p3-space-100); justify-items: start; font-size: var(--p3-fs-12); min-width: 0; }
.linkst > div > .lsample { justify-self: stretch; }

/* V4: Depth & motion, one preview, two sections under clear headers */
.vsec { display: grid; gap: var(--p3-space-200); }
.vsec + .vsec { margin-top: var(--p3-space-300); padding-top: var(--p3-space-400); border-top: var(--p3-bw-hairline) solid var(--p3-line-1); }
.vsec > h3 { margin: 0; font-size: var(--p3-fs-20); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); line-height: var(--p3-lh-compact); }
.vsec > p { margin: 0; color: var(--p3-text-2); max-width: var(--p3-l-measure); }

/* V11: layout bands (the bands themselves are brand content, [data-content]) */
.bprow { display: grid; grid-template-columns: var(--p3-l-bp) minmax(0, 1fr); gap: var(--p3-space-200); align-items: center; }
.bprow + .bprow { margin-top: var(--p3-space-200); }
.bprow .lab { display: grid; gap: var(--p3-space-025); font-size: var(--p3-fs-12); }
.bprow .lab b { font-size: var(--p3-fs-14); }
.ruler { display: grid; gap: var(--p3-space-100); }
.ruler .ticks2 { position: relative; height: var(--p3-space-300); font-family: var(--p3-font-mono); font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.ruler .ticks2 span { position: absolute; left: var(--at); transform: translateX(-50%); white-space: nowrap; }
.ruler .ticks2 span.first { transform: none; }

/* Preview header: the Roles toggle is the title (V2): two text tabs, the view's name and Roles */
.pvtabs { display: flex; gap: var(--p3-space-300); align-self: stretch; }
.pvtabs .tab { min-height: var(--p3-bar-h); font-size: var(--p3-fs-20); font-weight: var(--p3-fw-strong); letter-spacing: var(--p3-ls-snug); }
.pvtabs .tab[aria-selected="false"] { font-weight: var(--p3-fw-default); }
.pvsub { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--p3-fs-12); color: var(--p3-text-2); }
.app[data-w="narrow"] .pvtabs { gap: var(--p3-space-200); }
.app[data-w="narrow"] .pvtabs .tab, .app[data-w="narrow"] .pvtitle h2 { font-size: var(--p3-fs-16); }
.app[data-w="narrow"] .pvh-r1 > .popwrap .btn { padding: 0 var(--p3-space-100); }
.app[data-w="narrow"] .pvsub { display: none; }
.sec-h .hrow { display: flex; align-items: center; gap: var(--p3-space-050); }

/* IA-3: the Agent chip in the plugin's top bar, and its popover */
.agentchip {
  display: inline-flex; align-items: center; gap: var(--p3-space-075); min-height: var(--p3-ctl-h-sm); padding: 0 var(--p3-space-150) 0 var(--p3-space-100);
  border: var(--p3-bw-hairline) solid var(--t-edge); border-radius: var(--p3-radius-pill); background: var(--p3-bg-page); cursor: pointer; white-space: nowrap; font-weight: var(--p3-fw-emphasis);
}
.agentchip:hover { border-color: var(--p3-ctl-edge); }
.agentchip .ico { color: var(--p3-icon-2); }
.agentchip .adot { display: block; width: var(--p3-dot); height: var(--p3-dot); border-radius: var(--p3-radius-pill); border: var(--p3-bw-hairline) solid var(--p3-icon-2); }
.agentchip[data-on="true"] .adot { background: var(--p3-ok-icon); border-color: var(--p3-ok-icon); }

<script>
'use strict';
/* =====================================================================================
   Concept v6 app. Vanilla JS over the real engine (window.P3, bundled by build-v6.mjs).
   Every resolved value on screen comes from brandTheme / resolveAllModes / resolvePreview /
   buildTree run on the current input. Figma operations are simulated (see concept-v6.md).
   v6 over v5 (decisions-2026-09-30-v5-review.md): Color has sub-pages (IA-1), each tab or sub-page
   has one preview and it changes only when the page does (V1, V12), the Color sub-pages carry a
   Roles toggle with the editable matrix (V2), the chrome is layered (IA-2) with edges near 3:1 (B1),

function lever(key, inner, { fieldset = false, forId, readout = '', state = '', pm = '', label, tipExtra = '', keys, id } = {}) {
  const L = LEV[key];
  const lab = label || (L ? L.label : key);
  const desc = (L ? L.description : '') + tipExtra;
  if (BARE && BARE.key === key) {
    const ks = keys || [key]; const refused = S.refusal && ks.some((k) => S.refusal.key === k || String(S.refusal.key).startsWith(k + '.'));
    const tag = fieldset ? 'fieldset' : 'div';
    return `<${tag} class="lever${refused ? ' refused' : ''}" id="${id || 'lv-' + slug(key)}" data-keys="${esc(ks.join(' '))}" aria-labelledby="${BARE.hid}">${readout ? `<div class="lab"><span class="readout" id="ro-${slug(key)}">${readout}</span></div>` : ''}<div class="ctl">${inner}</div>${state}${pm}<p class="refmark" role="note">${gl('error')}<span>Refused. The preview keeps the last valid theme.</span></p></${tag}>`;
  }
  const ks = keys || [key];
  const refused = S.refusal && ks.some((k) => S.refusal.key === k || String(S.refusal.key).startsWith(k + '.'));
  const tip = desc ? `<p class="tip" id="tip-${slug(key)}"${S.tipOpen === key ? '' : ' hidden'}>${esc(desc)}</p>` : '';
  const info = desc ? infoBtn(key, lab) : '';
  const ro = readout ? `<span class="readout" id="ro-${slug(key)}">${readout}</span>` : '';
  const head = fieldset
    ? `<legend><span class="lname">${esc(lab)}</span>${info}${ro}</legend>`
    : `<div class="lab">${forId ? `<label for="${forId}">${esc(lab)}</label>` : `<span>${esc(lab)}</span>`}${info}${ro}</div>`;
  const tag = fieldset ? 'fieldset' : 'div';
  return `<${tag} class="lever${refused ? ' refused' : ''}" id="${id || 'lv-' + slug(key)}" data-keys="${esc(ks.join(' '))}">${head}${tip}<div class="ctl">${inner}</div>${state}${pm}<p class="refmark" role="note">${gl('error')}<span>Refused. The preview keeps the last valid theme.</span></p></${tag}>`;
}
const sent = (m) => (/[.?]$/.test(m.trim()) ? m.trim() : m.trim() + '.');
/** An inline state line: a warning by default, a quiet hint with `info`. */

/* ---------------- Per mode disclosure (model B) ---------------- */
function perMode(key, { keys, row, surfaces = false, note = '' }) {
  const ks = keys || [key];
  const ms = modesOn().filter((m) => m !== 'light' && (!surfaces || m === 'dark' || isDerived(m)));
  const n = ks.length ? ovCount(ks) : 0;
  const open = !!S.pmOpen[key];
  const id = `pm-${slug(key)}`;
  const rows = ms.map((m) => {
    if (isDerived(m)) {
      if (surfaces && m !== 'hc-dark' && m !== 'hc-light') return '';
      const st = R.st.per[m];
      return `<div class="pmr der"><div class="mn">${esc(mLabel(m))}<span class="tag der">Derived</span></div><div class="body"><span>Follows ${esc(follows(m))}. No settings of its own.</span>${vPill(st.f ? 'fail' : 'ok', st.f ? `${st.f} of ${st.n} below floor` : `All ${st.n} pairs at or above floor`)}</div></div>`;
    }
    return `<div class="pmr"><div class="mn">${esc(mLabel(m))}<span class="tag">${kindTag(m)}</span></div><div class="body">${row(m)}</div></div>`;
  }).join('');
  const body = ms.length ? rows : `<p class="pmnote">Only light is on. Turn on another mode in Brand › Modes to set values per mode.</p>`;
  return `<div class="pm"><button type="button" class="pmh" id="${id}" aria-expanded="${open}" aria-controls="${id}-b" data-act="pm" data-key="${esc(key)}">${gl('chevr')}Per mode · <b>${n ? plural(n, 'override') : 'follows base'}</b></button><div class="pmb" id="${id}-b"${open ? '' : ' hidden'}>${note ? `<p class="pmnote">${note}</p>` : ''}${body}</div></div>`;
}

const resetLink = (k, m, lever) => `<button type="button" class="lnk muted" data-act="reset" data-k="${esc(k)}" data-m="${esc(m)}" data-lever="${esc(lever)}">Reset to ${esc(follows(m))}</button>`;

const libraryFaces = () => {

  for (const b of Object.values(P3.examples)) for (const [g, v] of Object.entries(b.typography?.families || {})) if (typeof v === 'string') set.add(v);
  return [...set];
};

  const missing = faces.filter((f) => !fontInstalled(f));
  return missing.length ? `<p class="markers">${missing.map((f) => `<span class="nf">${gl('warn')}${esc(f)}: not installed, showing fallback</span>`).join('')}</p>` : '';
}

const VIEW_FN = {
  guide(m) {
    const r = R.mr[m].roles; const I = S.surface === 'inverse' ? 'inverse.' : '';
    const sw = (role, label, drive = '') => { const x = r[role]; return x ? `<button type="button" class="swb" data-role="${role}" data-act="specsel" data-mode="${m}"${drive ? ` data-drive="${drive}"` : ''}><i style="background:${paintOf(x)}"></i>${esc(label)}<span>${x.hex}</span></button>` : ''; };
    const cards = [['In stock', 'Item title', 'Short description in one or two lines.', '$48.00'], ['In stock', 'Second item', 'Supporting text sits in the secondary tier.', '$72.00'], ['In stock', 'Third item', 'Descriptions stay short and plain.', '$19.00']];
    const sel = S.sel && S.sel.mode === m ? (() => { const x = r[S.sel.role]; if (!x) return ''; return `<div class="callout" role="status"><span class="sw" data-content style="background:${x.hex}"></span><b class="mono">${esc(S.sel.role)}</b><span>${esc(stepLabel(x.path))}</span><span class="muted">${gated(x) ? `${fmtR(x.ratio)} against ${esc(x.against)} (floor ${fmtMin(x.min)})` : 'No contrast floor on this role.'}</span><span class="grow"></span><button type="button" class="btn sm" data-act="editrole" data-role="${esc(S.sel.role)}" data-mode="${m}" id="sel-edit">Edit role</button><button type="button" class="btn sm ghost" data-act="specclose" id="sel-close">Close</button></div>`; })() : '';
    const invBand = S.surface === 'page' ? `<div class="spec band" data-content data-drive="inverse" style="${specVars(m, 'inverse')}"><p class="sech">Inverse band</p><div class="btns"><span class="b p" data-role="inverse.interactive.primary.fill.rest">Primary on inverse</span><span class="b o" data-role="inverse.interactive.primary.text.rest">Outline on inverse</span><a data-role="inverse.text.link.default">A link on the inverse band</a></div></div>` : '';
    return `${faceMarkers(m)}<div class="spec" data-content style="${specVars(m, S.surface)}" data-drive="surface">
      <p class="eyb" data-role="${I}text.brand">Collection</p>
      <h1 data-role="${I}text.primary">Product name set in the display face</h1>
      <p class="lead" data-role="${I}text.secondary">Supporting copy sits in the body face at the secondary text tier.</p>
      <div class="btns">
        <span class="b p" data-role="${I}interactive.primary.fill.rest" data-drive="action">${icon('plus')}Add to cart</span>
        <span class="b o" data-role="${I}interactive.primary.text.rest" data-drive="action">Save for later</span>
        <span class="b n" data-role="${I}interactive.neutral.fill.rest" data-drive="neutral">Compare</span>
        <span class="b d" data-role="${I}interactive.destructive.fill.rest" data-drive="action">Remove</span>
        <span class="b x" data-role="${I}disabled.on-fill" data-drive="disabled" aria-disabled="true">Unavailable</span>
      </div>
      <p><a data-role="${I}text.link.default" data-drive="link">View all details</a> <span style="color:var(--t3)" data-role="${I}text.tertiary">· Ships in 3 to 5 days</span></p>
      <div class="scards">${cards.map(([b, h, p, pr]) => `<div class="scard" data-role="${S.surface === 'page' ? '' : I}background.${S.surface === 'page' ? 'secondary' : 'primary'}"><div class="media" data-role="${I}background.tertiary"></div><span class="badge" data-role="${I}text.success">${b}</span><h3 data-role="${I}text.primary">${h}</h3><p data-role="${I}text.secondary">${p}</p><span class="price">${pr}</span></div>`).join('')}</div>
      <div class="sfield"><span class="lb">Email address</span><div class="inp" data-role="${I}field.placeholder">name@example.com</div><span class="msg" data-role="${I}text.secondary">Used for order updates only.</span></div>
      <p class="sech">Backgrounds</p><div class="swrow" data-drive="surface">${sw(I + 'background.primary', 'primary')}${sw(I + 'background.secondary', 'secondary')}${sw(I + 'background.tertiary', 'tertiary')}</div>
      <p class="sech">Foregrounds</p><div class="swrow">${['brand', 'success', 'warning', 'danger', 'info'].map((k) => sw(I + 'foreground.' + k, k)).join('')}</div>
      <p class="sech">Text</p><div class="swrow">${['primary', 'secondary', 'tertiary', 'brand', 'danger'].map((k) => sw(I + 'text.' + k, k)).join('')}</div>
      <p class="sech">Borders</p><div class="swrow">${['primary', 'secondary', 'brand', 'focus'].map((k) => sw(I + 'border.' + k, k)).join('')}</div>
      <p class="sech">Icons</p><div class="icons" data-drive="icon">${[['heart', 'primary'], ['bell', 'secondary'], ['star', 'tertiary'], ['check', 'success'], ['alert', 'danger']].map(([n, k]) => r[I + 'icon.' + k] ? `<button type="button" class="ic" data-role="${I}icon.${k}" data-act="specsel" data-mode="${m}" aria-label="icon.${k}">${icon(ICONS[n] ? n : 'arrow', r[I + 'icon.' + k].hex)}</button>` : '').join('')}</div>
      <p class="sech">Disabled</p><div class="swrow" data-drive="disabled">${sw(I + 'disabled.fill', 'fill', 'disabled')}${sw(I + 'disabled.on-fill', 'on-fill', 'disabled')}${sw(I + 'disabled.text', 'text', 'disabled')}</div>
      <p class="sech">Interactive</p><div class="swrow" data-drive="action">${['rest', 'hover', 'pressed'].map((st) => sw(`${I}interactive.primary.fill.${st}`, `fill ${st}`)).join('')}${sw(I + 'interactive.primary.on-fill', 'on-fill')}${sw(I + 'text.link.default', 'link', 'link')}</div>
    </div>${invBand}${sel}`;
  },

  palettes() {
    const roleByPal = {}; for (const [role, pal] of Object.entries(R.t.roleToPalette)) (roleByPal[pal] ||= []).push(role);
    const brandNames = ['primary', ...(S.input.brandColors || []).map((b) => b.name)];
    // Ten squares a row; five in a slim preview, so each strip keeps its labels directly under it.
    const per = $('#pvp').dataset.w === 'slim' ? 5 : 10;
    const chunks = (a) => Array.from({ length: Math.ceil(a.length / per) }, (_, i) => a.slice(i * per, i * per + per));
    const block = (p) => {
      const roles = roleByPal[p.palette] || [];
      const anc = roles.length ? R.t.roleAnchorStep[roles.includes('brand') ? 'brand' : roles[0]] : (brandNames.includes(p.palette) ? 500 : null);
      const a = p.steps.find((s) => s.num === anc) || p.steps[10];
      const drives = roles.length ? `<span class="rolechip"><i data-content style="background:${a.hex}"></i>drives ${esc(roles.join(', '))}</span>` : '<span class="rolechip">decorative</span>';
      return `<div class="pal"><div class="palh"><span class="hero" data-content style="background:${a.hex}"></span><div class="nm"><b>${esc(p.palette === 'primary' ? 'Primary' : p.palette)}</b><div class="meta"><span class="hx">${a.hex}</span><span class="tokchip">palette.${esc(p.palette)}</span>${drives}</div></div>${anc ? `<div class="anc"><span class="eyebrow">Anchor</span><span class="ancpill">◆ ${String(anc).padStart(3, '0')}</span></div>` : ''}</div>
        ${chunks(p.steps).map((half) => `<div class="sqrow"><div class="sqs" aria-hidden="true">${half.map((st) => `<i class="${st.num === anc ? 'anc' : ''}" data-content style="background:${st.hex}"></i>`).join('')}</div><ol class="sqk" aria-label="${esc(p.palette)} ramp, steps ${half[0].key} to ${half[half.length - 1].key}">${half.map((st) => `<li${st.num === anc ? ' class="anc-k"' : ''}><b>${st.num === anc ? '◆ ' : ''}${st.key}</b><span>${st.hex.slice(1)}</span>${st.num === anc ? '<span class="sr"> (anchor)</span>' : ''}</li>`).join('')}</ol></div>`).join('')}</div>`;
    };
    const pals = R.t.palettes;
    const brand = pals.filter((p) => brandNames.includes(p.palette));
    const neutral = pals.filter((p) => p.palette === 'neutral');
    const status = pals.filter((p) => ['success', 'warning', 'danger', 'info'].includes(p.palette));
    const rest = pals.filter((p) => !brand.includes(p) && !neutral.includes(p) && !status.includes(p));
    const tr = treeOf().core.palette; const op = treeOf().opacity; const ink = R.mr.light.roles['text.primary'].hex;
    const alpha = ['black-alpha', 'white-alpha'].map((n) => tr[n] ? `<div class="ramp"><h4>${n}</h4><ol class="rampg" style="--n:${Object.keys(tr[n]).length}">${Object.entries(tr[n]).map(([k, v]) => `<li><div class="c checker"><div class="fillin" data-content style="background:${v.$value}"></div></div><div class="k"><b>${k}%</b></div></li>`).join('')}</ol></div>` : '').join('');
    const opac = `<div class="ramp"><h4>opacity <span class="small muted">text.primary at each step</span></h4><ol class="rampg" style="--n:${Object.keys(op).length}">${Object.entries(op).map(([k, v]) => `<li><div class="c checker"><div class="fillin" data-content style="background:${ink};opacity:${v.$value}"></div></div><div class="k"><b>${k}</b><span class="hx">${v.$value}</span></div></li>`).join('')}</ol></div>`;
    return board('Brand palettes', brand.map(block).join('') + rest.map(block).join(''), '', 'Each brand color grown into a 20-step ramp. Your color is pinned as the anchor, never shifted.')
      + board('Neutral', neutral.map(block).join(''), '', `Hue ${Math.round(R.t.palettes.find((p) => p.palette === 'neutral').steps[10].oklch.h)}°${S.input.neutral?.auto ? ', following primary' : ''}. Text, borders and surfaces draw from it.`)
      + board('Status palettes', status.map(block).join(''), '', 'Success, warning, danger and info. Auto reuses a brand color when its hue fits, or makes one.')
      + board('Alpha and opacity', alpha + opac, '', 'On a checkerboard, so the alpha shows.');
  },

  // Surfaces & fills (V8): backgrounds with a live sample chip per row (6.png), fills with a big live
  // fill and a contrast badge (9.png), gradients across their container at a large size (7.png).
  surfaces(m) {
    const r = R.mr[m].roles;
    const bgRow = (role, name, inv) => { const x = r[role]; if (!x) return ''; const ink = r[inv ? 'inverse.text.primary' : 'text.primary']; const bd = r[inv ? 'inverse.border.primary' : 'border.primary']; return `<div class="srow" data-drive="surface"><span class="sw40" data-content style="background:${paintOf(x)}"></span><div class="nm"><b>${esc(name)}</b>${tokOf(role)}<span class="st">${anchoredRole(role, m) ? 'Set' : 'Auto'} · ${esc(stepLabel(x.path))}</span></div><div class="sbox"><div class="sample" data-content style="background:${paintOf(x)};color:${ink.hex};border-color:${bd.hex}">${esc(name)}</div>${ratioBadge(cr(ink.hex, x.hex), 4.5)}</div></div>`; };
    const backgrounds = [['background.primary', 'Primary background'], ['background.secondary', 'Secondary background'], ['background.tertiary', 'Tertiary background']].map(([k, n]) => bgRow(k, n)).join('')
      + [['inverse.background.primary', 'Inverse background'], ['inverse.background.secondary', 'Inverse secondary']].map(([k, n]) => bgRow(k, n, true)).join('');
    const fills = FILLS.map(([k, l]) => { const role = `foreground.${k}`; const x = r[role]; if (!x) return ''; const on = r[`text.on-${k}`]; const ov = S.input.overrides?.[m]?.[role]; return `<div class="srow" data-drive="fill"><span class="sw40" data-content style="background:${x.hex}"></span><div class="nm"><b>${esc(l)}</b>${tokOf(role)}<span class="st">${isDerived(m) ? 'Derived' : ov ? 'Override' : 'Auto'} · ${esc(stepLabel(x.path))}</span></div><div class="sbox"><div class="sample" data-content style="background:${x.hex};color:${on ? on.hex : '#ffffff'}">${esc(l)} fill</div>${badge(x)}</div></div>`; }).join('');
    const gl2 = R.t.gradient.gradients || [];
    const grads = gl2.length ? gl2.map((x) => `<div class="grad" data-drive="gradient"><div class="gradh"><b>${esc(x.name)}</b><span class="tokchip">gradient.${esc(x.name)}</span><span class="small muted">${x.kind === 'radial' ? `radial, ${x.shape}` : `linear, ${x.angle}°`} · ${x.interpolation === 'srgb' ? 'sRGB' : 'OKLCH'}</span></div><div class="gfield" data-content style="background:${gradCss(x)}"></div><div class="gstops">${x.stops.map((st) => `<span class="gstop"><i data-content style="background:${st.hex}"></i>${esc(stepLabel(st.aliasOf))} · ${Math.round(st.position * 100)}%</span>`).join('')}<span class="gstop">text on it: ${fmtR(x.worstOnWhite)} white, ${fmtR(x.worstOnBlack)} black (worst point)</span></div></div>`).join('') : '<p class="hint">Gradients are off. Turn them on in the Gradients section to emit gradient tokens.</p>';
    return board('Backgrounds', backgrounds, '', `The surfaces ${esc((FULL_MODE_LABEL[m] || m).toLowerCase())} mode paints on, and the inverse band. Each sample carries the primary text for that surface, measured against it.`)
      + board('Foreground fills', fills, '', 'The bold fills for badges, indicators and brand accents, measured against the contrast floor surface.')
      + board('Gradients', grads, '', 'Stop colors alias palette steps, so a gradient follows the brand when its colors move.');
  },

  // Interactive: every interactive column in its states, links in their states, icons and disabled.
  interactive(m) {
    const r = R.mr[m].roles; const rad = ctlRadius(m); const bm = btnMetrics('medium', m); const face = faceOf('label', m).css;
    const cols = [...new Set(Object.keys(r).filter((k) => /^interactive\.[a-z0-9-]+\.fill\.rest$/.test(k)).map((k) => k.split('.')[1]))];
    const btn = (col, st, outline) => { const f = r[`interactive.${col}.fill.${st}`], on = r[`interactive.${col}.on-fill`], tx = r[`interactive.${col}.text.${st}`] || r[`interactive.${col}.text.rest`], bd = r[`interactive.${col}.border.${st}`] || r[`interactive.${col}.border.rest`]; if (!f) return ''; return outline ? `<span class="ib" style="height:${bm.h}px;padding:0 ${bm.padX}px;border-radius:${rad}px;font-family:${esc(face)};color:${tx?.hex};border-color:${bd?.hex};background:transparent">${st[0].toUpperCase() + st.slice(1)}</span>` : `<span class="ib" style="height:${bm.h}px;padding:0 ${bm.padX}px;border-radius:${rad}px;font-family:${esc(face)};background:${paintOf(f)};color:${on?.hex}">${st[0].toUpperCase() + st.slice(1)}</span>`; };
    const states = ['rest', 'hover', 'pressed'];
    // Every specimen sits on the brand's own page for the previewed mode, never on the chrome's card:
    // in dark chrome a light-mode outline or link would otherwise be drawn on the wrong surface.
    const page = r['background.primary'].hex, edge = r['border.primary'].hex, t2 = r['text.secondary'].hex;
    const surf = `background:${page};border-color:${edge};color:${t2}`;
    const col = (c) => { const on = r[`interactive.${c}.on-fill`]; const pal = c === 'primary' ? R.t.roleToPalette.action : c === 'destructive' ? R.t.roleToPalette.danger : c === 'neutral' ? 'neutral' : ((S.input.interactivePalettes || []).find((x) => (x.name || x.palette) === c)?.palette || c); return `<div class="irow" data-drive="action"><div class="nm"><b>${esc(c[0].toUpperCase() + c.slice(1))}</b><span class="tokchip">interactive.${esc(c)}</span><span class="small muted">palette ${esc(pal)}</span></div><div class="ispecw"><div class="ispec" data-content style="${surf}"><div class="iln"><span class="ilb">Filled</span>${states.map((s) => btn(c, s)).join('')}</div><div class="iln"><span class="ilb">Outline</span>${states.map((s) => btn(c, s, true)).join('')}</div></div><div class="ibadges"><span class="small muted">On-fill</span>${on ? badge(on) : ''}<span class="small muted">Outline text</span>${badge(r[`interactive.${c}.text.rest`])}</div></div></div>`; };
    const tile = (inner, label, role) => `<div><div class="lsample" data-content style="${surf}">${inner}</div><span class="mono">${esc(label)}</span>${badge(role)}</div>`;
    const links = ['default', 'hover', 'visited', 'pressed'].map((s) => { const x = r[`text.link.${s}`]; return x ? tile(`<span class="lk" style="color:${x.hex};font-family:${esc(faceOf('body', m).css)}">${s[0].toUpperCase() + s.slice(1)} link</span>`, stepLabel(x.path), x) : ''; }).join('');
    const icons = ['primary', 'secondary', 'brand'].map((k) => { const x = r[`icon.${k}`]; return x ? tile(`<span class="ic" style="color:${x.hex}">${icon(k === 'brand' ? 'heart' : k === 'secondary' ? 'bell' : 'check')}</span>`, `icon.${k}`, x) : ''; }).join('');
    const dis = r['disabled.fill'] ? tile(`<span class="ib" style="height:${bm.h}px;padding:0 ${bm.padX}px;border-radius:${rad}px;font-family:${esc(face)};background:${r['disabled.fill'].hex};color:${r['disabled.on-fill'].hex};cursor:not-allowed">Unavailable</span>`, 'disabled.on-fill', r['disabled.on-fill']) : '';
    const inv = (c) => { const f = r[`inverse.interactive.${c}.fill.rest`] || r[`inverse.interactive.${c}.text.rest`]; return f ? `<span class="ib" style="height:${bm.h}px;padding:0 ${bm.padX}px;border-radius:${rad}px;font-family:${esc(face)};${r[`inverse.interactive.${c}.fill.rest`] ? `background:${r[`inverse.interactive.${c}.fill.rest`].hex};color:${r[`inverse.interactive.${c}.on-fill`]?.hex}` : `color:${f.hex};border-color:${r[`inverse.interactive.${c}.border.rest`]?.hex};background:transparent`}">${esc(c[0].toUpperCase() + c.slice(1))}</span>` : ''; };
    return board('Actions', cols.map(col).join(''), '', `Filled and outline, at rest, hover and pressed. Outline hover: ${esc(optLabel('outlineInteraction', val('outlineInteraction')))}; neutral emphasis: ${esc(optLabel('neutralEmphasis', val('neutralEmphasis')))}.`)
      + board('Links', `<div class="linkst" data-drive="link">${links}</div>`, '', `Link palette ${esc(R.t.linkPalette)}. Each state is measured against the page.`)
      + board('Icons and disabled', `<div class="linkst" data-drive="icon disabled">${icons}${dis}</div>`, '', `Icon contrast: ${esc(optLabel('iconContrast', val('iconContrast')))}. Disabled contrast: ${esc(optLabel('disabledStrategy', val('disabledStrategy')))}.`)
      + board('On the inverse band', `<div class="ibband" data-content data-drive="inverse" style="background:${r['inverse.background.primary'].hex}">${cols.map(inv).join('')}<span class="lk" style="color:${r['inverse.text.link.default']?.hex}">A link on the band</span></div>`, '', `Strict interactive contrast is ${val('strictInteractiveContrast') ? 'on: inverse actions clear 4.5:1' : 'off: inverse actions clear 3:1'}.`);
  },

  // V2: the sub-page's role families as the editable role × mode matrix.
  roles() {
    const p = curPage();
    return board('Role × mode', rolesMatrix({ readOnly: false, sub: p.sub }), `<span class="small muted">${plural(roleFamilies(p.sub).reduce((a, f) => a + f.roles.length, 0), 'role')} · ${plural(modesOn().length, 'mode')}</span>`);
  },

  type(m) {
    const ty = R.t.typography;
    const lh = Object.fromEntries(ty.lineHeights.map((x) => [x.key, x.value]));
    const ls = Object.fromEntries(ty.letterSpacings.map((x) => [x.key, x.em]));
    const wr = Object.fromEntries(ty.weightRoles.map((w) => [w.role, w.value]));
    const clampOf = (min, max) => { const slope = (max - min) / (ty.maxViewport - ty.minViewport); const rnd = (v) => Math.round(v * 1e4) / 1e4; return `clamp(${rnd(min / 16)}rem, ${rnd((min - slope * ty.minViewport) / 16)}rem + ${rnd(slope * 100)}vw, ${rnd(max / 16)}rem)`; };
    const byStyle = new Map(); for (const c of ty.composites) { const k = `${c.group}.${c.variant}`; if (!byStyle.has(k)) byStyle.set(k, { ...c, weights: [] }); if (!byStyle.get(k).weights.includes(c.weightRole)) byStyle.get(k).weights.push(c.weightRole); }
    const unresolved = R.rp.unresolvedType;
    const merges = mobileMerges();
    const rows = [...byStyle.values()].map((st) => { const f = faceOf(st.group, m); return `<tr><th scope="row"><code>${st.group}.${st.variant}</code></th><td><span class="tysample" data-content style="font-family:${esc(f.css)};font-size:${Math.min(st.sizePx, 44)}px;font-weight:${wr[st.weights[0]]};font-style:${st.italicDefault ? 'italic' : 'normal'}">Aa</span></td><td class="tabnum">${st.sizePx}px</td><td class="tabnum">${st.sizeMinPx !== st.sizePx ? st.sizeMinPx + 'px' : 'same'}</td><td><code>${ty.fluid && st.sizeMinPx !== st.sizePx ? clampOf(st.sizeMinPx, st.sizePx) : st.sizePx / 16 + 'rem'}</code></td><td class="tabnum">${st.lineHeight} ${lh[st.lineHeight] ?? ''}</td><td class="tabnum">${st.tracking} ${ls[st.tracking] ?? ''}em</td><td>${st.weights.map((w) => `${w} ${wr[w]}`).join(', ')}</td></tr>`; }).join('');
    const faces = [...new Set(ty.families.map((f) => f.stack[0]))];
    const avail = P3.weightAvailability(ty);
    const faceRows = faces.map((f) => { const groups = ty.families.filter((x) => x.stack[0] === f).map((x) => x.group); const ws = [...new Set(groups.flatMap((g) => (avail[g] || []).map((r) => wr[r])))].sort((x, y) => x - y); return `<tr><th scope="row"><span data-content style="font-family:'${esc(f)}',system-ui">${esc(f)}</span></th><td>${groups.join(', ')}</td><td><span class="row wrap">${availTag(f)}</span></td><td class="tabnum">${ws.join(', ')}</td></tr>`; }).join('');
    const ms = modesOn();
    const modeRows = ty.families.map((f) => { const cells = ms.map((mm) => faceOf(f.group, isDerived(mm) ? follows(mm) : mm).name); const same = cells.every((c) => c === cells[0]); return `<tr><th scope="row">${f.group}</th>${same ? `<td colspan="${ms.length}">${esc(cells[0])} <span class="muted">in every mode</span></td>` : cells.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`; }).join('');
    return (unresolved.length ? stateLine(`<b>${plural(unresolved.length, 'type style')} this brand doesn't emit (#1802):</b> ${unresolved.map((u) => `<code>${esc(u)}</code>`).join(', ')}. The preview binds ${unresolved.length === 1 ? 'it' : 'them'} by name, so ${unresolved.length === 1 ? 'it shows' : 'they show'} the fallback. Set in Type › Scale.`) : '')
      + faceMarkers(m)
      + board('Scale', `<div class="tscroll"><table class="t"><thead><tr><th scope="col">Style</th><th scope="col">Sample</th><th scope="col">Desktop</th><th scope="col">Mobile</th><th scope="col">CSS</th><th scope="col">Line height</th><th scope="col">Tracking</th><th scope="col">Weights</th></tr></thead><tbody>${rows}</tbody></table></div>${merges.length ? `<div class="hint"><b>Mobile merges</b><ul>${merges.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<p class="hint">No two styles merge on mobile.</p>'}`, `<span class="small muted">${byStyle.size} styles · scale ${esc(ty.typeScale)} · ${ty.fluid ? `fluid ${ty.minViewport}–${ty.maxViewport}px` : 'static'}</span>`)
      + board('Face library', `<div class="tscroll"><table class="t"><thead><tr><th scope="col">Face</th><th scope="col">Categories</th><th scope="col">Availability</th><th scope="col">Weights shipped</th></tr></thead><tbody>${faceRows}</tbody></table></div>`)

  tokens() {
    const root = treeOf(); const ms = modesOn();
    const groups = Object.keys(root);
    const g = groups.includes(S.tokGroup) ? S.tokGroup : 'color';
    const rows = []; const walk = (o, p) => { if (o && typeof o === 'object') { if ('$value' in o) { rows.push([p, o]); return; } for (const [k, v] of Object.entries(o)) if (!k.startsWith('$')) walk(v, p ? `${p}.${k}` : k); } };
    walk(root[g], g);

    const cell = (v) => { const t = typeof v === 'object' ? JSON.stringify(v) : String(v); const col = /^#[0-9a-f]{6,8}$/i.test(t) ? `<span class="sw" data-content style="background:${t}"></span> ` : ''; return `<span class="row">${col}<code>${esc(t.length > 60 ? t.slice(0, 60) + '…' : t)}</code></span>`; };
    const body = show.map(([p, o]) => {
      const mods = o.$extensions?.prism3?.modes || {};
      const vals = ms.map((m) => (m === 'light' ? o.$value : mods[m]?.$value ?? o.$value));
      const same = vals.every((v) => JSON.stringify(v) === JSON.stringify(vals[0]));
      return `<tr><th scope="row"><code>${esc(R.t.root)}.${esc(p)}</code></th><td>${o.$type}</td>${same ? `<td colspan="${ms.length}"><span class="row">${cell(vals[0])}<span class="muted">same in every mode</span></span></td>` : vals.map((v) => `<td>${cell(v)}</td>`).join('')}</tr>`;
    }).join('');
    const total = (() => { let n = 0; const w = (o) => { if (o && typeof o === 'object') { if ('$value' in o) { n++; return; } for (const [k, v] of Object.entries(o)) if (!k.startsWith('$')) w(v); } }; w(root); return n; })();
    return board('Tokens', `<div class="toolbar"><label class="flab"><span>Group</span>${selectRaw(`id="tok-group" data-act="tokgroup" aria-label="Token group"`, groups.map((x) => `<option${x === g ? ' selected' : ''}>${x}</option>`).join(''), true)}</label><label class="flab grow"><span>Filter</span><input type="search" id="tok-q" placeholder="Filter by path" aria-label="Filter tokens by path" value="${esc(S.tokQ)}"></label></div><p class="hint">${hit.length} of ${rows.length} in ${g}${hit.length > 300 ? '; showing 300, filter to narrow' : ''}. A token with one value spans every mode column; columns split only where values differ.</p><div class="tscroll"><table class="t"><thead><tr><th scope="col">Token</th><th scope="col">Type</th>${ms.map((m) => `<th scope="col">${esc(mLabel(m))}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`, `<span class="small muted">${total} tokens · contract ${CONTRACT_V} · engine ${ENGINE_V}</span>`);
  },

  contrast() {
    const ms = modesOn();
    const roles = Object.keys(R.mr.light.roles).filter((k) => ms.some((m) => R.mr[m].roles[k] && gated(R.mr[m].roles[k])));
    const rows = roles.map((k) => {
      const cells = ms.map((m) => { const r = R.mr[m].roles[k]; if (!r || !gated(r)) return { html: '<td class="muted">no floor</td>', fail: false }; const f = r.ratio + 1e-9 < r.min; return { fail: f, html: f ? `<td class="fail"><button type="button" class="lnk" data-act="goto-role" data-role="${esc(k)}" data-mode="${m}" id="ct-${slug(k)}-${m}">${gl('error')}<span class="tabnum">${fmtR(r.ratio)}</span>&nbsp;below ${fmtMin(r.min)}</button></td>` : `<td class="tabnum">${fmtR(r.ratio)}</td>` }; });
      const anyFail = cells.some((c) => c.fail); const r0 = R.mr.light.roles[k];
      return { anyFail, html: `<tr><th scope="row"><code>${esc(k)}</code><br><span class="muted">against ${esc(r0.against)}</span></th><td><span class="tag">${floorTag(k, r0.min)}</span></td>${cells.map((c) => c.html).join('')}</tr>` };
    });
    const shown = S.contrastOnlyFail ? rows.filter((r) => r.anyFail) : rows;
    const st = R.st;
    return healthHtml() + board('Pairs', `<div class="toolbar"><label class="chk"><input type="checkbox" id="ct-only" data-act="ctonly"${S.contrastOnlyFail ? ' checked' : ''}>Only pairs below floor</label><span class="small muted">${st.fail ? `${st.fail} of ${st.total} below floor across ${plural(st.modesFailing, 'mode')}. Select a failing cell to open its role.` : `All ${st.total} pairs at or above floor in ${plural(ms.length, 'mode')}.`}</span></div><div class="tscroll"><table class="t"><thead><tr><th scope="col">Pair</th><th scope="col">Floor</th>${ms.map((m) => `<th scope="col">${esc(mLabel(m))}${isDerived(m) ? ' <span class="muted">(derived)</span>' : ''}</th>`).join('')}</tr></thead><tbody>${shown.map((r) => r.html).join('') || `<tr><td colspan="${ms.length + 2}">No pair is below its floor. Failing pairs appear here when an override or setting drops one below.</td></tr>`}</tbody></table></div>`, `<span class="small muted">${roles.length} gated roles × ${ms.length} modes</span>`);
  },

  log() {
    const DOM = [[/^namespace/, 'brand', 'root'], [/^(primary|neutral|brand color)/, 'brand', 'primary'], [/^(success|warning|info|danger|action|link|surface|disabled|icon|interactive|outline|gradient|neutral emphasis|status)/i, 'color', null], [/^typography|^type/, 'type', 'typography.typeScale'], [/^dimension|^radius|^density|^control/, 'shape', 'density'], [/^(motion|shadow)/, 'depth', null], [/^(layout|grid|breakpoint)/, 'layout', 'layout.columns'], [/^button/, 'components', 'buttonIcons']];
    const keyFor = (n) => { const lc = n.toLowerCase(); if (lc.startsWith('action')) return 'actionPalette'; if (lc.startsWith('link')) return 'linkPalette'; if (lc.startsWith('gradient')) return 'gradients'; if (lc.startsWith('shadow')) return 'shadow.softness'; if (lc.startsWith('motion')) return 'motionPersonality.tempo'; if (/^(success|warning|info|danger)/.test(lc)) return 'status.' + lc.match(/^(success|warning|info|danger)/)[1]; if (lc.startsWith('surface')) return 'surfaces'; if (lc.startsWith('disabled')) return 'disabledStrategy'; if (lc.startsWith('brand color')) return 'brandColors'; return null; };
    const groups = {};
    for (const n of R.t.notes) { const hit = DOM.find(([re]) => re.test(n)); const d = hit ? hit[1] : 'other'; const k = keyFor(n) || (hit && hit[2]); (groups[d] ||= []).push({ n, k }); }
    const order = [...HOMES.domains.map((d) => [d.id, d.label]), ['other', 'Other']];
    return order.filter(([d]) => groups[d]).map(([d, l]) => board(esc(l), `<ul class="loglist">${groups[d].map((x) => `<li>${esc(x.n)}${x.k && rowOf(x.k) ? ` <button type="button" class="lnk" data-act="goto" data-domain="${rowOf(x.k).domain}" data-key="${esc(x.k)}">${esc(LEV[x.k]?.label || x.k)}</button>` : ''}</li>`).join('')}</ul>`, `<span class="small muted">${plural(groups[d].length, 'note')}</span>`)).join('') + `<p class="hint">${plural(R.t.notes.length, 'decision')} the engine recorded for this brand, in the engine's own words.</p>`;

};

function mobileMerges() {
  const mob = {}; const seen = new Set();
  for (const c of R.t.typography.composites) { const k = `${c.group}.${c.variant}`; if (seen.has(k)) continue; seen.add(k); (mob[`${c.group}:${c.sizeMinPx}`] ||= []).push(k); }
  return Object.entries(mob).filter(([, v]) => v.length > 1).map(([k, v]) => `${v.slice(0, -1).join(', ')} and ${v[v.length - 1]} at ${k.split(':')[1]}px`);
}
function warnings() {
  const W = [], clear = [];
  const add = (cond, title, text, key, clearTitle, list) => (cond ? W.push({ title, text, key, list }) : clear.push(clearTitle || title));
  add(val('disabledStrategy') === 'full', 'Disabled contrast is Full', 'Disabled labels clear 4.5:1, so the disabled cue rests on fill, border and cursor.', 'disabledStrategy', 'Disabled caveat');
  add(R.t.notes.some((n) => /not color-distinct/.test(n)), 'Links need an underline', `Links in ${R.t.linkPalette} match body text color (WCAG 1.4.1).`, 'linkPalette', 'Link distinctness');

function gotoRole(role, mode) {

/** Scrolls `el` into view inside its own scrollers only (the matrix, the levers), never the frame. */
function scrollWithin(el, block) {
  for (let n = el.parentElement; n && !n.matches('#app'); n = n.parentElement) {
    const cs = getComputedStyle(n);
    if (!/(auto|scroll)/.test(cs.overflowY + cs.overflowX) || (n.scrollHeight <= n.clientHeight && n.scrollWidth <= n.clientWidth)) continue;
    const r = el.getBoundingClientRect(), b = n.getBoundingClientRect();
