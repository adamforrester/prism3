<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism3 Ecosystem</title>
<meta name="description" content="How a brand input becomes tokens, Figma artifacts and code in Prism3, and what checks each step.">
<style>
/* Color tokens. packages/engine/lint-ecosystem.ts reads these three blocks and checks every text pair at 4.5:1.
   The two dark blocks must stay identical: one serves prefers-color-scheme, the other the toggle. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-raised: #fbfbf9;
  --text: #16181d;
  --text-muted: #545a65;
  --border: #c9ccd2;
  --edge: #80868f;
  --edge-strong: #2b2f36;
  --link: #1f4fbf;
  --focus: #1f4fbf;
  --accent: #16181d;
  --on-accent: #ffffff;
  --trace: #c2410c;
  --on-trace: #ffffff;
  --hub-bg: #1b1d22;
  --hub-text: #ffffff;
  --hub-muted: #c9ccd3;
  --role-theming: #2f6fe4;
  --role-theming-ink: #1d4fb3;
  --role-theming-tint: #e9f0fd;
  --role-agent: #7c4ddb;
  --role-agent-ink: #5b2fb8;
  --role-agent-tint: #f1ebfc;
  --role-engine: #1b1d22;
  --role-engine-ink: #1b1d22;
  --role-engine-tint: #ececee;
  --role-output: #2f8584;
  --role-output-ink: #1d6463;
  --role-output-tint: #e4f2f1;
  --role-verification: #c98a0b;
  --role-verification-ink: #845500;
  --role-verification-tint: #fcf2dc;
  --role-code: #3f8f4f;
  --role-code-ink: #2b6b39;
  --role-code-tint: #e6f3e8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --surface: #171a20;
    --surface-raised: #1e222a;
    --text: #eceef2;
    --text-muted: #a8aeb9;
    --border: #3a404b;
    --edge: #7a818d;
    --edge-strong: #dfe2e8;
    --link: #8db4ff;
    --focus: #8db4ff;
    --accent: #eceef2;
    --on-accent: #0f1115;
    --trace: #ff8a4c;
    --on-trace: #111317;
    --hub-bg: #e9ebef;
    --hub-text: #111317;
    --hub-muted: #3d424b;
    --role-theming: #6f9cff;
    --role-theming-ink: #9dbcff;
    --role-theming-tint: #18233a;
    --role-agent: #a987f5;
    --role-agent-ink: #c6b0ff;
    --role-agent-tint: #231c38;
    --role-engine: #e9ebef;
    --role-engine-ink: #e9ebef;
    --role-engine-tint: #262a32;
    --role-output: #5cc2be;
    --role-output-ink: #86d7d3;
    --role-output-tint: #132a2a;
    --role-verification: #f0b43c;
    --role-verification-ink: #f5c766;
    --role-verification-tint: #2d2310;
    --role-code: #6fcf83;
    --role-code-ink: #96e0a6;
    --role-code-tint: #152d1b;
  }
}
:root[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #171a20;
    --surface-raised: #1e222a;
    --text: #eceef2;
    --text-muted: #a8aeb9;
    --border: #3a404b;
    --edge: #7a818d;
    --edge-strong: #dfe2e8;
    --link: #8db4ff;
    --focus: #8db4ff;
    --accent: #eceef2;
    --on-accent: #0f1115;
    --trace: #ff8a4c;
    --on-trace: #111317;
    --hub-bg: #e9ebef;
    --hub-text: #111317;
    --hub-muted: #3d424b;
    --role-theming: #6f9cff;
    --role-theming-ink: #9dbcff;
    --role-theming-tint: #18233a;
    --role-agent: #a987f5;
    --role-agent-ink: #c6b0ff;
    --role-agent-tint: #231c38;
    --role-engine: #e9ebef;
    --role-engine-ink: #e9ebef;
    --role-engine-tint: #262a32;
    --role-output: #5cc2be;
    --role-output-ink: #86d7d3;
    --role-output-tint: #132a2a;
    --role-verification: #f0b43c;
    --role-verification-ink: #f5c766;
    --role-verification-tint: #2d2310;
    --role-code: #6fcf83;
    --role-code-ink: #96e0a6;
    --role-code-tint: #152d1b;
}
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 20px 0 8px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
header.top h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--text-muted); max-width: 68ch; }
.btn {
  font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--edge-strong); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn[hidden] { display: none; }
.btn:disabled { color: var(--text-muted); cursor: default; border-style: dashed; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; padding: 10px 0 12px; border-bottom: 1px solid var(--border); }
.control-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.control-group > .lbl { font-size: 13px; color: var(--text-muted); width: 100%; }
select.btn { padding-right: 28px; max-width: 100%; }
.filter .btn[aria-pressed="false"] { text-decoration: line-through; color: var(--text-muted); }
.swatch-status { width: 18px; height: 12px; border-radius: 3px; border: 2px solid currentColor; display: inline-block; }
.swatch-status.partial { border-style: dashed; background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, currentColor 30%, transparent) 3px 4px); }
.swatch-status.planned { border-style: dotted; }

.trace-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; }
.trace-bar.active { border-bottom: 1px solid var(--border); }
.trace-row { display: flex; gap: 8px 16px; align-items: flex-start; flex-wrap: wrap; }
.trace-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.trace-buttons[hidden] { display: none; }
.trace-row .caption { flex: 1 1 320px; padding-top: 6px; }
@media (max-width: 899px) { .trace-bar .steps { display: none; } }
.caption { margin: 0; font-size: 15px; }
.caption .step-no { font-weight: 600; color: var(--text); }
.caption .what { color: var(--text-muted); font-size: 14px; display: block; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: s; }
.steps button {
  font: inherit; font-size: 13px; color: var(--text-muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 30px;
}
.steps button .n { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--bg); color: var(--text); font-weight: 600; font-size: 12px; }
.steps button.done { color: var(--text); }
.steps button.current { color: var(--text); border-color: var(--trace); box-shadow: inset 0 0 0 1px var(--trace); }
.steps button.current .n, .steps button.done .n { background: var(--accent); color: var(--on-accent); }

/* ── Diagram ───────────────────────────────────────────────────────────────────────────────── */
.stage { position: relative; padding: 8px 0 24px; }
.diagram { position: relative; width: 100%; aspect-ratio: 1500 / 880; container-type: inline-size; }
.diagram svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.list { display: none; }
@media (max-width: 899px) {
  .diagram { display: none; }
  .list { display: block; }
}

.region rect { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 6 5; }
.region.planned rect { fill: url(#hatch); stroke-dasharray: 2 5; stroke-linecap: round; stroke: var(--edge); }
.region text { fill: var(--text-muted); font-size: 13px; font-weight: 600; }

path.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: stroke .2s, opacity .2s, stroke-width .2s; }
path.edge.partial { stroke-dasharray: 7 5; }
path.edge.planned { stroke-dasharray: 1.5 5; stroke-linecap: round; }
path.edge.hit { stroke: transparent; stroke-width: 14; stroke-dasharray: none; }
.diagram.focusing path.edge:not(.hi) { opacity: .14; }
path.edge.hi { stroke: var(--edge-strong); stroke-width: 2.4; }
.diagram.tracing path.edge { opacity: .1; }
.diagram.tracing path.edge.upcoming { opacity: .35; stroke: var(--edge); }
.diagram.tracing path.edge.traced { opacity: 1; stroke: var(--edge-strong); stroke-width: 2.4; }
.diagram.tracing path.edge.current { opacity: 1; stroke: var(--trace); stroke-width: 3.4; }
.flow path.edge.hi { animation: flow 1s linear infinite; }
.flow path.edge.hi:not(.partial):not(.planned) { stroke-dasharray: 8 5; }
@keyframes flow { to { stroke-dashoffset: -13; } }
marker path { fill: var(--edge); }
#arrow-hi path { fill: var(--edge-strong); }
#arrow-trace path { fill: var(--trace); }
.dot { fill: var(--trace); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--on-accent); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.badge.current circle { fill: var(--trace); }
.badge.current text { fill: var(--on-trace); }

.node {
  position: absolute;
  left: calc((var(--x) - var(--w) / 2) / 1500 * 100%);
  top: calc((var(--y) - var(--h) / 2) / 880 * 100%);
  width: calc(var(--w) / 1500 * 100%);
  height: calc(var(--h) / 880 * 100%);
  --w: 172; --h: 62;
  font: inherit; font-size: clamp(11px, 0.92cqw, 14px); line-height: 1.2; font-weight: 600;
  color: var(--text); background: var(--tint); border: 2px solid var(--stroke); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px 8px;
  cursor: pointer; transition: background .2s, color .2s, border-color .2s, box-shadow .2s, transform .2s;
}
.node:hover { box-shadow: 0 2px 10px rgb(0 0 0 / 0.12); }
.node.partial { border-style: dashed; background: repeating-linear-gradient(135deg, var(--tint) 0 7px, color-mix(in srgb, var(--stroke) 14%, var(--tint)) 7px 9px); }
.node.planned { border-style: dotted; border-width: 2.5px; background: var(--bg); color: var(--text-muted); }
.node.actor { border-radius: 999px; }
.node .meta { display: block; font-weight: 500; font-size: 0.82em; color: var(--text-muted); margin-top: 2px; }
.node.hub { --w: 214; --h: 132; background: var(--hub-bg); color: var(--hub-text); border-color: var(--hub-bg); border-radius: 16px; font-size: clamp(13px, 1.2cqw, 18px); }
.node.hub .meta { color: var(--hub-muted); font-size: 0.66em; line-height: 1.35; margin-top: 6px; }
.node.selected { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--stroke); }
.diagram.focusing .node.near { box-shadow: 0 0 0 2px var(--stroke); }
.diagram.tracing .node:not(.in-trace), .diagram.focusing .node.far { background: var(--bg); color: var(--text-muted); border-color: var(--border); }
.diagram.tracing .node.hub:not(.in-trace) .meta { color: var(--text-muted); }
.diagram.tracing .node.cur-from, .diagram.tracing .node.cur-to { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--trace); }
.diagram.tracing .node.arrive { animation: arrive .6s ease-out; }
@keyframes arrive { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
[data-hide~="shipped"] .is-shipped, [data-hide~="partial"] .is-partial, [data-hide~="planned"] .is-planned { display: none; }
[data-hide] .in-trace-force { display: revert; }
[data-hide] .node.in-trace-force { display: flex; }

/* ── List view (phone) ─────────────────────────────────────────────────────────────────────── */
.list section { margin: 0 0 18px; }
.list h2 { font-size: 15px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
.list h2 .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--stroke); }
.list .note { margin: 0 0 8px; font-size: 13px; color: var(--text-muted); }
.list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.card {
  width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--tint);
  border: 2px solid var(--stroke); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: block;
}
.card.partial { border-style: dashed; }
.card.planned { border-style: dotted; background: var(--bg); }
.card .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.card .s { font-weight: 500; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.card .p { display: block; font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.card.cur { box-shadow: 0 0 0 3px var(--trace); }
.list.tracing .card:not(.in-trace) { background: var(--bg); border-color: var(--border); }

/* ── Detail panel ──────────────────────────────────────────────────────────────────────────── */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--surface); color: var(--text);
  border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgb(0 0 0 / 0.14); padding: 20px 20px 32px; overflow-y: auto; z-index: 10;
  transform: translateX(0); transition: transform .22s ease-out;
}
#panel[hidden] { display: block; transform: translateX(105%); visibility: hidden; transition: transform .22s ease-in, visibility 0s .22s; }
#panel h2 { font-size: 20px; margin: 4px 0 6px; line-height: 1.25; }
#panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 18px 0 6px; }
#panel p { margin: 0 0 8px; }
#panel ul { margin: 0; padding-left: 18px; }
#panel li { margin: 2px 0; }
#panel .close { position: absolute; top: 12px; right: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--border); color: var(--text); background: var(--surface-raised); }
.chip.role { color: var(--ink); border-color: var(--stroke); }
.links { list-style: none; padding: 0 !important; }
.links button { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; }
.links .what { color: var(--text-muted); font-size: 13px; display: block; }
.members { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; padding: 0 !important; }
.members li { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin: 0 !important; }
code, .src { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ── Legend ────────────────────────────────────────────────────────────────────────────────── */
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; padding: 16px 0; border-top: 1px solid var(--border); }
.legend h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 8px; }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font-size: 14px; }
.legend .sw { width: 22px; height: 16px; border-radius: 4px; border: 2px solid var(--stroke); background: var(--tint); margin-top: 3px; }
.legend .sw.hubsw { background: var(--hub-bg); border-color: var(--hub-bg); }
.legend .sub { color: var(--text-muted); font-size: 13px; display: block; }
.legend svg { width: 26px; height: 16px; margin-top: 3px; }
.legend svg line { stroke: var(--edge-strong); stroke-width: 2; }
footer { color: var(--text-muted); font-size: 13px; padding: 8px 0 32px; }
.notice { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }

[data-role="theming"] { --stroke: var(--role-theming); --ink: var(--role-theming-ink); --tint: var(--role-theming-tint); }
[data-role="agent"] { --stroke: var(--role-agent); --ink: var(--role-agent-ink); --tint: var(--role-agent-tint); }
[data-role="engine"] { --stroke: var(--role-engine); --ink: var(--role-engine-ink); --tint: var(--role-engine-tint); }
[data-role="output"] { --stroke: var(--role-output); --ink: var(--role-output-ink); --tint: var(--role-output-tint); }
[data-role="verification"] { --stroke: var(--role-verification); --ink: var(--role-verification-ink); --tint: var(--role-verification-tint); }
[data-role="code"] { --stroke: var(--role-code); --ink: var(--role-code-ink); --tint: var(--role-code-tint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Prism3 ecosystem</h1>
      <p>How a brand input becomes tokens, Figma artifacts and code, and what checks each step. Select a node for details, or trace a path through it.</p>
    </div>
    <button class="btn" id="theme" type="button" aria-pressed="false">Dark theme</button>
  </header>

  <div class="controls">
    <div class="control-group">
      <label class="lbl" for="trace">Trace a path</label>
      <select class="btn" id="trace"><option value="">Choose a path…</option></select>
    </div>
    <div class="control-group filter" role="group" aria-labelledby="filter-lbl">
      <span class="lbl" id="filter-lbl">Show</span>
    </div>
  </div>

  <div class="trace-bar" id="trace-bar">
    <div class="trace-row">
      <div class="trace-buttons" id="trace-buttons" hidden>
        <button class="btn primary" id="play" type="button">Play</button>
        <button class="btn" id="prev" type="button" aria-label="Previous step">Back</button>
        <button class="btn" id="next" type="button" aria-label="Next step">Next</button>
        <button class="btn" id="clear" type="button">Clear</button>
      </div>
      <p class="caption" id="caption" aria-live="polite">Arrow keys move between nodes. Enter opens a node's details; Escape closes them.</p>
    </div>
    <ol class="steps" id="steps" aria-label="Steps in this path"></ol>
  </div>

  <main class="stage" id="stage">
    <div class="diagram" id="diagram" role="group" aria-label="Ecosystem diagram">
      <svg class="edges" id="svg" aria-hidden="true" focusable="false"></svg>
    </div>
    <div class="list" id="list"></div>
  </main>

  <section class="legend" aria-label="Legend" id="legend"></section>
  <footer id="footer"></footer>
</div>

<aside id="panel" hidden aria-labelledby="panel-title" tabindex="-1">
  <button class="btn close" type="button" id="panel-close">Close</button>
  <div id="panel-body"></div>
</aside>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c);
    return n;
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs = {}) => { const n = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

  /* ── Theme ──────────────────────────────────────────────────────────────────────────────── */
  const themeBtn = $('#theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  const effectiveDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : sysDark.matches; };
  const syncThemeBtn = () => themeBtn.setAttribute('aria-pressed', String(effectiveDark()));
  const saved = store.get('p3-eco-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  syncThemeBtn();
  sysDark.addEventListener('change', syncThemeBtn);
  themeBtn.addEventListener('click', () => {
    const next = effectiveDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set('p3-eco-theme', next); syncThemeBtn();
  });

  fetch('./ecosystem.json').then((r) => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); }).then(render).catch((e) => {
    $('#stage').replaceChildren(el('div', { class: 'notice', role: 'alert' },
      el('p', { text: 'The diagram could not load ecosystem.json (' + e.message + ').' }),

      }, STEP_MS);
    }
    function pause() {
      clearInterval(state.timer); state.playing = false;
      play.textContent = state.trace && state.i >= state.trace.steps.length - 1 ? 'Replay' : 'Play';
    }
    function clearTrace(keepUi) {
      pause(); cancelAnimationFrame(state.raf); dot.setAttribute('opacity', '0');
      state.trace = null; state.i = -1;
      diagram.classList.remove('tracing'); list.classList.remove('tracing');
      for (const p of edgeEls.values()) { p.getAnimations?.().forEach((a) => a.cancel()); p.style.strokeDasharray = ''; p.classList.remove('traced', 'current', 'upcoming', 'in-trace-force'); p.setAttribute('marker-end', 'url(#arrow)'); }
      for (const b of nodeEls.values()) b.classList.remove('in-trace', 'in-trace-force', 'cur-from', 'cur-to', 'arrive');
      for (const c of cardEls.values()) { c.classList.remove('in-trace', 'cur'); c.parentElement.classList.remove('in-trace-force'); }
      badgeLayer.replaceChildren(); badgeEls.clear();
      stepsEl.replaceChildren();
      applyFilter();
      if (keepUi === true) return;
      sel.value = ''; caption.innerHTML = defaultCaption; play.textContent = 'Play';
      $('#trace-buttons').hidden = true; $('#trace-bar').classList.remove('active');
      if (location.hash.startsWith('#trace=')) setHash(null);
    }
    reduced.addEventListener('change', () => { if (state.trace) startTrace(state.trace.id); });

    /* ── Legend and footer ──────────────────────────────────────────────────────────────── */
    const legend = $('#legend');
    legend.append(
      el('div', {}, el('h2', { text: 'Roles' }), el('ul', {}, data.roles.map((r) => el('li', { 'data-role': r.id },
        el('span', { class: 'sw' + (r.id === 'engine' ? ' hubsw' : ''), 'aria-hidden': 'true' }), el('span', {}, r.label, el('span', { class: 'sub', text: r.note })))))),
      el('div', {}, el('h2', { text: 'Build status' }), el('ul', {}, data.statuses.map((s) => el('li', { 'data-role': 'engine' },
        el('span', { class: 'swatch-status ' + s.id, style: 'width:22px;height:16px;margin-top:3px;color:var(--edge-strong)', 'aria-hidden': 'true' }), el('span', {}, s.label, el('span', { class: 'sub', text: s.meaning }))))),
        el('ul', { style: 'margin-top:10px' }, data.statuses.map((s) => { const svgEl = sv('svg', { viewBox: '0 0 26 16', 'aria-hidden': 'true' }); const ln = sv('line', { x1: '1', y1: '8', x2: '25', y2: '8' }); if (s.id === 'partial') ln.setAttribute('stroke-dasharray', '5 3'); if (s.id === 'planned') { ln.setAttribute('stroke-dasharray', '1.5 4'); ln.setAttribute('stroke-linecap', 'round'); } svgEl.append(ln); return el('li', {}, svgEl, el('span', { text: s.label + ' connection' })); }))),
      el('div', {}, el('h2', { text: 'Modes' }), el('p', { style: 'margin:0', text: 'Appearance: ' + data.modes.appearance.join(', ') + '. ' + data.modes.viewport })),
    );
    $('#footer').append(
      el('p', { style: 'margin:0' }, el('span', { id: 'footer-count' }), ' ',
        'Drawn from ', el('a', { href: gh('docs/public/ecosystem/ecosystem.json'), text: 'ecosystem.json' }),
        '. A CI check, ', el('code', { text: 'lint-ecosystem.ts' }), ', fails when its paths, components, MCP tools, agent link commands or skills stop matching the code. ',
        el('a', { href: gh('docs/public/ecosystem/README.md'), text: 'How to update it' }), '.'));
    applyFilter();

    /* ── Deep links: #node=<id> or #trace=<id> ──────────────────────────────────────────── */
    function setHash(kind, id) { try { history.replaceState(null, '', kind ? `#${kind}=${id}` : location.pathname + location.search); } catch {} }
    const m = /^#(node|trace)=([\w-]+)$/.exec(location.hash);
    if (m && m[1] === 'trace' && traces.has(m[2])) startTrace(m[2]);
    else if (m && m[1] === 'node' && nodes.has(m[2])) openPanel(m[2], nodeEls.get(m[2]));
  }
})();
</script>
</body>
</html>
